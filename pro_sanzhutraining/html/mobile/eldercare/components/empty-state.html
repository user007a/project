<!-- 空状态组件模板 - 叁竹培训 -->

<!-- 使用说明：
  1. 将此组件添加到需要显示空状态的页面中
  2. 根据场景修改 icon、title 和 description
  3. 如需添加操作按钮，可在 empty-state-action 区域添加
-->

<!-- 通用空状态 -->
<div class="empty-state-wrapper" id="emptyStateTemplate" style="display: none;">
  <div class="empty-state">
    <div class="empty-state-icon">
      <span class="iconify" data-icon="solar:inbox-empty" style="font-size: 80px; color: #d1d5db;"></span>
    </div>
    <h3 class="empty-state-title">暂无内容</h3>
    <p class="empty-state-description">这里还没有任何内容，稍后再来看看吧</p>
    <div class="empty-state-action">
      <!-- 可添加操作按钮 -->
    </div>
  </div>
</div>

<!-- 订单空状态 -->
<div class="empty-state-wrapper" id="emptyOrderState" style="display: none;">
  <div class="empty-state">
    <div class="empty-state-icon">
      <span class="iconify" data-icon="solar:cart-large-minimalistic" style="font-size: 80px; color: #d1d5db;"></span>
    </div>
    <h3 class="empty-state-title">暂无订单</h3>
    <p class="empty-state-description">您还没有购买任何课程，快去选购吧</p>
    <div class="empty-state-action">
      <button class="btn-primary btn-sm" onclick="navigateTo('course-list.html')">浏览课程</button>
    </div>
  </div>
</div>

<!-- 网络错误状态 -->
<div class="empty-state-wrapper" id="networkErrorState" style="display: none;">
  <div class="empty-state">
    <div class="empty-state-icon">
      <span class="iconify" data-icon="solar:wifi-error" style="font-size: 80px; color: #d1d5db;"></span>
    </div>
    <h3 class="empty-state-title">网络连接失败</h3>
    <p class="empty-state-description">网络似乎有点问题，请检查您的网络连接后重试</p>

    </div>
  </div>

<!-- 加载状态组件 -->
<div class="loading-wrapper" id="loadingTemplate" style="display: none;">
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px;">
    <div class="loading-spinner" style="width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top-color: #2e9e5a; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    <p style="margin-top: 16px; font-size: 14px; color: #6b7280;">加载中...</p>
  </div>
</div>

<!-- 骨架屏组件 -->
<div class="skeleton-wrapper" id="skeletonTemplate" style="display: none;">
  <div style="padding: 16px;">
    <!-- 骨架卡片 -->
    <div class="card" style="margin-bottom: 16px; padding: 16px;">
      <div style="display: flex; gap: 12px;">
        <div class="skeleton skeleton-image" style="width: 80px; height: 80px;"></div>
        <div style="flex: 1;">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text" style="width: 60%;"></div>
        </div>
      </div>
    </div>

    <!-- 骨架列表项 -->
    <div class="card" style="padding: 16px; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="skeleton skeleton-avatar"></div>
        <div style="flex: 1;">
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text" style="width: 80%;"></div>
        </div>
      </div>
    </div>

    <!-- 骨架列表项 -->
    <div class="card" style="padding: 16px; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="skeleton skeleton-avatar"></div>
        <div style="flex: 1;">
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text" style="width: 60%;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast 提示组件 -->
<div class="toast" id="toastTemplate">
  <span class="toast-icon"></span>
  <span class="toast-message"></span>
</div>

<script>
  // 显示指定空状态
  function showEmptyState(stateId) {
    hideAllEmptyStates();
    var state = document.getElementById(stateId);
    if (state) {
      state.style.display = 'block';
    }
  }

  // 隐藏所有空状态
  function hideAllEmptyStates() {
    document.querySelectorAll('.empty-state-wrapper').forEach(function(el) {
      el.style.display = 'none';
    });
  }

  // 显示加载状态
  function showLoading() {
    hideAllEmptyStates();
    var loading = document.getElementById('loadingTemplate');
    if (loading) {
      loading.style.display = 'block';
    }
  }

  // 隐藏加载状态
  function hideLoading() {
    var loading = document.getElementById('loadingTemplate');
    if (loading) {
      loading.style.display = 'none';
    }
  }

  // 显示骨架屏
  function showSkeleton() {
    hideAllEmptyStates();
    var skeleton = document.getElementById('skeletonTemplate');
    if (skeleton) {
      skeleton.style.display = 'block';
    }
  }

  // 隐藏骨架屏
  function hideSkeleton() {
    var skeleton = document.getElementById('skeletonTemplate');
    if (skeleton) {
      skeleton.style.display = 'none';
    }
  }

  // 显示 Toast 提示
  function showToast(message, type) {
    type = type || 'info';
    var toast = document.getElementById('toastTemplate');
    if (toast) {
      toast.querySelector('.toast-message').textContent = message;
      toast.className = 'toast toast-' + type + ' show';
      setTimeout(function() {
        toast.classList.remove('show');
      }, 3000);
    }
  }

  // 成功提示
  function showSuccessToast(message) {
    showToast(message, 'success');
  }

  // 错误提示
  function showErrorToast(message) {
    showToast(message, 'error');
  }

  // 警告提示
  function showWarningToast(message) {
    showToast(message, 'warning');
  }
</script>
