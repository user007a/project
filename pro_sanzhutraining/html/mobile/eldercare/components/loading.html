﻿<!-- 全局加载状态组�?-->

<!-- 全屏加载遮罩 -->
<div id="globalLoading" class="fixed inset-0 bg-white/90 z-50 hidden flex items-center justify-center">
  <div class="flex flex-col items-center gap-4">
    <div class="relative">
      <div class="w-12 h-12 border-3 border-[#2e9e5a]/20 rounded-full"></div>
      <div class="absolute inset-0 w-12 h-12 border-3 border-[#2e9e5a] border-t-transparent rounded-full animate-spin"></div>
    </div>
    <span class="text-sm text-gray-500">加载�?..</span>
  </div>
</div>

<!-- 按钮加载状�?-->
<div id="btnLoading" class="inline-flex items-center justify-center gap-2">
  <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
  </svg>
</div>

<!-- 骨架屏组�?-->
<div id="skeletonCard" class="bg-white rounded-xl p-4 space-y-3 animate-pulse">
  <div class="h-24 bg-gray-100 rounded-lg"></div>
  <div class="h-4 bg-gray-100 rounded w-3/4"></div>
  <div class="h-3 bg-gray-100 rounded w-1/2"></div>
  <div class="h-3 bg-gray-100 rounded w-1/3"></div>
</div>

<!-- 列表项骨架屏 -->
<div id="skeletonListItem" class="bg-white rounded-xl p-4 flex gap-4 animate-pulse">
  <div class="w-24 h-20 bg-gray-100 rounded-lg flex-shrink-0"></div>
  <div class="flex-1 space-y-2">
    <div class="h-4 bg-gray-100 rounded w-full"></div>
    <div class="h-3 bg-gray-100 rounded w-3/4"></div>
    <div class="h-3 bg-gray-100 rounded w-1/2"></div>
  </div>
</div>

<!-- 空状态组�?-->
<div id="emptyState" class="flex flex-col items-center justify-center py-12 px-6">
  <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4">
    <span class="iconify text-gray-400 text-4xl" data-icon="solar:folder-open-linear"></span>
  </div>
  <h3 class="text-lg font-semibold text-gray-600 mb-2">暂无数据</h3>
  <p class="text-sm text-gray-400 text-center">当前没有相关内容</p>
</div>

<!-- 错误状态组�?-->
<div id="errorState" class="flex flex-col items-center justify-center py-12 px-6">
  <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mb-4">
    <span class="iconify text-red-400 text-4xl" data-icon="solar:alert-circle-bold"></span>
  </div>
  <h3 class="text-lg font-semibold text-gray-600 mb-2">加载失败</h3>
  <p class="text-sm text-gray-400 text-center mb-4">网络连接异常，请稍后重试</p>
  <button id="retryBtn" class="px-6 py-2 bg-[#2e9e5a] text-white text-sm font-medium rounded-full">
    重新加载
  </button>
</div>

<style>
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .animate-spin {
    animation: spin 1s linear infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .animate-pulse {
    animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
</style>

<script>
  // 加载状态管理工具类
  window.LoadingManager = {
    show: function(options) {
      const opts = Object.assign({
        text: '加载�?..',
        type: 'full' // full, inline, skeleton
      }, options || {});
      
      if (opts.type === 'full') {
        const overlay = document.getElementById('globalLoading');
        if (overlay) {
          overlay.classList.remove('hidden');
          overlay.classList.add('flex');
        }
      }
    },
    
    hide: function() {
      const overlay = document.getElementById('globalLoading');
      if (overlay) {
        overlay.classList.remove('flex');
        overlay.classList.add('hidden');
      }
    },
    
    showSkeleton: function(containerId) {
      const container = document.getElementById(containerId);
      if (container) {
        container.innerHTML = `
          <div class="animate-pulse space-y-3">
            <div class="h-24 bg-gray-100 rounded-xl"></div>
            <div class="h-4 bg-gray-100 rounded w-3/4"></div>
            <div class="h-3 bg-gray-100 rounded w-1/2"></div>
          </div>
        `;
      }
    },
    
    showEmpty: function(containerId, message) {
      const container = document.getElementById(containerId);
      if (container) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-12 px-6">
            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4">
              <span class="iconify text-gray-400 text-4xl" data-icon="solar:folder-open-linear"></span>
            </div>
            <h3 class="text-lg font-semibold text-gray-600 mb-2">暂无数据</h3>
            <p class="text-sm text-gray-400 text-center">${message || '当前没有相关内容'}</p>
          </div>
        `;
      }
    },
    
    showError: function(containerId, message) {
      const container = document.getElementById(containerId);
      if (container) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-12 px-6">
            <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mb-4">
              <span class="iconify text-red-400 text-4xl" data-icon="solar:alert-circle-bold"></span>
            </div>
            <h3 class="text-lg font-semibold text-gray-600 mb-2">加载失败</h3>
            <p class="text-sm text-gray-400 text-center mb-4">${message || '网络连接异常，请稍后重试'}</p>
            <button class="retry-btn px-6 py-2 bg-[#2e9e5a] text-white text-sm font-medium rounded-full">
              重新加载
            </button>
          </div>
        `;
        
        // 绑定重试按钮事件
        const retryBtn = container.querySelector('.retry-btn');
        if (retryBtn) {
          retryBtn.addEventListener('click', function() {
            window.location.reload();
          });
        }
      }
    }
  };
</script>
