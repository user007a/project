<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>叁竹培训 - 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="w-full max-w-[375px] min-h-[812px] bg-white relative overflow-hidden flex flex-col">

  <!-- 顶部绿色渐变装饰区 -->
  <div class="h-16 bg-gradient-to-br from-[#2e9e5a] to-[#1e7e42] rounded-b-3xl relative overflow-hidden">
    <div class="absolute top-4 left-5 text-white/60 text-xs">2026年05月27日</div>
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-white/[0.06] rounded-full"></div>
    <div class="absolute -bottom-6 -left-6 w-24 h-24 bg-white/[0.04] rounded-full"></div>
  </div>

  <!-- 白色圆角卡片 -->
  <div class="px-6 -mt-10 flex-1">
    <div class="bg-white rounded-3xl p-6 shadow-[0_4px_20px_rgba(0,0,0,0.08)] border border-gray-50">

      <!-- Logo + 标题 + slogan -->
      <div class="flex flex-col items-center mb-6">
        <div class="w-16 h-16 bg-emerald-50 rounded-2xl flex items-center justify-center mb-3 shadow-sm">
          <!-- 叁竹培训Logo: 三根竹子 -->
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-10 h-10">
            <path d="M16 42V14C16 14 12 8 12 4" stroke="#2e9e5a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M24 42V10C24 10 20 5 20 2" stroke="#1e7e42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M32 42V16C32 16 28 10 28 6" stroke="#2e9e5a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 22C14 22 16 20 20 22" stroke="#2e9e5a" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M22 18C22 18 24 16 28 18" stroke="#1e7e42" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M30 24C30 24 32 22 36 24" stroke="#2e9e5a" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M12 28C12 28 14 26 16 28" stroke="#2e9e5a" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">叁竹培训</h1>
        <p class="text-gray-400 text-sm mt-1">专业培训 · 技能认证</p>
      </div>

      <!-- 输入框区域 -->
      <div class="space-y-4">
        <!-- 手机号/用户名 -->
        <div class="relative" id="phoneGroup">
          <span class="iconify absolute left-4 top-4 text-gray-400 text-xl" data-icon="solar:phone-bold"></span>
          <input id="phoneInput" class="w-full pl-12 pr-4 py-3.5 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none focus:ring-[#2e9e5a]/50 focus:border-[#2e9e5a] focus:shadow-md focus:shadow-emerald-100/50 transition-all duration-200 text-sm" placeholder="手机号码 / 用户名" type="text"/>
          <div class="text-xs text-red-500 mt-1 ml-1 hidden" id="phoneError">请输入正确的11位手机号</div>
        </div>

        <!-- 密码 -->
        <div class="relative" id="passwordGroup">
          <span class="iconify absolute left-4 top-4 text-gray-400 text-xl" data-icon="solar:lock-password-bold"></span>
          <input id="passwordInput" class="w-full pl-12 pr-12 py-3.5 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none focus:ring-[#2e9e5a]/50 focus:border-[#2e9e5a] focus:shadow-md focus:shadow-emerald-100/50 transition-all duration-200 text-sm" placeholder="请输入密码" type="password" autocomplete="current-password"/>
          <span class="iconify absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-gray-400 text-xl cursor-pointer hover:text-[#2e9e5a] transition-colors active:scale-90" data-icon="solar:eye-bold" id="togglePwd"></span>
          <div class="text-xs text-red-500 mt-1 ml-1 hidden" id="passwordError">请输入密码</div>
        </div>

        <!-- 忘记密码 -->
        <div class="flex justify-end">
          <a class="text-xs text-[#2e9e5a] font-medium" href="javascript:void(0)">忘记密码？</a>
        </div>
      </div>

      <!-- 登录按钮 -->
      <button id="btnLogin" class="w-[85%] mx-auto mt-5 bg-gradient-to-r from-[#2e9e5a] to-[#1e7e42] text-white text-center py-3 rounded-full font-semibold shadow-md shadow-emerald-200/50 hover:shadow-lg hover:shadow-emerald-200/50 active:scale-95 transition-all duration-200 relative overflow-hidden">
        <span class="btn-text">登        录</span>
        <span class="spinner hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
      </button>
    </div>

    <!-- 快速登录分隔线 -->
    <div class="flex items-center gap-4 py-5">
      <div class="flex-1 h-px bg-gray-200"></div>
      <span class="text-xs text-gray-400">快速登录</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <!-- 微信授权登录 -->
    <button id="btnWechat" class="flex items-center justify-center gap-3 w-[85%] mx-auto bg-white text-[#2e9e5a] border-2 border-[#2e9e5a] py-3 rounded-full font-semibold shadow-sm hover:shadow-md hover:bg-emerald-50 active:scale-95 transition-all duration-200 relative overflow-hidden">
      <span class="iconify text-2xl" data-icon="ri:wechat-fill"></span>
      <span class="wechat-btn-text">微信授权登录</span>
      <span class="wechat-spinner hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-5 h-5 border-2 border-[#2e9e5a]/30 border-t-[#2e9e5a] rounded-full animate-spin"></span>
    </button>

    <!-- 隐私协议 -->
    <div class="flex items-center justify-center mt-5">
      <label class="flex items-center text-[11px] text-gray-400 gap-1.5 cursor-pointer">
        <input id="agreeCheck" class="w-3.5 h-3.5 rounded border-gray-300 text-[#2e9e5a] focus:ring-[#2e9e5a]" type="checkbox"/>
        <span>已阅读并同意 <span class="text-[#2e9e5a]">《服务协议》</span> 与 <span class="text-[#2e9e5a]">《隐私政策》</span></span>
      </label>
    </div>
  </div>

  <!-- 底部版权 -->
  <div class="p-6 text-center">
    <p class="text-xs text-gray-300">2026 叁竹教育科技有限公司 版权所有</p>
  </div>
</div>

<!-- 登录成功弹窗 -->
<div id="successOverlay" class="fixed inset-0 bg-black/50 z-50 hidden justify-center items-center">
  <div class="bg-white rounded-2xl p-8 text-center w-[260px] animate-[scaleIn_0.3s_ease]">
    <div class="w-14 h-14 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-4">
      <span class="iconify text-[#2e9e5a] text-3xl" data-icon="solar:check-circle-bold"></span>
    </div>
    <div class="text-lg font-semibold text-gray-800 mb-2">登录成功</div>
    <div class="text-xs text-gray-400" id="successCountdown">2秒后自动跳转...</div>
  </div>
</div>

<style>
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
</style>

<script>
  // 自动跳转已登录
  (function() {
    if (sessionStorage.getItem('isLoggedIn')) {
      window.location.href = 'home.html';
    }
  })();

  // 密码显隐切换
  var togglePwd = document.getElementById('togglePwd');
  var pwdInput = document.getElementById('passwordInput');
  var pwdVisible = false;
  togglePwd.addEventListener('click', function() {
    pwdVisible = !pwdVisible;
    pwdInput.type = pwdVisible ? 'text' : 'password';
    togglePwd.setAttribute('data-icon', pwdVisible ? 'solar:eye-closed-bold' : 'solar:eye-bold');
  });

  // 表单验证
  function showError(groupId, errorId, msg) {
    var group = document.getElementById(groupId);
    var errorEl = document.getElementById(errorId);
    errorEl.textContent = msg || errorEl.textContent;
    errorEl.classList.remove('hidden');
    var input = group.querySelector('input');
    if (input) input.classList.add('border-red-400');
  }
  function clearError(groupId, errorId) {
    var errorEl = document.getElementById(errorId);
    errorEl.classList.add('hidden');
    var group = document.getElementById(groupId);
    var input = group.querySelector('input');
    if (input) input.classList.remove('border-red-400');
  }
  function clearAllErrors() {
    ['phoneError', 'passwordError'].forEach(function(id) {
      document.getElementById(id).classList.add('hidden');
    });
    ['phoneGroup', 'passwordGroup'].forEach(function(id) {
      var input = document.getElementById(id).querySelector('input');
      if (input) input.classList.remove('border-red-400');
    });
  }

  // 输入时清除错误
  document.getElementById('phoneInput').addEventListener('input', function() { clearError('phoneGroup', 'phoneError'); });
  document.getElementById('passwordInput').addEventListener('input', function() { clearError('passwordGroup', 'passwordError'); });

  // 账号密码登录
  document.getElementById('btnLogin').addEventListener('click', function() {
    clearAllErrors();
    var phone = document.getElementById('phoneInput').value.trim();
    var pass = document.getElementById('passwordInput').value.trim();
    var valid = true;

    if (!phone) {
      showError('phoneGroup', 'phoneError', '请输入手机号或用户名');
      valid = false;
    }
    if (!pass) {
      showError('passwordGroup', 'passwordError', '请输入密码');
      valid = false;
    }
    if (!valid) return;

    if (!document.getElementById('agreeCheck').checked) {
      alert('请先阅读并同意《服务协议》与《隐私政策》');
      return;
    }

    doLogin(this, phone, 'btn-text', 'spinner');
  });

  // 微信登录
  document.getElementById('btnWechat').addEventListener('click', function() {
    if (!document.getElementById('agreeCheck').checked) {
      alert('请先阅读并同意《服务协议》与《隐私政策》');
      return;
    }
    doLogin(this, '微信用户', 'wechat-btn-text', 'wechat-spinner');
  });

  // 通用登录处理
  function doLogin(btn, username, textClass, spinnerClass) {
    var textEl = btn.querySelector('.' + textClass);
    var spinnerEl = btn.querySelector('.' + spinnerClass);
    textEl.style.opacity = '0';
    spinnerEl.classList.remove('hidden');
    btn.disabled = true;

    setTimeout(function() {
      textEl.style.opacity = '1';
      spinnerEl.classList.add('hidden');
      btn.disabled = false;
      sessionStorage.setItem('isLoggedIn', 'true');
      sessionStorage.setItem('loginUser', username);

      var overlay = document.getElementById('successOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');

      var countdown = 2;
      document.getElementById('successCountdown').textContent = countdown + '秒后自动跳转...';
      var timer = setInterval(function() {
        countdown--;
        if (countdown <= 0) {
          clearInterval(timer);
          window.location.href = 'home.html';
        } else {
          document.getElementById('successCountdown').textContent = countdown + '秒后自动跳转...';
        }
      }, 1000);
    }, 1200);
  }
</script>
</body>
</html>
