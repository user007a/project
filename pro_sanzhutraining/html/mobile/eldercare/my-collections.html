<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="css/tokens.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<body class="bg-[#f5f5f5] min-h-screen">

<div class="w-full max-w-[750px] mx-auto min-h-screen bg-[#f5f5f5] relative">

  <div class="bg-gradient-to-br from-[#2e9e5a] to-[#1e7e42] px-4 pt-10 pb-5 rounded-b-3xl relative overflow-hidden">

    <div class="absolute -bottom-10 -left-10 w-36 h-36 bg-white/[0.05] rounded-full"></div>
    <div class="flex items-center gap-3 relative z-10">

      <div class="stat-item">

        <div class="stat-label">总课时</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="totalTeachers">0</div>

      </div>
    </div>
  </div>

  <div class="px-4 py-4 space-y-3" id="collectionList"></div>

  <div class="hidden" id="emptyState">

      <a href="course-list.html" class="mt-5 px-8 py-2.5 bg-[#2e9e5a] text-white text-sm rounded-full font-medium active:scale-95 transition-all shadow-md shadow-[#2e9e5a]/20">
        去浏览课程
      </a>
    </div>
  </div>

  <!-- 底部5tab导航 -->
  <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[750px] h-14 bg-white flex border-t border-gray-100 z-50 safe-area-bottom">

      <span class="iconify text-[22px]" data-icon="solar:home-2-linear"></span>
      <span class="text-[10px]">首页</span>
    </a>
    <a href="course-list.html" class="tab-item flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400 transition cursor-pointer">
      <span class="iconify text-[22px]" data-icon="solar:book-linear"></span>
      <span class="text-[10px]">课程</span>
    </a>
    <a href="question-bank.html" class="tab-item flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400 transition cursor-pointer">
      <span class="iconify text-[22px]" data-icon="solar:document-text-linear"></span>
      <span class="text-[10px]">题库</span>
    </a>
    <a href="news.html" class="tab-item flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400 transition cursor-pointer">
      <span class="iconify text-[22px]" data-icon="solar:bookmark-linear"></span>
      <span class="text-[10px]">资讯</span>
    </a>
    <a href="profile.html" class="tab-item flex-1 flex flex-col items-center justify-center gap-0.5 text-brand transition cursor-pointer">
      <span class="iconify text-[22px]" data-icon="solar:user-rounded-bold"></span>
      <span class="text-[10px] font-semibold">我的</span>
    </a>
  </div>

</div>

<script>
  function getCollections() {
    var collections = localStorage.getItem('sanzhu_collections');
    return collections ? JSON.parse(collections) : [];
  }

  function saveCollections(collections) {
    localStorage.setItem('sanzhu_collections', JSON.stringify(collections));
  }

  function removeCollection(courseId) {
    var collections = getCollections();
    collections = collections.filter(function(course) {
      return course.id !== courseId;
    });
    saveCollections(collections);
    renderCollections();
    updateStats();
  }

  function updateStats() {
    var collections = getCollections();
    document.getElementById('totalCount').textContent = collections.length;
    document.getElementById('collectionCount').textContent = collections.length + '门';
    
    var totalLessons = collections.reduce(function(sum, course) {
      return sum + parseInt(course.lessons);
    }, 0);
    document.getElementById('totalLessons').textContent = totalLessons;
    
    var teachers = new Set(collections.map(function(course) {
      return course.teacher;
    }));
    document.getElementById('totalTeachers').textContent = teachers.size;
  }

  function renderCollections() {
    var collections = getCollections();
    var listContainer = document.getElementById('collectionList');
    var emptyState = document.getElementById('emptyState');

    if (collections.length === 0) {
      listContainer.innerHTML = '';
      emptyState.classList.remove('hidden');
      return;
    }

    emptyState.classList.add('hidden');
    
    var html = collections.map(function(course) {
      return `
        <div class="course-item">
          <div class="flex gap-3">
            <div class="course-item-image">
              <img src="${course.image}" alt="${course.title}" loading="lazy">
            </div>
            <div class="course-item-content">
              <h3 class="course-item-title">${course.title}</h3>
              <p class="course-item-meta">${course.teacher} · ${course.lessons}课时</p>
              <div class="flex items-center gap-1 mt-1">
                <span class="iconify text-[var(--color-primary)] text-[9px]" data-icon="solar:calendar-linear"></span>
                <span class="text-[10px] text-gray-400">${course.time}</span>
              </div>
            </div>
            <span class="iconify text-[var(--color-error)] text-[12px] flex-shrink-0 mt-1" data-icon="solar:heart-bold"></span>
          </div>
          <div class="course-item-footer">
            <button class="course-item-btn course-item-btn-secondary" onclick="removeCollection('${course.id}')">取消收藏</button>
            <a href="learn.html" class="course-item-btn course-item-btn-primary">查看课程</a>
          </div>
        </div>
      `;
    }).join('');

    listContainer.innerHTML = html;
  }

    renderCollections();
    updateStats();
