<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>叁竹培训 - 我的证书</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#2e9e5a', dark: '#1e7e42', light: '#e8f5ec', 50: '#f0faf4' },
            accent: { orange: '#f39c12', blue: '#3498db', red: '#e74c3c', purple: '#9b59b6', cyan: '#1abc9c' }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f5f5f5] font-sans text-[#333]">
  <div class="max-w-[750px] mx-auto min-h-screen relative pb-16">

    <!-- 顶部绿色渐变Header -->
    <div class="bg-gradient-to-br from-brand to-brand-dark rounded-b-3xl px-4 pt-10 pb-5 relative overflow-hidden">
      <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2"></div>
      <div class="flex items-center gap-3 relative z-10">
        <a href="profile.html" class="w-9 h-9 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center flex-shrink-0 active:scale-90 transition-all hover:bg-white/30 shadow-lg shadow-black/10">
          <span class="iconify text-white text-lg" data-icon="solar:arrow-left-linear"></span>
        </a>
        <h1 class="text-white font-bold text-base">我的证书</h1>
      </div>
    </div>

    <!-- 统计信息 -->
  <div class="stats-card">
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-value text-[var(--color-primary)]">
          <span class="iconify text-base" data-icon="solar:award-star"></span>
          <span>2</span>
        </div>
        <div class="stat-label">已获得证书</div>
      </div>
      <div class="stat-item">
        <div class="stat-value text-[var(--color-accent-purple)]">
          <span class="iconify text-base" data-icon="solar:medal-ribbons-star-linear"></span>
          <span>2</span>
        </div>
        <div class="stat-label">认证类型</div>
      </div>
      <div class="stat-item">
        <div class="stat-value text-[var(--color-gray-400)]">
          <span class="iconify text-base" data-icon="solar:lock-linear"></span>
          <span>1</span>
        </div>
        <div class="stat-label">待解锁</div>
      </div>
    </div>
  </div>

    <!-- 证书列表 -->
    <div class="px-4 py-3 space-y-3">
      <div class="flex items-center gap-2 mb-2">
        <span class="w-1 h-4 bg-brand rounded-full"></span>
        <span class="text-sm font-medium text-[#333]">已获得证书</span>
      </div>
      
      <div class="block bg-white rounded-2xl shadow-sm overflow-hidden hover:shadow-lg hover:shadow-gray-200/80 hover:-translate-y-1 active:scale-[0.98] transition-all duration-300">
        <div class="flex">
          <div class="w-[130px] min-h-[100px] flex-shrink-0 relative overflow-hidden">
            <img src="https://images.unsplash.com/photo-1586281380349-632531db7ed4?w=260&h=200&fit=crop" alt="养老护理员初级职业技能等级证书" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"></div>
            <span class="absolute top-1.5 left-1.5 text-[10px] px-1.5 py-0.5 rounded bg-accent-orange text-white font-medium shadow-sm">初级</span>
          </div>
          <div class="flex-1 p-3 flex flex-col justify-between">
            <div>
              <div class="text-[15px] font-semibold text-gray-800 leading-snug">养老护理员职业技能等级证书</div>
              <div class="text-xs text-gray-400 mt-1.5 flex items-center gap-1">
                <span class="iconify text-sm" data-icon="solar:building-2-linear"></span>人力资源和社会保障部
              </div>
              <div class="text-xs text-gray-400 mt-1 flex items-center gap-1">
                <span class="iconify text-sm" data-icon="solar:calendar-linear"></span>2024-03-15
              </div>
            </div>
            <div class="flex items-end justify-between">
              <span class="text-[11px] text-gray-400 flex items-center gap-0.5">
                <span class="iconify text-xs" data-icon="solar:hash-linear"></span>JN20240315001
              </span>
              <button class="course-item-btn course-item-btn-primary text-xs">
                <span class="iconify text-[12px]" data-icon="solar:eye-linear"></span>查看
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="block bg-white rounded-2xl shadow-sm overflow-hidden hover:shadow-lg hover:shadow-gray-200/80 hover:-translate-y-1 active:scale-[0.98] transition-all duration-300">
        <div class="flex">
          <div class="w-[130px] min-h-[100px] flex-shrink-0 relative overflow-hidden">
            <img src="https://images.unsplash.com/photo-1553877522-43269d4ea984?w=260&h=200&fit=crop" alt="老年人能力评估师培训证书" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"></div>
            <span class="absolute top-1.5 left-1.5 text-[10px] px-1.5 py-0.5 rounded bg-accent-purple text-white font-medium">结业</span>
          </div>
          <div class="flex-1 p-3 flex flex-col justify-between">
            <div>
              <div class="text-[15px] font-semibold text-gray-800 leading-snug">老年人能力评估师培训证书</div>
              <div class="text-xs text-gray-400 mt-1.5 flex items-center gap-1">
                <span class="iconify text-sm" data-icon="solar:school-linear"></span>叁竹职业技能培训学校
              </div>
              <div class="text-xs text-gray-400 mt-1 flex items-center gap-1">
                <span class="iconify text-sm" data-icon="solar:calendar-linear"></span>2024-05-20
              </div>
            </div>
            <div class="flex items-end justify-between">
              <span class="text-[11px] text-gray-400 flex items-center gap-0.5">
                <span class="iconify text-xs" data-icon="solar:hash-linear"></span>SZ20240520008
              </span>
              <button class="course-item-btn course-item-btn-secondary text-xs">
                <span class="iconify text-[12px]" data-icon="solar:eye-linear"></span>查看
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 mb-2 mt-4">
        <span class="w-1 h-4 bg-gray-300 rounded-full"></span>
        <span class="text-sm font-medium text-[#333]">待解锁证书</span>
      </div>

      <div class="block bg-white rounded-2xl shadow-sm overflow-hidden opacity-75">
        <div class="flex">
          <div class="w-[130px] min-h-[100px] flex-shrink-0 relative overflow-hidden">
            <div class="w-full h-full bg-gray-100 flex items-center justify-center">
              <span class="iconify text-gray-400 text-4xl" data-icon="solar:lock-linear"></span>
            </div>
            <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"></div>
          </div>
          <div class="flex-1 p-3 flex flex-col justify-between">
            <div>
              <div class="text-[15px] font-semibold text-gray-400 leading-snug">养老护理员（中级）职业技能等级证书</div>
              <div class="text-xs text-gray-400 mt-1.5 flex items-center gap-1">
                <span class="iconify text-sm" data-icon="solar:calendar-linear"></span>学习进度
              </div>
              <div class="mt-2">
                <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                  <div class="h-full bg-brand rounded-full" style="width:65%"></div>
                </div>
                <div class="text-[10px] text-gray-400 mt-1">65%</div>
              </div>
            </div>
            <div class="flex items-end justify-between">
              <span class="text-[11px] text-gray-400 flex items-center gap-0.5">
                完成全部课程并通过考试后获得
              </span>
              <button class="course-item-btn course-item-btn-secondary text-xs">
                <span class="iconify text-[12px]" data-icon="solar:play-circle-linear"></span>继续
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- 底部5tab导航 -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[750px] h-14 bg-white flex border-t border-gray-100 z-50 safe-area-bottom">
      <a href="home.html" class="tab-item flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400 transition cursor-pointer">
        <span class="iconify text-[22px]" data-icon="solar:home-2-linear"></span>
        <span class="text-[10px]">首页</span>
      </a>
      <a href="course-list.html" class="tab-item flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400 transition cursor-pointer">
        <span class="iconify text-[22px]" data-icon="solar:book-linear"></span>
        <span class="text-[10px]">课程</span>
      </a>
      <a href="question-bank.html" class="tab-item flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400 transition cursor-pointer">
        <span class="iconify text-[22px]" data-icon="solar:document-text-linear"></span>
        <span class="text-[10px]">题库</span>
      </a>
      <a href="news.html" class="tab-item flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400 transition cursor-pointer">
        <span class="iconify text-[22px]" data-icon="solar:bookmark-linear"></span>
        <span class="text-[10px]">资讯</span>
      </a>
      <a href="profile.html" class="tab-item flex-1 flex flex-col items-center justify-center gap-0.5 text-brand transition cursor-pointer">
        <span class="iconify text-[22px]" data-icon="solar:user-rounded-bold"></span>
        <span class="text-[10px] font-semibold">我的</span>
      </a>
    </div>

  </div>
</body>
</html>
