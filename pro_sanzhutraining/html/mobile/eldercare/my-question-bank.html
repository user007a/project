<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>叁竹培训 - 我的题库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f5f5f5] min-h-screen">

<div class="w-full max-w-[375px] mx-auto min-h-screen bg-[#f5f5f5] relative">

  <!-- 顶部Header -->
  <div class="bg-gradient-to-br from-[#2e9e5a] to-[#1e7e42] px-4 pt-10 pb-4 rounded-b-[40px]">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center cursor-pointer" onclick="history.back()">
        <span class="iconify text-white text-lg" data-icon="solar:arrow-left-linear"></span>
      </div>
      <h1 class="text-white font-bold text-base">我的题库</h1>
    </div>
  </div>

  <div class="px-4 py-4 space-y-4">

    <!-- 刷题统计卡片 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <h3 class="font-bold text-sm text-[#333] mb-3">刷题统计</h3>
      <div class="grid grid-cols-4 gap-2">
        <div class="text-center">
          <div class="w-12 h-12 rounded-xl bg-[#e8f5ec] flex items-center justify-center mx-auto mb-1.5">
            <span class="iconify text-[#2e9e5a] text-xl" data-icon="solar:fire-linear"></span>
          </div>
          <div class="text-lg font-bold text-[#333]">23</div>
          <div class="text-[10px] text-gray-400">今日刷题</div>
        </div>
        <div class="text-center">
          <div class="w-12 h-12 rounded-xl bg-[#eaf2fa] flex items-center justify-center mx-auto mb-1.5">
            <span class="iconify text-[#3498db] text-xl" data-icon="solar:chart-2-linear"></span>
          </div>
          <div class="text-lg font-bold text-[#333]">1,286</div>
          <div class="text-[10px] text-gray-400">累计刷题</div>
        </div>
        <div class="text-center">
          <div class="w-12 h-12 rounded-xl bg-[#fef5e7] flex items-center justify-center mx-auto mb-1.5">
            <span class="iconify text-[#f39c12] text-xl" data-icon="solar:medal-star-linear"></span>
          </div>
          <div class="text-lg font-bold text-[#333]">89%</div>
          <div class="text-[10px] text-gray-400">最高正确率</div>
        </div>
        <div class="text-center">
          <div class="w-12 h-12 rounded-xl bg-[#fdecea] flex items-center justify-center mx-auto mb-1.5">
            <span class="iconify text-[#e74c3c] text-xl" data-icon="solar:calendar-mark-linear"></span>
          </div>
          <div class="text-lg font-bold text-[#333]">15</div>
          <div class="text-[10px] text-gray-400">连续打卡</div>
        </div>
      </div>
    </div>

    <!-- 错题集入口 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm flex items-center gap-3 cursor-pointer active:scale-[0.98] transition-transform">
      <div class="w-11 h-11 rounded-xl bg-[#fdecea] flex items-center justify-center flex-shrink-0">
        <span class="iconify text-[#e74c3c] text-2xl" data-icon="solar:close-circle-linear"></span>
      </div>
      <div class="flex-1">
        <h3 class="font-bold text-sm text-[#333]">我的错题</h3>
        <p class="text-xs text-gray-400 mt-0.5">共 <span class="text-[#e74c3c] font-bold">47</span> 道错题需要复习</p>
      </div>
      <button class="px-4 py-1.5 rounded-full bg-[#fdecea] text-[#e74c3c] text-xs font-medium active:scale-95 transition-all">查看</button>
    </div>

    <!-- 已刷专题列表 -->
    <div>
      <h3 class="font-bold text-sm text-[#333] mb-3">已刷专题</h3>
      <div class="space-y-3">

        <!-- 专题1 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-[#e8f5ec] flex items-center justify-center">
                <span class="iconify text-[#2e9e5a] text-sm" data-icon="solar:book-linear"></span>
              </div>
              <span class="font-bold text-sm text-[#333]">日常生活照料</span>
            </div>
            <span class="text-xs text-[#2e9e5a] font-medium">正确率 92%</span>
          </div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-gray-400">已刷 86/120 题</span>
            <span class="text-xs text-gray-400">72%</span>
          </div>
          <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-[#2e9e5a] to-[#3db870] rounded-full" style="width:72%"></div>
          </div>
        </div>

        <!-- 专题2 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-[#eaf2fa] flex items-center justify-center">
                <span class="iconify text-[#3498db] text-sm" data-icon="solar:heart-pulse-linear"></span>
              </div>
              <span class="font-bold text-sm text-[#333]">基础护理知识</span>
            </div>
            <span class="text-xs text-[#3498db] font-medium">正确率 85%</span>
          </div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-gray-400">已刷 156/200 题</span>
            <span class="text-xs text-gray-400">78%</span>
          </div>
          <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-[#3498db] to-[#5dade2] rounded-full" style="width:78%"></div>
          </div>
        </div>

        <!-- 专题3 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-[#fef5e7] flex items-center justify-center">
                <span class="iconify text-[#f39c12] text-sm" data-icon="solar:shield-check-linear"></span>
              </div>
              <span class="font-bold text-sm text-[#333]">安全与急救</span>
            </div>
            <span class="text-xs text-[#f39c12] font-medium">正确率 78%</span>
          </div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-gray-400">已刷 65/100 题</span>
            <span class="text-xs text-gray-400">65%</span>
          </div>
          <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-[#f39c12] to-[#f4d03f] rounded-full" style="width:65%"></div>
          </div>
        </div>

        <!-- 专题4 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-[#f5eef8] flex items-center justify-center">
                <span class="iconify text-[#9b59b6] text-sm" data-icon="solar:users-group-rounded-linear"></span>
              </div>
              <span class="font-bold text-sm text-[#333]">心理护理与沟通</span>
            </div>
            <span class="text-xs text-[#9b59b6] font-medium">正确率 89%</span>
          </div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-gray-400">已刷 48/80 题</span>
            <span class="text-xs text-gray-400">60%</span>
          </div>
          <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-[#9b59b6] to-[#bb8fce] rounded-full" style="width:60%"></div>
          </div>
        </div>

        <!-- 专题5 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-[#e8f8f5] flex items-center justify-center">
                <span class="iconify text-[#1abc9c] text-sm" data-icon="solar:buildings-linear"></span>
              </div>
              <span class="font-bold text-sm text-[#333]">养老机构管理</span>
            </div>
            <span class="text-xs text-[#1abc9c] font-medium">正确率 71%</span>
          </div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-gray-400">已刷 35/60 题</span>
            <span class="text-xs text-gray-400">58%</span>
          </div>
          <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-[#1abc9c] to-[#48c9b0] rounded-full" style="width:58%"></div>
          </div>
        </div>

      </div>
    </div>

  </div>

</div>

</body>
</html>
