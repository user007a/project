<script>
  // 页面加载时初始化
  document.addEventListener('DOMContentLoaded', function() {
    // 从localStorage加载保存的头像
    var savedAvatar = localStorage.getItem('userAvatar');
    if (savedAvatar) {
      document.getElementById('avatarImg').src = savedAvatar;
    }
    
    // 添加头像悬浮效果
    var container = document.getElementById('avatarContainer');
    var overlay = document.getElementById('avatarOverlay');
    container.addEventListener('mouseenter', function() {
      overlay.style.opacity = '1';
    });
    container.addEventListener('mouseleave', function() {
      overlay.style.opacity = '0';
    });
  });

  function uploadAvatar() {
    document.getElementById('avatarInput').click();
  }

  function handleAvatarUpload(event) {
    var file = event.target.files[0];
    if (!file) return;

    // 验证文件类型
    if (!file.type.startsWith('image/')) {
      alert('请选择图片文件');
      return;
    }

    // 验证文件大小（最大2MB）
    if (file.size > 2 * 1024 * 1024) {
      alert('图片大小不能超过2MB');
      return;
    }

    var reader = new FileReader();
    reader.onload = function(e) {
      var img = document.getElementById('avatarImg');
      img.src = e.target.result;
      
      // 保存到localStorage
      localStorage.setItem('userAvatar', e.target.result);
      
      // 提示上传成功
      showToast('头像上传成功');
    };
    reader.readAsDataURL(file);
  }

  function showToast(message) {
    var toast = document.createElement('div');
    toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-black/80 text-white px-4 py-2 rounded-full text-sm z-[2000] animate-bounce';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(function() {
      toast.remove();
    }, 2000);
  }

  function showContactModal() {
    document.getElementById('contactModal').classList.remove('hidden');
    document.getElementById('contactModal').classList.add('flex');
  }
  function hideContactModal(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('contactModal').classList.add('hidden');
    document.getElementById('contactModal').classList.remove('flex');
  }
  function showLogoutModal() {
    document.getElementById('logoutModal').classList.remove('hidden');
    document.getElementById('logoutModal').classList.add('flex');
  }
  function hideLogoutModal(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('logoutModal').classList.add('hidden');
    document.getElementById('logoutModal').classList.remove('flex');
  }
  function doLogout() {
    sessionStorage.removeItem('isLoggedIn');
    sessionStorage.removeItem('loginUser');
    window.location.href = 'login.html';
  }
</script>
