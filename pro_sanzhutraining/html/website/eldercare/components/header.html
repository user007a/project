<div class="header" id="mainHeader">
  <div class="header-inner">
    <div class="logo-area">
      <div class="logo-icon"><span class="iconify" data-icon="mdi:bamboo" style="color: white; font-size: 24px;"></span></div>
      <span class="logo-text">叁竹培训</span>
    </div>
    <div class="cat-trigger"><span class="iconify" data-icon="mdi:menu" style="font-size: 18px;"></span><span>课程分类</span></div>
    <div class="search-box">
      <select class="search-cat-select">
        <option>全部课程</option>
        <option>养老护理员</option>
        <option>老年人能力评估师</option>
        <option>健康照护师</option>
        <option>营养配餐员</option>
      </select>
      <input class="search-input" type="text" placeholder="搜索课程、讲师、证书..." id="searchInput">
      <button class="search-btn" onclick="handleSearch()"><span class="iconify" data-icon="mdi:magnify" style="color: white; font-size: 22px;"></span></button>
    </div>
    <nav class="header-nav" id="headerNav">
      <a href="index.html">首页</a>
      <a href="course-list.html">课程中心</a>
      <a href="exam-center.html">考试中心</a>
      <a href="my.html">个人中心</a>
    </nav>
    <div class="header-actions" id="headerActions">
      <a href="login.html" class="btn-login">登录</a>
      <a href="register.html" class="btn-register">注册</a>
    </div>
    <div class="user-menu" id="userMenu" style="display: none;">
      <div class="user-avatar-mini" id="userAvatarMini">
        <span class="iconify" data-icon="mdi:account-circle" style="font-size: 32px;"></span>
      </div>
      <div class="user-dropdown">
        <div class="dropdown-item" onclick="goToProfile()">
          <span class="iconify" data-icon="mdi:account-circle"></span>
          个人中心
        </div>
        <div class="dropdown-item" onclick="goToLearning()">
          <span class="iconify" data-icon="mdi:book-open"></span>
          我的学习
        </div>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item logout" onclick="handleLogout()">
          <span class="iconify" data-icon="mdi:logout"></span>
          退出登录
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // 检查登录状态
    var isLoggedIn = sessionStorage.getItem('isLoggedIn');
    
    if (isLoggedIn) {
      document.getElementById('headerActions').style.display = 'none';
      document.getElementById('userMenu').style.display = 'flex';
      
      // 设置用户名显示
      var userName = sessionStorage.getItem('userName') || '用户';
      document.getElementById('userAvatarMini').setAttribute('title', userName);
    }
    
    // 搜索功能
    window.handleSearch = function() {
      var keyword = document.getElementById('searchInput').value.trim();
      if (keyword) {
        window.location.href = 'search.html?q=' + encodeURIComponent(keyword);
      }
    };
    
    // 回车搜索
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        handleSearch();
      }
    });
    
    // 导航到个人信息
    window.goToProfile = function() {
      window.location.href = 'my.html';
    };
    
    // 导航到我的学习
    window.goToLearning = function() {
      window.location.href = 'my.html';
    };
    
    // 退出登录
    window.handleLogout = function() {
      sessionStorage.removeItem('isLoggedIn');
      sessionStorage.removeItem('userName');
      window.location.href = 'index.html';
    };
  })();
</script>
