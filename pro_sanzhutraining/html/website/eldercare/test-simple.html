<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能测试 - 简化版</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        h2 {
            color: #3B82F6;
            margin-top: 0;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background: #3B82F6;
            color: white;
        }
        .btn-secondary {
            background: #6B7280;
            color: white;
        }
        .btn-success {
            background: #10B981;
            color: white;
        }
        .btn-danger {
            background: #EF4444;
            color: white;
        }
        button:hover {
            opacity: 0.9;
        }
        #loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.9);
            z-index: 9999;
        }
        #loading.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3B82F6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            z-index: 10000;
            display: none;
        }
        #toast.success { background: #10B981; }
        #toast.error { background: #EF4444; }
        #toast.info { background: #3B82F6; }
        #toast.warning { background: #F59E0B; }
    </style>
</head>
<body>
    <h1>个人中心功能测试</h1>
    
    <div class="section">
        <h2>1. 我的学习 - 继续学习</h2>
        <button class="btn-primary" onclick="goToCourse('caregiver-primary')">继续学习 - 养老护理员（初级）</button>
        <button class="btn-primary" onclick="goToCourse('psychology-care')">继续学习 - 老年人心理护理</button>
    </div>
    
    <div class="section">
        <h2>2. 我的订单</h2>
        <button class="btn-success" onclick="payOrder('202401140002')">立即支付</button>
        <button class="btn-secondary" onclick="cancelOrder('202401140002')">取消订单</button>
        <button class="btn-primary" onclick="viewOrderDetail('202401150001')">查看订单详情</button>
        <button class="btn-primary" onclick="goToCourse('caregiver-primary')">去学习</button>
        <button class="btn-secondary" onclick="applyInvoice('202401150001')">申请发票</button>
    </div>
    
    <div class="section">
        <h2>3. 我的考试</h2>
        <button class="btn-primary" onclick="viewExamDetail('exam-caregiver-primary')">查看考试详情</button>
        <button class="btn-danger" onclick="retryExam('exam-caregiver-primary')">重新考试</button>
    </div>
    
    <div class="section">
        <h2>4. 我的收藏</h2>
        <button class="btn-success" onclick="buyCourse('caregiver-primary')">立即购买</button>
        <button class="btn-secondary" onclick="removeFavorite('caregiver-primary')">取消收藏</button>
    </div>
    
    <div id="loading">
        <div class="spinner"></div>
    </div>
    
    <div id="toast"></div>
    
    <script>
        // Toast提示
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = type;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
        
        // Loading
        function showLoading() {
            document.getElementById('loading').classList.add('active');
        }
        
        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }
        
        // 课程跳转
        function goToCourse(courseId) {
            const courses = {
                'caregiver-primary': '养老护理员（初级）考证培训',
                'psychology-care': '老年人心理护理专题课程',
                'caregiver-intermediate': '养老护理员（中级）提升课程'
            };
            
            const courseName = courses[courseId];
            if (courseName) {
                showLoading();
                showToast(`正在进入「${courseName}」...`, 'info');
                
                setTimeout(() => {
                    hideLoading();
                    showToast(`即将跳转到课程直播页面`, 'success');
                    // 实际跳转：window.location.href = `course-live.html?id=${courseId}`;
                }, 1000);
            } else {
                showToast('课程不存在', 'error');
            }
        }
        
        // 订单支付
        function payOrder(orderId) {
            showLoading();
            showToast('正在处理支付...', 'info');
            
            setTimeout(() => {
                hideLoading();
                showToast(`订单 ${orderId} 支付成功！`, 'success');
            }, 1500);
        }
        
        // 取消订单
        function cancelOrder(orderId) {
            if (confirm(`确定要取消订单 ${orderId} 吗？`)) {
                showLoading();
                setTimeout(() => {
                    hideLoading();
                    showToast(`订单 ${orderId} 已取消`, 'info');
                }, 500);
            }
        }
        
        // 查看订单详情
        function viewOrderDetail(orderId) {
            showToast(`查看订单 ${orderId} 详情`, 'info');
            // 实际跳转：window.location.href = `order-detail.html?id=${orderId}`;
        }
        
        // 申请发票
        function applyInvoice(orderId) {
            const invoiceType = prompt('请选择发票类型:\n1. 个人\n2. 企业', '1');
            const title = prompt('请输入发票抬头:');
            const email = prompt('请输入接收发票的邮箱:');
            
            if (title && email) {
                showLoading();
                setTimeout(() => {
                    hideLoading();
                    showToast('发票申请提交成功！发票将发送至您的邮箱', 'success');
                }, 1000);
            }
        }
        
        // 查看考试详情
        function viewExamDetail(examId) {
            const exams = {
                'exam-caregiver-primary': '养老护理员初级考试',
                'exam-psychology-care': '老年人心理护理考试'
            };
            
            const examName = exams[examId];
            if (examName) {
                showToast(`查看「${examName}」详情`, 'info');
                // 实际跳转：window.location.href = `exam-detail.html?id=${examId}`;
            }
        }
        
        // 重新考试
        function retryExam(examId) {
            const exams = {
                'exam-caregiver-primary': '养老护理员初级考试',
                'exam-psychology-care': '老年人心理护理考试'
            };
            
            const examName = exams[examId];
            if (examName && confirm(`确定要重新参加「${examName}」吗？`)) {
                showLoading();
                showToast(`正在进入「${examName}」...`, 'info');
                
                setTimeout(() => {
                    hideLoading();
                    showToast('即将跳转到考试页面', 'success');
                    // 实际跳转：window.location.href = `exam-start.html?id=${examId}`;
                }, 800);
            }
        }
        
        // 购买课程
        function buyCourse(courseId) {
            const courses = {
                'caregiver-primary': { name: '养老护理员（初级）考证培训', price: 599 },
                'psychology-care': { name: '老年人心理护理专题课程', price: 399 },
                'caregiver-intermediate': { name: '养老护理员（中级）提升课程', price: 799 }
            };
            
            const course = courses[courseId];
            if (course) {
                showLoading();
                showToast(`正在购买「${course.name}」...`, 'info');
                
                setTimeout(() => {
                    hideLoading();
                    showToast(`「${course.name}」购买成功！`, 'success');
                }, 1000);
            }
        }
        
        // 取消收藏
        function removeFavorite(courseId) {
            const courses = {
                'caregiver-primary': '养老护理员（初级）考证培训',
                'psychology-care': '老年人心理护理专题课程',
                'caregiver-intermediate': '养老护理员（中级）提升课程'
            };
            
            const courseName = courses[courseId];
            if (courseName && confirm(`确定要取消收藏「${courseName}」吗？`)) {
                showToast(`已取消收藏「${courseName}」`, 'info');
            }
        }
    </script>
</body>
</html>
