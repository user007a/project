<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能测试</title>
</head>
<body>
    <h1>功能测试页面</h1>
    
    <h2>我的学习</h2>
    <button onclick="goToCourse('caregiver-primary')">继续学习 - 养老护理员（初级）</button>
    <button onclick="goToCourse('psychology-care')">继续学习 - 老年人心理护理</button>
    
    <h2>我的订单</h2>
    <button onclick="applyInvoice('202401150001')">申请发票</button>
    <button onclick="viewOrderDetail('202401150001')">查看订单详情</button>
    <button onclick="goToCourse('caregiver-primary')">去学习</button>
    <button onclick="payOrder('202401140002')">立即支付</button>
    <button onclick="cancelOrder('202401140002')">取消订单</button>
    
    <h2>我的考试</h2>
    <button onclick="viewExamDetail('exam-caregiver-primary')">查看考试详情</button>
    <button onclick="retryExam('exam-caregiver-primary')">重新考试</button>
    
    <h2>我的收藏</h2>
    <button onclick="buyCourse('caregiver-primary')">立即购买</button>
    <button onclick="removeFavorite('caregiver-primary')">取消收藏</button>
    
    <div id="loadingOverlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); z-index: 9999;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">加载中...</div>
    </div>
    
    <div id="toastContainer" style="position: fixed; top: 20px; right: 20px; z-index: 10000;"></div>
    
    <script>
        // 简化的Toast
        const toast = {
            show: function(message, type = 'info') {
                alert(`[${type}] ${message}`);
            },
            success: function(message) {
                this.show(message, 'success');
            },
            error: function(message) {
                this.show(message, 'error');
            },
            info: function(message) {
                this.show(message, 'info');
            }
        };
        
        // 简化的Loading
        const loading = {
            show: function() {
                document.getElementById('loadingOverlay').style.display = 'block';
            },
            hide: function() {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        };
        
        // 课程跳转功能
        function goToCourse(courseId) {
            const courseMap = {
                'caregiver-primary': { name: '养老护理员（初级）考证培训', url: 'course-live.html?id=caregiver-primary' },
                'psychology-care': { name: '老年人心理护理专题课程', url: 'course-live.html?id=psychology-care' },
                'caregiver-intermediate': { name: '养老护理员（中级）提升课程', url: 'course-live.html?id=caregiver-intermediate' }
            };
            
            const course = courseMap[courseId];
            if (course) {
                loading.show();
                toast.info(`正在进入「${course.name}」...`);
                
                setTimeout(() => {
                    loading.hide();
                    alert(`即将跳转到: ${course.url}`);
                    // window.location.href = course.url;
                }, 800);
            } else {
                toast.error('课程信息不存在');
            }
        }
        
        // 订单相关功能
        function payOrder(orderId) {
            loading.show();
            toast.info('正在处理支付...');
            
            setTimeout(() => {
                loading.hide();
                toast.success(`订单 ${orderId} 支付成功！`);
            }, 1500);
        }
        
        function cancelOrder(orderId) {
            if (confirm(`确定要取消订单 ${orderId} 吗？`)) {
                loading.show();
                
                setTimeout(() => {
                    loading.hide();
                    toast.info(`订单 ${orderId} 已取消`);
                }, 500);
            }
        }
        
        function viewOrderDetail(orderId) {
            toast.info(`查看订单 ${orderId} 详情`);
            alert(`即将跳转到订单详情页: order-detail.html?id=${orderId}`);
        }
        
        // 发票申请功能
        function applyInvoice(orderId) {
            const invoiceType = prompt('请选择发票类型:\n1. 个人\n2. 企业', '1');
            const title = prompt('请输入发票抬头:');
            const email = prompt('请输入邮箱:');
            
            if (title && email) {
                loading.show();
                
                setTimeout(() => {
                    loading.hide();
                    toast.success('发票申请提交成功！发票将发送至您的邮箱');
                }, 1000);
            }
        }
        
        // 考试相关功能
        function viewExamDetail(examId) {
            const examMap = {
                'exam-caregiver-primary': { name: '养老护理员初级考试', url: 'exam-detail.html?id=exam-caregiver-primary' },
                'exam-psychology-care': { name: '老年人心理护理考试', url: 'exam-detail.html?id=exam-psychology-care' }
            };
            
            const exam = examMap[examId];
            if (exam) {
                toast.info(`查看「${exam.name}」详情`);
                alert(`即将跳转到考试详情页: ${exam.url}`);
            } else {
                toast.error('考试信息不存在');
            }
        }
        
        function retryExam(examId) {
            const examMap = {
                'exam-caregiver-primary': { name: '养老护理员初级考试', url: 'exam-start.html?id=exam-caregiver-primary' },
                'exam-psychology-care': { name: '老年人心理护理考试', url: 'exam-start.html?id=exam-psychology-care' }
            };
            
            const exam = examMap[examId];
            if (exam) {
                if (confirm(`确定要重新参加「${exam.name}」吗？`)) {
                    loading.show();
                    toast.info(`正在进入「${exam.name}」...`);
                    
                    setTimeout(() => {
                        loading.hide();
                        alert(`即将跳转到考试页面: ${exam.url}`);
                    }, 800);
                }
            } else {
                toast.error('考试信息不存在');
            }
        }
        
        // 收藏相关功能
        function buyCourse(courseId) {
            const courseMap = {
                'caregiver-primary': { name: '养老护理员（初级）考证培训', price: 599 },
                'psychology-care': { name: '老年人心理护理专题课程', price: 399 },
                'caregiver-intermediate': { name: '养老护理员（中级）提升课程', price: 799 }
            };
            
            const course = courseMap[courseId];
            if (course) {
                loading.show();
                toast.info(`正在购买「${course.name}」...`);
                
                setTimeout(() => {
                    loading.hide();
                    toast.success(`「${course.name}」购买成功！已加入学习列表`);
                }, 1000);
            } else {
                toast.error('课程信息不存在');
            }
        }
        
        function removeFavorite(courseId) {
            const courseMap = {
                'caregiver-primary': '养老护理员（初级）考证培训',
                'psychology-care': '老年人心理护理专题课程',
                'caregiver-intermediate': '养老护理员（中级）提升课程'
            };
            
            const courseName = courseMap[courseId];
            if (confirm(`确定要取消收藏「${courseName}」吗？`)) {
                toast.info(`已取消收藏「${courseName}」`);
            }
        }
    </script>
</body>
</html>
