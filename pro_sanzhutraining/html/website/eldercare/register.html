<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户注册 - 叁竹培训</title>
  <link rel="stylesheet" href="css/design-tokens.css">
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--color-bg-primary);
    }

    .register-wrapper {
      display: flex;
      min-height: 100vh;
    }

    .register-left {
      flex: 1;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 50%, #1a6b3a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 60px;
      position: relative;
      overflow: hidden;
    }

    .register-left::before {
      content: '';
      position: absolute;
      top: -10%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
    }

    .register-left::after {
      content: '';
      position: absolute;
      bottom: -20%;
      left: -10%;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
    }

    .brand-section {
      position: relative;
      z-index: 1;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 48px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .logo-icon svg {
      width: 36px;
      height: 36px;
    }

    .brand-text {
      font-size: 32px;
      font-weight: var(--font-weight-bold);
      color: white;
      letter-spacing: 2px;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      color: white;
    }

    .hero-title {
      font-size: 48px;
      font-weight: var(--font-weight-bold);
      line-height: 1.2;
      margin-bottom: 24px;
    }

    .hero-desc {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.8;
      margin-bottom: 40px;
      max-width: 400px;
    }

    .features-list {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .feature-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .feature-icon .iconify {
      font-size: 22px;
      color: white;
    }

    .feature-text {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: var(--font-weight-medium);
    }

    .register-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      background: var(--color-bg-primary);
    }

    .register-card {
      width: 100%;
      max-width: 500px;
      background: var(--color-bg-card);
      border-radius: var(--radius-xl);
      padding: 48px;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border-light);
    }

    .register-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .register-title {
      font-size: 28px;
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .register-subtitle {
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      gap: 12px;
    }

    .input-wrapper.full-width {
      gap: 0;
    }

    .form-input {
      flex: 1;
      height: 48px;
      padding: 0 16px;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 15px;
      color: var(--text-primary);
      transition: all var(--transition-fast);
      outline: none;
      background: var(--color-gray-50);
    }

    .form-input:focus {
      border-color: var(--color-primary);
      background: var(--color-bg-card);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }

    .form-input.error {
      border-color: var(--color-error);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
    }

    .form-input.success {
      border-color: var(--color-success);
    }

    .send-code-btn {
      flex-shrink: 0;
      padding: 0 24px;
      height: 48px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: var(--text-white);
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }

    .send-code-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.35);
    }

    .send-code-btn:disabled {
      background: var(--color-gray-300);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .password-strength {
      margin-top: 10px;
    }

    .strength-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    .strength-segment {
      flex: 1;
      height: 4px;
      background: var(--color-gray-200);
      border-radius: var(--radius-full);
      transition: all var(--transition-fast);
    }

    .strength-segment.active {
      background: var(--color-primary);
    }

    .strength-segment.weak {
      background: var(--color-error);
    }

    .strength-segment.medium {
      background: var(--color-warning);
    }

    .strength-segment.strong {
      background: var(--color-success);
    }

    .strength-text {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
    }

    .strength-text span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .form-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 24px 0;
    }

    .checkbox-wrapper {
      position: relative;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .checkbox-wrapper input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .checkmark {
      position: absolute;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      background: var(--color-bg-card);
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkbox-wrapper input:checked + .checkmark {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }

    .checkmark::after {
      content: '';
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .checkbox-wrapper input:checked + .checkmark::after {
      opacity: 1;
    }

    .checkbox-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .checkbox-text a {
      color: var(--color-primary);
      font-weight: 600;
    }

    .checkbox-text a:hover {
      text-decoration: underline;
    }

    .register-btn {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: var(--text-white);
      border: none;
      border-radius: var(--radius-md);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .register-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4);
    }

    .register-btn:active {
      transform: translateY(0);
    }

    .login-link {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }

    .login-link a {
      color: var(--color-primary);
      font-weight: 600;
      margin-left: 6px;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: var(--color-error);
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-content {
      background: var(--color-bg-card);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      animation: scaleIn 0.3s ease;
      box-shadow: var(--shadow-floating);
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--color-primary-100) 0%, var(--color-primary-50) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .modal-icon .iconify {
      font-size: 48px;
      color: var(--color-primary);
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .modal-desc {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .modal-btn {
      padding: 14px 48px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: var(--text-white);
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }

    .modal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.35);
    }

    @media (max-width: 992px) {
      .register-wrapper {
        flex-direction: column;
      }

      .register-left {
        padding: 40px 30px;
        min-height: 300px;
      }

      .hero-title {
        font-size: 32px;
      }

      .hero-desc {
        font-size: 16px;
        max-width: 100%;
      }

      .register-right {
        padding: 40px 30px;
      }

      .register-card {
        padding: 32px;
      }
    }

    @media (max-width: 480px) {
      .register-left {
        padding: 30px 20px;
        min-height: 250px;
      }

      .brand-logo {
        margin-bottom: 24px;
      }

      .logo-icon {
        width: 48px;
        height: 48px;
      }

      .logo-icon svg {
        width: 28px;
        height: 28px;
      }

      .brand-text {
        font-size: 24px;
      }

      .hero-title {
        font-size: 26px;
      }

      .hero-desc {
        font-size: 14px;
      }

      .register-right {
        padding: 20px;
      }

      .register-card {
        padding: 24px;
      }

      .register-title {
        font-size: 24px;
      }

      .input-wrapper {
        flex-direction: column;
        gap: 10px;
      }

      .send-code-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="register-wrapper">
    <div class="register-left">
      <div class="brand-section">
        <div class="brand-logo">
          <div class="logo-icon">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 42V14C16 14 12 8 12 4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M24 42V10C24 10 20 5 20 2" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M32 42V16C32 16 28 10 28 6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 22C14 22 16 20 20 22" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M22 18C22 18 24 16 28 18" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M30 24C30 24 32 22 36 24" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M12 28C12 28 14 26 16 28" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="brand-text">叁竹培训</span>
        </div>
      </div>

      <div class="hero-content">
        <h1 class="hero-title">开启您的<br/>职业发展之旅</h1>
        <p class="hero-desc">专注养老护理领域，提供专业培训课程与技能认证服务，助您成就职业梦想。</p>
      </div>

      <div class="features-list">
        <div class="feature-item">
          <div class="feature-icon">
            <span class="iconify" data-icon="solar:graduation-cap-bold"></span>
          </div>
          <span class="feature-text">专业认证课程</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">
            <span class="iconify" data-icon="solar:video-circle-bold"></span>
          </div>
          <span class="feature-text">高清视频教学</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">
            <span class="iconify" data-icon="solar:users-bold"></span>
          </div>
          <span class="feature-text">专业导师指导</span>
        </div>
      </div>
    </div>

    <div class="register-right">
      <div class="register-card">
        <div class="register-header">
          <h2 class="register-title">创建账户</h2>
          <p class="register-subtitle">注册成为叁竹培训学员</p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label class="form-label">手机号码</label>
            <div class="input-wrapper full-width">
              <input type="tel" class="form-input" id="phone" placeholder="请输入手机号码" maxlength="11">
            </div>
            <p class="error-message" id="phoneError">请输入正确的手机号码</p>
          </div>

          <div class="form-group">
            <label class="form-label">验证码</label>
            <div class="input-wrapper">
              <input type="text" class="form-input" id="code" placeholder="请输入验证码" maxlength="6">
              <button type="button" class="send-code-btn" id="sendCodeBtn" onclick="sendCode()">
                获取验证码
              </button>
            </div>
            <p class="error-message" id="codeError">请输入6位验证码</p>
          </div>

          <div class="form-group">
            <label class="form-label">登录密码</label>
            <div class="input-wrapper full-width">
              <input type="password" class="form-input" id="password" placeholder="请设置登录密码（8-20位，包含字母和数字）">
            </div>
            <div class="password-strength" id="passwordStrength">
              <div class="strength-bar">
                <div class="strength-segment" id="strength1"></div>
                <div class="strength-segment" id="strength2"></div>
                <div class="strength-segment" id="strength3"></div>
                <div class="strength-segment" id="strength4"></div>
              </div>
              <div class="strength-text">
                <span>密码强度：<strong id="strengthLabel">弱</strong></span>
                <span>8-20位，包含字母和数字</span>
              </div>
            </div>
            <p class="error-message" id="passwordError">密码必须为8-20位，且包含字母和数字</p>
          </div>

          <div class="form-group">
            <label class="form-label">确认密码</label>
            <div class="input-wrapper full-width">
              <input type="password" class="form-input" id="confirmPassword" placeholder="请再次输入密码">
            </div>
            <p class="error-message" id="confirmError">两次密码输入不一致</p>
          </div>

          <div class="form-checkbox">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="agreeTerms">
              <span class="checkmark"></span>
            </div>
            <div class="checkbox-text">
              我已阅读并同意<a href="javascript:void(0)">《用户服务协议》</a>和<a href="javascript:void(0)">《隐私政策》</a>
            </div>
          </div>

          <button type="submit" class="register-btn">
            <span class="iconify" data-icon="solar:user-plus-bold"></span>
            注册
          </button>
        </form>

        <div class="login-link">
          已有账号？
          <a href="login.html">去登录</a>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="successModal">
    <div class="modal-content">
      <div class="modal-icon">
        <span class="iconify" data-icon="solar:check-circle-bold"></span>
      </div>
      <h2 class="modal-title">注册成功</h2>
      <p class="modal-desc">恭喜您已成功注册叁竹培训账号<br>即将跳转到登录页面...</p>
      <button class="modal-btn" onclick="goToLogin()">立即登录</button>
    </div>
  </div>

  <script>
    let countdown = 60;
    let timer = null;

    function sendCode() {
      const phone = document.getElementById('phone').value;
      const phoneRegex = /^1[3-9]\d{9}$/;

      if (!phoneRegex.test(phone)) {
        showError('phone', 'phoneError');
        return;
      }

      hideError('phone', 'phoneError');
      const btn = document.getElementById('sendCodeBtn');
      btn.disabled = true;
      btn.textContent = `${countdown}秒后重试`;

      timer = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '获取验证码';
          countdown = 60;
        } else {
          btn.textContent = `${countdown}秒后重试`;
        }
      }, 1000);
    }

    function checkPasswordStrength(password) {
      let strength = 0;
      const hasLetter = /[a-zA-Z]/.test(password);
      const hasNumber = /\d/.test(password);
      const isValidLength = password.length >= 8 && password.length <= 20;

      if (isValidLength) strength++;
      if (hasLetter) strength++;
      if (hasNumber) strength++;
      if (password.length >= 12 && hasLetter && hasNumber) strength++;

      return Math.min(strength, 4);
    }

    function updateStrengthIndicator(strength) {
      const segments = ['strength1', 'strength2', 'strength3', 'strength4'];
      const labels = ['非常弱', '弱', '中等', '强', '非常强'];
      const labelEl = document.getElementById('strengthLabel');

      segments.forEach((id, index) => {
        const segment = document.getElementById(id);
        segment.classList.remove('active', 'weak', 'medium', 'strong');

        if (index < strength) {
          segment.classList.add('active');
          if (strength <= 1) {
            segment.classList.add('weak');
          } else if (strength === 2) {
            segment.classList.add('medium');
          } else {
            segment.classList.add('strong');
          }
        }
      });

      labelEl.textContent = labels[strength];
      labelEl.style.color = strength <= 1 ? '#ef4444' : strength === 2 ? '#f59e0b' : '#10b981';
    }

    document.getElementById('password').addEventListener('input', function(e) {
      const password = e.target.value;
      const strength = checkPasswordStrength(password);
      updateStrengthIndicator(strength);

      if (password.length > 0) {
        hideError('password', 'passwordError');
      }
    });

    document.getElementById('confirmPassword').addEventListener('input', function(e) {
      const password = document.getElementById('password').value;
      const confirm = e.target.value;

      if (confirm.length > 0 && password !== confirm) {
        showError('confirmPassword', 'confirmError');
      } else if (confirm.length > 0 && password === confirm) {
        hideError('confirmPassword', 'confirmError');
        e.target.classList.add('success');
      }
    });

    function showError(inputId, errorId) {
      document.getElementById(inputId).classList.add('error');
      document.getElementById(inputId).classList.remove('success');
      document.getElementById(errorId).classList.add('show');
    }

    function hideError(inputId, errorId) {
      document.getElementById(inputId).classList.remove('error');
      document.getElementById(inputId).classList.add('success');
      document.getElementById(errorId).classList.remove('show');
    }

    document.getElementById('phone').addEventListener('input', function(e) {
      const phone = e.target.value;
      const phoneRegex = /^1[3-9]\d{9}$/;

      if (phone.length === 11 && phoneRegex.test(phone)) {
        hideError('phone', 'phoneError');
      } else if (phone.length > 0 && phone.length < 11) {
        this.classList.remove('success');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const phone = document.getElementById('phone').value;
      const code = document.getElementById('code').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const agreeTerms = document.getElementById('agreeTerms').checked;

      const phoneRegex = /^1[3-9]\d{9}$/;
      const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,20}$/;

      let isValid = true;

      if (!phoneRegex.test(phone)) {
        showError('phone', 'phoneError');
        isValid = false;
      }

      if (code.length !== 6) {
        showError('code', 'codeError');
        isValid = false;
      }

      if (!passwordRegex.test(password)) {
        showError('password', 'passwordError');
        isValid = false;
      }

      if (password !== confirmPassword) {
        showError('confirmPassword', 'confirmError');
        isValid = false;
      }

      if (!agreeTerms) {
        alert('请阅读并同意用户协议');
        isValid = false;
      }

      if (isValid) {
        document.getElementById('successModal').classList.add('show');
      }
    });

    function goToLogin() {
      window.location.href = 'login.html';
    }

    document.getElementById('successModal').addEventListener('click', function(e) {
      if (e.target === this) {
        goToLogin();
      }
    });
  </script>
</body>
</html>
