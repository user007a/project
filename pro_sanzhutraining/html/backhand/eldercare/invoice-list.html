<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发票管理 - 叁竹培训系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.95); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-\[slideIn_0\.3s_ease-out\] { animation: slideIn 0.3s ease-out; }
        .animate-\[fadeOut_0\.3s_ease-out\] { animation: fadeOut 0.3s ease-out; }
        .animate-\[fadeIn_0\.15s_ease-out\] { animation: fadeIn 0.15s ease-out; }
    </style>
    <style>
        .modal-overlay { opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.show { opacity: 1; }
        .modal-content { transform: scale(0.95) translateY(10px); opacity: 0; transition: all 0.3s ease; }
        .modal-overlay.show .modal-content { transform: scale(1) translateY(0); opacity: 1; }
    </style>
</head>
<body class="bg-[#F0F2F5]">

    
        <!-- 顶部栏 -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-shrink-0">
            <div>
                                <h1 class="text-lg font-bold text-gray-900">发票管理</h1>
            </div>
            <div class="flex items-center gap-4">
                <button class="relative p-2 text-gray-400 hover:text-gray-600 transition-colors">
                    <span class="iconify text-xl" data-icon="ri:notification-3-line"></span>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <div class="h-6 w-px bg-gray-200"></div>
            <div class="relative">
                <div id="adminDropdown" class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 px-3 py-1.5 rounded-lg transition-colors">
                    <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                        <span class="text-blue-600 text-sm font-bold">管</span>
                    </div>
                    <span class="text-sm text-gray-700">管理员</span>
                    <span class="iconify text-gray-400" data-icon="ri:arrow-down-s-line"></span>
                </div>
                <div id="adminMenu" class="hidden absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50">
                    <a href="admin-profile.html" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                        <span class="iconify mr-2 text-gray-400" data-icon="ri:user-line"></span>
                        个人信息
                    </a>
                    <a href="login.html" class="flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                        <span class="iconify mr-2" data-icon="ri:logout-circle-line"></span>
                        退出登录
                    </a>
                </div>
            </div>
                <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 px-3 py-1.5 rounded-lg transition-colors">
                    <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                        <span class="text-blue-600 text-sm font-bold">管</span>
                    </div>
                    <span class="text-sm text-gray-700">管理员</span>
                    <span class="iconify text-gray-400" data-icon="ri:arrow-down-s-line"></span>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6">
            <!-- 统计卡片 -->
            <div class="grid grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs text-gray-500">开票总张数</p>
                            <p class="text-xl font-bold text-gray-900 mt-1">126</p>
                            <p class="text-xs text-green-600 mt-1 flex items-center gap-0.5">
                                <span class="iconify text-xs" data-icon="ri:arrow-up-line"></span>15.2%
                            </p>
                        </div>
                        <div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center">
                            <span class="iconify text-blue-500 text-xl" data-icon="ri:file-text-line"></span>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs text-gray-500">开票总金额</p>
                            <p class="text-xl font-bold text-gray-900 mt-1">¥156,800</p>
                            <p class="text-xs text-green-600 mt-1 flex items-center gap-0.5">
                                <span class="iconify text-xs" data-icon="ri:arrow-up-line"></span>18.7%
                            </p>
                        </div>
                        <div class="w-10 h-10 bg-green-50 rounded-lg flex items-center justify-center">
                            <span class="iconify text-green-500 text-xl" data-icon="ri:money-cny-circle-line"></span>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs text-gray-500">待审核</p>
                            <p class="text-xl font-bold text-gray-900 mt-1">12</p>
                            <p class="text-xs text-yellow-600 mt-1 flex items-center gap-0.5">
                                <span class="iconify text-xs" data-icon="ri:alert-circle-line"></span>待处理
                            </p>
                        </div>
                        <div class="w-10 h-10 bg-yellow-50 rounded-lg flex items-center justify-center">
                            <span class="iconify text-yellow-500 text-xl" data-icon="ri:clock-line"></span>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border shadow-sm">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs text-gray-500">本月新增</p>
                            <p class="text-xl font-bold text-gray-900 mt-1">32</p>
                            <p class="text-xs text-green-600 mt-1 flex items-center gap-0.5">
                                <span class="iconify text-xs" data-icon="ri:trending-up-line"></span>增长中
                            </p>
                        </div>
                        <div class="w-10 h-10 bg-purple-50 rounded-lg flex items-center justify-center">
                            <span class="iconify text-purple-500 text-xl" data-icon="ri:calendar-line"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 搜索筛选区 -->
            <div class="bg-white p-6 rounded-xl border shadow-sm mb-6">
                <div class="grid grid-cols-6 gap-4 items-end">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">用户</label>
                        <input type="text" id="searchUser" placeholder="搜索用户姓名" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">公司名称</label>
                        <input type="text" id="searchCompany" placeholder="搜索公司名称" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">开票状态</label>
                        <select id="searchStatus" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm text-gray-500 transition-all">
                            <option value="all">全部</option>
                            <option value="pending">待审核</option>
                            <option value="approved">已通过</option>
                            <option value="rejected">已拒绝</option>
                            <option value="issued">已开票</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">开票类型</label>
                        <select id="searchType" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm text-gray-500 transition-all">
                            <option value="all">全部</option>
                            <option value="general">增值税普通发票</option>
                            <option value="special">增值税专用发票</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">开票时间</label>
                        <div class="flex items-center gap-2">
                            <input type="date" id="startDate" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm text-gray-500 transition-all">
                            <span class="text-gray-400 text-sm">至</span>
                            <input type="date" id="endDate" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm text-gray-500 transition-all">
                        </div>
                    </div>
                    <div class="flex items-end gap-2">
                        <button onclick="searchInvoices()" class="px-5 py-2 bg-[#1890FF] text-white rounded-lg text-sm font-semibold hover:bg-[#1890FF] transition-colors">搜索</button>
                        <button onclick="resetSearch()" class="px-5 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors">重置</button>
                    </div>
                </div>
            </div>

            <!-- 操作栏 + 数据表格 -->
            <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b bg-gray-50/50 flex justify-between items-center">
                    <span class="text-sm text-gray-500">共 <span class="font-semibold text-gray-900">23</span> 条发票记录</span>
                    <div class="flex items-center gap-3">
                        <button onclick="exportInvoices()" class="inline-flex items-center gap-2 px-4 py-2 bg-[#1890FF] text-white rounded-lg text-sm font-medium hover:bg-[#1890FF] transition-colors">
                            <span class="iconify" data-icon="ri:download-line"></span>导出发票
                        </button>
                    </div>
                </div>

                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-gray-100">
                                <th class="px-4 py-3 text-left text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/50 w-12 whitespace-nowrap">序号</th>
                                <th class="px-4 py-3 text-left text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/50">用户</th>
                                <th class="px-4 py-3 text-left text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/50">开票公司名称</th>
                                <th class="px-4 py-3 text-left text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/50">开票抬头</th>
                                <th class="px-4 py-3 text-left text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/50">开票金额</th>
                                <th class="px-4 py-3 text-left text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/50">开票类型</th>
                                <th class="px-4 py-3 text-left text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/50">开票状态</th>
                                <th class="px-4 py-3 text-left text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/50">开票时间</th>
                                <th class="px-4 py-3 text-right text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/50">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100" id="invoiceTableBody">
                        </tbody>
                    </table>
                </div>
                <!-- 分页 -->
                <div class="px-6 py-4 border-t flex items-center justify-between">
                    <span id="pageInfo" class="text-sm text-gray-500">第 1 / 1 页，共 0 条</span>
                    <div id="paginationBtns" class="flex items-center gap-1">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 modal-overlay" onclick="if(event.target===this)closeDetail()">
        <div class="modal-content bg-white rounded-2xl w-full max-w-3xl max-h-[85vh] overflow-hidden shadow-xl mx-4">
            <div class="flex items-center justify-between px-6 py-4 border-b">
                <h3 class="text-lg font-bold text-gray-900">发票详情</h3>
                <button onclick="closeDetail()" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
                    <span class="iconify" data-icon="ri:close-line"></span>
                </button>
            </div>
            <div class="p-6 overflow-y-auto" id="detailContent">
            </div>
            <div class="px-6 py-4 border-t flex justify-end gap-3">
                <button onclick="closeDetail()" class="px-5 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">返回</button>
                <button onclick="downloadPDFFromDetail()" class="px-5 py-2 bg-[#1890FF] text-white rounded-lg text-sm font-semibold hover:bg-[#1890FF] transition-colors">下载PDF</button>
            </div>
        </div>
    </div>

    <!-- 编辑弹窗 -->
    <div id="editModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 modal-overlay" onclick="if(event.target===this)closeEdit()">
        <div class="modal-content bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden shadow-xl mx-4">
            <div class="flex items-center justify-between px-6 py-4 border-b">
                <h3 class="text-lg font-bold text-gray-900">编辑发票</h3>
                <button onclick="closeEdit()" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
                    <span class="iconify" data-icon="ri:close-line"></span>
                </button>
            </div>
            <div class="p-6 overflow-y-auto">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">开票公司名称</label>
                        <input type="text" id="editCompanyName" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">开票抬头</label>
                        <input type="text" id="editInvoiceTitle" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">开票金额</label>
                        <input type="number" id="editAmount" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">开票类型</label>
                        <select id="editType" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm">
                            <option value="general">增值税普通发票</option>
                            <option value="special">增值税专用发票</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="px-6 py-4 border-t flex justify-end gap-3">
                <button onclick="closeEdit()" class="px-5 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">取消</button>
                <button onclick="saveEdit()" class="px-5 py-2 bg-[#1890FF] text-white rounded-lg text-sm font-semibold hover:bg-[#1890FF] transition-colors">保存</button>
            </div>
        </div>
    </div>

            // 确保数据已定义

                return;
            }
            
            filteredData = Object.keys(invoiceData).map(key => ({ id: key, ...invoiceData[key] }));
            // 默认按时间倒序
            filteredData.sort((a, b) => new Date(b.time) - new Date(a.time));
            totalPages = Math.ceil(filteredData.length / pageSize);
            if (totalPages < 1) totalPages = 1;
            renderTable();
            renderPagination();
        }

            const endIndex = Math.min(startIndex + pageSize, filteredData.length);

            let html = '';
            pageData.forEach((data, index) => {
                const statusClass = getStatusClass(data.status);

                const nameChar = data.user.charAt(0);
                const colorIndex = globalIndex % avatarColors.length;
                const avatarClass = avatarColors[colorIndex];

                html += `

                '已通过': 'px-2 py-1 bg-green-50 text-green-700 rounded text-xs font-medium',

                '已拒绝': 'px-2 py-1 bg-red-50 text-red-700 rounded text-xs font-medium'
            };
            return classes[status] || 'px-2 py-1 bg-gray-50 text-gray-700 rounded text-xs font-medium';
        }

        // 渲染分页
        function renderPagination() {
            const pageInfo = document.getElementById('pageInfo');
            const paginationBtns = document.getElementById('paginationBtns');

            pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页，共 ${filteredData.length} 条`;

            let html = '';
            html += `<button onclick="prevPage()" class="px-3 py-1.5 text-sm border rounded-lg ${currentPage === 1 ? 'border-gray-200 text-gray-400 cursor-not-allowed' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;

            // 显示所有页码（参考学员管理页面样式）
            for (let i = 1; i <= totalPages; i++) {
                html += `<button onclick="goToPage(${i})" class="px-3 py-1.5 text-sm border rounded-lg ${i === currentPage ? 'bg-[#1890FF] text-white border-[#1890FF]' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}">${i}</button>`;
            }

            html += `<button onclick="nextPage()" class="px-3 py-1.5 text-sm border rounded-lg ${currentPage === totalPages ? 'border-gray-200 text-gray-400 cursor-not-allowed' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;

            paginationBtns.innerHTML = html;
        }

        // 上一页
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
                renderPagination();
            }
        }

        // 下一页
        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
                renderPagination();
            }
        }

        // 跳转到指定页
        function goToPage(page) {
            if (page >= 1 && page <= totalPages) {
                currentPage = page;

                renderPagination();

        function editInvoice(id) {
            currentEditId = id;

            document.getElementById('editCompanyName').value = data.companyName;
            document.getElementById('editInvoiceTitle').value = data.invoiceTitle;
            document.getElementById('editAmount').value = data.amount.replace(/[^\d.]/g, '');
            document.getElementById('editType').value = data.type.includes('专用') ? 'special' : 'general';
            
            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editModal').classList.add('show');
        }

            document.getElementById('editModal').classList.add('hidden');

            currentEditId = '';

            const data = invoiceData[currentEditId];
            if (!data) return;
            
            data.companyName = document.getElementById('editCompanyName').value;

            data.amount = document.getElementById('editAmount').value;

        function convertToChinese(num) {
            const chars = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
            const units = ['', '拾', '佰', '仟', '万', '拾', '佰', '仟', '亿'];
            num = num.replace(/,/g, '');
            let result = '';
            
            for (let i = 0; i < num.length; i++) {
                const digit = parseInt(num[i]);
                const unitIndex = num.length - 1 - i;
                result += chars[digit] + units[unitIndex];
            }
            
            result = result.replace(/零+/g, '零').replace(/零万/g, '万').replace(/零亿/g, '亿');
            return result;
        }

        function searchInvoices() {
            const user = document.getElementById('searchUser').value.toLowerCase();
            const company = document.getElementById('searchCompany').value.toLowerCase();
            const status = document.getElementById('searchStatus').value;
            const type = document.getElementById('searchType').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            // 筛选数据
            filteredData = Object.keys(invoiceData).map(key => ({ id: key, ...invoiceData[key] }));

            filteredData = filteredData.filter(data => {
                const rowUser = data.user.toLowerCase();
                const rowCompany = data.companyName.toLowerCase();
                const rowStatus = data.status;
                const rowType = data.type;
                const rowTime = data.time.split(' ')[0];

                let match = true;

                if (user && !rowUser.includes(user)) match = false;
                if (company && !rowCompany.includes(company)) match = false;
                if (status !== 'all' && rowStatus !== status) match = false;
                if (type !== 'all') {
                    const typeText = type === 'general' ? '普通' : '专用';
                    if (!rowType.includes(typeText)) match = false;
                }
                if (startDate && rowTime < startDate) match = false;
                if (endDate && rowTime > endDate) match = false;

                return match;
            });

            // 按时间倒序
            filteredData.sort((a, b) => new Date(b.time) - new Date(a.time));

            // 重置到第一页
            currentPage = 1;
            totalPages = Math.ceil(filteredData.length / pageSize);
            if (totalPages < 1) totalPages = 1;

            renderTable();
            renderPagination();
        }

        function resetSearch() {
            document.getElementById('searchUser').value = '';
            document.getElementById('searchCompany').value = '';
            document.getElementById('searchStatus').value = 'all';
            document.getElementById('searchType').value = 'all';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';

            // 恢复所有数据
            filteredData = Object.keys(invoiceData).map(key => ({ id: key, ...invoiceData[key] }));
            filteredData.sort((a, b) => new Date(b.time) - new Date(a.time));

            currentPage = 1;
            totalPages = Math.ceil(filteredData.length / pageSize);
            if (totalPages < 1) totalPages = 1;

            renderTable();
            renderPagination();
        }

            switch(status) {
                case '待审核': return 'yellow';
                case '已通过': return 'green';
                case '已开票': return 'blue';
                case '已拒绝': return 'red';
                default: return 'gray';

        let initialized = false;

        function initializePage() {
            if (initialized) return;
            initialized = true;
            
            console.log('Initializing pagination...');
            console.log('invoiceData:', invoiceData);
            initPagination();

        // 导出发票
        function exportInvoices() {
            const headers = ['序号', '用户', '开票公司名称', '开票抬头', '纳税人识别号', '地址', '电话', '开户银行', '银行账号', '开票金额', '开票类型', '开票状态', '开票时间'];
            
            const data = filteredData.map((invoice, index) => [
                index + 1,
                invoice.user,
                invoice.companyName,
                invoice.invoiceTitle,
                invoice.taxNumber || '',
                invoice.address || '',
                invoice.phone || '',
                invoice.bank || '',
                invoice.account || '',
                '¥' + invoice.amount,
                invoice.type,
                invoice.status,
                invoice.time
            ]);
            
            function escapeCsvField(field) {
                if (field == null) return '';
                const str = String(field);
                if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                    return '"' + str.replace(/"/g, '""') + '"';
                }
                return str;
            }
            
            let csvContent = '\uFEFF';
            csvContent += headers.map(escapeCsvField).join(',') + '\n';
            data.forEach(row => {
                csvContent += row.map(escapeCsvField).join(',') + '\n';
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', '发票列表_' + new Date().toISOString().slice(0, 10) + '.csv');
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // 确保DOM加载完成后再初始化
        document.addEventListener('DOMContentLoaded', initializePage);

        // 也在脚本加载完成后尝试初始化（防止DOMContentLoaded已触发）
        if (document.readyState !== 'loading') {
            initializePage();
        }

        document.querySelectorAll('.menu-toggle').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const menuGroup = this.closest('.menu-group');
                const menuItems = menuGroup.querySelector('.menu-items');
                const arrow = this.querySelector('.menu-arrow');
                
                const isExpanded = menuItems.style.display !== 'none';
                
                if (isExpanded) {
                    menuItems.style.display = 'none';
                    arrow.textContent = '›';
                } else {
                    menuItems.style.display = 'block';
                    arrow.textContent = '‹';
                }
            });
        });
    </script>

<script>
    function showToast(type, title, message, duration = 4000) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        var toastId = 'toast_' + Date.now();
        var icons = { success: 'ri:checkbox-circle-line', error: 'ri:error-warning-line', warning: 'ri:alert-line', info: 'ri:information-line' };
        var colors = { success: 'bg-green-50 border-green-200 text-green-800', error: 'bg-red-50 border-red-200 text-red-800', warning: 'bg-yellow-50 border-yellow-200 text-yellow-800', info: 'bg-blue-50 border-blue-200 text-blue-800' };
        var iconColors = { success: 'text-green-500', error: 'text-red-500', warning: 'text-yellow-500', info: 'text-blue-500' };
        toast.id = toastId;
        toast.className = 'pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-lg ' + colors[type] + ' animate-[slideIn_0.3s_ease-out]';
        toast.innerHTML = '<span class="iconify text-xl ' + iconColors[type] + '" data-icon="' + icons[type] + '"></span><div class="flex-1"><div class="font-medium text-sm">' + title + '</div><div class="text-xs opacity-80 mt-0.5">' + message + '</div></div><button onclick="dismissToast(\'' + toastId + '\')" class="opacity-60 hover:opacity-100 transition-opacity"><span class="iconify text-lg" data-icon="ri:close-line"></span></button>';
        container.appendChild(toast);
        setTimeout(function() { var el = document.getElementById(toastId); if(el) { el.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(function() { el.remove(); }, 300); } }, duration);
    }
    function dismissToast(id) { var el = document.getElementById(id); if(el) { el.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(function() { el.remove(); }, 300); } }
document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') { if (e.key === 'Escape') e.target.blur(); return; }
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); showToast('info', '快捷搜索', '按 Ctrl+K 打开全局搜索'); }
);

    function initShortcutHints() {
        var hint = document.createElement('div');
        hint.className = 'fixed bottom-4 left-4 z-[9997] bg-white px-3 py-2 rounded-lg shadow-lg border border-gray-100 text-xs text-gray-500';
        hint.innerHTML = '<div class="flex items-center gap-3"><span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">Ctrl</kbd>+<kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">K</kbd> 搜索</span><span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">Ctrl</kbd>+<kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">N</kbd> 新增</span></div>';
        hint.style.display = 'none'; hint.id = 'shortcutHint';
        var hintTimeout;
        document.addEventListener('keydown', function(e) { if (e.ctrlKey || e.metaKey) { hint.style.display = 'flex'; clearTimeout(hintTimeout); hintTimeout = setTimeout(function() { hint.style.display = 'none'; }, 3000); } });
        document.body.appendChild(hint);
    }
    initShortcutHints();
    </script>
