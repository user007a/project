            <a href="teacher-list.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all"><span class="iconify mr-3 text-lg" data-icon="ri:user-star-line"></span><span class="text-sm">讲师管理</span></a>

    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-lg font-bold text-gray-900">支付配置</h1>
            </div>
            <div class="flex items-center gap-4">
                <button class="relative p-2 text-gray-400 hover:text-gray-600 transition-colors"><span class="iconify text-xl" data-icon="ri:notification-3-line"></span><span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
                <div class="h-6 w-px bg-gray-200"></div>
                <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 px-3 py-1.5 rounded-lg transition-colors"><div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center"><span class="text-blue-600 text-sm font-bold">管</span></div><span class="text-sm text-gray-700">管理员</span><span class="iconify text-gray-400" data-icon="ri:arrow-down-s-line"></span></div>
            </div>
        </header>
        <main class="flex-1 overflow-y-auto p-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">支付配置</h1>
            <!-- 微信支付 -->
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-6">
                <div class="px-6 py-4 bg-gray-50 border-b flex items-center justify-between"><h3 class="text-base font-bold text-gray-900">微信支付</h3><span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs">已启用</span></div>
                <div class="p-6 grid grid-cols-2 gap-6">
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">AppID</label><input type="text" value="wx•••••••••" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">商户号 (MchID)</label><input type="text" value="1••••••••" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">API密钥</label><input type="password" value="••••••••••••••••" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">回调地址</label><input type="text" value="https://api.sanzhuedu.com/pay/wechat/callback" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div class="col-span-2 flex items-center gap-4"><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"><span class="text-sm text-gray-700">启用微信支付</span></label><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"><span class="text-sm text-gray-700">启用H5支付</span></label></div>
                </div>
            </div>
            <div class="flex items-center justify-end gap-3"><button class="px-10 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">保存配置</button></div>
        </main>
    </div>
