<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付配置 - 叁竹培训系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.95); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-\[slideIn_0\.3s_ease-out\] { animation: slideIn 0.3s ease-out; }
        .animate-\[fadeOut_0\.3s_ease-out\] { animation: fadeOut 0.3s ease-out; }
        .animate-\[fadeIn_0\.15s_ease-out\] { animation: fadeIn 0.15s ease-out; }
    </style>
</head>
<body class="bg-[#F0F2F5]">
    
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-shrink-0">
            <div>
                                <h1 class="text-lg font-bold text-gray-900">支付配置</h1>
            </div>
            <div class="flex items-center gap-4">
                <button class="relative p-2 text-gray-400 hover:text-gray-600 transition-colors"><span class="iconify text-xl" data-icon="ri:notification-3-line"></span><span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
                <div class="h-6 w-px bg-gray-200"></div>
            <div class="relative">
                <div id="adminDropdown" class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 px-3 py-1.5 rounded-lg transition-colors">
                    <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                        <span class="text-blue-600 text-sm font-bold">管</span>
                    </div>
                    <span class="text-sm text-gray-700">管理员</span>
                    <span class="iconify text-gray-400" data-icon="ri:arrow-down-s-line"></span>
                </div>
                <div id="adminMenu" class="hidden absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50">
                    <a href="admin-profile.html" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                        <span class="iconify mr-2 text-gray-400" data-icon="ri:user-line"></span>
                        个人信息
                    </a>
                    <a href="login.html" class="flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                        <span class="iconify mr-2" data-icon="ri:logout-circle-line"></span>
                        退出登录
                    </a>
                </div>
            </div>
                <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 px-3 py-1.5 rounded-lg transition-colors"><div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center"><span class="text-blue-600 text-sm font-bold">管</span></div><span class="text-sm text-gray-700">管理员</span><span class="iconify text-gray-400" data-icon="ri:arrow-down-s-line"></span></div>
            </div>
        </header>
        <main class="flex-1 overflow-y-auto p-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">支付配置</h1>
            <!-- 微信支付 -->
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-6">
                <div class="px-6 py-4 bg-gray-50 border-b flex items-center justify-between"><h3 class="text-base font-bold text-gray-900">微信支付</h3><span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs">已启用</span></div>
                <div class="p-6 grid grid-cols-2 gap-6">
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">AppID</label><input type="text" value="wx•••••••••" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">商户号 (MchID)</label><input type="text" value="1••••••••" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">API密钥</label><input type="password" value="••••••••••••••••" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">回调地址</label><input type="text" value="https://api.sanzhuedu.com/pay/wechat/callback" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div class="col-span-2 flex items-center gap-4"><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"><span class="text-sm text-gray-700">启用微信支付</span></label><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"><span class="text-sm text-gray-700">启用H5支付</span></label></div>
                </div>
            </div>
            <div class="flex items-center justify-end gap-3"><button class="px-10 py-2 bg-[#1890FF] text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">保存配置</button></div>
        </main>
    </div>

    <script>
        document.querySelectorAll('.menu-toggle').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const menuGroup = this.closest('.menu-group');
                const menuItems = menuGroup.querySelector('.menu-items');
                const arrow = this.querySelector('.menu-arrow');
                
                const isExpanded = menuItems.style.display !== 'none';
                
                if (isExpanded) {
                    menuItems.style.display = 'none';
                    arrow.textContent = '›';
                } else {
                    menuItems.style.display = 'block';
                    arrow.textContent = '‹';
                }
            });
        });
    </script>

    <!-- Toast 通知容器 -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<script>
    function showToast(type, title, message, duration = 4000) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        var toastId = 'toast_' + Date.now();
        var icons = { success: 'ri:checkbox-circle-line', error: 'ri:error-warning-line', warning: 'ri:alert-line', info: 'ri:information-line' };
        var colors = { success: 'bg-green-50 border-green-200 text-green-800', error: 'bg-red-50 border-red-200 text-red-800', warning: 'bg-yellow-50 border-yellow-200 text-yellow-800', info: 'bg-blue-50 border-blue-200 text-blue-800' };
        var iconColors = { success: 'text-green-500', error: 'text-red-500', warning: 'text-yellow-500', info: 'text-blue-500' };
        toast.id = toastId;
        toast.className = 'pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-lg ' + colors[type] + ' animate-[slideIn_0.3s_ease-out]';
        toast.innerHTML = '<span class="iconify text-xl ' + iconColors[type] + '" data-icon="' + icons[type] + '"></span><div class="flex-1"><div class="font-medium text-sm">' + title + '</div><div class="text-xs opacity-80 mt-0.5">' + message + '</div></div><button onclick="dismissToast(\'' + toastId + '\')" class="opacity-60 hover:opacity-100 transition-opacity"><span class="iconify text-lg" data-icon="ri:close-line"></span></button>';
        container.appendChild(toast);
        setTimeout(function() { var el = document.getElementById(toastId); if(el) { el.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(function() { el.remove(); }, 300); } }, duration);
    }
    function dismissToast(id) { var el = document.getElementById(id); if(el) { el.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(function() { el.remove(); }, 300); } }
document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') { if (e.key === 'Escape') e.target.blur(); return; }
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); showToast('info', '快捷搜索', '按 Ctrl+K 打开全局搜索'); }
    });

    function initShortcutHints() {
        var hint = document.createElement('div');
        hint.className = 'fixed bottom-4 left-4 z-[9997] bg-white px-3 py-2 rounded-lg shadow-lg border border-gray-100 text-xs text-gray-500';
        hint.innerHTML = '<div class="flex items-center gap-3"><span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">Ctrl</kbd>+<kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">K</kbd> 搜索</span></div>';
        hint.style.display = 'none'; hint.id = 'shortcutHint';
        var hintTimeout;
        document.addEventListener('keydown', function(e) { if (e.ctrlKey || e.metaKey) { hint.style.display = 'flex'; clearTimeout(hintTimeout); hintTimeout = setTimeout(function() { hint.style.display = 'none'; }, 3000); } });
        document.body.appendChild(hint);
    }
    initShortcutHints();
    </script>
<script src="embed.js"></script>

    <script>
        // 管理员下拉菜单
        const adminDropdown = document.getElementById('adminDropdown');
        const adminMenu = document.getElementById('adminMenu');
        if (adminDropdown && adminMenu) {
            adminDropdown.addEventListener('click', function(e) {
                e.stopPropagation();
                adminMenu.classList.toggle('hidden');
            });

            document.addEventListener('click', function() {
                adminMenu.classList.add('hidden');
            });

            adminMenu.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }
    </script>
</body>
</html>
