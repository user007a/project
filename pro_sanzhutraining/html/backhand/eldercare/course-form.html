<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程编辑 - 叁竹培训系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.95); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-\[slideIn_0\.3s_ease-out\] { animation: slideIn 0.3s ease-out; }
        .animate-\[fadeOut_0\.3s_ease-out\] { animation: fadeOut 0.3s ease-out; }
        .animate-\[fadeIn_0\.15s_ease-out\] { animation: fadeIn 0.15s ease-out; }
        .chapter-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .chapter-content.expanded { max-height: 2000px; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .video-upload-area { display: none; }
        .video-upload-area.show { display: block; }
    </style>
</head>
<body class="bg-[#F0F2F5]">

    <!-- 主内容区 -->
    
        <!-- 顶部栏 -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-lg font-bold text-gray-900">课程编辑</h1>
            </div>
            <div class="flex items-center gap-4">
                <button class="relative p-2 text-gray-400 hover:text-gray-600 transition-colors">
                    <span class="iconify text-xl" data-icon="ri:notification-3-line"></span>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <div class="h-6 w-px bg-gray-200"></div>
            <div class="relative">
                <div id="adminDropdown" class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 px-3 py-1.5 rounded-lg transition-colors">
                    <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                        <span class="text-blue-600 text-sm font-bold">管</span>
                    </div>
                    <span class="text-sm text-gray-700">管理员</span>
                    <span class="iconify text-gray-400" data-icon="ri:arrow-down-s-line"></span>
                </div>
                <div id="adminMenu" class="hidden absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50">
                    <a href="admin-profile.html" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                        <span class="iconify mr-2 text-gray-400" data-icon="ri:user-line"></span>
                        个人信息
                    </a>
                    <a href="login.html" class="flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                        <span class="iconify mr-2" data-icon="ri:logout-circle-line"></span>
                        退出登录
                    </a>
                </div>
            </div>
                <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 px-3 py-1.5 rounded-lg transition-colors">
                    <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                        <span class="text-blue-600 text-sm font-bold">管</span>
                    </div>
                    <span class="text-sm text-gray-700">管理员</span>
                    <span class="iconify text-gray-400" data-icon="ri:arrow-down-s-line"></span>
                </div>
            </div>
        </header>

        <!-- 内容区域 -->
        <main class="flex-1 overflow-y-auto p-6">
            <!-- 面包屑 -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-2 text-sm text-gray-500">
                    <a href="course-list.html" class="hover:text-[#1890FF]">课程管理</a>
                    <span class="iconify" data-icon="ri:arrow-right-s-line"></span>
                    <span class="text-gray-900 font-medium">编辑课程</span>
                </div>
                <a href="course-list.html" class="text-sm text-gray-500 hover:text-[#1890FF] flex items-center gap-1 transition-colors">
                    <span class="iconify" data-icon="ri:arrow-left-line"></span>返回列表
                </a>
            </div>

            <div class="grid grid-cols-3 gap-6">
                <!-- 左侧：基本信息 + 章节管理 -->
                <div class="col-span-2 space-y-6">
                    <!-- 基本信息 -->
                    <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
                        <div class="px-6 py-4 border-b bg-gray-50/50">
                            <h3 class="text-base font-bold text-gray-900">基本信息</h3>
                        </div>
                        <div class="p-6 space-y-5">
                            <div class="grid grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1.5">课程名称 <span class="text-red-500">*</span></label>
                                    <input type="text" value="养老护理员（初级）培训班" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1.5">课程分类 <span class="text-red-500">*</span></label>
                                    <select class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all">
                                        <option selected>养老护理员</option>
                                        <option>老年人能力评估师</option>
                                        <option>健康照护师</option>
                                        <option>营养配餐员</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1.5">授课讲师 <span class="text-red-500">*</span></label>
                                    <select class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all">
                                        <option selected>王德明</option>
                                        <option>李秀英</option>
                                        <option>张建国</option>
                                        <option>陈慧芳</option>
                                        <option>刘志强</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1.5">课程价格 <span class="text-red-500">*</span></label>
                                    <div class="relative">
                                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">¥</span>
                                        <input type="number" value="680" class="w-full border border-gray-200 pl-8 pr-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all">
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">课程简介</label>
                                <textarea rows="3" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm resize-none transition-all">本课程面向养老护理行业初学者，系统讲解养老护理基础知识与实操技能，涵盖老年人日常生活照料、基础护理操作、安全防护等内容。</textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">适合人群</label>
                                <textarea rows="3" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm resize-none transition-all"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">课程常见问答</label>
                                <textarea rows="5" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm resize-none transition-all"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">课程封面</label>
                                <div class="flex items-start gap-4">
                                    <div class="w-40 h-24 bg-gray-100 rounded-xl flex items-center justify-center border-2 border-dashed border-gray-200 hover:border-[#1890FF] transition-colors cursor-pointer">
                                        <div class="text-center">
                                            <span class="iconify text-2xl text-gray-300" data-icon="ri:image-add-line"></span>
                                            <p class="text-xs text-gray-400 mt-1">上传封面</p>
                                        </div>
                                    </div>
                                    <div class="text-xs text-gray-400 space-y-1 pt-1">
                                        <p>建议尺寸 750×420px</p>
                                        <p>支持 JPG、PNG 格式</p>
                                        <p>文件大小不超过 2MB</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- 右侧：其他设置 -->
                <div class="space-y-6">
                    <!-- 其他设置 -->
                    <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
                        <div class="px-6 py-4 border-b bg-gray-50/50">
                            <h3 class="text-base font-bold text-gray-900">其他设置</h3>
                        </div>
                        <div class="p-6 space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">总课时数</label>
                                <div class="relative">
                                    <input type="number" value="32" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all">
                                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">课时</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">学习有效期</label>
                                <div class="relative">
                                    <input type="number" value="365" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all">
                                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">天</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">排序权重</label>
                                <input type="number" value="1" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">课程状态</label>
                                <select class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all">
                                    <option>已上架</option>
                                    <option>已下架</option>
                                    <option>草稿</option>
                                </select>
                            </div>
                            <div class="flex items-center justify-between">
                                <label class="text-sm font-medium text-gray-700">是否热门课程</label>
                                <button onclick="this.classList.toggle('bg-[#1890FF]');this.classList.toggle('bg-gray-300');this.querySelector('span').classList.toggle('translate-x-5')" class="w-11 h-6 bg-gray-300 rounded-full relative transition-colors">
                                    <span class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform shadow-sm"></span>
                                </button>
                            </div>
                            <div class="flex items-center justify-between">
                                <label class="text-sm font-medium text-gray-700">是否推荐</label>
                                <button onclick="this.classList.toggle('bg-[#1890FF]');this.classList.toggle('bg-gray-300');this.querySelector('span').classList.toggle('translate-x-5')" class="w-11 h-6 bg-gray-300 rounded-full relative transition-colors">
                                    <span class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform shadow-sm"></span>
                                </button>
                            </div>
                            <div class="flex items-center justify-between">
                                <label class="text-sm font-medium text-gray-700">可申请证书</label>
                                <button onclick="this.classList.toggle('bg-[#1890FF]');this.classList.toggle('bg-gray-300');this.querySelector('span').classList.toggle('translate-x-5')" class="w-11 h-6 bg-[#1890FF] rounded-full relative transition-colors">
                                    <span class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 translate-x-5 transition-transform shadow-sm"></span>
                                </button>
                            </div>
                            <div class="flex items-center justify-between">
                                <label class="text-sm font-medium text-gray-700">是否政府补贴</label>
                                <button onclick="this.classList.toggle('bg-[#1890FF]');this.classList.toggle('bg-gray-300');this.querySelector('span').classList.toggle('translate-x-5')" class="w-11 h-6 bg-gray-300 rounded-full relative transition-colors">
                                    <span class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform shadow-sm"></span>
                                </button>
                            </div>
                            <div class="flex items-center justify-between">
                                <label class="text-sm font-medium text-gray-700">是否持证上岗必备</label>
                                <button onclick="this.classList.toggle('bg-[#1890FF]');this.classList.toggle('bg-gray-300');this.querySelector('span').classList.toggle('translate-x-5')" class="w-11 h-6 bg-gray-300 rounded-full relative transition-colors">
                                    <span class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform shadow-sm"></span>
                                </button>
                            </div>
                            <div class="flex items-center justify-between">
                                <label class="text-sm font-medium text-gray-700">是否免费</label>
                                <button onclick="this.classList.toggle('bg-[#1890FF]');this.classList.toggle('bg-gray-300');this.querySelector('span').classList.toggle('translate-x-5')" class="w-11 h-6 bg-gray-300 rounded-full relative transition-colors">
                                    <span class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform shadow-sm"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="flex items-center justify-end gap-3 mt-6 pb-6">
                <a href="course-list.html" class="px-6 py-2.5 border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors">取消</a>
                <button class="px-6 py-2.5 border border-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors">保存草稿</button>
                <button onclick="showSuccess()" class="px-8 py-2.5 bg-[#1890FF] text-white rounded-lg text-sm font-medium hover:bg-[#1890FF] transition-colors">保存并发布</button>
            </div>
        </main>
    </div>

    <!-- 保存成功弹窗 -->
    <div id="successModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50" onclick="if(event.target===this)this.classList.add('hidden')">
        <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl text-center">
            <div class="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="iconify text-green-500 text-3xl" data-icon="ri:check-line"></span>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">保存成功</h3>
            <p class="text-sm text-gray-500 mb-6">课程已成功保存并发布</p>
            <div class="flex items-center justify-center gap-3">
                <button onclick="document.getElementById('successModal').classList.add('hidden')" class="px-6 py-2 border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors">继续编辑</button>
                <a href="course-list.html" class="px-6 py-2 bg-[#1890FF] text-white rounded-lg text-sm font-medium hover:bg-[#1890FF] transition-colors">返回列表</a>
            </div>
        </div>
    </div>

    <!-- 视频上传弹窗 -->
    <div id="uploadModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50" onclick="if(event.target===this)this.classList.add('hidden')">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl">
            <div class="px-6 py-4 border-b flex items-center justify-between">
                <h3 class="text-lg font-bold text-gray-900">上传视频</h3>
                <button onclick="document.getElementById('uploadModal').classList.add('hidden')" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100">
                    <span class="iconify text-gray-400 text-xl" data-icon="ri:close-line"></span>
                </button>
            </div>
            <div class="p-6">
                <div class="border-2 border-dashed border-gray-200 rounded-xl p-8 text-center hover:border-[#1890FF] transition-colors cursor-pointer">
                    <span class="iconify text-4xl text-gray-300 mb-3" data-icon="ri:video-upload-line"></span>
                    <p class="text-sm text-gray-500 mb-1">拖拽视频文件到此处，或点击选择</p>
                    <p class="text-xs text-gray-400 mt-2">支持 MP4、MOV 格式</p>
                    <p class="text-xs text-gray-400">单个文件不超过 500MB</p>
                </div>
            </div>
            <div class="px-6 py-4 border-t flex items-center justify-end gap-3">
                <button onclick="document.getElementById('uploadModal').classList.add('hidden')" class="px-5 py-2 border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors">取消</button>
                <button onclick="document.getElementById('uploadModal').classList.add('hidden')" class="px-5 py-2 bg-[#1890FF] text-white rounded-lg text-sm font-medium hover:bg-[#1890FF] transition-colors">开始上传</button>
            </div>
        </div>
    </div>

    <script>
        function addChapter() {
            const list = document.getElementById('chapterList');
            const count = list.children.length + 1;
            const chapter = document.createElement('div');
            chapter.className = 'border border-gray-200 rounded-xl overflow-hidden';
            chapter.innerHTML = `
                <div class="px-4 py-3 bg-gray-50/80 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="iconify text-gray-400 drag-handle" data-icon="ri:drag-move-2-line"></span>
                        <input type="text" value="第${count}章：新章节" class="text-sm font-medium text-gray-900 bg-transparent border-none outline-none focus:bg-white focus:border focus:border-gray-200 rounded px-2 py-0.5">
                    </div>
                    <button class="p-1 text-gray-400 hover:text-red-500 transition-colors">
                        <span class="iconify text-sm" data-icon="ri:delete-bin-line"></span>
                    </button>
                </div>
                <div class="px-4 py-3 border-t border-gray-100 bg-white">
                    <div class="flex items-center gap-3">
                        <span class="iconify text-gray-300 flex-shrink-0" data-icon="ri:video-line"></span>
                        <span class="text-sm text-gray-400 flex-1">暂无视频</span>
                        <button onclick="triggerUpload()" class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium text-white bg-[#1890FF] hover:bg-[#1890FF] rounded-lg transition-colors flex-shrink-0">
                            <span class="iconify text-xs" data-icon="ri:upload-cloud-line"></span>上传视频
                        </button>
                        <button class="inline-flex items-center gap-1 px-3 py-1.5 text-sm text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors flex-shrink-0">
                            <span class="iconify text-xs" data-icon="ri:delete-bin-line"></span>删除视频
                        </button>
                    </div>
                </div>
            `;
            list.appendChild(chapter);
        }

        function triggerUpload() {
            document.getElementById('uploadModal').classList.remove('hidden');
        }

        function showSuccess() {
            document.getElementById('successModal').classList.remove('hidden');
        }
    </script>

    <!-- Toast 通知容器 -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<script>
    function showToast(type, title, message, duration = 4000) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        var toastId = 'toast_' + Date.now();
        var icons = { success: 'ri:checkbox-circle-line', error: 'ri:error-warning-line', warning: 'ri:alert-line', info: 'ri:information-line' };
        var colors = { success: 'bg-green-50 border-green-200 text-green-800', error: 'bg-red-50 border-red-200 text-red-800', warning: 'bg-yellow-50 border-yellow-200 text-yellow-800', info: 'bg-blue-50 border-blue-200 text-blue-800' };
        var iconColors = { success: 'text-green-500', error: 'text-red-500', warning: 'text-yellow-500', info: 'text-blue-500' };
        toast.id = toastId;
        toast.className = 'pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-lg ' + colors[type] + ' animate-[slideIn_0.3s_ease-out]';
        toast.innerHTML = '<span class="iconify text-xl ' + iconColors[type] + '" data-icon="' + icons[type] + '"></span><div class="flex-1"><div class="font-medium text-sm">' + title + '</div><div class="text-xs opacity-80 mt-0.5">' + message + '</div></div><button onclick="dismissToast(\'' + toastId + '\')" class="opacity-60 hover:opacity-100 transition-opacity"><span class="iconify text-lg" data-icon="ri:close-line"></span></button>';
        container.appendChild(toast);
        setTimeout(function() { var el = document.getElementById(toastId); if(el) { el.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(function() { el.remove(); }, 300); } }, duration);
    }
    function dismissToast(id) { var el = document.getElementById(id); if(el) { el.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(function() { el.remove(); }, 300); } }
document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') { if (e.key === 'Escape') e.target.blur(); return; }
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); showToast('info', '快捷搜索', '按 Ctrl+K 打开全局搜索'); }
        if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); showSuccess(); }
    });

    function initShortcutHints() {
        var hint = document.createElement('div');
        hint.className = 'fixed bottom-4 left-4 z-[9997] bg-white px-3 py-2 rounded-lg shadow-lg border border-gray-100 text-xs text-gray-500';
        hint.innerHTML = '<div class="flex items-center gap-3"><span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">Ctrl</kbd>+<kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">K</kbd> 搜索</span><span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">Ctrl</kbd>+<kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">S</kbd> 保存</span></div>';
        hint.style.display = 'none'; hint.id = 'shortcutHint';
        var hintTimeout;
        document.addEventListener('keydown', function(e) { if (e.ctrlKey || e.metaKey) { hint.style.display = 'flex'; clearTimeout(hintTimeout); hintTimeout = setTimeout(function() { hint.style.display = 'none'; }, 3000); } });
        document.body.appendChild(hint);
    }
    initShortcutHints();
    </script>

    <script>
        // 管理员下拉菜单
        const adminDropdown = document.getElementById('adminDropdown');
        const adminMenu = document.getElementById('adminMenu');
        if (adminDropdown && adminMenu) {
            adminDropdown.addEventListener('click', function(e) {
                e.stopPropagation();
                adminMenu.classList.toggle('hidden');
            });

            document.addEventListener('click', function() {
                adminMenu.classList.add('hidden');
            });

            adminMenu.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }
    </script>
