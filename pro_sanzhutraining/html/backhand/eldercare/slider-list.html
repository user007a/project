    <script>
    
    // 分页逻辑
    const PAGE_SIZE = 10;
    let currentPage = 1;
    const rows = document.querySelectorAll('tbody tr[data-row]');
    const totalRows = rows.length;
    const totalPages = Math.ceil(totalRows / PAGE_SIZE);

    function renderPagination(page) {
        currentPage = page;
        rows.forEach((row) => {
            const rowNum = parseInt(row.getAttribute('data-row'));
            if (rowNum > (page - 1) * PAGE_SIZE && rowNum <= page * PAGE_SIZE) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
        const infoEl = document.getElementById('pageInfo');
        if (infoEl) infoEl.textContent = '第 ' + page + ' / ' + totalPages + ' 页，共 ' + totalRows + ' 条';
        const paginationBtns = document.getElementById('paginationBtns');
        if (paginationBtns) {
            let html = '';
            html += '<button onclick="renderPagination(' + (page - 1) + ')" class="px-3 py-1.5 text-sm border rounded-lg ' + (page === 1 ? 'border-gray-200 text-gray-400 cursor-not-allowed' : 'border-gray-200 text-gray-600 hover:bg-gray-50') + '" ' + (page === 1 ? 'disabled' : '') + '>上一页</button>';
            for (let i = 1; i <= totalPages; i++) {
                html += '<button onclick="renderPagination(' + i + ')" class="px-3 py-1.5 text-sm border rounded-lg ' + (i === page ? 'bg-[#1890FF] text-white border-[#1890FF]' : 'border-gray-200 text-gray-600 hover:bg-gray-50') + '">' + i + '</button>';
            }
            html += '<button onclick="renderPagination(' + (page + 1) + ')" class="px-3 py-1.5 text-sm border rounded-lg ' + (page === totalPages ? 'border-gray-200 text-gray-400 cursor-not-allowed' : 'border-gray-200 text-gray-600 hover:bg-gray-50') + '" ' + (page === totalPages ? 'disabled' : '') + '>下一页</button>';
            paginationBtns.innerHTML = html;
        }
    }
    renderPagination(1);
    </script>

    <!-- Toast 通知容器 -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

    <!-- 悬浮操作按钮 (FAB) -->

            <span id="fabIcon" class="iconify text-2xl transition-transform duration-300" data-icon="ri:add-line"></span>
        </button>

    <script>
    function showToast(type, title, message, duration = 4000) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        var toastId = 'toast_' + Date.now();
        var icons = { success: 'ri:checkbox-circle-line', error: 'ri:error-warning-line', warning: 'ri:alert-line', info: 'ri:information-line' };
        var colors = { success: 'bg-green-50 border-green-200 text-green-800', error: 'bg-red-50 border-red-200 text-red-800', warning: 'bg-yellow-50 border-yellow-200 text-yellow-800', info: 'bg-blue-50 border-blue-200 text-blue-800' };
        var iconColors = { success: 'text-green-500', error: 'text-red-500', warning: 'text-yellow-500', info: 'text-blue-500' };
        toast.id = toastId;
        toast.className = 'pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-lg ' + colors[type] + ' animate-[slideIn_0.3s_ease-out]';
        toast.innerHTML = '<span class="iconify text-xl ' + iconColors[type] + '" data-icon="' + icons[type] + '"></span><div class="flex-1"><div class="font-medium text-sm">' + title + '</div><div class="text-xs opacity-80 mt-0.5">' + message + '</div></div><button onclick="dismissToast(\'' + toastId + '\')" class="opacity-60 hover:opacity-100 transition-opacity"><span class="iconify text-lg" data-icon="ri:close-line"></span></button>';
        container.appendChild(toast);
        setTimeout(function() { var el = document.getElementById(toastId); if(el) { el.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(function() { el.remove(); }, 300); } }, duration);
    }
    function dismissToast(id) { var el = document.getElementById(id); if(el) { el.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(function() { el.remove(); }, 300); } }

    var fabOpen = false;
    function toggleFab() { fabOpen = !fabOpen; var menu = document.getElementById('fabMenu'); var icon = document.getElementById('fabIcon'); if (fabOpen) { menu.classList.remove('hidden'); menu.classList.add('flex'); icon.style.transform = 'rotate(45deg)'; } else { menu.classList.add('hidden'); menu.classList.remove('flex'); icon.style.transform = 'rotate(0deg)'; } }
    function fabAction(type) { toggleFab(); showToast('info', '功能提示', '该功能即将上线'); }

    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') { if (e.key === 'Escape') e.target.blur(); return; }
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); showToast('info', '快捷搜索', '按 Ctrl+K 打开全局搜索'); }
        if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); fabAction('slider'); }
    });

    function initShortcutHints() {
        var hint = document.createElement('div');
        hint.className = 'fixed bottom-4 left-4 z-[9997] bg-white px-3 py-2 rounded-lg shadow-lg border border-gray-100 text-xs text-gray-500';
        hint.innerHTML = '<div class="flex items-center gap-3"><span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">Ctrl</kbd>+<kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">K</kbd> 搜索</span><span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">Ctrl</kbd>+<kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">N</kbd> 新增</span></div>';
        hint.style.display = 'none'; hint.id = 'shortcutHint';
        var hintTimeout;
        document.addEventListener('keydown', function(e) { if (e.ctrlKey || e.metaKey) { hint.style.display = 'flex'; clearTimeout(hintTimeout); hintTimeout = setTimeout(function() { hint.style.display = 'none'; }, 3000); } });
        document.body.appendChild(hint);
    }
    initShortcutHints();
    window.addEventListener('load', function() { showToast('info', '欢迎使用Banner管理', '按 Ctrl+N 快速新增Banner'); });
    </script>
