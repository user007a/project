<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图标测试</title>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .icon-group { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .icon-item { display: inline-block; margin: 10px; text-align: center; }
        .icon-item span { font-size: 32px; }
    </style>
</head>
<body>
    <h1>Iconify 图标测试</h1>
    
    <div class="icon-group">
        <h2>测试的图标</h2>
        <div class="icon-item">
            <span class="iconify" data-icon="ri:clipboard-list-line"></span>
            <p>clipboard-list-line</p>
        </div>
        <div class="icon-item">
            <span class="iconify" data-icon="ri:help-circle-line"></span>
            <p>help-circle-line</p>
        </div>
        <div class="icon-item">
            <span class="iconify" data-icon="ri:file-text-line"></span>
            <p>file-text-line</p>
        </div>
        <div class="icon-item">
            <span class="iconify" data-icon="ri:home-4-line"></span>
            <p>home-4-line</p>
        </div>
    </div>
    
    <div class="icon-group">
        <h2>更多测试图标</h2>
        <div class="icon-item">
            <span class="iconify" data-icon="ri:team-line"></span>
            <p>team-line</p>
        </div>
        <div class="icon-item">
            <span class="iconify" data-icon="ri:book-open-line"></span>
            <p>book-open-line</p>
        </div>
    </div>
    
    <script>
        console.log('Iconify version:', window.Iconify ? 'loaded' : 'not loaded');
        if (window.Iconify) {
            console.log('Iconify API available');
        }
    </script>
</body>
</html>
