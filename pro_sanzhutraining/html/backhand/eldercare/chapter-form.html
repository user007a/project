<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>章节管理 - 叁竹培训系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
    </style>
</head>
<body class="bg-[#F0F2F5] pt-3 pb-6">
    <!-- 内容区域 -->
    <div class="max-w-none">
        <!-- 面包屑 -->
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2 text-sm text-gray-500">
                <a href="course-list.html" class="hover:text-[#1890FF]">课程管理</a>
                <span class="iconify" data-icon="ri:arrow-right-s-line"></span>
                <span class="text-gray-900 font-medium">章节管理</span>
                <span class="iconify" data-icon="ri:arrow-right-s-line"></span>
                <span class="text-gray-900 font-medium">养老护理员（初级）培训班</span>
            </div>
            <a href="course-list.html" class="text-sm text-gray-500 hover:text-[#1890FF] flex items-center gap-1 transition-colors">
                <span class="iconify" data-icon="ri:arrow-left-line"></span>返回课程列表
            </a>
        </div>

        <!-- 章节管理 -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50 flex items-center justify-between">
                <h3 class="text-base font-bold text-gray-900">章节管理</h3>
                <button onclick="addChapter()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-[#1890FF] hover:bg-blue-50 rounded-lg transition-colors">
                    <span class="iconify" data-icon="ri:add-line"></span>添加章节
                </button>
            </div>
            <div class="p-6 space-y-4" id="chapterList">
                <!-- 章节1 - 已上传视频 -->
                <div class="border border-gray-200 rounded-xl overflow-hidden">
                    <div class="px-4 py-3 bg-gray-50/80 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="iconify text-gray-400 drag-handle" data-icon="ri:drag-move-2-line"></span>
                            <input type="text" value="第一章：养老护理基础概论" class="text-sm font-medium text-gray-900 bg-transparent border-none outline-none focus:bg-white focus:border focus:border-gray-200 rounded px-2 py-0.5">
                        </div>
                        <button class="p-1 text-gray-400 hover:text-red-500 transition-colors">
                            <span class="iconify text-sm" data-icon="ri:delete-bin-line"></span>
                        </button>
                    </div>
                    <div class="px-4 py-3 border-t border-gray-100 bg-white">
                        <div class="flex items-center gap-3">
                            <span class="iconify text-green-500 flex-shrink-0" data-icon="ri:checkbox-circle-line"></span>
                            <span class="text-sm text-gray-600 flex-1 min-w-0 truncate">视频文件名.mp4</span>
                            <span class="text-sm text-gray-400 flex-shrink-0">25:30</span>
                            <span class="text-sm text-gray-400 flex-shrink-0">125M</span>
                            <button onclick="triggerUpload()" class="inline-flex items-center gap-1 px-3 py-1.5 text-sm text-[#1890FF] hover:bg-blue-50 rounded-lg transition-colors flex-shrink-0">
                                <span class="iconify text-xs" data-icon="ri:upload-cloud-line"></span>替换视频
                            </button>
                            <button class="inline-flex items-center gap-1 px-3 py-1.5 text-sm text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors flex-shrink-0">
                                <span class="iconify text-xs" data-icon="ri:delete-bin-line"></span>删除视频
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 章节2 - 未上传视频 -->
                <div class="border border-gray-200 rounded-xl overflow-hidden">
                    <div class="px-4 py-3 bg-gray-50/80 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="iconify text-gray-400 drag-handle" data-icon="ri:drag-move-2-line"></span>
                            <input type="text" value="第二章：日常护理操作" class="text-sm font-medium text-gray-900 bg-transparent border-none outline-none focus:bg-white focus:border focus:border-gray-200 rounded px-2 py-0.5">
                        </div>
                        <button class="p-1 text-gray-400 hover:text-red-500 transition-colors">
                            <span class="iconify text-sm" data-icon="ri:delete-bin-line"></span>
                        </button>
                    </div>
                    <div class="px-4 py-3 border-t border-gray-100 bg-white">
                        <div class="flex items-center gap-3">
                            <span class="iconify text-gray-300 flex-shrink-0" data-icon="ri:video-line"></span>
                            <span class="text-sm text-gray-400 flex-1">暂无视频</span>
                            <button onclick="triggerUpload()" class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium text-white bg-[#1890FF] hover:bg-[#1890FF] rounded-lg transition-colors flex-shrink-0">
                                <span class="iconify text-xs" data-icon="ri:upload-cloud-line"></span>上传视频
                            </button>
                            <button class="inline-flex items-center gap-1 px-3 py-1.5 text-sm text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors flex-shrink-0">
                                <span class="iconify text-xs" data-icon="ri:delete-bin-line"></span>删除视频
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 章节3 - 未上传视频 -->
                <div class="border border-gray-200 rounded-xl overflow-hidden">
                    <div class="px-4 py-3 bg-gray-50/80 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="iconify text-gray-400 drag-handle" data-icon="ri:drag-move-2-line"></span>
                            <input type="text" value="第三章：安全防护与应急处理" class="text-sm font-medium text-gray-900 bg-transparent border-none outline-none focus:bg-white focus:border focus:border-gray-200 rounded px-2 py-0.5">
                        </div>
                        <button class="p-1 text-gray-400 hover:text-red-500 transition-colors">
                            <span class="iconify text-sm" data-icon="ri:delete-bin-line"></span>
                        </button>
                    </div>
                    <div class="px-4 py-3 border-t border-gray-100 bg-white">
                        <div class="flex items-center gap-3">
                            <span class="iconify text-gray-300 flex-shrink-0" data-icon="ri:video-line"></span>
                            <span class="text-sm text-gray-400 flex-1">暂无视频</span>
                            <button onclick="triggerUpload()" class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium text-white bg-[#1890FF] hover:bg-[#1890FF] rounded-lg transition-colors flex-shrink-0">
                                <span class="iconify text-xs" data-icon="ri:upload-cloud-line"></span>上传视频
                            </button>
                            <button class="inline-flex items-center gap-1 px-3 py-1.5 text-sm text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors flex-shrink-0">
                                <span class="iconify text-xs" data-icon="ri:delete-bin-line"></span>删除视频
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="flex items-center justify-end gap-3 mt-6 pb-6">
            <button onclick="goBack()" class="px-6 py-2.5 border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors">取消</button>
            <button onclick="showSuccess()" class="px-8 py-2.5 bg-[#1890FF] text-white rounded-lg text-sm font-medium hover:bg-[#1890FF] transition-colors">保存并发布</button>
        </div>
    </div>

    <!-- 保存成功弹窗 -->
    <div id="successModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50" onclick="if(event.target===this)this.classList.add('hidden')">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="iconify text-3xl text-green-500" data-icon="ri:check-circle-fill"></span>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">保存成功</h3>
            <p class="text-gray-500 text-sm mb-6">章节信息已成功保存</p>
            <button onclick="document.getElementById('successModal').classList.add('hidden')" class="px-6 py-2 bg-[#1890FF] text-white rounded-lg text-sm font-medium hover:bg-[#1890FF] transition-colors">确定</button>
        </div>
    </div>

    <script>
        function addChapter() {
            const chapterList = document.getElementById('chapterList');
            const newChapter = document.createElement('div');
            newChapter.className = 'border border-gray-200 rounded-xl overflow-hidden';
            newChapter.innerHTML = `
                <div class="px-4 py-3 bg-gray-50/80 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="iconify text-gray-400 drag-handle" data-icon="ri:drag-move-2-line"></span>
                        <input type="text" placeholder="请输入章节名称" class="text-sm font-medium text-gray-900 bg-transparent border-none outline-none focus:bg-white focus:border focus:border-gray-200 rounded px-2 py-0.5">
                    </div>
                    <button class="p-1 text-gray-400 hover:text-red-500 transition-colors">
                        <span class="iconify text-sm" data-icon="ri:delete-bin-line"></span>
                    </button>
                </div>
                <div class="px-4 py-3 border-t border-gray-100 bg-white">
                    <div class="flex items-center gap-3">
                        <span class="iconify text-gray-300 flex-shrink-0" data-icon="ri:video-line"></span>
                        <span class="text-sm text-gray-400 flex-1">暂无视频</span>
                        <button onclick="triggerUpload()" class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium text-white bg-[#1890FF] hover:bg-[#1890FF] rounded-lg transition-colors flex-shrink-0">
                            <span class="iconify text-xs" data-icon="ri:upload-cloud-line"></span>上传视频
                        </button>
                        <button class="inline-flex items-center gap-1 px-3 py-1.5 text-sm text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors flex-shrink-0">
                            <span class="iconify text-xs" data-icon="ri:delete-bin-line"></span>删除视频
                        </button>
                    </div>
                </div>
            `;
            chapterList.appendChild(newChapter);
        }

        function triggerUpload() {
            alert('视频上传功能开发中');
        }

        function goBack() {
            window.location.href = 'course-list.html';
        }

        function showSuccess() {
            document.getElementById('successModal').classList.remove('hidden');
        }
    </script>
</body>
</html>
