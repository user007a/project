    <script>
        function selectRole(role) {
            // Update card borders
            document.getElementById('card-admin').className = role === 'admin'
                ? 'bg-white rounded-xl border-2 border-blue-500 shadow-sm p-6 cursor-pointer transition-all hover:shadow-md'
                : 'bg-white rounded-xl border shadow-sm p-6 cursor-pointer transition-all hover:shadow-md';
            document.getElementById('card-operator').className = role === 'operator'
                ? 'bg-white rounded-xl border-2 border-blue-500 shadow-sm p-6 cursor-pointer transition-all hover:shadow-md'
                : 'bg-white rounded-xl border shadow-sm p-6 cursor-pointer transition-all hover:shadow-md';
            // Update title
            document.getElementById('permTitle').textContent = '权限配置 - ' + (role === 'admin' ? '超级管理员' : '运营数据员');
            // Toggle permission content
            document.getElementById('perm-admin').classList.toggle('hidden', role !== 'admin');
            document.getElementById('perm-operator').classList.toggle('hidden', role !== 'operator');
        }
        
        document.querySelectorAll('.menu-toggle').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const menuGroup = this.closest('.menu-group');
                const menuItems = menuGroup.querySelector('.menu-items');
                const arrow = this.querySelector('.menu-arrow');
                
                const isExpanded = menuItems.style.display !== 'none';
                
                if (isExpanded) {
                    menuItems.style.display = 'none';
                    arrow.textContent = '›';
                } else {
                    menuItems.style.display = 'block';
                    arrow.textContent = '‹';
                }
            });
        });
    </script>
