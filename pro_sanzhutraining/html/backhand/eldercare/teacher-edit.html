        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="dashboard.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">
                <span class="iconify mr-3 text-lg" data-icon="ri:home-4-line"></span>
                <span class="text-sm">工作台</span>
            </a>
            <div class="pt-4 pb-2 px-4 text-xs font-semibold text-gray-500 uppercase tracking-widest">学员管理</div>
            <a href="student-list.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">
                <span class="iconify mr-3 text-lg" data-icon="ri:team-line"></span>

            <a href="certificate-list.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">

            <a href="study-record.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">

                <span class="text-sm">学习记录</span>
            </a>
            <div class="pt-4 pb-2 px-4 text-xs font-semibold text-gray-500 uppercase tracking-widest">课程中心</div>
            <a href="course-list.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">
                <span class="iconify mr-3 text-lg" data-icon="ri:book-open-line"></span>
                <span class="text-sm">课程管理</span>
            </a>
            <a href="category-list.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">
                <span class="iconify mr-3 text-lg" data-icon="ri:folder-line"></span>
                <span class="text-sm">分类管理</span>
            </a>
            <a href="teacher-list.html" class="flex items-center px-4 py-3 bg-[#1890FF] text-white rounded-md">
                <span class="iconify mr-3 text-lg" data-icon="ri:user-star-line"></span>

            </a>
            <div class="pt-4 pb-2 px-4 text-xs font-semibold text-gray-500 uppercase tracking-widest">订单中心</div>
            <a href="order-list.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">
                <span class="iconify mr-3 text-lg" data-icon="ri:shopping-cart-line"></span>
                <span class="text-sm">订单管理</span>
            </a>
            <a href="refund-list.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">
                <span class="iconify mr-3 text-lg" data-icon="ri:refund-line"></span>
                <span class="text-sm">退款管理</span>
            </a>
            <div class="pt-4 pb-2 px-4 text-xs font-semibold text-gray-500 uppercase tracking-widest">题库中心</div>
            <a href="question-bank.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">
                <span class="iconify mr-3 text-lg" data-icon="ri:questionnaire-line"></span>
                <span class="text-sm">题库管理</span>
            </a>
            <div class="pt-4 pb-2 px-4 text-xs font-semibold text-gray-500 uppercase tracking-widest">内容管理</div>
            <a href="article-list.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">
                <span class="iconify mr-3 text-lg" data-icon="ri:article-line"></span>
                <span class="text-sm">资讯管理</span>
            </a>
            <a href="article-category.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">
                <span class="iconify mr-3 text-lg" data-icon="ri:folder-line"></span>
                <span class="text-sm">资讯分类</span>

            <div class="pt-4 pb-2 px-4 text-xs font-semibold text-gray-500 uppercase tracking-widest">系统设置</div>

            <a href="message-center.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">

            <a href="system-settings.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">

                <span class="text-sm">短信配置</span>

            <a href="role-permission.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-white/10 rounded-md transition-all">

    <div class="flex-1 flex flex-col min-w-0">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-shrink-0">
            <div class="flex items-center gap-4">
                <button onclick="goBack()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <span class="iconify text-gray-600" data-icon="ri:arrow-left-line"></span>
                </button>
                <h1 class="text-lg font-bold text-gray-900">编辑讲师</h1>
            </div>
            <div class="flex items-center gap-4">
                <button class="relative p-2 text-gray-400 hover:text-gray-600 transition-colors">
                    <span class="iconify text-xl" data-icon="ri:notification-3-line"></span>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <div class="h-6 w-px bg-gray-200"></div>
                <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 px-3 py-1.5 rounded-lg transition-colors">
                    <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                        <span class="text-blue-600 text-sm font-bold">管</span>
                    </div>
                    <span class="text-sm text-gray-700">管理员</span>
                    <span class="iconify text-gray-400" data-icon="ri:arrow-down-s-line"></span>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6">
            <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
                <form id="teacherForm" class="p-6">
                    <div class="flex flex-col lg:flex-row gap-6 mb-6">
                        <div class="lg:w-48 flex flex-col items-center">
                            <div class="relative">
                                <div class="w-32 h-32 bg-gray-100 rounded-full flex items-center justify-center">
                                    <span class="iconify text-gray-400 text-4xl" data-icon="ri:user-line"></span>
                                </div>
                                <button type="button" class="absolute -bottom-1 -right-1 w-8 h-8 bg-[#1890FF] text-white rounded-full flex items-center justify-center hover:bg-blue-600 transition-colors">
                                    <span class="iconify" data-icon="ri:camera-line"></span>
                                </button>
                            </div>
                            <p class="text-xs text-gray-400 mt-3">支持 JPG、PNG 格式，大小不超过 2MB</p>
                        </div>
                        <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">讲师姓名 *</label>
                                <input type="text" id="teacherName" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all" value="王德明" placeholder="请输入讲师姓名">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">职称</label>
                                <input type="text" id="title" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all" value="高级护理师" placeholder="请输入职称">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">专业方向</label>
                                <select id="major" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm text-gray-600 transition-all">
                                    <option value="">请选择专业方向</option>
                                    <option value="养老护理" selected>养老护理</option>
                                    <option value="能力评估">能力评估</option>
                                    <option value="健康照护">健康照护</option>
                                    <option value="营养配餐">营养配餐</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">联系电话 *</label>
                                <input type="tel" id="phone" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all" value="13800138001" placeholder="请输入联系电话">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">电子邮箱</label>
                                <input type="email" id="email" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all" value="wangdeming@example.com" placeholder="请输入电子邮箱">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">状态</label>
                                <div class="flex items-center gap-4">
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" name="status" value="1" checked class="w-4 h-4 text-[#1890FF] focus:ring-[#1890FF]">
                                        <span class="text-sm text-gray-700">在职</span>
                                    </label>
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" name="status" value="0" class="w-4 h-4 text-[#1890FF] focus:ring-[#1890FF]">
                                        <span class="text-sm text-gray-700">离职</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="border-t pt-6">
                        <h3 class="text-sm font-semibold text-gray-900 mb-4">个人简介</h3>
                        <textarea id="bio" rows="4" class="w-full border border-gray-200 px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#1890FF] text-sm transition-all resize-none" placeholder="请输入讲师个人简介">从事养老护理教学15年，省养老护理技能大赛评委，具有丰富的教学经验和实践经验。</textarea>
                    </div>

                    <div class="border-t pt-6 mt-6">
                        <h3 class="text-sm font-semibold text-gray-900 mb-4">教学经历</h3>
                        <div class="bg-gray-50 rounded-lg p-4">
                            <div class="flex items-start gap-3">
                                <span class="iconify text-gray-400 mt-0.5" data-icon="ri:briefcase-line"></span>
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-sm font-medium text-gray-900">养老护理专家</span>
                                        <span class="text-xs text-gray-400">2010年-至今</span>
                                    </div>
                                    <p class="text-sm text-gray-500">从事养老护理教学与研究工作，培养了大量优秀的养老护理人才。</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="border-t pt-6 mt-6">
                        <h3 class="text-sm font-semibold text-gray-900 mb-4">授课课程</h3>
                        <div class="space-y-2">
                            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <div class="flex items-center gap-3">
                                    <span class="iconify text-blue-500" data-icon="ri:book-open-line"></span>
                                    <span class="text-sm text-gray-700">养老护理基础</span>
                                </div>
                                <span class="text-xs text-gray-400">初级课程</span>
                            </div>
                            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <div class="flex items-center gap-3">
                                    <span class="iconify text-blue-500" data-icon="ri:book-open-line"></span>
                                    <span class="text-sm text-gray-700">老年常见疾病护理</span>
                                </div>
                                <span class="text-xs text-gray-400">中级课程</span>
                            </div>
                            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <div class="flex items-center gap-3">
                                    <span class="iconify text-blue-500" data-icon="ri:book-open-line"></span>
                                    <span class="text-sm text-gray-700">康复护理技术</span>
                                </div>
                                <span class="text-xs text-gray-400">高级课程</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end gap-3 mt-8 pt-6 border-t">
                        <button type="button" onclick="goBack()" class="px-5 py-2 border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors">取消</button>
                        <button type="submit" class="px-5 py-2 bg-[#1890FF] text-white rounded-lg text-sm font-medium hover:bg-blue-600 transition-colors">保存</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        function goBack() {
            window.location.href = 'teacher-list.html';
        }

        document.getElementById('teacherForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('保存成功！');
            goBack();
        });
    </script>
</body>
</html>
