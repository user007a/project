    <script>
        // 菜单展开/收起
        document.querySelectorAll('.menu-toggle').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const menuItems = this.nextElementSibling;
                const arrow = this.querySelector('.menu-arrow');
                if (menuItems.style.display === 'none' || menuItems.style.display === '') {
                    menuItems.style.display = 'block';
                    arrow.classList.add('expanded');
                } else {
                    menuItems.style.display = 'none';
                    arrow.classList.remove('expanded');
                }
            });
        });

        // Tab 管理
        const tabs = [];
        const tabBar = document.getElementById('tabBar');
        const mainFrame = document.getElementById('mainFrame');

        // 页面图标映射
        const iconMap = {
            'dashboard.html': 'ri:home-4-line',
            'student-list.html': 'ri:team-line',
            'study-record.html': 'ri:time-line',
            'course-list.html': 'ri:book-open-line',
            'category-list.html': 'ri:folder-line',
            'share-list.html': 'ri:share-line',
            'teacher-list.html': 'ri:user-line',
            'question-bank.html': 'ri:questionnaire-line',
            'paper-management.html': 'ri:file-text-line',
            'mock-exam.html': 'ri:timer-line',
            'practice-exam.html': 'ri:pen-tool-line',
            'order-list.html': 'ri:shopping-cart-line',
            'refund-list.html': 'ri:refund-line',
            'invoice-list.html': 'ri:receipt-line',
            'article-list.html': 'ri:file-text-line',
            'article-category.html': 'ri:folder-line',
            'user-management.html': 'ri:user-settings-line',
            'institution-management.html': 'ri:building-line',
            'department-management.html': 'ri:layout-grid-line',
            'message-center.html': 'ri:notification-3-line',
            'system-settings.html': 'ri:settings-3-line',
            'external-config.html': 'ri:cloud-line'
        };

        function openPage(url, title) {
            const existingTab = tabs.find(tab => tab.url === url);
            if (existingTab) {
                selectTab(existingTab);
                return;
            }
            const icon = iconMap[url] || 'ri:file-line';
            const newTab = { id: Date.now(), url: url, title: title, icon: icon, element: null };
            const tabElement = document.createElement('div');
            tabElement.className = 'flex items-center gap-1.5 px-3 py-2 bg-gray-100 text-gray-600 rounded-t-md cursor-pointer hover:bg-gray-200 transition-colors tab-animate';
            tabElement.innerHTML = `<span class="iconify text-base" data-icon="${icon}"></span><span class="text-sm whitespace-nowrap">${title}</span><button class="tab-close ml-1 p-0.5 hover:bg-black/10 rounded transition-colors"><span class="iconify text-xs" data-icon="ri:close-line"></span></button>`;
            tabElement.dataset.tabId = newTab.id;
            tabElement.addEventListener('click', (e) => {
                if (!e.target.closest('.tab-close')) selectTab(newTab);
            });
            tabElement.querySelector('.tab-close').addEventListener('click', (e) => {
                e.stopPropagation();
                closeTab(newTab);
            });
            tabBar.appendChild(tabElement);
            newTab.element = tabElement;
            tabs.push(newTab);
            selectTab(newTab);
            mainFrame.src = url;
        }

        function selectTab(tab) {
            tabs.forEach(t => {
                t.element.classList.remove('bg-white', 'text-gray-900', 'border-b-2', 'border-blue-500');
                t.element.classList.add('bg-gray-100', 'text-gray-600');
            });
            tab.element.classList.remove('bg-gray-100', 'text-gray-600');
            tab.element.classList.add('bg-white', 'text-gray-900', 'border-b-2', 'border-blue-500');
        }

        function closeTab(tab) {
            const index = tabs.indexOf(tab);
            if (index === -1) return;
            tab.element.remove();
            tabs.splice(index, 1);
            if (tabs.length > 0) {
                const newIndex = index > 0 ? index - 1 : 0;
                selectTab(tabs[newIndex]);
                mainFrame.src = tabs[newIndex].url;
            }
        }

        // 管理员下拉菜单
        const adminDropdown = document.getElementById('adminDropdown');
        const adminMenu = document.getElementById('adminMenu');
        adminDropdown.addEventListener('click', () => { adminMenu.classList.toggle('hidden'); });
        document.addEventListener('click', (e) => {
            if (!adminDropdown.contains(e.target)) adminMenu.classList.add('hidden');
        });

        // 侧边栏折叠
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.querySelector('aside');
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('w-16');
            sidebar.classList.toggle('w-64');
            document.querySelectorAll('.menu-items').forEach(item => {
                if (sidebar.classList.contains('w-16')) item.style.display = 'none';
            });
        });

        // 默认打开工作台
        openPage('dashboard.html', '工作台');
    </script>
