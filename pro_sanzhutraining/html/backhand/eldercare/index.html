        .tab-animate { animation: tabSlideIn 0.2s ease-out; }

        /* Tab 栏滚动条隐藏 */
        .tab-scroll::-webkit-scrollbar { display: none; }
        .tab-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* 菜单箭头旋转 */

        /* iframe 容器 */

        .iframe-container.active { display: block; }

    <script>
    // ==================== Tab 管理 ====================
    (function() {
        var tabs = [];
        var activeTabId = null;
        var tabBar = document.getElementById('tabBar');
        var contentArea = document.getElementById('contentArea');
        var tabCounter = 0;

        // 菜单配置映射
        var menuMap = {};
        document.querySelectorAll('.menu-link').forEach(function(link) {
            var page = link.getAttribute('data-page');
            menuMap[page] = {
                title: link.getAttribute('data-title'),
                icon: link.getAttribute('data-icon')
            };
        });

        // 创建 Tab
        function createTab(page, title, icon) {
            var tabId = 'tab_' + (++tabCounter);
            var tabData = {
                id: tabId,
                page: page,
                title: title,
                icon: icon
            };
            tabs.push(tabData);

            // 创建 Tab DOM
            var tabEl = document.createElement('div');
            tabEl.id = tabId;
            tabEl.className = 'tab-item tab-animate flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-md cursor-pointer transition-all select-none flex-shrink-0 border';
            tabEl.innerHTML =
                '<span class="iconify text-base" data-icon="' + icon + '"></span>' +
                '<span class="whitespace-nowrap">' + title + '</span>' +
                '<button class="tab-close ml-1 p-0.5 hover:bg-black/10 rounded transition-colors" onclick="event.stopPropagation()">' +
                '  <span class="iconify text-xs" data-icon="ri:close-line"></span>' +
                '</button>';

            tabEl.querySelector('.tab-close').addEventListener('click', function(e) {
                e.stopPropagation();
                closeTab(tabId);
            });

            tabEl.addEventListener('click', function() {
                activateTab(tabId);
            });

            tabBar.appendChild(tabEl);

            // 创建 iframe
            var iframeContainer = document.createElement('div');
            iframeContainer.id = 'iframe_' + tabId;
            iframeContainer.className = 'iframe-container absolute inset-0';
            iframeContainer.innerHTML = '<iframe src="' + page + '" frameborder="0"></iframe>';
            contentArea.appendChild(iframeContainer);

            activateTab(tabId);
            return tabId;
        }

        // 激活 Tab
        function activateTab(tabId) {
            activeTabId = tabId;

            // 更新 Tab 样式
            document.querySelectorAll('.tab-item').forEach(function(el) {
                if (el.id === tabId) {
                    el.className = 'tab-item tab-animate flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-md cursor-pointer transition-all select-none flex-shrink-0 border bg-[#1890FF] text-white border-[#1890FF]';
                } else {
                    el.className = 'tab-item flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-md cursor-pointer transition-all select-none flex-shrink-0 border border-gray-200 text-gray-600 hover:text-gray-900 hover:bg-gray-50 bg-white';
                }
            });

            // 显示对应的 iframe
            document.querySelectorAll('.iframe-container').forEach(function(el) {
                el.classList.remove('active');
            });
            var iframeContainer = document.getElementById('iframe_' + tabId);
            if (iframeContainer) {
                iframeContainer.classList.add('active');
            }

            // 滚动到可视区域
            var activeTab = document.getElementById(tabId);
            if (activeTab) {
                activeTab.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
            }

            // 更新菜单高亮
            updateMenuHighlight();
        }

        // 关闭 Tab
        function closeTab(tabId) {
            var index = tabs.findIndex(function(t) { return t.id === tabId; });
            if (index === -1) return;

            // 如果关闭的是当前激活的 tab，切换到相邻 tab
            if (activeTabId === tabId) {
                var nextTab = tabs[index + 1] || tabs[index - 1];
                if (nextTab) {
                    activateTab(nextTab.id);
                } else {
                    activeTabId = null;
                }
            }

            // 移除 DOM
            var tabEl = document.getElementById(tabId);
            if (tabEl) tabEl.remove();
            var iframeContainer = document.getElementById('iframe_' + tabId);
            if (iframeContainer) iframeContainer.remove();

            // 移除数据
            tabs.splice(index, 1);
        }

        // 打开或切换到 Tab
        function openTab(page, title, icon) {
            // 检查是否已存在
            var existing = tabs.find(function(t) { return t.page === page; });
            if (existing) {
                activateTab(existing.id);
                return;
            }

            // 从 menuMap 中获取标题和图标
            var info = menuMap[page];
            if (info) {
                title = title || info.title;
                icon = icon || info.icon;
            }

            createTab(page, title || page, icon || 'ri:file-line');
        }

        // 更新菜单高亮
        function updateMenuHighlight() {
            var activePage = activeTabId ? tabs.find(function(t) { return t.id === activeTabId; }) : null;
            var activePageUrl = activePage ? activePage.page : null;

            document.querySelectorAll('.menu-link').forEach(function(link) {
                var page = link.getAttribute('data-page');
                if (page === activePageUrl) {
                    link.classList.remove('text-gray-300', 'hover:bg-white/10');
                    link.classList.add('bg-[#1890FF]', 'text-white');
                } else {
                    link.classList.remove('bg-[#1890FF]', 'text-white');
                    link.classList.add('text-gray-300', 'hover:bg-white/10');
                }
            });
        }

        // 菜单点击事件
        document.querySelectorAll('.menu-link').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                var page = this.getAttribute('data-page');
                var title = this.getAttribute('data-title');
                var icon = this.getAttribute('data-icon');
                openTab(page, title, icon);
            });
        });

        // 菜单折叠/展开
        document.querySelectorAll('.menu-toggle').forEach(function(toggle) {
            toggle.addEventListener('click', function() {
                var menuGroup = this.closest('.menu-group');
                var menuItems = menuGroup.querySelector('.menu-items');
                var arrow = this.querySelector('.menu-arrow');

                var isExpanded = menuItems.style.display !== 'none';

                if (isExpanded) {
                    menuItems.style.display = 'none';
                    arrow.style.transform = 'rotate(0deg)';
                } else {
                    menuItems.style.display = 'block';
                    arrow.style.transform = 'rotate(90deg)';
                }
            });
        });

        // 默认展开所有菜单
        document.querySelectorAll('.menu-items').forEach(function(items) {
            items.style.display = 'block';
        });
        document.querySelectorAll('.menu-arrow').forEach(function(arrow) {
            arrow.style.transform = 'rotate(90deg)';
        });

        // 侧边栏折叠
        var sidebarCollapsed = false;
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            var aside = document.querySelector('aside');
            sidebarCollapsed = !sidebarCollapsed;
            if (sidebarCollapsed) {
                aside.style.width = '0';
                aside.style.overflow = 'hidden';
                aside.style.padding = '0';
                this.querySelector('.iconify').setAttribute('data-icon', 'ri:menu-unfold-line');
            } else {
                aside.style.width = '16rem';
                aside.style.overflow = '';
                aside.style.padding = '';
                this.querySelector('.iconify').setAttribute('data-icon', 'ri:menu-fold-line');
            }
        });

        // 监听 iframe 消息（返回列表等导航）
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'navigate') {
                var url = e.data.url;
                if (url && menuMap[url]) {
                    openTab(url, menuMap[url].title, menuMap[url].icon);
                }
            }
        });

        // 暴露全局函数供外部调用
        window.openTab = openTab;
        window.closeTab = closeTab;
        window.activateTab = activateTab;

        // 初始化：打开工作台
