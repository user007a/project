    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.95); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-\[slideIn_0\.3s_ease-out\] { animation: slideIn 0.3s ease-out; }
        .animate-\[fadeOut_0\.3s_ease-out\] { animation: fadeOut 0.3s ease-out; }
        .animate-\[fadeIn_0\.15s_ease-out\] { animation: fadeIn 0.15s ease-out; }
    </style>
</head>
<body class="bg-[#F0F2F5]">

    
        <!-- 顶部栏 -->

        <main class="flex-1 overflow-y-auto p-6">

                                    <td class="px-6 py-4 text-sm text-gray-700">王管理</td>
                                    <td class="px-6 py-4 text-sm text-gray-500">2024-01-01</td>
                                    <td class="px-6 py-4 text-right"><div class="flex items-center justify-end gap-2"><button onclick="showForm('tech')" class="text-blue-600 hover:text-blue-800 font-semibold text-sm">编辑</button><button class="text-red-600 hover:text-red-800 text-sm">删除</button></div></td>
                                </tr>
                                <tr class="hover:bg-blue-50/30 transition-all">

                                    <td class="px-6 py-4 text-sm text-gray-700">李运营</td>

                                    <td class="px-6 py-4 text-sm text-gray-500">3</td>
                                    <td class="px-6 py-4 text-sm font-medium text-gray-900">内容部</td>
                                    <td class="px-6 py-4 text-sm text-gray-700">张编辑</td>
                                    <td class="px-6 py-4 text-sm text-gray-500">2024-02-01</td>
                                    <td class="px-6 py-4 text-right"><div class="flex items-center justify-end gap-2"><button onclick="showForm('content')" class="text-blue-600 hover:text-blue-800 font-semibold text-sm">编辑</button><button class="text-red-600 hover:text-red-800 text-sm">删除</button></div></td>
                                </tr>
                                <tr class="hover:bg-blue-50/30 transition-all">
                                    <td class="px-6 py-4 text-sm text-gray-500">4</td>
                                    <td class="px-6 py-4 text-sm font-medium text-gray-900">教务部</td>
                                    <td class="px-6 py-4 text-sm text-gray-700">刘助教</td>
                                    <td class="px-6 py-4 text-sm text-gray-500">2024-03-01</td>
                                    <td class="px-6 py-4 text-right"><div class="flex items-center justify-end gap-2"><button onclick="showForm('edu')" class="text-blue-600 hover:text-blue-800 font-semibold text-sm">编辑</button><button class="text-red-600 hover:text-red-800 text-sm">删除</button></div></td>
                                </tr>
                                <tr class="hover:bg-blue-50/30 transition-all">
                                    <td class="px-6 py-4 text-sm text-gray-500">5</td>
                                    <td class="px-6 py-4 text-sm font-medium text-gray-900">客服部</td>
                                    <td class="px-6 py-4 text-sm text-gray-700">赵客服</td>
                                    <td class="px-6 py-4 text-sm text-gray-500">2024-03-15</td>
                                    <td class="px-6 py-4 text-right"><div class="flex items-center justify-end gap-2"><button onclick="showForm('cs')" class="text-blue-600 hover:text-blue-800 font-semibold text-sm">编辑</button><button class="text-red-600 hover:text-red-800 text-sm">删除</button></div></td>

                                    <td class="px-6 py-4 text-right"><div class="flex items-center justify-end gap-2"><button onclick="showForm('research')" class="text-blue-600 hover:text-blue-800 font-semibold text-sm">编辑</button><button class="text-red-600 hover:text-red-800 text-sm">删除</button></div></td>

            <!-- 新增/编辑部门表单 -->

                </div>
                <div class="max-w-2xl">
                    <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
                        <div class="p-6 space-y-6">
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">部门名称 <span class="text-red-500">*</span></label>
                                <input type="text" id="deptName" placeholder="请输入部门名称" class="w-full border border-gray-200 px-4 py-2.5 rounded-lg outline-none focus:ring-1 focus:ring-blue-500 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">部门主管</label>
                                <select id="deptLeader" class="w-full border border-gray-200 px-4 py-2.5 rounded-lg outline-none focus:ring-1 focus:ring-blue-500 text-sm text-gray-700">
                                    <option value="">请选择部门主管</option>
                                    <option value="wang">王管理</option>
                                    <option value="li">李运营</option>
                                    <option value="zhang">张编辑</option>
                                    <option value="liu">刘助教</option>
                                    <option value="zhao">赵客服</option>
                                    <option value="zhou">周财务</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">部门描述</label>
                                <textarea id="deptDesc" rows="4" placeholder="请输入部门描述" class="w-full border border-gray-200 px-4 py-2.5 rounded-lg outline-none focus:ring-1 focus:ring-blue-500 text-sm resize-none"></textarea>
                            </div>
                        </div>
                        <div class="px-6 py-4 bg-gray-50 border-t flex items-center justify-end gap-3">
                            <button onclick="showList()" class="px-6 py-2.5 border border-gray-200 text-gray-600 rounded-lg text-sm font-semibold hover:bg-gray-100 transition-colors">取消</button>
                            <button onclick="saveDepartment()" class="px-6 py-2.5 bg-[#1890FF] text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">保存</button>
                        </div>
                    </div>
                </div>

        </main>
    </div>

    <script>
        function showForm(id) {
            document.getElementById('listView').classList.add('hidden');
            document.getElementById('formView').classList.remove('hidden');
            if (id) {
                document.getElementById('formTitle').textContent = '编辑部门';
                // 简单的示例数据填充
                const names = {
                    'tech': '技术部',
                    'ops': '运营部',
                    'content': '内容部',
                    'edu': '教务部',
                    'cs': '客服部',
                    'finance': '财务部',
                    'research': '教研部'
                };
                const leaders = {
                    'tech': 'wang',
                    'ops': 'li',
                    'content': 'zhang',
                    'edu': 'liu',
                    'cs': 'zhao',
                    'finance': 'zhou',
                    'research': ''
                };
                document.getElementById('deptName').value = names[id] || '';
                document.getElementById('deptLeader').value = leaders[id] || '';
                document.getElementById('deptDesc').value = '负责公司的相关业务运营';
            } else {
                document.getElementById('formTitle').textContent = '新增部门';
                document.getElementById('deptName').value = '';
                document.getElementById('deptLeader').value = '';
                document.getElementById('deptDesc').value = '';
            }
        }
        function showList() {
            document.getElementById('formView').classList.add('hidden');
            document.getElementById('listView').classList.remove('hidden');
        }
        function saveDepartment() {
            const name = document.getElementById('deptName').value;
            if (!name) {
                alert('请输入部门名称');
                return;
            }
            showToast('success', '保存成功', '部门信息已保存');
            setTimeout(showList, 1000);
        }
        
        document.querySelectorAll('.menu-toggle').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const menuGroup = this.closest('.menu-group');
                const menuItems = menuGroup.querySelector('.menu-items');
                const arrow = this.querySelector('.menu-arrow');
                
                const isExpanded = menuItems.style.display !== 'none';
                
                if (isExpanded) {
                    menuItems.style.display = 'none';
                    arrow.textContent = '›';
                } else {
                    menuItems.style.display = 'block';
                    arrow.textContent = '‹';
                }
            });
        });
    </script>

    <!-- Toast 通知容器 -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<script>
    function showToast(type, title, message, duration = 4000) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        var toastId = 'toast_' + Date.now();
        var icons = { success: 'ri:checkbox-circle-line', error: 'ri:error-warning-line', warning: 'ri:alert-line', info: 'ri:information-line' };
        var colors = { success: 'bg-green-50 border-green-200 text-green-800', error: 'bg-red-50 border-red-200 text-red-800', warning: 'bg-yellow-50 border-yellow-200 text-yellow-800', info: 'bg-blue-50 border-blue-200 text-blue-800' };
        var iconColors = { success: 'text-green-500', error: 'text-red-500', warning: 'text-yellow-500', info: 'text-blue-500' };
        toast.id = toastId;
        toast.className = 'pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-lg ' + colors[type] + ' animate-[slideIn_0.3s_ease-out]';
        toast.innerHTML = '<span class="iconify text-xl ' + iconColors[type] + '" data-icon="' + icons[type] + '"></span><div class="flex-1"><div class="font-medium text-sm">' + title + '</div><div class="text-xs opacity-80 mt-0.5">' + message + '</div></div><button onclick="dismissToast(\'' + toastId + '\')" class="opacity-60 hover:opacity-100 transition-opacity"><span class="iconify text-lg" data-icon="ri:close-line"></span></button>';
        container.appendChild(toast);
        setTimeout(function() { var el = document.getElementById(toastId); if(el) { el.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(function() { el.remove(); }, 300); } }, duration);
    }
    function dismissToast(id) { var el = document.getElementById(id); if(el) { el.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(function() { el.remove(); }, 300); } }
document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') { if (e.key === 'Escape') e.target.blur(); return; }
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); showToast('info', '快捷搜索', '按 Ctrl+K 打开全局搜索'); }
    });

    function initShortcutHints() {
        var hint = document.createElement('div');
        hint.className = 'fixed bottom-4 left-4 z-[9997] bg-white px-3 py-2 rounded-lg shadow-lg border border-gray-100 text-xs text-gray-500';
        hint.innerHTML = '<div class="flex items-center gap-3"><span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">Ctrl</kbd>+<kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">K</kbd> 搜索</span></div>';
        hint.style.display = 'none'; hint.id = 'shortcutHint';
        var hintTimeout;
        document.addEventListener('keydown', function(e) { if (e.ctrlKey || e.metaKey) { hint.style.display = 'flex'; clearTimeout(hintTimeout); hintTimeout = setTimeout(function() { hint.style.display = 'none'; }, 3000); } });
        document.body.appendChild(hint);
    }
    initShortcutHints();
    </script>
<script src="embed.js"></script>

    <script>
        // 管理员下拉菜单
        const adminDropdown = document.getElementById('adminDropdown');
        const adminMenu = document.getElementById('adminMenu');
        if (adminDropdown && adminMenu) {
            adminDropdown.addEventListener('click', function(e) {
                e.stopPropagation();
                adminMenu.classList.toggle('hidden');
            });

            document.addEventListener('click', function() {
                adminMenu.classList.add('hidden');
            });

            adminMenu.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }
    </script>
</body>
