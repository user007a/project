    // 渲染卡片
    const grid = document.getElementById('cardsGrid');

    function renderCards(data) {
        grid.innerHTML = '';
        const noResult = document.getElementById('noResult');

        if(data.length === 0) {
            noResult.classList.remove('hidden');
            document.getElementById('certPagination').style.display = 'none';
            return;
        }
        noResult.classList.add('hidden');
        document.getElementById('certPagination').style.display = '';

        data.forEach((card, index) => {
            const el = document.createElement('a');
            el.href = card.link;
            el.target = '_blank';
            el.rel = 'noopener noreferrer';
            el.setAttribute('data-card', index + 1);
            el.className = `bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all duration-300 p-6 border-l-4 ${card.borderColor} group relative block`;
            el.innerHTML = `
                <div class="relative z-10 h-full flex flex-col justify-between min-h-[180px]">
                    <div>
                        <div class="w-10 h-10 ${card.iconBg} rounded-lg flex items-center justify-center mb-4">
                            <span class="iconify text-xl ${card.iconColor}" data-icon="${card.icon}"></span>
                        </div>
                        <h4 class="text-base font-bold mb-2 leading-snug text-gray-900">${card.title}</h4>
                        <p class="text-gray-500 text-sm leading-relaxed">${card.desc}</p>
                    </div>
                    <div class="flex items-center gap-2 mt-6 text-sm font-semibold ${card.btnColor} ${card.btnBg} rounded-lg px-3 py-2 w-fit group-hover:opacity-80 transition-opacity">
                        前往查询 <span class="iconify group-hover:translate-x-1 transition-transform" data-icon="ri:arrow-right-line"></span>
                    </div>
                </div>
            `;
            grid.appendChild(el);
        });
        renderCertPagination(1);
    }

    renderCards(certCards);

    // 搜索过滤
    function filterCards() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if(!query) {
            renderCards(certCards);
            return;
        }
        const filtered = certCards.filter(c =>
            c.title.toLowerCase().includes(query) ||
            c.desc.toLowerCase().includes(query) ||
            c.keyword.toLowerCase().includes(query)
        );
        renderCards(filtered);
    }

    // 卡片分页逻辑
    const CERT_PAGE_SIZE = 10;
    let certCurrentPage = 1;

    function renderCertPagination(page) {
        const cards = document.querySelectorAll('[data-card]');
        const totalCards = cards.length;
        const totalPages = Math.ceil(totalCards / CERT_PAGE_SIZE);
        certCurrentPage = page;
        cards.forEach((card) => {
            const cardNum = parseInt(card.getAttribute('data-card'));
            if (cardNum > (page - 1) * CERT_PAGE_SIZE && cardNum <= page * CERT_PAGE_SIZE) {
                card.style.display = '';
            } else {
                card.style.display = 'none';
            }
        });
        const infoEl = document.getElementById('pageInfo');
        if (infoEl) infoEl.textContent = '第 ' + page + ' / ' + totalPages + ' 页，共 ' + totalCards + ' 条';
        const paginationBtns = document.getElementById('paginationBtns');
        if (paginationBtns) {
            let html = '';
            html += '<button onclick="renderCertPagination(' + (page - 1) + ')" class="px-3 py-1.5 text-sm border rounded-lg ' + (page === 1 ? 'border-gray-200 text-gray-400 cursor-not-allowed' : 'border-gray-200 text-gray-600 hover:bg-gray-50') + '" ' + (page === 1 ? 'disabled' : '') + '>上一页</button>';
            for (let i = 1; i <= totalPages; i++) {
                html += '<button onclick="renderCertPagination(' + i + ')" class="px-3 py-1.5 text-sm border rounded-lg ' + (i === page ? 'bg-[#1890FF] text-white border-[#1890FF]' : 'border-gray-200 text-gray-600 hover:bg-gray-50') + '">' + i + '</button>';
            }
            html += '<button onclick="renderCertPagination(' + (page + 1) + ')" class="px-3 py-1.5 text-sm border rounded-lg ' + (page === totalPages ? 'border-gray-200 text-gray-400 cursor-not-allowed' : 'border-gray-200 text-gray-600 hover:bg-gray-50') + '" ' + (page === totalPages ? 'disabled' : '') + '>下一页</button>';
            paginationBtns.innerHTML = html;
        }
    }
    </script>

    <script>
        document.querySelectorAll('.menu-toggle').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const menuGroup = this.closest('.menu-group');
                const menuItems = menuGroup.querySelector('.menu-items');
                const arrow = this.querySelector('.menu-arrow');
                
                const isExpanded = menuItems.style.display !== 'none';
                
                if (isExpanded) {
                    menuItems.style.display = 'none';
                    arrow.textContent = '›';
                } else {
                    menuItems.style.display = 'block';
                    arrow.textContent = '‹';
                }
            });
        });
    </script>

    <!-- Toast 通知容器 -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<script>
    function showToast(type, title, message, duration = 4000) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        var toastId = 'toast_' + Date.now();
        var icons = { success: 'ri:checkbox-circle-line', error: 'ri:error-warning-line', warning: 'ri:alert-line', info: 'ri:information-line' };
        var colors = { success: 'bg-green-50 border-green-200 text-green-800', error: 'bg-red-50 border-red-200 text-red-800', warning: 'bg-yellow-50 border-yellow-200 text-yellow-800', info: 'bg-blue-50 border-blue-200 text-blue-800' };
        var iconColors = { success: 'text-green-500', error: 'text-red-500', warning: 'text-yellow-500', info: 'text-blue-500' };
        toast.id = toastId;
        toast.className = 'pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-lg ' + colors[type] + ' animate-[slideIn_0.3s_ease-out]';
        toast.innerHTML = '<span class="iconify text-xl ' + iconColors[type] + '" data-icon="' + icons[type] + '"></span><div class="flex-1"><div class="font-medium text-sm">' + title + '</div><div class="text-xs opacity-80 mt-0.5">' + message + '</div></div><button onclick="dismissToast(\'' + toastId + '\')" class="opacity-60 hover:opacity-100 transition-opacity"><span class="iconify text-lg" data-icon="ri:close-line"></span></button>';
        container.appendChild(toast);
        setTimeout(function() { var el = document.getElementById(toastId); if(el) { el.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(function() { el.remove(); }, 300); } }, duration);
    }
    function dismissToast(id) { var el = document.getElementById(id); if(el) { el.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(function() { el.remove(); }, 300); } }
document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') { if (e.key === 'Escape') e.target.blur(); return; }
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); showToast('info', '快捷搜索', '按 Ctrl+K 打开全局搜索'); }
);

    function initShortcutHints() {
        var hint = document.createElement('div');
        hint.className = 'fixed bottom-4 left-4 z-[9997] bg-white px-3 py-2 rounded-lg shadow-lg border border-gray-100 text-xs text-gray-500';
        hint.innerHTML = '<div class="flex items-center gap-3"><span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">Ctrl</kbd>+<kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">K</kbd> 搜索</span><span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">Ctrl</kbd>+<kbd class="px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 font-mono">N</kbd> 新增</span></div>';
        hint.style.display = 'none'; hint.id = 'shortcutHint';
        var hintTimeout;
        document.addEventListener('keydown', function(e) { if (e.ctrlKey || e.metaKey) { hint.style.display = 'flex'; clearTimeout(hintTimeout); hintTimeout = setTimeout(function() { hint.style.display = 'none'; }, 3000); } });
        document.body.appendChild(hint);
    }
    initShortcutHints();
    </script>
<script src="embed.js"></script>
</body>
