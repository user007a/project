    <div class="flex-1 flex flex-col min-w-0">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-shrink-0"><div class="flex items-center gap-2 text-sm text-gray-500"><a href="dashboard.html" class="hover:text-blue-600">工作台</a><span class="iconify" data-icon="ri:arrow-right-s-line"></span><span class="text-gray-900 font-medium">基础设置</span></div><div class="flex items-center gap-4"><button class="relative p-2 text-gray-400 hover:text-gray-600 transition-colors"><span class="iconify text-xl" data-icon="ri:notification-3-line"></span><span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span></button><div class="h-6 w-px bg-gray-200"></div><div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 px-3 py-1.5 rounded-lg transition-colors"><div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center"><span class="text-blue-600 text-sm font-bold">管</span></div><span class="text-sm text-gray-700">管理员</span><span class="iconify text-gray-400" data-icon="ri:arrow-down-s-line"></span></div></div></header>
        <main class="flex-1 overflow-y-auto p-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">基础设置</h1>
            <!-- 站点信息 -->
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-6">
                <div class="px-6 py-4 bg-gray-50 border-b"><h3 class="text-base font-bold text-gray-900">站点信息</h3></div>
                <div class="p-6 grid grid-cols-2 gap-6">
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">平台名称</label><input type="text" value="叁竹培训" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">平台副标题</label><input type="text" value="专业养老培训平台" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">联系电话</label><input type="text" value="400-XXX-XXXX" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">联系邮箱</label><input type="email" value="contact@sanzhuedu.com" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div class="col-span-2"><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">平台简介</label><textarea rows="3" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm resize-none">面向养老行业从业人员，提供在线培训与考证服务</textarea></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">平台Logo</label><div class="flex items-center gap-4"><div class="w-16 h-16 bg-blue-50 rounded-lg flex items-center justify-center border-2 border-dashed border-gray-200"><span class="iconify text-2xl text-blue-400" data-icon="ri:plant-line"></span></div><button class="text-sm text-blue-600 hover:text-blue-800 font-medium">更换Logo</button></div></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">备案号</label><input type="text" placeholder="ICP备案号" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                </div>
            </div>
            <!-- 学时设置 -->
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-6">
                <div class="px-6 py-4 bg-gray-50 border-b"><h3 class="text-base font-bold text-gray-900">学时与证书设置</h3></div>
                <div class="p-6 grid grid-cols-2 gap-6">
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">默认学习有效期</label><div class="relative"><input type="number" value="365" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"><span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">天</span></div></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">防快进设置</label><select class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"><option>开启</option><option>关闭</option></select></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">证书申请条件</label><select class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"><option>学时达标即可申请</option><option>需通过考核</option></select></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">证书模板</label><select class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"><option>标准模板</option><option>自定义模板</option></select></div>
                </div>
            </div>
            <!-- 退款设置 -->
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-6">
                <div class="px-6 py-4 bg-gray-50 border-b"><h3 class="text-base font-bold text-gray-900">退款规则设置</h3></div>
                <div class="p-6">
                    <div class="space-y-4">
                        <div class="flex items-center gap-6 p-4 bg-green-50 rounded-lg border border-green-200">
                            <span class="text-xs font-bold text-green-700 bg-green-100 px-2 py-1 rounded">≤20%</span>
                            <span class="text-sm text-gray-700">学习进度不超过20%，可全额退款</span>
                        </div>
                        <div class="flex items-center gap-6 p-4 bg-yellow-50 rounded-lg border border-yellow-200">
                            <span class="text-xs font-bold text-yellow-700 bg-yellow-100 px-2 py-1 rounded">20%-50%</span>
                            <span class="text-sm text-gray-700">学习进度20%-50%，退款50%</span>
                        </div>
                        <div class="flex items-center gap-6 p-4 bg-red-50 rounded-lg border border-red-200">
                            <span class="text-xs font-bold text-red-700 bg-red-100 px-2 py-1 rounded">>50%</span>
                            <span class="text-sm text-gray-700">学习进度超过50%，不予退款</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex items-center justify-end gap-3"><button class="px-6 py-2 border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors">重置</button><button class="px-10 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">保存设置</button></div>
        </main>
    </div>
</body>
</html>
