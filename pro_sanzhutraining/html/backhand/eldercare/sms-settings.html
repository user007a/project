        <main class="flex-1 overflow-y-auto p-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">短信配置</h1>
            <!-- 短信服务商 -->
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-6">
                <div class="px-6 py-4 bg-gray-50 border-b"><h3 class="text-base font-bold text-gray-900">服务商配置</h3></div>
                <div class="p-6 grid grid-cols-2 gap-6">
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">短信服务商</label><select class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"><option>阿里云短信</option><option>腾讯云短信</option></select></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">AccessKey ID</label><input type="text" value="LTAI••••••••" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">AccessKey Secret</label><input type="password" value="••••••••••••••••" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-500 uppercase mb-2">短信签名</label><input type="text" value="叁竹培训" class="w-full border border-gray-200 p-2 rounded-md outline-none focus:ring-1 focus:ring-blue-500 text-sm"></div>
                </div>
            </div>
            <!-- 短信模板 -->
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-6">
                <div class="px-6 py-4 bg-gray-50 border-b flex items-center justify-between"><h3 class="text-base font-bold text-gray-900">短信模板</h3><button class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-blue-600 hover:bg-blue-50 rounded-md transition-colors"><span class="iconify" data-icon="ri:add-line"></span>新增模板</button></div>
                <div class="overflow-x-auto"><table class="w-full"><thead><tr class="border-b border-gray-100"><th class="px-6 py-3 text-left text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/30">模板名称</th><th class="px-6 py-3 text-left text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/30">模板CODE</th><th class="px-6 py-3 text-left text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/30">用途</th><th class="px-6 py-3 text-left text-xs text-gray-400 uppercase tracking-wider font-bold bg-gray-50/30">状态</th></tr></thead>
                <tbody class="divide-y divide-gray-100">
                    <tr class="hover:bg-blue-50/30 transition-all"><td class="px-6 py-4"><span class="text-sm font-medium text-gray-900">验证码短信</span></td><td class="px-6 py-4"><span class="text-sm text-gray-700 font-mono">SMS_001</span></td><td class="px-6 py-4"><span class="text-sm text-gray-700">登录/注册验证码</span></td><td class="px-6 py-4"><span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs">已启用</span></td></tr>
                    <tr class="hover:bg-blue-50/30 transition-all"><td class="px-6 py-4"><span class="text-sm font-medium text-gray-900">订单通知</span></td><td class="px-6 py-4"><span class="text-sm text-gray-700 font-mono">SMS_002</span></td><td class="px-6 py-4"><span class="text-sm text-gray-700">购买成功/退款通知</span></td><td class="px-6 py-4"><span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs">已启用</span></td></tr>
                    <tr class="hover:bg-blue-50/30 transition-all"><td class="px-6 py-4"><span class="text-sm font-medium text-gray-900">证书通知</span></td><td class="px-6 py-4"><span class="text-sm text-gray-700 font-mono">SMS_003</span></td><td class="px-6 py-4"><span class="text-sm text-gray-700">证书审核结果通知</span></td><td class="px-6 py-4"><span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs">已启用</span></td></tr>
                    <tr class="hover:bg-blue-50/30 transition-all"><td class="px-6 py-4"><span class="text-sm font-medium text-gray-900">学习提醒</span></td><td class="px-6 py-4"><span class="text-sm text-gray-700 font-mono">SMS_004</span></td><td class="px-6 py-4"><span class="text-sm text-gray-700">课程即将到期提醒</span></td><td class="px-6 py-4"><span class="px-2 py-1 bg-gray-100 text-gray-700 rounded text-xs">已禁用</span></td></tr>
                </tbody></table></div>

    <script>
        document.querySelectorAll('.menu-toggle').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const menuGroup = this.closest('.menu-group');
                const menuItems = menuGroup.querySelector('.menu-items');
                const arrow = this.querySelector('.menu-arrow');
                
                const isExpanded = menuItems.style.display !== 'none';
                
                if (isExpanded) {
                    menuItems.style.display = 'none';
                    arrow.textContent = '›';
                } else {
                    menuItems.style.display = 'block';
                    arrow.textContent = '‹';
                }
            });
        });
    </script>
