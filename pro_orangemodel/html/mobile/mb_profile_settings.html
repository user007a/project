<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>南丰蜜桔智慧果园 - 设置</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
</head>
<body>
  <div class="mb-app">
    <div class="page-header mb-header-detail">
      <div class="header-nav">
        <div class="header-back" onclick="window.history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div class="header-title">设置</div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-title">消息通知</div>
        
        <div class="list-item">
          <div class="list-icon green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">预警通知</div>
            <div class="list-subtitle">接收病虫害、气象灾害等预警信息</div>
          </div>
          <div onclick="toggleSwitch(this)" class="switch on"></div>
        </div>

        <div class="list-item">
          <div class="list-icon blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 18h.01"/>
              <path d="M8 21h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2z"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">农事建议通知</div>
            <div class="list-subtitle">接收系统生成的农事操作建议</div>
          </div>
          <div onclick="toggleSwitch(this)" class="switch on"></div>
        </div>

        <div class="list-item">
          <div class="list-icon orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
              <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">资讯推送</div>
            <div class="list-subtitle">接收最新农技资讯和培训课程</div>
          </div>
          <div onclick="toggleSwitch(this)" class="switch"></div>
        </div>

        <div class="list-item">
          <div class="list-icon purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 8v4l3 3"/>
              <circle cx="12" cy="12" r="10"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">声音提醒</div>
            <div class="list-subtitle">收到通知时播放提示音</div>
          </div>
          <div onclick="toggleSwitch(this)" class="switch on"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">意见反馈</div>
        
        <div class="form-item">
          <label class="form-label">反馈类型</label>
          <div class="mb-grid mb-grid-3">
            <div onclick="selectFeedbackType('bug')" class="feedback-tag" data-type="bug">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              <div style="font-size: 11px; margin-top: 4px;">Bug反馈</div>
            </div>
            <div onclick="selectFeedbackType('feature')" class="feedback-tag" data-type="feature">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <div style="font-size: 11px; margin-top: 4px;">功能建议</div>
            </div>
            <div onclick="selectFeedbackType('other')" class="feedback-tag" data-type="other">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              <div style="font-size: 11px; margin-top: 4px;">其他</div>
            </div>
          </div>
        </div>

        <div class="form-item">
          <label class="form-label">反馈内容</label>
          <textarea class="form-textarea" placeholder="请详细描述您的问题或建议..."></textarea>
        </div>

        <div class="form-item">
          <label class="form-label">联系方式</label>
          <input type="text" class="form-input" placeholder="请输入您的手机号或微信号（选填）">
        </div>

        <button class="btn btn-primary btn-block" onclick="submitFeedback()">提交反馈</button>
      </div>

      <div class="card">
        <div class="card-title">关于我们</div>
        
        <div class="list-item" onclick="showAbout()">
          <div class="list-icon blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 16v-4"/>
              <path d="M12 8h.01"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">版本信息</div>
            <div class="list-subtitle">南丰蜜桔智慧果园 v1.0.0</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>

        <div class="list-item" onclick="showPrivacy()">
          <div class="list-icon green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">隐私政策</div>
            <div class="list-subtitle">查看用户隐私保护条款</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>

        <div class="list-item" onclick="showTerms()">
          <div class="list-icon orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">用户协议</div>
            <div class="list-subtitle">查看服务使用条款</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>

        <div class="list-item" onclick="contactUs()">
          <div class="list-icon purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">联系我们</div>
            <div class="list-subtitle">客服热线：0794-XXX-XXXX</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      </div>

      <div class="card">
        <button class="btn btn-outline btn-block" onclick="logout()">退出登录</button>
      </div>

      <div style="text-align: center; padding: 24px; font-size: 12px; color: var(--text-light);">
        © 2026 南丰县农业农村局<br>
        致力于为种植户提供智能化、精准化的农事管理服务
      </div>
    </div>

    <nav class="tab-bar">
      <a href="mb_home.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>首页</span>
      </a>
      <a href="mb_data.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>数据</span>
      </a>
      <a href="mb_disease.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>病虫害</span>
      </a>
      <a href="mb_news.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>资讯</span>
      </a>
      <a href="mb_profile.html" class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <div class="modal-overlay" id="successModal">
    <div class="modal modal-success">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div style="font-size: 18px; font-weight: bold; color: var(--text); margin-bottom: 8px;">提交成功</div>
      <div style="font-size: 13px; color: var(--text-secondary);">感谢您的宝贵意见，我们会尽快处理</div>
      <div class="modal-footer" style="border-top: none; margin-top: 16px;">
        <button class="btn btn-primary btn-block" onclick="closeModal('successModal')">确定</button>
      </div>
    </div>
  </div>

  <style>
    .feedback-tag {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .feedback-tag.active {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
    }
  </style>

  <script>
    function toggleSwitch(el) {
      el.classList.toggle('on');
    }
    function selectFeedbackType(type) {
      document.querySelectorAll('.feedback-tag').forEach(el => {
        el.classList.remove('active');
      });
      document.querySelector(`[data-type="${type}"]`).classList.add('active');
    }
    function submitFeedback() {
      var content = document.querySelector('.form-textarea').value;
      if (!content || content.trim().length < 5) {
        alert('请输入详细的反馈内容（至少5个字符）');
        return;
      }
      
      document.getElementById('successModal').classList.add('show');
      document.querySelector('.form-textarea').value = '';
      document.querySelectorAll('.feedback-tag').forEach(el => {
        el.classList.remove('active');
      });
    }
    function showAbout() {
      alert('南丰蜜桔智慧果园 v1.0.0\n\n致力于为种植户提供智能化、精准化的农事管理服务。');
    }
    function showPrivacy() {
      alert('隐私政策');
    }
    function showTerms() {
      alert('用户协议');
    }
    function contactUs() {
      alert('客服热线：0794-XXX-XXXX');
    }
    function logout() {
      if (confirm('确定要退出登录吗？')) {
        alert('已退出登录');
        window.location.href = 'mb_home.html';
      }
    }
  </script>
</body>
</html>
