<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>南丰蜜桔智慧果园 - 数据管理</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
</head>
<body>
  <div class="mb-app">
    <div class="page-header mb-header-detail">
      <div class="header-nav">
        <div class="header-back" onclick="window.history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div class="header-title">数据管理</div>
      </div>
      <div class="header-content">
        <div class="header-sub">管理南丰蜜桔果园数据，获取智能分析</div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-title">果园环境实时监测</div>
        <div class="mb-env-grid">
          <div class="env-item">
            <div class="env-icon">🌡️</div>
            <div class="env-value" style="color: var(--danger);">35.8°C</div>
            <div class="env-label">空气温度</div>
          </div>
          <div class="env-item">
            <div class="env-icon">💧</div>
            <div class="env-value">45%</div>
            <div class="env-label">空气湿度</div>
          </div>
          <div class="env-item">
            <div class="env-icon">🌍</div>
            <div class="env-value" style="color: var(--warning);">32.1°C</div>
            <div class="env-label">土壤温度</div>
          </div>
          <div class="env-item">
            <div class="env-icon">🌱</div>
            <div class="env-value" style="color: var(--warning);">52%</div>
            <div class="env-label">土壤湿度</div>
          </div>
          <div class="env-item">
            <div class="env-icon">☀️</div>
            <div class="env-value">1250 lux</div>
            <div class="env-label">光照强度</div>
          </div>
          <div class="env-item">
            <div class="env-icon">⚡</div>
            <div class="env-value">1.2 mS/cm</div>
            <div class="env-label">土壤EC值</div>
          </div>
        </div>
        <div style="margin-top: 12px; font-size: 12px; color: var(--text-light); text-align: center;">
          数据更新时间：2026-07-22 14:30
        </div>
      </div>

      <div class="card">
        <div class="card-title">功能菜单</div>
        <div class="list-item" onclick="navigateTo('mb_data_orchard.html')">
          <div class="list-icon green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">我的果园</div>
            <div class="list-subtitle">管理南丰蜜桔果园基础信息和地块</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>

        <div class="list-item" onclick="navigateTo('mb_data_input.html')">
          <div class="list-icon blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="1" x2="12" y2="23"/>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">数据录入</div>
            <div class="list-subtitle">土壤养分、墒情、农事操作等</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>

        <div class="list-item" onclick="navigateTo('mb_data_monitor.html')">
          <div class="list-icon purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">设备监测</div>
            <div class="list-subtitle">实时数据查看与历史趋势</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>

        <div class="list-item" onclick="navigateTo('mb_data_suggestion.html')">
          <div class="list-icon orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">智能建议</div>
            <div class="list-subtitle">录入数据生成蜜桔专属农事建议</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">今日数据概览</div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">5</div>
            <div class="stat-label">录入记录</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">6</div>
            <div class="stat-label">在线设备</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">15</div>
            <div class="stat-label">监测点位</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">3</div>
            <div class="stat-label">农事建议</div>
          </div>
        </div>
      </div>
    </div>

    <nav class="tab-bar">
      <a href="mb_home.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>首页</span>
      </a>
      <a href="mb_data.html" class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>数据</span>
      </a>
      <a href="mb_disease.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>病虫害</span>
      </a>
      <a href="mb_news.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>资讯</span>
      </a>
      <a href="mb_profile.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <script>
    function navigateTo(page) {
      window.location.href = page;
    }
  </script>
</body>
</html>
