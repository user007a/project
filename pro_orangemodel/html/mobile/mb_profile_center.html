<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>南丰蜜桔智慧果园 - 个人信息</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    .page-header {
      position: relative;
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      padding: 44px 16px 20px;
      color: var(--bg-white);
    }
    
    .header-back {
      position: absolute;
      left: 12px;
      top: 44px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .header-back svg { width: 18px; height: 18px; }
    
    .header-content { padding-left: 44px; }
    .header-title { font-size: var(--font-xl); font-weight: 700; }
    .header-sub { font-size: var(--font-sm); opacity: 0.85; margin-top: 4px; }

    .card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
    }
    
    .card-title {
      font-size: var(--font-md);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .card-title svg { width: 18px; height: 18px; color: var(--primary); }

    .form-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
    }
    
    .form-item:last-child { border-bottom: none; }
    
    .form-label { font-size: var(--font-base); color: var(--text); }
    .form-value { font-size: var(--font-base); color: var(--text-secondary); }
    .form-arrow {
      width: 18px;
      height: 18px;
      color: var(--text-light);
    }
    
    .form-arrow svg { width: 100%; height: 100%; }

    .btn-row {
      display: flex;
      gap: var(--space-3);
    }
    
    .btn-row button { flex: 1; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 1000;
      display: none; justify-content: center; align-items: center;
    }
    
    .modal-overlay.show { display: flex; }
    
    .modal-box {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      width: 90%;
      max-width: 360px;
      max-height: 85vh;
      overflow: hidden;
    }
    
    .modal-header {
      padding: var(--space-5);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .modal-title { font-size: var(--font-lg); font-weight: 600; color: var(--text); }
    .modal-close {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-md);
      background: var(--gray-100);
    }
    
    .modal-close svg { width: 18px; height: 18px; color: var(--text-secondary); }
    
    .modal-body { padding: var(--space-4); max-height: 60vh; overflow-y: auto; }
    .modal-footer { padding: var(--space-4); border-top: 1px solid var(--border); }

    .modal-item {
      padding: var(--space-3);
      border-radius: var(--radius-md);
      background: var(--bg);
      margin-bottom: var(--space-2);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .modal-item:active { background: var(--gray-100); }
    .modal-item span { font-size: var(--font-base); color: var(--text); }

    .success-modal {
      text-align: center;
      padding: var(--space-8) var(--space-6);
    }
    
    .success-icon {
      width: 64px; height: 64px;
      margin: 0 auto var(--space-4);
      border-radius: 50%;
      background: var(--success-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .success-icon svg { width: 32px; height: 32px; color: var(--success); }
    
    .success-title { font-size: var(--font-lg); font-weight: 600; color: var(--text); margin-bottom: var(--space-2); }
    .success-desc { font-size: var(--font-sm); color: var(--text-secondary); }

    .skeleton-state { display: none; }
    .mb-app.loading .real-content { display: none; }
    .mb-app.loading .skeleton-state { display: block; }
  </style>
</head>
<body>
  <div class="mb-app loading">
    <!-- ===================== 骨架屏 ===================== -->
    <div class="skeleton-state">
      <div class="page-header">
        <div class="header-nav">
          <div style="width:36px;height:36px;"></div>
          <div class="header-title"></div>
        </div>
      </div>
      <div class="mb-section">
        <div class="mb-skeleton-card">
          <div class="mb-skeleton" style="width:80px;height:16px;margin-bottom:16px;"></div>
          <div class="mb-skeleton-line long"></div>
          <div class="mb-skeleton-line long"></div>
          <div class="mb-skeleton-line long"></div>
        </div>
        <div style="height:20px;"></div>
        <div class="mb-skeleton-card">
          <div class="mb-skeleton" style="width:80px;height:16px;margin-bottom:16px;"></div>
          <div class="mb-skeleton-line long"></div>
          <div class="mb-skeleton-line long"></div>
        </div>
        <div style="height:20px;"></div>
        <div class="mb-skeleton-card">
          <div class="mb-skeleton" style="width:80px;height:16px;margin-bottom:16px;"></div>
          <div class="mb-skeleton-line long"></div>
          <div class="mb-skeleton-line long"></div>
        </div>
      </div>
    </div>

    <!-- ===================== 真实内容 ===================== -->
    <div class="real-content">
      <!-- Header -->
      <div class="page-header">
        <div class="header-back" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </div>
        <div class="header-content">
          <div class="header-title">个人信息</div>
          <div class="header-sub">管理您的账户信息和安全设置</div>
        </div>
      </div>

      <div class="mb-section">
        <!-- 基本信息 -->
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            基本信息
          </div>
          <div class="form-item" onclick="editProfile()">
            <div class="form-label">姓名</div>
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <div class="form-value">张三</div>
              <div class="form-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </div>
            </div>
          </div>
          <div class="form-item" onclick="editProfile()">
            <div class="form-label">所在地区</div>
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <div class="form-value">江西省抚州市南丰县白舍镇</div>
              <div class="form-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </div>
            </div>
          </div>
          <div class="form-item" onclick="editProfile()">
            <div class="form-label">种植主体类型</div>
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <div class="form-value">种植大户</div>
              <div class="form-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- 认证信息 -->
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            认证信息
          </div>
          <div class="form-item" onclick="bindPhone()">
            <div class="form-label">手机号</div>
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <div class="form-value">未绑定</div>
              <div class="form-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </div>
            </div>
          </div>
          <div class="form-item" onclick="bindWechat()">
            <div class="form-label">微信</div>
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <div class="form-value">未绑定</div>
              <div class="form-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- 账户安全 -->
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            账户安全
          </div>
          <div class="form-item" onclick="changePassword()">
            <div class="form-label">修改密码</div>
            <div class="form-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </div>
          </div>
          <div class="form-item">
            <div class="form-label">登录安全</div>
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <div class="form-value">已开启</div>
              <div class="form-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </div>
            </div>
          </div>
          <div class="form-item">
            <div class="form-label">登录记录</div>
            <div class="form-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div><!-- /real-content -->

    <!-- 底部导航 -->
    <div class="mb-tab-bar">
      <div class="mb-tab-item" onclick="navigateTo('mb_home.html')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>首页</span></div>
      <div class="mb-tab-item" onclick="navigateTo('mb_data.html')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>数据</span></div>
      <div class="mb-tab-item" onclick="navigateTo('mb_disease.html')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>病虫害</span></div>
      <div class="mb-tab-item" onclick="navigateTo('mb_news.html')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>资讯</span></div>
      <div class="mb-tab-item active" onclick="navigateTo('mb_profile.html')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>我的</span></div>
    </div>

    <!-- 编辑信息弹窗 -->
    <div class="modal-overlay" id="editModal">
      <div class="modal-box">
        <div class="modal-header">
          <div class="modal-title">编辑个人信息</div>
          <div class="modal-close" onclick="closeModal('editModal')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </div>
        </div>
        <div class="modal-body">
          <div class="form-item">
            <div class="form-label">姓名</div>
            <input type="text" class="form-input" id="editName" value="张三" style="text-align: right;">
          </div>
          <div class="form-item">
            <div class="form-label">所在地区</div>
            <input type="text" class="form-input" id="editRegion" value="江西省抚州市南丰县白舍镇" style="text-align: right;">
          </div>
          <div class="form-item">
            <div class="form-label">种植主体类型</div>
            <div class="form-select" onclick="showTypePicker()">
              <span class="form-select-value" id="editType">种植大户</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <div class="btn-row">
            <button class="mb-btn mb-btn-outline" onclick="closeModal('editModal')">取消</button>
            <button class="mb-btn mb-btn-primary" onclick="saveProfile()">保存</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 种植主体类型选择 -->
    <div class="modal-overlay" id="typePickerModal">
      <div class="modal-box">
        <div class="modal-header">
          <div class="modal-title">选择种植主体类型</div>
          <div class="modal-close" onclick="closeModal('typePickerModal')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </div>
        </div>
        <div class="modal-body">
          <div class="modal-item" onclick="selectType('种植大户')"><span>种植大户</span></div>
          <div class="modal-item" onclick="selectType('家庭农场')"><span>家庭农场</span></div>
          <div class="modal-item" onclick="selectType('专业合作社')"><span>专业合作社</span></div>
          <div class="modal-item" onclick="selectType('企业')"><span>企业</span></div>
        </div>
      </div>
    </div>

    <!-- 修改密码弹窗 -->
    <div class="modal-overlay" id="pwdModal">
      <div class="modal-box">
        <div class="modal-header">
          <div class="modal-title">修改密码</div>
          <div class="modal-close" onclick="closeModal('pwdModal')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </div>
        </div>
        <div class="modal-body">
          <div class="form-item">
            <div class="form-label">原密码</div>
            <input type="password" class="form-input" id="oldPwd" placeholder="请输入原密码" style="text-align: right;">
          </div>
          <div class="form-item">
            <div class="form-label">新密码</div>
            <input type="password" class="form-input" id="newPwd" placeholder="请输入新密码（6-20位）" style="text-align: right;">
          </div>
          <div class="form-item">
            <div class="form-label">确认新密码</div>
            <input type="password" class="form-input" id="confirmPwd" placeholder="请再次输入新密码" style="text-align: right;">
          </div>
        </div>
        <div class="modal-footer">
          <div class="btn-row">
            <button class="mb-btn mb-btn-outline" onclick="closeModal('pwdModal')">取消</button>
            <button class="mb-btn mb-btn-primary" onclick="submitPwdChange()">确认修改</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 绑定手机号弹窗 -->
    <div class="modal-overlay" id="phoneModal">
      <div class="modal-box">
        <div class="modal-header">
          <div class="modal-title">绑定手机号</div>
          <div class="modal-close" onclick="closeModal('phoneModal')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </div>
        </div>
        <div class="modal-body">
          <div class="form-item">
            <div class="form-label">手机号</div>
            <input type="tel" class="form-input" id="bindPhone" placeholder="请输入手机号" style="text-align: right;">
          </div>
          <div class="form-item">
            <div style="display: flex; gap: var(--space-3); width: 100%;">
              <input type="text" class="form-input" id="verifyCode" placeholder="验证码" style="flex: 1; text-align: right;">
              <button class="mb-btn mb-btn-outline" onclick="sendVerifyCode()" id="codeBtn">获取验证码</button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <div class="btn-row">
            <button class="mb-btn mb-btn-outline" onclick="closeModal('phoneModal')">取消</button>
            <button class="mb-btn mb-btn-primary" onclick="submitPhoneBind()">确认绑定</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 成功提示弹窗 -->
    <div class="modal-overlay" id="successModal">
      <div class="modal-box">
        <div class="success-modal">
          <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="success-title" id="successMsg">操作成功</div>
          <div class="success-desc">您的信息已更新</div>
        </div>
        <div class="modal-footer">
          <button class="mb-btn mb-btn-primary mb-btn-block" onclick="closeModal('successModal')">确定</button>
        </div>
      </div>
    </div>

    <script>
      function goBack() {
        window.history.back();
      }

      function navigateTo(page) {
        window.location.href = page;
      }

      function editProfile() {
        document.getElementById('editModal').classList.add('show');
      }

      function showTypePicker() {
        document.getElementById('typePickerModal').classList.add('show');
      }

      function selectType(type) {
        document.getElementById('editType').textContent = type;
        closeModal('typePickerModal');
      }

      function saveProfile() {
        var name = document.getElementById('editName').value;
        var region = document.getElementById('editRegion').value;
        
        if (!name || !region) {
          alert('请填写完整信息');
          return;
        }
        
        closeModal('editModal');
        document.getElementById('successMsg').textContent = '保存成功';
        document.getElementById('successModal').classList.add('show');
      }

      function changePassword() {
        document.getElementById('pwdModal').classList.add('show');
      }

      function submitPwdChange() {
        var oldPwd = document.getElementById('oldPwd').value;
        var newPwd = document.getElementById('newPwd').value;
        var confirmPwd = document.getElementById('confirmPwd').value;
        
        if (!oldPwd || !newPwd || !confirmPwd) {
          alert('请填写完整密码信息');
          return;
        }
        
        if (newPwd.length < 6) {
          alert('新密码长度不能少于6位');
          return;
        }
        
        if (newPwd !== confirmPwd) {
          alert('两次输入的新密码不一致');
          return;
        }
        
        closeModal('pwdModal');
        document.getElementById('successMsg').textContent = '密码修改成功';
        document.getElementById('successModal').classList.add('show');
        
        document.getElementById('oldPwd').value = '';
        document.getElementById('newPwd').value = '';
        document.getElementById('confirmPwd').value = '';
      }

      function bindPhone() {
        document.getElementById('phoneModal').classList.add('show');
      }

      function sendVerifyCode() {
        var phone = document.getElementById('bindPhone').value;
        if (!phone || phone.length !== 11) {
          alert('请输入正确的手机号');
          return;
        }
        
        var btn = document.getElementById('codeBtn');
        btn.textContent = '发送中...';
        btn.disabled = true;
        
        setTimeout(function() {
          btn.textContent = '60秒后重新获取';
          var count = 60;
          var timer = setInterval(function() {
            count--;
            btn.textContent = count + '秒后重新获取';
            if (count <= 0) {
              clearInterval(timer);
              btn.textContent = '获取验证码';
              btn.disabled = false;
            }
          }, 1000);
          alert('验证码已发送至手机');
        }, 1000);
      }

      function submitPhoneBind() {
        var phone = document.getElementById('bindPhone').value;
        var code = document.getElementById('verifyCode').value;
        
        if (!phone || phone.length !== 11) {
          alert('请输入正确的手机号');
          return;
        }
        
        if (!code || code.length !== 6) {
          alert('请输入6位验证码');
          return;
        }
        
        closeModal('phoneModal');
        document.getElementById('successMsg').textContent = '手机号绑定成功';
        document.getElementById('successModal').classList.add('show');
        
        document.getElementById('bindPhone').value = '';
        document.getElementById('verifyCode').value = '';
      }

      function bindWechat() {
        alert('正在跳转微信授权...');
        setTimeout(function() {
          document.getElementById('successMsg').textContent = '微信绑定成功';
          document.getElementById('successModal').classList.add('show');
        }, 1500);
      }

      function closeModal(id) {
        document.getElementById(id).classList.remove('show');
      }

      (function() {
        var app = document.querySelector('.mb-app');
        setTimeout(function() {
          app.classList.remove('loading');
        }, 600);
      })();
    </script>
  </body>
</html>
