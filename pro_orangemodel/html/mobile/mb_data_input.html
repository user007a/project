<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>南丰蜜桔智慧果园 - 数据录入</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
</head>
<body>
  <div class="mb-app">
    <div class="page-header mb-header-detail">
      <div class="header-nav">
        <div class="header-back" onclick="window.history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div class="header-title">数据录入</div>
      </div>
      <div class="header-content">
        <div class="header-sub">手动录入果园数据</div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-title">选择录入类型</div>
        <div class="service-grid">
          <div class="service-item" onclick="showForm('soil')">
            <div class="service-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
            </div>
            <div class="service-name">土壤养分</div>
          </div>
          <div class="service-item" onclick="showForm('moisture')">
            <div class="service-icon blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </div>
            <div class="service-name">墒情</div>
          </div>
          <div class="service-item" onclick="showForm('weather')">
            <div class="service-icon orange">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                <path d="M12 2a5.5 5.5 0 0 0-5.5 5.5v1l-1.8 3.4a1.5 1.5 0 0 0 1.3 2.1h11.2a1.5 1.5 0 0 0 1.3-2.1L17.5 8.5V7.5A5.5 5.5 0 0 0 12 2z"/>
                <path d="M4 16.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
                <path d="M12 16.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
                <path d="M20 16.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
              </svg>
            </div>
            <div class="service-name">温湿度</div>
          </div>
          <div class="service-item" onclick="showForm('farming')">
            <div class="service-icon purple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
              </svg>
            </div>
            <div class="service-name">农事操作</div>
          </div>
        </div>
      </div>

      <div class="card" id="soilForm" style="display: none;">
        <div class="card-title">土壤养分录入</div>
        <div class="form-item">
          <label class="form-label">地块选择</label>
          <div class="form-select" onclick="showPicker(this)">
            <span class="form-select-value">请选择地块</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">采样日期</label>
          <input type="text" class="form-input" placeholder="请选择日期">
        </div>
        <div class="mb-grid mb-grid-2">
          <div class="form-item">
            <label class="form-label">有机质(%)</label>
            <input type="number" class="form-input" placeholder="请输入">
          </div>
          <div class="form-item">
            <label class="form-label">pH值</label>
            <input type="number" class="form-input" placeholder="请输入">
          </div>
          <div class="form-item">
            <label class="form-label">氮含量(g/kg)</label>
            <input type="number" class="form-input" placeholder="请输入">
          </div>
          <div class="form-item">
            <label class="form-label">磷含量(g/kg)</label>
            <input type="number" class="form-input" placeholder="请输入">
          </div>
          <div class="form-item">
            <label class="form-label">钾含量(g/kg)</label>
            <input type="number" class="form-input" placeholder="请输入">
          </div>
          <div class="form-item">
            <label class="form-label">有效钙(mg/kg)</label>
            <input type="number" class="form-input" placeholder="请输入">
          </div>
        </div>
        <button class="btn btn-primary btn-block">提交数据</button>
      </div>

      <div class="card" id="moistureForm" style="display: none;">
        <div class="card-title">墒情录入</div>
        <div class="form-item">
          <label class="form-label">地块选择</label>
          <div class="form-select" onclick="showPicker(this)">
            <span class="form-select-value">请选择地块</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">记录日期</label>
          <input type="text" class="form-input" placeholder="请选择日期">
        </div>
        <div class="form-item">
          <label class="form-label">土壤湿度(%)</label>
          <input type="number" class="form-input" placeholder="请输入">
        </div>
        <div class="form-item">
          <label class="form-label">墒情等级</label>
          <div class="mb-grid mb-grid-3">
            <div style="padding: 8px; text-align: center; border-radius: 8px; background: var(--danger-bg); color: var(--danger); font-size: 12px;">干旱</div>
            <div style="padding: 8px; text-align: center; border-radius: 8px; background: var(--warning-bg); color: var(--warning); font-size: 12px;">适中</div>
            <div style="padding: 8px; text-align: center; border-radius: 8px; background: var(--success-bg); color: var(--success); font-size: 12px;">充足</div>
          </div>
        </div>
        <button class="btn btn-primary btn-block">提交数据</button>
      </div>

      <div class="card" id="weatherForm" style="display: none;">
        <div class="card-title">温湿度录入</div>
        <div class="form-item">
          <label class="form-label">地块选择</label>
          <div class="form-select" onclick="showPicker(this)">
            <span class="form-select-value">请选择地块</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">记录时间</label>
          <input type="text" class="form-input" placeholder="请选择时间">
        </div>
        <div class="mb-grid mb-grid-2">
          <div class="form-item">
            <label class="form-label">空气温度(°C)</label>
            <input type="number" class="form-input" placeholder="请输入">
          </div>
          <div class="form-item">
            <label class="form-label">空气湿度(%)</label>
            <input type="number" class="form-input" placeholder="请输入">
          </div>
          <div class="form-item">
            <label class="form-label">土壤温度(°C)</label>
            <input type="number" class="form-input" placeholder="请输入">
          </div>
          <div class="form-item">
            <label class="form-label">土壤湿度(%)</label>
            <input type="number" class="form-input" placeholder="请输入">
          </div>
        </div>
        <button class="btn btn-primary btn-block">提交数据</button>
      </div>

      <div class="card" id="farmingForm" style="display: none;">
        <div class="card-title">农事操作填报</div>
        <div class="form-item">
          <label class="form-label">地块选择</label>
          <div class="form-select" onclick="showPicker(this)">
            <span class="form-select-value">请选择地块</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">操作日期</label>
          <input type="text" class="form-input" placeholder="请选择日期">
        </div>
        <div class="form-item">
          <label class="form-label">农事类型</label>
          <div class="mb-grid mb-grid-3">
            <div style="padding: 8px; text-align: center; border-radius: 8px; background: var(--bg); font-size: 12px;">施肥</div>
            <div style="padding: 8px; text-align: center; border-radius: 8px; background: var(--bg); font-size: 12px;">灌溉</div>
            <div style="padding: 8px; text-align: center; border-radius: 8px; background: var(--bg); font-size: 12px;">剪枝</div>
            <div style="padding: 8px; text-align: center; border-radius: 8px; background: var(--bg); font-size: 12px;">疏果</div>
            <div style="padding: 8px; text-align: center; border-radius: 8px; background: var(--bg); font-size: 12px;">喷药</div>
            <div style="padding: 8px; text-align: center; border-radius: 8px; background: var(--bg); font-size: 12px;">其他</div>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">操作详情</label>
          <textarea class="form-textarea" placeholder="请输入操作详情..."></textarea>
        </div>
        <button class="btn btn-primary btn-block">提交数据</button>
      </div>
    </div>

    <nav class="tab-bar">
      <a href="mb_home.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>首页</span>
      </a>
      <a href="mb_data.html" class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>数据</span>
      </a>
      <a href="mb_disease.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>病虫害</span>
      </a>
      <a href="mb_news.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>资讯</span>
      </a>
      <a href="mb_profile.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <div class="modal-overlay" id="pickerModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="pickerTitle">请选择</div>
      </div>
      <div class="modal-body" style="max-height: 300px; overflow-y: auto;">
        <div id="pickerContent"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closePicker()">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="successModal">
    <div class="modal modal-success">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div style="font-size: 18px; font-weight: bold; color: var(--text); margin-bottom: 8px;">提交成功</div>
      <div style="font-size: 13px; color: var(--text-secondary);">数据已成功录入系统</div>
      <div class="modal-footer" style="border-top: none; margin-top: 16px;">
        <button class="btn btn-primary btn-block" onclick="closeSuccess()">确定</button>
      </div>
    </div>
  </div>

  <script>
    var currentPickerTarget;
    
    var pickerData = {
      orchard: ['1号早熟蜜桔区', '2号中熟蜜桔区', '3号晚熟蜜桔区', '4号试验田'],
      moistureLevel: ['干旱', '适中', '充足'],
      farmingType: ['施肥', '灌溉', '剪枝', '疏果', '喷药', '其他']
    };
    
    function showForm(type) {
      document.getElementById('soilForm').style.display = 'none';
      document.getElementById('moistureForm').style.display = 'none';
      document.getElementById('weatherForm').style.display = 'none';
      document.getElementById('farmingForm').style.display = 'none';
      document.getElementById(type + 'Form').style.display = 'block';
    }
    
    function showPicker(target) {
      currentPickerTarget = target;
      var title = '请选择地块';
      var data = pickerData.orchard;
      
      if (target.closest('.form-item').querySelector('.form-label').textContent.includes('墒情')) {
        title = '请选择墒情等级';
        data = pickerData.moistureLevel;
      }
      
      document.getElementById('pickerTitle').textContent = title;
      var content = '';
      data.forEach(function(item) {
        content += '<div onclick="selectPickerValue(\'' + item + '\')" style="padding: 12px; border-radius: 8px; background: var(--bg); margin-bottom: 8px; cursor: pointer;">' + item + '</div>';
      });
      document.getElementById('pickerContent').innerHTML = content;
      document.getElementById('pickerModal').classList.add('show');
    }
    
    function selectPickerValue(value) {
      currentPickerTarget.querySelector('.form-select-value').textContent = value;
      currentPickerTarget.querySelector('.form-select-value').style.color = 'var(--text)';
      closePicker();
    }
    
    function closePicker() {
      document.getElementById('pickerModal').classList.remove('show');
    }
    
    function submitData() {
      document.getElementById('successModal').classList.add('show');
    }
    
    function closeSuccess() {
      document.getElementById('successModal').classList.remove('show');
      window.history.back();
    }
    
    document.querySelectorAll('.btn-primary.btn-block').forEach(function(btn) {
      btn.onclick = submitData;
    });
  </script>
</body>
</html>
