<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>南丰蜜桔智慧果园 - 我的</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    .profile-section {
      background: var(--gradient-header);
      padding: calc(var(--safe-top) + 16px) var(--space-4) var(--space-6);
      color: var(--text-on-primary);
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
      box-shadow: var(--shadow-header);
      position: relative;
      overflow: hidden;
    }

    .profile-section::before {
      content: '';
      position: absolute;
      top: -50%; right: -30%;
      width: 200px; height: 200px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      position: relative;
      z-index: 1;
    }

    .avatar-wrapper { position: relative; }

    .avatar {
      width: 72px; height: 72px;
      border-radius: var(--radius-full);
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      border: 3px solid rgba(255,255,255,0.3);
    }

    .avatar svg { width: 36px; height: 36px; color: var(--text-on-primary); }

    .avatar-edit {
      position: absolute; bottom: 0; right: 0;
      width: 28px; height: 28px;
      background: var(--bg-white);
      border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-md);
    }

    .avatar-edit svg { width: 14px; height: 14px; color: var(--primary); }

    .profile-info { flex: 1; }

    .profile-name-row { display: flex; align-items: center; gap: var(--space-2); }

    .profile-name {
      font-size: var(--font-xl);
      font-weight: var(--font-bold);
    }

    .role-tag {
      font-size: var(--font-xs);
      background: rgba(255,255,255,0.25);
      padding: var(--space-0.5) var(--space-2);
      border-radius: var(--radius-full);
    }

    .profile-area {
      font-size: var(--font-sm);
      opacity: 0.85;
      margin-top: var(--space-1);
    }

    .profile-stats {
      display: flex; justify-content: space-around;
      margin-top: var(--space-5);
      padding: var(--space-4) var(--space-2);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-xl);
      position: relative; z-index: 1;
    }

    .stat-item { flex: 1; text-align: center; }

    .stat-num {
      font-size: var(--font-2xl);
      font-weight: var(--font-extrabold);
      font-family: var(--font-family-number);
      background: linear-gradient(135deg, #fff, rgba(255,255,255,0.7));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label { font-size: var(--font-xs); opacity: 0.8; margin-top: var(--space-0.5); }

    .menu-icon.green { background: var(--primary-50); color: var(--primary-700); }
    .menu-icon.blue { background: var(--info-light); color: var(--info-dark); }
    .menu-icon.orange { background: var(--warning-light); color: var(--warning-dark); }
    .menu-icon.red { background: var(--error-light); color: var(--error-dark); }
    .menu-icon.purple { background: var(--purple-bg); color: #7c3aed; }
    .menu-icon.cyan { background: #ecfeff; color: #0e7490; }
    .menu-icon.gray { background: var(--gray-100); color: var(--gray-500); }
    .menu-icon.yellow { background: var(--harvest-50); color: var(--harvest-700); }

    .menu-badge {
      min-width: 22px; height: 22px;
      background: var(--error); color: var(--text-on-primary);
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      font-weight: var(--font-bold);
      display: flex; align-items: center; justify-content: center;
      padding: 0 6px;
      margin-right: var(--space-2);
      animation: pulse 2s infinite;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--bg-overlay);
      z-index: var(--z-modal);
      display: none;
      justify-content: center; align-items: center;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.show { display: flex; }

    .modal-box {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-6) var(--space-5);
      width: 85%; max-width: 320px;
    }

    .modal-title {
      font-size: var(--font-lg); font-weight: var(--font-bold);
      text-align: center; margin-bottom: var(--space-3);
    }

    .modal-content {
      font-size: var(--font-base); color: var(--text-secondary);
      text-align: center; margin-bottom: var(--space-6);
    }

    .modal-btn-group { display: flex; gap: var(--space-3); }

    .modal-btn {
      flex: 1; height: 44px;
      border-radius: var(--radius-full);
      font-size: var(--font-base); font-weight: var(--font-semibold);
      cursor: pointer;
      border: none;
    }

    .modal-btn.cancel { background: var(--gray-100); color: var(--text-secondary); }
    .modal-btn.confirm { background: var(--gradient-primary); color: var(--text-on-primary); }
  </style>
</head>
<body>

          </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">操作提示</div>
      <div class="modal-content" id="modalContent">确定要退出登录吗？</div>
      <div class="modal-btn-group">
        <button class="modal-btn cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn confirm" onclick="doLogout()">确定</button>
      </div>
    </div>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }

    function openModal(title, content) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalContent').textContent = content;
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    function confirmLogout() { openModal('退出登录', '确定要退出登录吗？'); }

    function doLogout() {
      sessionStorage.removeItem('isLoggedIn');
      window.location.href = 'mb_home.html';
    }

    function openProfile() {
      openModal('个人信息', '用户ID：NJ2026001\n角色：地块负责人\n负责区域：南丰县');
    }
  </script>

</html>
