<!DOCTYPE html>

  <title>南丰蜜桔智慧果园 - 我的</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
</head>
<body>
  <div class="mb-app">
    <div class="page-header mb-header-home">
      <div class="header-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>

          <div class="user-name">张三</div>
          <div class="user-role">种植大户 · 已认证</div>
        </div>
        <div style="color: white; opacity: 0.8;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
      </div>

      <div class="card">
        <div class="card-title">服务统计</div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">28</div>
            <div class="stat-label">农事建议</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">15</div>

          </div>
          <div class="stat-card">
            <div class="stat-value">12</div>

          <div class="stat-card">
            <div class="stat-value">126</div>

        </div>
      </div>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

              <circle cx="12" cy="7" r="4"/>

              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">服务记录</div>
            <div class="list-subtitle">农事建议、预警、识别历史</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>

        <div class="list-item" onclick="navigateTo('mb_profile_settings.html')">
          <div class="list-icon orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>

              </svg>
            </div>
            <div class="service-name">AI识别</div>
          </div>
          <div class="service-item" onclick="navigateTo('mb_news_list.html')">
            <div class="service-icon blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">

                <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>

        <div style="font-size: 13px; color: var(--text-secondary); line-height: 1.6;">
          <p>南丰蜜桔智慧果园系统 v1.0</p>
          <p>致力于为种植户提供智能化、精准化的农事管理服务</p>
          <p style="margin-top: 8px; color: var(--text-light); font-size: 12px;">© 2026 南丰县农业农村局</p>
