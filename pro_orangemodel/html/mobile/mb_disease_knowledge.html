<!DOCTYPE html>

</head>
<body>
  <div class="mb-app">
    <div class="page-header mb-header-detail">
      <div class="header-nav">
        <div class="header-back" onclick="window.history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div class="header-title">病虫害知识库</div>

    <div class="content">
      <div class="card">
        <div class="card-title">分类筛选</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">

          <span class="tag tag-danger" onclick="filterType('disease')">病害</span>
          <span class="tag tag-warning" onclick="filterType('pest')">虫害</span>

      <div class="card">
        <div class="card-title">病害（8种）</div>
        <div class="list-item" onclick="showDetail('黄龙病')">

              <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
              <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>

          <div class="list-content">
            <div class="list-title">黄龙病</div>
            <div class="list-subtitle">毁灭性病害 · 高风险</div>

          </div>
        </div>
        <div class="list-item" onclick="showDetail('黑点病')">
          <div class="list-icon red">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
              <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">黑点病</div>
            <div class="list-subtitle">果实病害 · 中风险</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>

        </div>
        <div class="list-item" onclick="showDetail('疮痂病')">
          <div class="list-icon red">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
              <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">疮痂病</div>
            <div class="list-subtitle">叶片病害 · 中风险</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <div class="list-item" onclick="showDetail('黑星病')">
          <div class="list-icon red">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
              <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">黑星病</div>
            <div class="list-subtitle">果实病害 · 中风险</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">虫害（10种）</div>
        <div class="list-item" onclick="showDetail('红蜘蛛')">
          <div class="list-icon orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">红蜘蛛</div>
            <div class="list-subtitle">螨类害虫 · 高风险</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <div class="list-item" onclick="showDetail('柑桔木虱')">
          <div class="list-icon orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">柑桔木虱</div>
            <div class="list-subtitle">黄龙病传播媒介 · 高风险</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <div class="list-item" onclick="showDetail('蚧壳虫')">
          <div class="list-icon orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">蚧壳虫</div>
            <div class="list-subtitle">刺吸式害虫 · 中风险</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <div class="list-item" onclick="showDetail('粉虱')">
          <div class="list-icon orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
          </div>
          <div class="list-content">
            <div class="list-title">粉虱</div>
            <div class="list-subtitle">刺吸式害虫 · 中风险</div>
          </div>
          <div class="list-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      </div>
    </div>

    <nav class="tab-bar">
      <a href="mb_home.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>首页</span>
      </a>
      <a href="mb_data.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>数据</span>
      </a>
      <a href="mb_disease.html" class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>病虫害</span>
      </a>
      <a href="mb_news.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>资讯</span>
      </a>
      <a href="mb_profile.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <div class="modal-overlay" id="detailModal">
    <div class="modal" style="width: 90%; max-width: 360px; max-height: 80vh;">
      <div class="modal-header">
        <div class="modal-title" id="detailTitle">病虫害详情</div>
      </div>
      <div class="modal-body" style="max-height: 50vh; overflow-y: auto;">
        <div id="detailContent"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeDetail()">关闭</button>
        <button class="btn btn-primary" onclick="viewTreatment()">防治方案</button>
      </div>
    </div>
  </div>

  <script>
    var diseaseData = {
      '黄龙病': {
        type: '病害',
        risk: '高风险',
        description: '黄龙病是由韧皮部杆菌引起的毁灭性病害，通过柑桔木虱传播。病树表现为叶片黄化、果实畸形、小果多，严重时整株死亡。',
        symptoms: '1. 叶片黄化，呈斑驳状，黄绿相间\n2. 果实变小、畸形，着色不均\n3. 病树生长衰弱，枝条干枯\n4. 根部腐烂',
        prevention: '1. 严格检疫，杜绝病苗进入\n2. 种植无病苗木\n3. 彻底防治柑桔木虱\n4. 发现病树立即挖除烧毁\n5. 加强果园管理，增强树势'
      },
      '黑点病': {
        type: '病害',
        risk: '中风险',
        description: '黑点病主要危害果实，在果实表面形成黑色小斑点，影响果实外观和商品价值。高温高湿环境易发病。',
        symptoms: '1. 果实表面出现针尖大小的黑色小斑点\n2. 斑点周围有黄色晕圈\n3. 严重时斑点连成一片',
        prevention: '1. 冬季清园，减少病源\n2. 加强通风透光\n3. 药剂防治：谢花后喷代森锰锌等'
      },
      '疮痂病': {
        type: '病害',
        risk: '中风险',
        description: '疮痂病主要危害嫩叶、嫩梢和幼果，导致叶片畸形、果实表面粗糙，影响产量和品质。',
        symptoms: '1. 叶片上出现蜡黄色圆锥形突起\n2. 病斑木栓化，表面粗糙\n3. 幼果表面出现瘤状突起',
        prevention: '1. 冬季清园，剪除病枝\n2. 春梢和幼果期药剂防治\n3. 选用抗病品种'
      },
      '黑星病': {
        type: '病害',
        risk: '中风险',
        description: '黑星病主要危害果实，在果实成熟前后发病，形成黑色星状斑点，严重影响果实外观。',
        symptoms: '1. 果实表面出现圆形黑色斑点\n2. 病斑中心凹陷，周围有褐色晕圈\n3. 潮湿条件下病斑上长出黑色霉层',
        prevention: '1. 加强果园排水\n2. 合理施肥，增强树势\n3. 幼果期药剂防治'
      },
      '红蜘蛛': {
        type: '虫害',
        risk: '高风险',
        description: '红蜘蛛是蜜桔最常见的害虫之一，以刺吸式口器吸食叶片和果实汁液，导致叶片失绿、果实表面出现斑点。',
        symptoms: '1. 叶片出现灰白色小点，逐渐失绿\n2. 严重时叶片苍白脱落\n3. 果实表面出现褐色斑点\n4. 叶片背面有白色丝网',
        prevention: '1. 冬季清园，刮除老皮\n2. 保护天敌（瓢虫、捕食螨等）\n3. 药剂防治：螺螨酯、乙螨唑等\n4. 注意药剂轮换，避免抗药性'
      },
      '柑桔木虱': {
        type: '虫害',
        risk: '高风险',
        description: '柑桔木虱是黄龙病的主要传播媒介，同时也是重要害虫，以成虫和若虫吸食嫩梢汁液。',
        symptoms: '1. 嫩梢叶片卷曲、畸形\n2. 若虫分泌白色蜜露，诱发煤烟病\n3. 严重时嫩梢枯萎',
        prevention: '1. 彻底清除果园周围的芸香科植物\n2. 梢期重点防治\n3. 药剂防治：噻虫嗪、吡虫啉等\n4. 保持树冠通风透光'
      },
      '蚧壳虫': {
        type: '虫害',
        risk: '中风险',
        description: '蚧壳虫种类繁多，主要有红蜡蚧、矢尖蚧、糠片蚧等，以刺吸式口器吸食汁液，分泌蜜露诱发煤烟病。',
        symptoms: '1. 枝条和叶片上出现白色或褐色蚧壳\n2. 叶片发黄、脱落\n3. 枝条衰弱，甚至枯死\n4. 诱发煤烟病',
        prevention: '1. 冬季清园，剪除虫枝\n2. 保护天敌（寄生蜂、瓢虫等）\n3. 药剂防治：噻嗪酮、毒死蜱等\n4. 加强果园通风'
      },
      '粉虱': {
        type: '虫害',
        risk: '中风险',
        description: '粉虱主要有白粉虱和黑刺粉虱，以成虫和若虫吸食叶片汁液，分泌蜜露诱发煤烟病。',
        symptoms: '1. 叶片背面有大量白色或黑色粉虱\n2. 叶片发黄、卷曲\n3. 诱发煤烟病，影响光合作用',
        prevention: '1. 悬挂黄色粘虫板诱杀成虫\n2. 保护天敌（丽蚜小蜂等）\n3. 药剂防治：吡虫啉、啶虫脒等'
      }
    };
    
    function filterType(type) {
      var cards = document.querySelectorAll('.card');
      cards.forEach(function(card) {
        if (card.querySelector('.card-title').textContent.includes('病害') && type === 'disease') {
          card.style.display = 'block';
        } else if (card.querySelector('.card-title').textContent.includes('虫害') && type === 'pest') {
          card.style.display = 'block';
        } else if (type === 'all') {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
      
      document.querySelectorAll('.tag').forEach(function(tag) {
        tag.classList.remove('tag-primary');
        if (tag.textContent === (type === 'all' ? '全部' : type === 'disease' ? '病害' : '虫害')) {
          tag.classList.add('tag-primary');
        }
      });
    }
    
    function showDetail(name) {
      var data = diseaseData[name];
      if (!data) return;
      
      var riskColor = data.risk === '高风险' ? 'var(--danger)' : 'var(--warning)';
      var riskBg = data.risk === '高风险' ? 'var(--danger-bg)' : 'var(--warning-bg)';
      
      document.getElementById('detailTitle').textContent = name;
      document.getElementById('detailContent').innerHTML = `
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
          <span style="padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; background: ${riskBg}; color: ${riskColor};">${data.risk}</span>
          <span style="font-size: 12px; color: var(--text-light);">${data.type}</span>
        </div>
        <div style="margin-bottom: 16px;">
          <div style="font-size: 13px; font-weight: bold; color: var(--text); margin-bottom: 8px;">🔍 病害描述</div>
          <div style="font-size: 13px; color: var(--text-secondary); line-height: 1.6;">${data.description}</div>
        </div>
        <div style="margin-bottom: 16px;">
          <div style="font-size: 13px; font-weight: bold; color: var(--text); margin-bottom: 8px;">📋 症状表现</div>
          <div style="font-size: 13px; color: var(--text-secondary); line-height: 1.6; white-space: pre-line;">${data.symptoms}</div>
        </div>
        <div>
          <div style="font-size: 13px; font-weight: bold; color: var(--text); margin-bottom: 8px;">🌿 防治方法</div>
          <div style="font-size: 13px; color: var(--text-secondary); line-height: 1.6; white-space: pre-line;">${data.prevention}</div>
        </div>
      `;
      
      document.getElementById('detailModal').classList.add('show');
    }
    
    function closeDetail() {
      document.getElementById('detailModal').classList.remove('show');
    }
    
    function viewTreatment() {
      closeDetail();
      window.location.href = 'mb_disease_report.html';
    }
  </script>
</body>
</html>
