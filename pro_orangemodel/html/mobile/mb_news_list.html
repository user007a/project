<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>南丰蜜桔智慧果园 - 农技资讯</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
</head>
<body>
  <div class="mb-app">
    <div class="page-header mb-header-detail">
      <div class="header-nav">
        <div class="header-back" onclick="window.history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div class="header-title">农技资讯</div>
      </div>
      <div class="header-content">
        <div class="header-sub">最新农业技术文章与资讯</div>
      </div>
    </div>

    <div class="content">
      <div style="display: flex; gap: 12px; margin-bottom: 16px;">
        <div style="flex: 1; background: var(--bg-white); border-radius: 12px; padding: 10px 16px; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="color: var(--text-light);">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" placeholder="搜索资讯内容..." style="flex: 1; border: none; outline: none; font-size: 14px; background: transparent;">
        </div>
        <button class="btn btn-primary" onclick="searchNews()">搜索</button>
      </div>

      <div class="card" style="padding: 0;">
        <div style="display: flex; overflow-x: auto; white-space: nowrap; padding: 12px;">
          <div onclick="filterCategory('all')" class="filter-tag active" data-category="all">全部</div>
          <div onclick="filterCategory('disease')" class="filter-tag" data-category="disease">病虫害</div>
          <div onclick="filterCategory('fertilizer')" class="filter-tag" data-category="fertilizer">施肥</div>
          <div onclick="filterCategory('irrigation')" class="filter-tag" data-category="irrigation">灌溉</div>
          <div onclick="filterCategory('weather')" class="filter-tag" data-category="weather">气象</div>
          <div onclick="filterCategory('pruning')" class="filter-tag" data-category="pruning">修剪</div>
        </div>
      </div>

      <div class="card" id="newsContainer">
        <!-- News items will be dynamically generated here -->
      </div>

      <div style="text-align: center; padding: 16px;">
        <button class="btn btn-outline" onclick="loadMore()">加载更多</button>
      </div>
    </div>

    <nav class="tab-bar">
      <a href="mb_home.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>首页</span>
      </a>
      <a href="mb_data.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>数据</span>
      </a>
      <a href="mb_disease.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>病虫害</span>
      </a>
      <a href="mb_news.html" class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>资讯</span>
      </a>
      <a href="mb_profile.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <style>
    .filter-tag {
      display: inline-flex;
      padding: 8px 16px;
      margin-right: 12px;
      background: var(--bg);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-tag.active {
      background: var(--primary);
      color: white;
    }
  </style>

  <script>
    var imgA = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Nanfeng%20tangerine%20summer%20management%20orange%20orchard%20comprehensive%20care&image_size=landscape_4_3';
    var imgB = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Nanfeng%20tangerine%20fruit%20growth%20stage%20fertilization%20orange%20trees&image_size=landscape_4_3';
    var imgC = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Nanfeng%20tangerine%20red%20spider%20mite%20pest%20control%20orange%20tree%20leaves&image_size=landscape_4_3';
    var newsData = [
      { title: '南丰蜜桔夏季病虫害综合防治技术要点', image: imgC, date: '2026-07-22', views: '3258', summary: '高温高湿天气易引发多种病虫害，需加强监测...', category: 'disease' },
      { title: '果实膨大期科学施肥指南', image: imgB, date: '2026-07-21', views: '2196', summary: '根据土壤养分状况，合理搭配氮磷钾肥料...', category: 'fertilizer' },
      { title: '高温天气果园管理注意事项', image: imgA, date: '2026-07-20', views: '1856', summary: '持续高温对蜜桔生长不利，需采取降温措施...', category: 'weather' },
      { title: '精准灌溉技术在蜜桔种植中的应用', image: imgA, date: '2026-07-19', views: '1562', summary: '根据土壤湿度数据，智能控制灌溉时机...', category: 'irrigation' },
      { title: '南丰蜜桔品质提升关键技术', image: imgB, date: '2026-07-18', views: '2081', summary: '通过科学管理，提高蜜桔甜度和外观品质...', category: 'all' },
      { title: '蜜桔夏季高温热害防范与补救措施', image: imgA, date: '2026-07-17', views: '2156', summary: '持续高温影响蜜桔生长，需及时采取降温措施...', category: 'weather' },
      { title: '蜜桔夏季修剪技术要点', image: imgC, date: '2026-07-16', views: '1723', summary: '夏季修剪可改善通风透光，促进果实发育...', category: 'pruning' },
      { title: '红蜘蛛综合防治方案', image: imgC, date: '2026-07-15', views: '2890', summary: '红蜘蛛是夏季主要害虫，需综合防治...', category: 'disease' },
      { title: '叶面喷肥技术详解', image: imgB, date: '2026-07-14', views: '1654', summary: '叶面喷肥可快速补充养分，提高肥料利用率...', category: 'fertilizer' },
      { title: '果园夏季排水管理', image: imgA, date: '2026-07-13', views: '1432', summary: '夏季多雨需加强排水，防止根系积水...', category: 'irrigation' }
    ];
    
    var currentCategory = 'all';
    var currentKeyword = '';
    var currentPage = 1;
    var pageSize = 6;
    
    function renderNews(data) {
      var container = document.getElementById('newsContainer');
      container.innerHTML = '';
      
      data.forEach(function(item) {
        var card = document.createElement('div');
        card.className = 'news-card';
        card.onclick = function() { navigateTo('mb_news_detail.html'); };
        card.innerHTML = `
          <div style="display: flex; gap: 12px;">
            <img src="${item.image}" style="width: 100px; height: 80px; border-radius: 8px; object-fit: cover; flex-shrink: 0;" alt="${item.title}">
            <div style="flex: 1;">
              <div style="font-size: 14px; font-weight: bold; line-height: 1.4;">${item.title}</div>
              <div style="font-size: 12px; color: var(--text-light); margin-top: 8px;">${item.date} · 阅读 ${item.views}</div>
              <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.summary}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }
    
    function navigateTo(page) {
      window.location.href = page;
    }
    
    function searchNews() {
      currentKeyword = document.querySelector('input[placeholder="搜索资讯内容..."]').value.trim();
      currentPage = 1;
      filterAndRender();
    }
    
    function filterCategory(category) {
      currentCategory = category;
      currentPage = 1;
      
      document.querySelectorAll('.filter-tag').forEach(tag => {
        tag.classList.remove('active');
      });
      document.querySelector(`[data-category="${category}"]`).classList.add('active');
      
      filterAndRender();
    }
    
    function filterAndRender() {
      var filtered = newsData.filter(function(item) {
        var matchCategory = currentCategory === 'all' || item.category === currentCategory;
        var matchKeyword = !currentKeyword || item.title.includes(currentKeyword) || item.summary.includes(currentKeyword);
        return matchCategory && matchKeyword;
      });
      
      var start = (currentPage - 1) * pageSize;
      var end = start + pageSize;
      var paginated = filtered.slice(start, end);
      
      renderNews(paginated);
      
      var totalPages = Math.ceil(filtered.length / pageSize);
      var loadBtn = document.querySelector('button[onclick="loadMore()"]');
      if (currentPage >= totalPages || filtered.length === 0) {
        loadBtn.textContent = '暂无更多';
        loadBtn.disabled = true;
        loadBtn.style.opacity = '0.5';
      } else {
        loadBtn.textContent = '加载更多';
        loadBtn.disabled = false;
        loadBtn.style.opacity = '1';
      }
      
      if (filtered.length === 0) {
        document.getElementById('newsContainer').innerHTML = `
          <div style="text-align: center; padding: 40px 20px; color: var(--text-light);">
            <div style="font-size: 48px; margin-bottom: 16px;">🔍</div>
            <div style="font-size: 14px;">没有找到相关资讯</div>
          </div>
        `;
      }
    }
    
    function loadMore() {
      currentPage++;
      filterAndRender();
    }
    
    filterAndRender();
  </script>
</body>
</html>
