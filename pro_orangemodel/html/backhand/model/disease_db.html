<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病害数据库 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
        .content-wrapper { padding: 24px; height: 100vh; overflow-y: auto; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: white; border-radius: 12px; width: 90%; max-width: 700px; max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">病害数据库</h1>
                <p class="text-gray-500 mt-1">管理南丰蜜桔病害知识数据</p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openImportModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    导入病害
                </button>
                <button onclick="exportDiseases()" class="px-4 py-2 bg-gray-600 text-white rounded-lg text-sm hover:bg-gray-700 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    导出病害
                </button>
                <button onclick="openAddModal()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    添加病害
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100">
                <div class="flex items-center space-x-4 flex-wrap">
                    <div class="flex-1 max-w-md">
                        <div class="relative">
                            <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <input type="text" id="search-input" placeholder="搜索病害名称..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" oninput="filterDiseases()">
                        </div>
                    </div>
                    <select id="type-filter" class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="filterDiseases()">
                        <option value="">全部类型</option>
                        <option value="真菌病害">真菌病害</option>
                        <option value="细菌病害">细菌病害</option>
                        <option value="病毒病害">病毒病害</option>
                    </select>
                    <button onclick="resetFilter()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200">重置</button>
                </div>
            </div>

            <div id="disease-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-4">
            </div>

            <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between">
                <p class="text-sm text-gray-500">共 <span id="total-count">20</span> 条记录</p>
                <div class="flex items-center space-x-2">
                    <button onclick="prevPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">上一页</button>
                    <span class="text-sm text-gray-600"><span id="current-page">1</span> / <span id="total-pages">4</span></span>
                    <button onclick="nextPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">下一页</button>
                    <select id="page-size" class="px-3 py-1 border border-gray-300 rounded text-sm" onchange="changePageSize()">
                        <option value="6">6条/页</option>
                        <option value="10">10条/页</option>
                        <option value="20">20条/页</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div id="add-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    添加病害
                </h3>
                <button onclick="closeModal('add-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">病害名称</label>
                        <input type="text" id="add-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请输入病害名称">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">病害类型</label>
                        <select id="add-type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="真菌病害">真菌病害</option>
                            <option value="细菌病害">细菌病害</option>
                            <option value="病毒病害">病毒病害</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">发病温度</label>
                        <input type="text" id="add-temperature" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="例如：25-30°C">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">发病季节</label>
                        <input type="text" id="add-season" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="例如：夏季">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">风险等级</label>
                        <select id="add-risk" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="高风险">高风险</option>
                            <option value="中风险">中风险</option>
                            <option value="低风险">低风险</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">病害描述</label>
                        <textarea id="add-desc" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" rows="3" placeholder="请输入病害描述"></textarea>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('add-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">取消</button>
                <button onclick="saveDisease()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">保存</button>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    编辑病害
                </h3>
                <button onclick="closeModal('edit-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">病害名称</label>
                        <input type="text" id="edit-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">病害类型</label>
                        <select id="edit-type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="真菌病害">真菌病害</option>
                            <option value="细菌病害">细菌病害</option>
                            <option value="病毒病害">病毒病害</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">发病温度</label>
                        <input type="text" id="edit-temperature" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">发病季节</label>
                        <input type="text" id="edit-season" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">风险等级</label>
                        <select id="edit-risk" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="高风险">高风险</option>
                            <option value="中风险">中风险</option>
                            <option value="低风险">低风险</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">病害描述</label>
                        <textarea id="edit-desc" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" rows="3"></textarea>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('edit-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">取消</button>
                <button onclick="updateDisease()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">保存</button>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-6 text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </div>
                <h3 class="text-lg font-semibold text-gray-800 mb-2">确认删除</h3>
                <p class="text-sm text-gray-500 mb-6">确定要删除这条病害数据吗？此操作不可撤销。</p>
                <div class="flex justify-center space-x-3">
                    <button onclick="closeModal('delete-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">取消</button>
                    <button onclick="confirmDelete()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm">确认删除</button>
                </div>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    病害详情
                </h3>
                <button onclick="closeModal('detail-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">病害名称</label>
                        <p class="text-sm font-medium text-gray-800" id="detail-name"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">病害类型</label>
                        <p class="text-sm font-medium text-gray-800" id="detail-type"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">发病温度</label>
                        <p class="text-sm font-medium text-gray-800" id="detail-temperature"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">发病季节</label>
                        <p class="text-sm font-medium text-gray-800" id="detail-season"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">风险等级</label>
                        <p class="text-sm font-medium text-gray-800" id="detail-risk"></p>
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-gray-500 mb-1">病害描述</label>
                    <p class="text-sm text-gray-800" id="detail-desc"></p>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end">
                <button onclick="closeModal('detail-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">关闭</button>
            </div>
        </div>
    </div>

    <div id="import-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    导入病害数据
                </h3>
                <button onclick="closeModal('import-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-green-500 transition cursor-pointer" onclick="document.getElementById('import-file').click()">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    <p class="text-gray-600 mb-2">点击或拖拽文件到此处上传</p>
                    <p class="text-sm text-gray-400">支持 Excel (.xlsx)、CSV 文件</p>
                    <input type="file" id="import-file" accept=".xlsx,.xls,.csv" class="hidden" onchange="handleImportFile(this)">
                </div>
                <div class="mt-4 p-3 bg-blue-50 rounded-lg">
                    <p class="text-sm text-blue-700 flex items-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        导入模板说明：病害名称为必填字段
                    </p>
                </div>
                <div class="mt-4 flex justify-between items-center">
                    <button onclick="downloadTemplate()" class="text-blue-600 hover:text-blue-700 text-sm flex items-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        下载导入模板
                    </button>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('import-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">取消</button>
                <button onclick="submitImport()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">开始导入</button>
            </div>
        </div>
    </div>

    <script>
        const diseases = [
            { id: 'disease-1', name: '黄龙病', type: '病毒病害', temperature: '25-30°C', season: '全年', risk: '高风险', desc: '由黄龙病病菌引起的毁灭性病害，主要通过木虱传播，严重影响蜜桔产量和品质。' },
            { id: 'disease-2', name: '炭疽病', type: '真菌病害', temperature: '28-32°C', season: '夏季', risk: '中风险', desc: '由炭疽菌引起，危害叶片、枝梢和果实，高温高湿条件下易爆发。' },
            { id: 'disease-3', name: '黑点病', type: '真菌病害', temperature: '20-25°C', season: '春季', risk: '中风险', desc: '又称沙皮病，在果实表面形成小黑点，影响外观品质和商品价值。' },
            { id: 'disease-4', name: '溃疡病', type: '细菌病害', temperature: '25-30°C', season: '夏梢期', risk: '高风险', desc: '由细菌引起，在叶片和果实上形成隆起的溃疡斑，影响光合作用和果实品质。' },
            { id: 'disease-5', name: '疮痂病', type: '真菌病害', temperature: '15-25°C', season: '春季', risk: '中风险', desc: '由真菌引起，主要危害幼嫩组织，导致叶片和果实畸形。' },
            { id: 'disease-6', name: '褐斑病', type: '真菌病害', temperature: '22-28°C', season: '秋季', risk: '中风险', desc: '导致叶片出现褐色斑点，严重时造成落叶，影响树势。' },
            { id: 'disease-7', name: '灰霉病', type: '真菌病害', temperature: '15-20°C', season: '冬季', risk: '低风险', desc: '在低温高湿条件下发生，危害花器和幼果，导致落花落果。' },
            { id: 'disease-8', name: '白粉病', type: '真菌病害', temperature: '18-25°C', season: '春末夏初', risk: '低风险', desc: '叶片表面产生白色粉状物，影响光合作用和树体生长。' },
            { id: 'disease-9', name: '煤烟病', type: '真菌病害', temperature: '20-28°C', season: '全年', risk: '低风险', desc: '由蚜虫、介壳虫等害虫分泌的蜜露引起，影响叶片光合作用。' },
            { id: 'disease-10', name: '蒂腐病', type: '真菌病害', temperature: '25-30°C', season: '成熟期', risk: '中风险', desc: '危害果实蒂部，导致果实腐烂，严重影响果实储存和销售。' },
            { id: 'disease-11', name: '黑星病', type: '真菌病害', temperature: '20-25°C', season: '夏季', risk: '中风险', desc: '在果实表面形成黑色星状斑点，影响果实外观和商品价值。' },
            { id: 'disease-12', name: '疫病', type: '真菌病害', temperature: '28-32°C', season: '夏季', risk: '高风险', desc: '高温高湿条件下快速蔓延，导致枝梢枯萎和果实腐烂。' },
            { id: 'disease-13', name: '锈壁虱', type: '真菌病害', temperature: '25-30°C', season: '夏季', risk: '中风险', desc: '危害叶片和果实，导致叶片发黄和果实变黑。' },
            { id: 'disease-14', name: '叶斑病', type: '真菌病害', temperature: '22-26°C', season: '春秋季', risk: '低风险', desc: '叶片出现圆形或不规则斑点，严重时导致落叶。' },
            { id: 'disease-15', name: '轮纹病', type: '真菌病害', temperature: '20-25°C', season: '春季', risk: '中风险', desc: '枝干和果实上形成轮纹状病斑，影响树势和果实品质。' },
            { id: 'disease-16', name: '霉斑病', type: '真菌病害', temperature: '18-22°C', season: '冬季', risk: '低风险', desc: '叶片出现霉斑，影响光合作用效率。' },
            { id: 'disease-17', name: '软腐病', type: '细菌病害', temperature: '25-30°C', season: '夏季', risk: '高风险', desc: '细菌引起的果实腐烂病，高温高湿环境下易爆发。' },
            { id: 'disease-18', name: '青霉病', type: '真菌病害', temperature: '15-20°C', season: '储存期', risk: '中风险', desc: '果实储存期间发生的真菌病害，导致果实腐烂变质。' },
            { id: 'disease-19', name: '绿霉病', type: '真菌病害', temperature: '18-22°C', season: '储存期', risk: '中风险', desc: '与青霉病类似，在果实表面形成绿色霉层。' },
            { id: 'disease-20', name: '衰退病', type: '病毒病害', temperature: '20-25°C', season: '全年', risk: '高风险', desc: '病毒引起的慢性病害，导致树势衰退，产量下降。' }
        ];

        let currentPage = 1;
        let pageSize = 6;
        let currentId = null;
        let filteredDiseases = [...diseases];

        function getTypeColor(type) {
            switch(type) {
                case '真菌病害': return 'bg-orange-100 text-orange-700';
                case '细菌病害': return 'bg-blue-100 text-blue-700';
                case '病毒病害': return 'bg-red-100 text-red-700';
                default: return 'bg-gray-100 text-gray-700';
            }
        }

        function getTypeBgColor(type) {
            switch(type) {
                case '真菌病害': return 'bg-orange-100';
                case '细菌病害': return 'bg-blue-100';
                case '病毒病害': return 'bg-red-100';
                default: return 'bg-gray-100';
            }
        }

        function getRiskColor(risk) {
            switch(risk) {
                case '高风险': return 'text-red-600';
                case '中风险': return 'text-yellow-600';
                case '低风险': return 'text-green-600';
                default: return 'text-gray-600';
            }
        }

        function renderDiseases() {
            const container = document.getElementById('disease-list');
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = filteredDiseases.slice(start, end);

            container.innerHTML = pageData.map(disease => `
                <div class="border border-gray-200 rounded-xl p-4 hover:border-green-300 hover:shadow-md transition" data-id="${disease.id}" data-name="${disease.name}" data-type="${disease.type}" data-temperature="${disease.temperature}" data-season="${disease.season}" data-risk="${disease.risk}" data-desc="${disease.desc}">
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center space-x-3">
                            <div class="w-12 h-12 ${getTypeBgColor(disease.type)} rounded-lg flex items-center justify-center">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7h-9m0 0V5a3 3 0 016 0v2m-6 0a3 3 0 00-6 0v10a3 3 0 006 0m10-3a2 2 0 11-4 0 2 2 0 014 0zM17 10H7m0 0l3-3m-3 3l3 3"/></svg>
                            </div>
                            <div>
                                <h3 class="font-semibold text-gray-800">${disease.name}</h3>
                                <span class="px-2 py-0.5 ${getTypeColor(disease.type)} text-xs rounded">${disease.type}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="openDetailModal('${disease.id}')" class="p-1 text-gray-400 hover:text-blue-600" title="查看详情">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                            <button onclick="openEditModal('${disease.id}')" class="p-1 text-gray-400 hover:text-blue-600" title="编辑">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button onclick="openDeleteModal('${disease.id}')" class="p-1 text-gray-400 hover:text-red-600" title="删除">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </div>
                    <p class="text-sm text-gray-600 mb-3">${disease.desc}</p>
                    <div class="flex items-center space-x-4 text-xs text-gray-500">
                        <span class="flex items-center"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>${disease.temperature}</span>
                        <span class="flex items-center"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>${disease.season}</span>
                        <span class="flex items-center ${getRiskColor(disease.risk)}"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.66 1.732-3L13.732 4c-.77-1.34-2.694-1.34-3.464 0L3.34 16c-.77 1.34.192 3 1.732 3z"/></svg>${disease.risk}</span>
                    </div>
                </div>
            `).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredDiseases.length / pageSize);
            document.getElementById('total-count').textContent = filteredDiseases.length;
            document.getElementById('current-page').textContent = currentPage;
            document.getElementById('total-pages').textContent = totalPages;
        }

        function openAddModal() {
            document.getElementById('add-name').value = '';
            document.getElementById('add-type').value = '真菌病害';
            document.getElementById('add-temperature').value = '';
            document.getElementById('add-season').value = '';
            document.getElementById('add-risk').value = '中风险';
            document.getElementById('add-desc').value = '';
            document.getElementById('add-modal').classList.add('active');
        }

        function openImportModal() {
            document.getElementById('import-file').value = '';
            document.getElementById('import-modal').classList.add('active');
        }

        function handleImportFile(input) {
            const file = input.files[0];
            if (file) {
                alert('已选择文件: ' + file.name);
            }
        }

        function downloadTemplate() {
            const content = '病害名称,病害类型,发病温度,发病季节,风险等级,病害描述\n黄龙病,病毒病害,25-30°C,全年,高风险,由黄龙病病菌引起的毁灭性病害';
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '病害导入模板.csv';
            link.click();
        }

        function submitImport() {
            const file = document.getElementById('import-file').files[0];
            if (!file) {
                alert('请先选择要导入的文件');
                return;
            }
            alert('病害数据导入成功！\n文件: ' + file.name + '\n导入数量: 5 条');
            closeModal('import-modal');
        }

        function exportDiseases() {
            const content = diseases.map(d => `${d.name},${d.type},${d.temperature},${d.season},${d.risk},${d.desc}`).join('\n');
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '病害列表_' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
        }

        function openEditModal(id) {
            currentId = id;
            const card = document.querySelector(`div[data-id="${id}"]`);
            if (card) {
                document.getElementById('edit-name').value = card.getAttribute('data-name');
                document.getElementById('edit-type').value = card.getAttribute('data-type');
                document.getElementById('edit-temperature').value = card.getAttribute('data-temperature');
                document.getElementById('edit-season').value = card.getAttribute('data-season');
                document.getElementById('edit-risk').value = card.getAttribute('data-risk');
                document.getElementById('edit-desc').value = card.getAttribute('data-desc');
            }
            document.getElementById('edit-modal').classList.add('active');
        }

        function openDetailModal(id) {
            const card = document.querySelector(`div[data-id="${id}"]`);
            if (card) {
                document.getElementById('detail-name').textContent = card.getAttribute('data-name');
                document.getElementById('detail-type').textContent = card.getAttribute('data-type');
                document.getElementById('detail-temperature').textContent = card.getAttribute('data-temperature');
                document.getElementById('detail-season').textContent = card.getAttribute('data-season');
                document.getElementById('detail-risk').textContent = card.getAttribute('data-risk');
                document.getElementById('detail-desc').textContent = card.getAttribute('data-desc');
            }
            document.getElementById('detail-modal').classList.add('active');
        }

        function openDeleteModal(id) {
            currentId = id;
            document.getElementById('delete-modal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function saveDisease() {
            const name = document.getElementById('add-name').value;
            if (!name) {
                alert('请填写病害名称');
                return;
            }
            alert('病害数据添加成功！\n名称: ' + name);
            closeModal('add-modal');
        }

        function updateDisease() {
            alert('病害数据更新成功！');
            closeModal('edit-modal');
        }

        function confirmDelete() {
            alert('病害数据删除成功！');
            closeModal('delete-modal');
        }

        function filterDiseases() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const typeFilter = document.getElementById('type-filter').value;
            
            filteredDiseases = diseases.filter(d => {
                const matchesSearch = d.name.toLowerCase().includes(searchTerm) || d.desc.toLowerCase().includes(searchTerm);
                const matchesType = !typeFilter || d.type === typeFilter;
                return matchesSearch && matchesType;
            });
            
            currentPage = 1;
            renderDiseases();
        }

        function resetFilter() {
            document.getElementById('search-input').value = '';
            document.getElementById('type-filter').value = '';
            filteredDiseases = [...diseases];
            currentPage = 1;
            renderDiseases();
        }

        function prevPage() {
            const totalPages = Math.ceil(filteredDiseases.length / pageSize);
            if (currentPage > 1) {
                currentPage--;
                renderDiseases();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredDiseases.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderDiseases();
            }
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('page-size').value);
            currentPage = 1;
            renderDiseases();
        }

        document.addEventListener('click', (e) => {
            ['add-modal', 'edit-modal', 'delete-modal', 'detail-modal', 'import-modal'].forEach(modalId => {
                const modal = document.getElementById(modalId);
                const btn = e.target.closest('[onclick*="' + modalId + '"]');
                if (!modal.contains(e.target) && !btn) {
                    modal.classList.remove('active');
                }
            });
        });

        renderDiseases();
    </script>
</body>
</html>
