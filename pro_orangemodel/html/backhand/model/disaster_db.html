<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灾害数据库 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
        .content-wrapper { padding: 24px; height: 100vh; overflow-y: auto; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: white; border-radius: 12px; width: 90%; max-width: 700px; max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">灾害数据库</h1>
                <p class="text-gray-500 mt-1">管理南丰蜜桔气象灾害知识数据</p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openImportModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    导入灾害
                </button>
                <button onclick="exportDisasters()" class="px-4 py-2 bg-gray-600 text-white rounded-lg text-sm hover:bg-gray-700 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    导出灾害
                </button>
                <button onclick="openAddModal()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    添加灾害
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100">
                <div class="flex items-center space-x-4 flex-wrap">
                    <div class="flex-1 max-w-md">
                        <div class="relative">
                            <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <input type="text" id="search-input" placeholder="搜索灾害名称..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" oninput="filterDisasters()">
                        </div>
                    </div>
                    <select id="type-filter" class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="filterDisasters()">
                        <option value="">全部类型</option>
                        <option value="气象灾害">气象灾害</option>
                        <option value="生物灾害">生物灾害</option>
                        <option value="其他灾害">其他灾害</option>
                    </select>
                    <button onclick="resetFilter()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200">重置</button>
                </div>
            </div>

            <div id="disaster-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-4">
            </div>

            <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between">
                <p class="text-sm text-gray-500">共 <span id="total-count">20</span> 条记录</p>
                <div class="flex items-center space-x-2">
                    <button onclick="prevPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">上一页</button>
                    <span class="text-sm text-gray-600"><span id="current-page">1</span> / <span id="total-pages">4</span></span>
                    <button onclick="nextPage()" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">下一页</button>
                    <select id="page-size" class="px-3 py-1 border border-gray-300 rounded text-sm" onchange="changePageSize()">
                        <option value="6">6条/页</option>
                        <option value="10">10条/页</option>
                        <option value="20">20条/页</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div id="add-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    添加灾害
                </h3>
                <button onclick="closeModal('add-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">灾害名称</label>
                        <input type="text" id="add-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="请输入灾害名称">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">灾害类型</label>
                        <select id="add-type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="气象灾害">气象灾害</option>
                            <option value="生物灾害">生物灾害</option>
                            <option value="其他灾害">其他灾害</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">触发条件</label>
                        <input type="text" id="add-condition" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="例如：温度>35°C">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">高发季节</label>
                        <input type="text" id="add-season" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="例如：7-8月">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">风险等级</label>
                        <select id="add-risk" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="高风险">高风险</option>
                            <option value="中风险">中风险</option>
                            <option value="低风险">低风险</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">灾害描述</label>
                        <textarea id="add-desc" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" rows="3" placeholder="请输入灾害描述"></textarea>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('add-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">取消</button>
                <button onclick="saveDisaster()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">保存</button>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    编辑灾害
                </h3>
                <button onclick="closeModal('edit-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">灾害名称</label>
                        <input type="text" id="edit-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">灾害类型</label>
                        <select id="edit-type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="气象灾害">气象灾害</option>
                            <option value="生物灾害">生物灾害</option>
                            <option value="其他灾害">其他灾害</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">触发条件</label>
                        <input type="text" id="edit-condition" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">高发季节</label>
                        <input type="text" id="edit-season" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">风险等级</label>
                        <select id="edit-risk" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="高风险">高风险</option>
                            <option value="中风险">中风险</option>
                            <option value="低风险">低风险</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">灾害描述</label>
                        <textarea id="edit-desc" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" rows="3"></textarea>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('edit-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">取消</button>
                <button onclick="updateDisaster()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">保存</button>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-6 text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </div>
                <h3 class="text-lg font-semibold text-gray-800 mb-2">确认删除</h3>
                <p class="text-sm text-gray-500 mb-6">确定要删除这条灾害数据吗？此操作不可撤销。</p>
                <div class="flex justify-center space-x-3">
                    <button onclick="closeModal('delete-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">取消</button>
                    <button onclick="confirmDelete()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm">确认删除</button>
                </div>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    灾害详情
                </h3>
                <button onclick="closeModal('detail-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">灾害名称</label>
                        <p class="text-sm font-medium text-gray-800" id="detail-name"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">灾害类型</label>
                        <p class="text-sm font-medium text-gray-800" id="detail-type"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">触发条件</label>
                        <p class="text-sm font-medium text-gray-800" id="detail-condition"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">高发季节</label>
                        <p class="text-sm font-medium text-gray-800" id="detail-season"></p>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">风险等级</label>
                        <p class="text-sm font-medium text-gray-800" id="detail-risk"></p>
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-gray-500 mb-1">灾害描述</label>
                    <p class="text-sm text-gray-800" id="detail-desc"></p>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end">
                <button onclick="closeModal('detail-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">关闭</button>
            </div>
        </div>
    </div>

    <div id="import-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    导入灾害数据
                </h3>
                <button onclick="closeModal('import-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6">
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-green-500 transition cursor-pointer" onclick="document.getElementById('import-file').click()">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    <p class="text-gray-600 mb-2">点击或拖拽文件到此处上传</p>
                    <p class="text-sm text-gray-400">支持 Excel (.xlsx)、CSV 文件</p>
                    <input type="file" id="import-file" accept=".xlsx,.xls,.csv" class="hidden" onchange="handleImportFile(this)">
                </div>
                <div class="mt-4 p-3 bg-blue-50 rounded-lg">
                    <p class="text-sm text-blue-700 flex items-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        导入模板说明：灾害名称为必填字段
                    </p>
                </div>
                <div class="mt-4 flex justify-between items-center">
                    <button onclick="downloadTemplate()" class="text-blue-600 hover:text-blue-700 text-sm flex items-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        下载导入模板
                    </button>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal('import-modal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">取消</button>
                <button onclick="submitImport()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">开始导入</button>
            </div>
        </div>
    </div>

    <script>
        const disasters = [
            { id: 'disaster-1', name: '高温热害', type: '气象灾害', condition: '>35°C', season: '7-8月', risk: '高风险', desc: '持续高温导致果实日灼、落果，影响果实品质和产量，7-8月高发。' },
            { id: 'disaster-2', name: '暴雨洪涝', type: '气象灾害', condition: '>100mm/日', season: '6-7月', risk: '中风险', desc: '短时强降雨导致果园积水、根系缺氧，诱发病害发生，夏季汛期高发。' },
            { id: 'disaster-3', name: '干旱缺水', type: '气象灾害', condition: '<20mm/月', season: '7-9月', risk: '高风险', desc: '持续无雨导致土壤缺水，叶片卷曲、果实发育迟缓，影响产量和品质。' },
            { id: 'disaster-4', name: '台风灾害', type: '气象灾害', condition: '>8级', season: '8-9月', risk: '中风险', desc: '强风导致树枝折断、果实掉落，伴随暴雨引发山洪和泥石流，8-9月高发。' },
            { id: 'disaster-5', name: '低温冷害', type: '气象灾害', condition: '<5°C', season: '12-2月', risk: '中风险', desc: '低温影响花芽分化和开花，导致落花落果，冬季高发。' },
            { id: 'disaster-6', name: '寒潮冻害', type: '气象灾害', condition: '<-5°C', season: '1-2月', risk: '高风险', desc: '极端低温导致树体冻害、枝条冻死，严重影响来年产量。' },
            { id: 'disaster-7', name: '冰雹灾害', type: '气象灾害', condition: '冰雹天气', season: '3-4月', risk: '中风险', desc: '冰雹击打叶片和果实，造成机械损伤，影响树势和果实品质。' },
            { id: 'disaster-8', name: '大风灾害', type: '气象灾害', condition: '>6级', season: '4-5月', risk: '低风险', desc: '大风导致枝条摇摆、果实掉落，春季高发。' },
            { id: 'disaster-9', name: '雷电灾害', type: '气象灾害', condition: '雷暴天气', season: '4-9月', risk: '低风险', desc: '雷电击伤树体，引发火灾，夏季雷暴期高发。' },
            { id: 'disaster-10', name: '连阴雨', type: '气象灾害', condition: '>7天', season: '3-4月', risk: '中风险', desc: '持续阴雨导致光照不足、病害滋生，影响授粉和坐果。' },
            { id: 'disaster-11', name: '倒春寒', type: '气象灾害', condition: '<10°C', season: '3-4月', risk: '高风险', desc: '春季气温骤降影响开花授粉，导致落花落果。' },
            { id: 'disaster-12', name: '秋旱', type: '气象灾害', condition: '<30mm/月', season: '9-10月', risk: '中风险', desc: '秋季干旱影响果实成熟和糖分积累，降低果实品质。' },
            { id: 'disaster-13', name: '寒露风', type: '气象灾害', condition: '<15°C', season: '10月', risk: '低风险', desc: '秋季低温影响晚熟品种成熟，导致果实品质下降。' },
            { id: 'disaster-14', name: '洪涝灾害', type: '气象灾害', condition: '水位>50cm', season: '6-7月', risk: '高风险', desc: '长时间积水导致根系腐烂，树体死亡。' },
            { id: 'disaster-15', name: '山体滑坡', type: '其他灾害', condition: '降雨>200mm', season: '6-7月', risk: '高风险', desc: '暴雨引发山体滑坡，摧毁果园设施，威胁人身安全。' },
            { id: 'disaster-16', name: '泥石流', type: '其他灾害', condition: '暴雨+地形', season: '6-7月', risk: '高风险', desc: '泥石流冲刷果园，造成毁灭性损失。' },
            { id: 'disaster-17', name: '鼠害', type: '生物灾害', condition: '密度>10只/亩', season: '全年', risk: '低风险', desc: '田鼠啃食根系和果实，造成损失。' },
            { id: 'disaster-18', name: '鸟害', type: '生物灾害', condition: '果实成熟期', season: '9-11月', risk: '低风险', desc: '鸟类啄食成熟果实，影响商品价值。' },
            { id: 'disaster-19', name: '草害', type: '生物灾害', condition: '覆盖率>30%', season: '全年', risk: '低风险', desc: '杂草争夺水分和养分，影响树体生长。' },
            { id: 'disaster-20', name: '霜冻', type: '气象灾害', condition: '<0°C', season: '12-2月', risk: '中风险', desc: '霜冻导致叶片和幼果冻伤，影响产量。' }
        ];

        let currentPage = 1;
        let pageSize = 6;
        let currentId = null;
        let filteredDisasters = [...disasters];

        function getTypeColor(type) {
            switch(type) {
                case '气象灾害': return 'bg-red-100 text-red-700';
                case '生物灾害': return 'bg-green-100 text-green-700';
                default: return 'bg-purple-100 text-purple-700';
            }
        }

        function getTypeBgColor(type) {
            switch(type) {
                case '气象灾害': return 'bg-red-100';
                case '生物灾害': return 'bg-green-100';
                default: return 'bg-purple-100';
            }
        }

        function getRiskColor(risk) {
            switch(risk) {
                case '高风险': return 'text-red-600';
                case '中风险': return 'text-yellow-600';
                case '低风险': return 'text-green-600';
                default: return 'text-gray-600';
            }
        }

        function renderDisasters() {
            const container = document.getElementById('disaster-list');
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = filteredDisasters.slice(start, end);

            container.innerHTML = pageData.map(disaster => `
                <div class="border border-gray-200 rounded-xl p-4 hover:border-green-300 hover:shadow-md transition" data-id="${disaster.id}" data-name="${disaster.name}" data-type="${disaster.type}" data-condition="${disaster.condition}" data-season="${disaster.season}" data-risk="${disaster.risk}" data-desc="${disaster.desc}">
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center space-x-3">
                            <div class="w-12 h-12 ${getTypeBgColor(disaster.type)} rounded-lg flex items-center justify-center">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7h-9m0 0V5a3 3 0 016 0v2m-6 0a3 3 0 00-6 0v10a3 3 0 006 0m10-3a2 2 0 11-4 0 2 2 0 014 0zM17 10H7m0 0l3-3m-3 3l3 3"/></svg>
                            </div>
                            <div>
                                <h3 class="font-semibold text-gray-800">${disaster.name}</h3>
                                <span class="px-2 py-0.5 ${getTypeColor(disaster.type)} text-xs rounded">${disaster.type}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="openDetailModal('${disaster.id}')" class="p-1 text-gray-400 hover:text-blue-600" title="查看详情">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                            <button onclick="openEditModal('${disaster.id}')" class="p-1 text-gray-400 hover:text-blue-600" title="编辑">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button onclick="openDeleteModal('${disaster.id}')" class="p-1 text-gray-400 hover:text-red-600" title="删除">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </div>
                    <p class="text-sm text-gray-600 mb-3">${disaster.desc}</p>
                    <div class="flex items-center space-x-4 text-xs text-gray-500">
                        <span class="flex items-center"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>${disaster.condition}</span>
                        <span class="flex items-center"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>${disaster.season}</span>
                        <span class="flex items-center ${getRiskColor(disaster.risk)}"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.66 1.732-3L13.732 4c-.77-1.34-2.694-1.34-3.464 0L3.34 16c-.77 1.34.192 3 1.732 3z"/></svg>${disaster.risk}</span>
                    </div>
                </div>
            `).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredDisasters.length / pageSize);
            document.getElementById('total-count').textContent = filteredDisasters.length;
            document.getElementById('current-page').textContent = currentPage;
            document.getElementById('total-pages').textContent = totalPages;
        }

        function openAddModal() {
            document.getElementById('add-name').value = '';
            document.getElementById('add-type').value = '气象灾害';
            document.getElementById('add-condition').value = '';
            document.getElementById('add-season').value = '';
            document.getElementById('add-risk').value = '中风险';
            document.getElementById('add-desc').value = '';
            document.getElementById('add-modal').classList.add('active');
        }

        function openImportModal() {
            document.getElementById('import-file').value = '';
            document.getElementById('import-modal').classList.add('active');
        }

        function handleImportFile(input) {
            const file = input.files[0];
            if (file) {
                alert('已选择文件: ' + file.name);
            }
        }

        function downloadTemplate() {
            const content = '灾害名称,灾害类型,触发条件,高发季节,风险等级,灾害描述\n高温热害,气象灾害,>35°C,7-8月,高风险,持续高温导致果实日灼';
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '灾害导入模板.csv';
            link.click();
        }

        function submitImport() {
            const file = document.getElementById('import-file').files[0];
            if (!file) {
                alert('请先选择要导入的文件');
                return;
            }
            alert('灾害数据导入成功！\n文件: ' + file.name + '\n导入数量: 5 条');
            closeModal('import-modal');
        }

        function exportDisasters() {
            const content = disasters.map(d => `${d.name},${d.type},${d.condition},${d.season},${d.risk},${d.desc}`).join('\n');
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '灾害列表_' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
        }

        function openEditModal(id) {
            currentId = id;
            const card = document.querySelector(`div[data-id="${id}"]`);
            if (card) {
                document.getElementById('edit-name').value = card.getAttribute('data-name');
                document.getElementById('edit-type').value = card.getAttribute('data-type');
                document.getElementById('edit-condition').value = card.getAttribute('data-condition');
                document.getElementById('edit-season').value = card.getAttribute('data-season');
                document.getElementById('edit-risk').value = card.getAttribute('data-risk');
                document.getElementById('edit-desc').value = card.getAttribute('data-desc');
            }
            document.getElementById('edit-modal').classList.add('active');
        }

        function openDetailModal(id) {
            const card = document.querySelector(`div[data-id="${id}"]`);
            if (card) {
                document.getElementById('detail-name').textContent = card.getAttribute('data-name');
                document.getElementById('detail-type').textContent = card.getAttribute('data-type');
                document.getElementById('detail-condition').textContent = card.getAttribute('data-condition');
                document.getElementById('detail-season').textContent = card.getAttribute('data-season');
                document.getElementById('detail-risk').textContent = card.getAttribute('data-risk');
                document.getElementById('detail-desc').textContent = card.getAttribute('data-desc');
            }
            document.getElementById('detail-modal').classList.add('active');
        }

        function openDeleteModal(id) {
            currentId = id;
            document.getElementById('delete-modal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function saveDisaster() {
            const name = document.getElementById('add-name').value;
            if (!name) {
                alert('请填写灾害名称');
                return;
            }
            alert('灾害数据添加成功！\n名称: ' + name);
            closeModal('add-modal');
        }

        function updateDisaster() {
            alert('灾害数据更新成功！');
            closeModal('edit-modal');
        }

        function confirmDelete() {
            alert('灾害数据删除成功！');
            closeModal('delete-modal');
        }

        function filterDisasters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const typeFilter = document.getElementById('type-filter').value;
            
            filteredDisasters = disasters.filter(d => {
                const matchesSearch = d.name.toLowerCase().includes(searchTerm) || d.desc.toLowerCase().includes(searchTerm);
                const matchesType = !typeFilter || d.type === typeFilter;
                return matchesSearch && matchesType;
            });
            
            currentPage = 1;
            renderDisasters();
        }

        function resetFilter() {
            document.getElementById('search-input').value = '';
            document.getElementById('type-filter').value = '';
            filteredDisasters = [...disasters];
            currentPage = 1;
            renderDisasters();
        }

        function prevPage() {
            const totalPages = Math.ceil(filteredDisasters.length / pageSize);
            if (currentPage > 1) {
                currentPage--;
                renderDisasters();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredDisasters.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderDisasters();
            }
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('page-size').value);
            currentPage = 1;
            renderDisasters();
        }

        document.addEventListener('click', (e) => {
            ['add-modal', 'edit-modal', 'delete-modal', 'detail-modal', 'import-modal'].forEach(modalId => {
                const modal = document.getElementById(modalId);
                const btn = e.target.closest('[onclick*="' + modalId + '"]');
                if (!modal.contains(e.target) && !btn) {
                    modal.classList.remove('active');
                }
            });
        });

        renderDisasters();
    </script>
</body>
</html>
