<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墒情数据库 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; overflow: visible !important; }
        .content-wrapper { padding: 24px; min-height: 100%; overflow: visible !important; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); z-index: 9999; align-items: center; justify-content: center; overflow: auto; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: white; border-radius: 12px; width: 95%; max-width: 1100px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">墒情数据库</h1>
                <p class="text-gray-500 mt-1">土壤墒情监测数据管理</p>
            </div>
            <div class="flex items-center space-x-3">
                <input type="text" id="search-input" placeholder="搜索站点名称..." class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500 w-48" oninput="filterStations()">
                <select id="status-filter" class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onchange="filterStations()">
                    <option value="">全部状态</option>
                    <option value="正常">正常</option>
                    <option value="偏干">偏干</option>
                    <option value="干旱">干旱</option>
                    <option value="偏湿">偏湿</option>
                </select>
                <button onclick="refreshData()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 transition flex items-center">
                    <iconify-icon icon="material-symbols:refresh" class="w-4 h-4 mr-1"></iconify-icon>
                    刷新数据
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">监测站点</p>
                        <h3 class="text-2xl font-bold text-gray-800 mt-1">12</h3>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <iconify-icon icon="material-symbols:location-on" class="w-6 h-6 text-blue-500"></iconify-icon>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">平均墒情</p>
                        <h3 class="text-2xl font-bold text-green-600 mt-1">45.5%</h3>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <iconify-icon icon="material-symbols:water" class="w-6 h-6 text-green-500"></iconify-icon>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">正常站点</p>
                        <h3 class="text-2xl font-bold text-blue-600 mt-1">8</h3>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <iconify-icon icon="material-symbols:check-circle" class="w-6 h-6 text-blue-500"></iconify-icon>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">预警站点</p>
                        <h3 class="text-2xl font-bold text-orange-600 mt-1">4</h3>
                    </div>
                    <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center">
                        <iconify-icon icon="material-symbols:alert-triangle" class="w-6 h-6 text-orange-500"></iconify-icon>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <iconify-icon icon="material-symbols:line-chart" class="w-5 h-5 mr-2 text-green-600"></iconify-icon>
                    墒情变化趋势
                </h3>
                <div class="h-80">
                    <canvas id="moistureTrendChart"></canvas>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <iconify-icon icon="material-symbols:pie-chart" class="w-5 h-5 mr-2 text-purple-600"></iconify-icon>
                    墒情分布统计
                </h3>
                <div class="h-80">
                    <canvas id="moisturePieChart"></canvas>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100">
            <div class="px-6 py-4 border-b border-gray-100">
                <h3 class="text-lg font-semibold text-gray-800">墒情监测站点列表</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">站点名称</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">位置</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">墒情值</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">墒情等级</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">pH值</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">有机质</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">氮含量</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">磷含量</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">钾含量</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">采样时间</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="station-table-body" class="divide-y divide-gray-100">
                    </tbody>
                </table>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between">
                <div class="text-sm text-gray-500">显示 <span id="page-size">10</span> 条，共 <span id="total-count">0</span> 条</div>
                <div class="flex items-center space-x-2">
                    <button onclick="prevPage()" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50" id="prev-btn">上一页</button>
                    <span id="page-info" class="text-sm text-gray-600">第 1 页 / 共 1 页</span>
                    <button onclick="nextPage()" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50" id="next-btn">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="detail-modal">
        <div class="modal-content">
            <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800" id="modal-title">站点详情</h3>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600">
                    <iconify-icon icon="material-symbols:close" class="w-6 h-6"></iconify-icon>
                </button>
            </div>
            <div class="p-6">
                <div class="flex items-center justify-between mb-6 p-4 bg-gradient-to-r from-green-50 to-blue-50 rounded-xl">
                    <div>
                        <h4 class="text-lg font-semibold text-gray-800" id="detail-name">-</h4>
                        <p class="text-gray-500 text-sm mt-1 flex items-center">
                            <iconify-icon icon="material-symbols:location-on" class="w-4 h-4 mr-1"></iconify-icon>
                            <span id="detail-location">-</span>
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-gray-500 text-xs">采样时间</p>
                        <p class="text-gray-700 font-medium text-sm" id="detail-sample-time">-</p>
                    </div>
                </div>

                <div class="mb-6">
                    <h4 class="text-sm font-semibold text-gray-800 mb-3 flex items-center">
                        <iconify-icon icon="material-symbols:droplet" class="w-4 h-4 mr-2 text-blue-500"></iconify-icon>
                        墒情状态
                    </h4>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="bg-blue-50 rounded-xl p-4 text-center">
                            <p class="text-blue-500 text-xs mb-1">当前墒情</p>
                            <p class="text-2xl font-bold text-blue-600" id="detail-moisture">-</p>
                        </div>
                        <div class="rounded-xl p-4 text-center" id="detail-level-card">
                            <p class="text-gray-500 text-xs mb-1">墒情等级</p>
                            <p class="text-xl font-bold" id="detail-level">-</p>
                        </div>
                        <div class="bg-orange-50 rounded-xl p-4 text-center">
                            <p class="text-orange-500 text-xs mb-1">土壤类型</p>
                            <p class="text-lg font-semibold text-orange-700" id="detail-soil-type">-</p>
                        </div>
                    </div>
                </div>

                <div class="mb-6">
                    <h4 class="text-sm font-semibold text-gray-800 mb-3 flex items-center">
                        <iconify-icon icon="material-symbols:flask" class="w-4 h-4 mr-2 text-purple-500"></iconify-icon>
                        土壤养分
                    </h4>
                    <div class="grid grid-cols-5 gap-3">
                        <div class="bg-gray-50 rounded-lg p-3 text-center">
                            <p class="text-gray-400 text-xs">pH值</p>
                            <p class="text-lg font-semibold text-gray-800 mt-1" id="detail-ph">-</p>
                        </div>
                        <div class="bg-gray-50 rounded-lg p-3 text-center">
                            <p class="text-gray-400 text-xs">有机质</p>
                            <p class="text-lg font-semibold text-gray-800 mt-1" id="detail-organic">-</p>
                        </div>
                        <div class="bg-gray-50 rounded-lg p-3 text-center">
                            <p class="text-gray-400 text-xs">氮含量</p>
                            <p class="text-lg font-semibold text-gray-800 mt-1" id="detail-nitrogen">-</p>
                        </div>
                        <div class="bg-gray-50 rounded-lg p-3 text-center">
                            <p class="text-gray-400 text-xs">磷含量</p>
                            <p class="text-lg font-semibold text-gray-800 mt-1" id="detail-phosphorus">-</p>
                        </div>
                        <div class="bg-gray-50 rounded-lg p-3 text-center">
                            <p class="text-gray-400 text-xs">钾含量</p>
                            <p class="text-lg font-semibold text-gray-800 mt-1" id="detail-potassium">-</p>
                        </div>
                    </div>
                </div>

                <div class="bg-gradient-to-br from-gray-50 to-gray-100 rounded-xl p-5 border border-gray-100">
                    <h4 class="text-sm font-semibold text-gray-800 mb-4 flex items-center">
                        <iconify-icon icon="material-symbols:trending-up" class="w-4 h-4 mr-2 text-green-500"></iconify-icon>
                        墒情趋势图
                    </h4>
                    <div class="bg-white rounded-lg p-2 h-64 shadow-sm">
                        <canvas id="detail-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const mockStations = [
            { id: 1, name: '太和镇监测站', location: '太和镇太和村', moisture: 35, level: '偏干', soilType: '壤土', ph: 6.5, organic: 2.1, nitrogen: 1.2, phosphorus: 0.8, potassium: 150, sampleTime: '2026-07-25 14:30:00' },
            { id: 2, name: '桑田镇监测站', location: '桑田镇桑田村', moisture: 48, level: '正常', soilType: '砂壤土', ph: 6.8, organic: 2.5, nitrogen: 1.5, phosphorus: 1.0, potassium: 180, sampleTime: '2026-07-25 14:25:00' },
            { id: 3, name: '市山镇监测站', location: '市山镇市山村', moisture: 55, level: '正常', soilType: '黏土', ph: 6.2, organic: 3.0, nitrogen: 1.8, phosphorus: 1.2, potassium: 200, sampleTime: '2026-07-25 14:20:00' },
            { id: 4, name: '白舍镇监测站', location: '白舍镇白舍村', moisture: 28, level: '干旱', soilType: '砂土', ph: 7.0, organic: 1.8, nitrogen: 1.0, phosphorus: 0.6, potassium: 120, sampleTime: '2026-07-25 14:15:00' },
            { id: 5, name: '三溪乡监测站', location: '三溪乡三溪村', moisture: 62, level: '正常', soilType: '壤土', ph: 6.6, organic: 2.8, nitrogen: 2.0, phosphorus: 1.5, potassium: 220, sampleTime: '2026-07-25 14:10:00' },
            { id: 6, name: '洽湾镇监测站', location: '洽湾镇洽湾村', moisture: 70, level: '偏湿', soilType: '黏土', ph: 6.4, organic: 3.2, nitrogen: 2.2, phosphorus: 1.8, potassium: 250, sampleTime: '2026-07-25 14:05:00' },
            { id: 7, name: '东坪乡监测站', location: '东坪乡东坪村', moisture: 42, level: '正常', soilType: '砂壤土', ph: 6.7, organic: 2.3, nitrogen: 1.4, phosphorus: 0.9, potassium: 160, sampleTime: '2026-07-25 14:00:00' },
            { id: 8, name: '莱溪乡监测站', location: '莱溪乡莱溪村', moisture: 38, level: '偏干', soilType: '壤土', ph: 6.3, organic: 2.0, nitrogen: 1.3, phosphorus: 0.7, potassium: 140, sampleTime: '2026-07-25 13:55:00' },
            { id: 9, name: '太源乡监测站', location: '太源乡太源村', moisture: 50, level: '正常', soilType: '黏土', ph: 6.9, organic: 2.6, nitrogen: 1.6, phosphorus: 1.1, potassium: 190, sampleTime: '2026-07-25 13:50:00' },
            { id: 10, name: '傅坊乡监测站', location: '傅坊乡傅坊村', moisture: 25, level: '干旱', soilType: '砂土', ph: 7.2, organic: 1.5, nitrogen: 0.8, phosphorus: 0.5, potassium: 100, sampleTime: '2026-07-25 13:45:00' },
            { id: 11, name: '紫霄镇监测站', location: '紫霄镇紫霄村', moisture: 58, level: '正常', soilType: '壤土', ph: 6.5, organic: 2.7, nitrogen: 1.9, phosphorus: 1.4, potassium: 210, sampleTime: '2026-07-25 13:40:00' },
            { id: 12, name: '南丰县监测站', location: '南丰县琴城镇', moisture: 65, level: '偏湿', soilType: '砂壤土', ph: 6.6, organic: 2.9, nitrogen: 2.1, phosphorus: 1.6, potassium: 230, sampleTime: '2026-07-25 13:35:00' }
        ];

        let currentPage = 1;
        const pageSize = 10;
        let filteredStations = [...mockStations];
        let detailChartInstance = null;

        function getLevelClass(level) {
            switch(level) {
                case '正常': return 'bg-green-100 text-green-700';
                case '偏干': return 'bg-yellow-100 text-yellow-700';
                case '干旱': return 'bg-red-100 text-red-700';
                case '偏湿': return 'bg-blue-100 text-blue-700';
                default: return 'bg-gray-100 text-gray-700';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('station-table-body');
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const data = filteredStations.slice(start, end);

            tbody.innerHTML = data.map(station => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${station.name}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-500">${station.location}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${station.moisture}%</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${getLevelClass(station.level)}">${station.level}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${station.ph}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${station.organic}%</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${station.nitrogen}g/kg</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${station.phosphorus}g/kg</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${station.potassium}mg/kg</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-500">${station.sampleTime}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <button onclick="viewStation(${station.id})" class="text-blue-600 hover:text-blue-900 mr-3">查看</button>
                    </td>
                </tr>
            `).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredStations.length / pageSize);
            document.getElementById('total-count').textContent = filteredStations.length;
            document.getElementById('page-info').textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === totalPages;
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredStations.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        }

        function filterStations() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const status = document.getElementById('status-filter').value;
            
            filteredStations = mockStations.filter(s => {
                const matchSearch = s.name.toLowerCase().includes(search) || s.location.toLowerCase().includes(search);
                const matchStatus = !status || s.level === status;
                return matchSearch && matchStatus;
            });
            
            currentPage = 1;
            renderTable();
        }

        function refreshData() {
            document.getElementById('search-input').value = '';
            document.getElementById('status-filter').value = '';
            filteredStations = [...mockStations];
            currentPage = 1;
            renderTable();
        }

        function viewStation(id) {
            const station = mockStations.find(s => s.id === id);
            if (!station) return;

            document.getElementById('modal-title').textContent = station.name + ' - 详情';
            document.getElementById('detail-name').textContent = station.name;
            document.getElementById('detail-location').textContent = station.location;
            document.getElementById('detail-moisture').textContent = station.moisture + '%';
            document.getElementById('detail-soil-type').textContent = station.soilType;
            document.getElementById('detail-ph').textContent = station.ph;
            document.getElementById('detail-organic').textContent = station.organic + '%';
            document.getElementById('detail-nitrogen').textContent = station.nitrogen + 'g/kg';
            document.getElementById('detail-phosphorus').textContent = station.phosphorus + 'g/kg';
            document.getElementById('detail-potassium').textContent = station.potassium + 'mg/kg';
            document.getElementById('detail-sample-time').textContent = station.sampleTime;

            const levelCard = document.getElementById('detail-level-card');
            const levelText = document.getElementById('detail-level');
            levelText.textContent = station.level;
            
            levelCard.className = 'rounded-xl p-4 text-center';
            levelText.className = 'text-xl font-bold';
            
            switch(station.level) {
                case '正常':
                    levelCard.classList.add('bg-green-50');
                    levelText.classList.add('text-green-600');
                    break;
                case '偏干':
                    levelCard.classList.add('bg-yellow-50');
                    levelText.classList.add('text-yellow-600');
                    break;
                case '干旱':
                    levelCard.classList.add('bg-red-50');
                    levelText.classList.add('text-red-600');
                    break;
                case '偏湿':
                    levelCard.classList.add('bg-blue-50');
                    levelText.classList.add('text-blue-600');
                    break;
                default:
                    levelCard.classList.add('bg-gray-50');
                    levelText.classList.add('text-gray-600');
            }

            document.getElementById('detail-modal').classList.add('active');
            renderDetailChart(station);
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        function renderDetailChart(station) {
            const ctx = document.getElementById('detail-chart').getContext('2d');
            const hours = ['08:00', '10:00', '12:00', '14:00', '16:00', '18:00'];
            const moistureData = [station.moisture - 5, station.moisture - 3, station.moisture, station.moisture + 2, station.moisture, station.moisture - 1];

            if (detailChartInstance) {
                detailChartInstance.destroy();
            }

            detailChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: hours,
                    datasets: [{
                        label: '墒情(%)',
                        data: moistureData,
                        borderColor: '#10B981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: false, min: 20, max: 80 }
                    }
                }
            });
        }

        function initCharts() {
