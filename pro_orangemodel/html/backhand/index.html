        <button class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-50 flex items-center">

    <div id="notification-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">

                <button onclick="closeModal('notification-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <iconify-icon icon="material-symbols:close" class="w-5 h-5 text-gray-500"></iconify-icon>
                </button>
            </div>
            <div class="p-4 space-y-3">
                <div class="notification-item p-3 bg-red-50 rounded-lg border border-red-100">
                    <div class="flex items-start">
                        <iconify-icon icon="material-symbols:warning" class="w-5 h-5 text-red-500 mr-2 flex-shrink-0"></iconify-icon>
                        <div>
                            <p class="font-medium text-gray-800">高温热害预警</p>
                            <p class="text-sm text-gray-500 mt-1">未来3天最高气温将达35°C以上，请做好防暑降温措施</p>
                            <p class="text-xs text-gray-400 mt-2">2026-07-22 10:30</p>
                        </div>
                    </div>
                </div>
                <div class="notification-item p-3 bg-orange-50 rounded-lg border border-orange-100">
                    <div class="flex items-start">
                        <iconify-icon icon="material-symbols:alert-circle" class="w-5 h-5 text-orange-500 mr-2 flex-shrink-0"></iconify-icon>
                        <div>
                            <p class="font-medium text-gray-800">3条预警待审核处理</p>
                            <p class="text-sm text-gray-500 mt-1">请及时处理待审核的预警信息</p>
                            <p class="text-xs text-gray-400 mt-2">2026-07-22 09:15</p>
                        </div>
                    </div>
                </div>
                <div class="notification-item p-3 bg-blue-50 rounded-lg border border-blue-100">
                    <div class="flex items-start">
                        <iconify-icon icon="material-symbols:update" class="w-5 h-5 text-blue-500 mr-2 flex-shrink-0"></iconify-icon>
                        <div>
                            <p class="font-medium text-gray-800">气象数据同步完成</p>
                            <p class="text-sm text-gray-500 mt-1">今日气象数据已完成同步更新</p>

    <div id="message-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                    <iconify-icon icon="material-symbols:message" class="w-5 h-5 mr-2 text-gray-600"></iconify-icon>
                    站内消息
                </h3>
                <button onclick="closeModal('message-modal')" class="p-1 hover:bg-gray-100 rounded">
                    <iconify-icon icon="material-symbols:close" class="w-5 h-5 text-gray-500"></iconify-icon>
                </button>
            </div>
            <div class="p-4 space-y-3">
                <div class="notification-item p-3 bg-gray-50 rounded-lg">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center mr-3">
                                <iconify-icon icon="material-symbols:person" class="w-4 h-4 text-green-600"></iconify-icon>
                            </div>
                            <div>
                                <p class="font-medium text-gray-800">张农技</p>
                                <p class="text-sm text-gray-500">已提交土壤养分数据，请审核</p>
                            </div>
                        </div>
                        <span class="text-xs text-gray-400">1小时前</span>
                    </div>
                </div>
                <div class="notification-item p-3 bg-gray-50 rounded-lg">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center mr-3">
                                <iconify-icon icon="material-symbols:person" class="w-4 h-4 text-blue-600"></iconify-icon>
                            </div>
                            <div>
                                <p class="font-medium text-gray-800">系统通知</p>
                                <p class="text-sm text-gray-500">长势研判报告已生成</p>
                            </div>
                        </div>
                        <span class="text-xs text-gray-400">昨天</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const tabs = {};
        let activeTab = 'home';
        
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggle-sidebar');
            const icon = toggleBtn.querySelector('svg');
            const text = toggleBtn.querySelector('.sidebar-text');
            if (sidebar.classList.contains('sidebar-collapsed')) {
                sidebar.classList.remove('sidebar-collapsed');
                icon.setAttribute('icon', 'material-symbols:chevron-left');
                text.textContent = '收起';
            } else {
                sidebar.classList.add('sidebar-collapsed');
                icon.setAttribute('icon', 'material-symbols:chevron-right');
                text.textContent = '展开';
            }
        }
        
        function openTab(id, name, url) {
            if (tabs[id]) {
                switchTab(id);
                return;
            }
            tabs[id] = { name, url };
            const tabBar = document.getElementById('tab-bar');
            const tab = document.createElement('button');
            tab.id = `tab-${id}`;
            tab.className = 'flex items-center space-x-2 px-4 py-2 rounded-t-lg text-sm font-medium text-gray-600 hover:bg-gray-200 min-w-max';
            tab.innerHTML = `
                <iconify-icon icon="material-symbols:file" class="w-4 h-4"></iconify-icon>
                <span>${name}</span>
                <button onclick="closeTab('${id}', event)" class="p-0.5 hover:bg-gray-300 rounded">
                    <iconify-icon icon="material-symbols:close" class="w-3 h-3"></iconify-icon>
                </button>
            `;
            tab.onclick = () => switchTab(id);
            tabBar.appendChild(tab);
            switchTab(id);
        }
        
        function switchTab(id) {
            activeTab = id;
            document.querySelectorAll('#tab-bar button').forEach(btn => btn.classList.remove('tab-active'));
            const tabBtn = document.getElementById(`tab-${id}`);
            if (tabBtn) tabBtn.classList.add('tab-active');
            document.getElementById('mainFrame').src = tabs[id]?.url || 'home.html';
            updateMenuHighlight(id);
        }
        
        function updateMenuHighlight(id) {
            document.querySelectorAll('#sidebar button').forEach(btn => btn.classList.remove('menu-active'));
            const menuBtn = document.getElementById(`menu-${id}`);
            if (menuBtn) menuBtn.classList.add('menu-active');
        }
        
        function closeTab(id, event) {
            event.stopPropagation();
            if (id === 'home') return;
            delete tabs[id];
            const tabBtn = document.getElementById(`tab-${id}`);
            if (tabBtn) tabBtn.remove();
            if (activeTab === id) {
                const remainingTabs = Object.keys(tabs);
                switchTab(remainingTabs[remainingTabs.length - 1] || 'home');
            }
        }
        
        function toggleUserMenu() {
            const menu = document.getElementById('user-menu');
            menu.classList.toggle('active');
        }
        
        function toggleNotifications() {
            const modal = document.getElementById('notification-modal');
            modal.classList.toggle('active');
        }
        
        function toggleMessages() {
            const modal = document.getElementById('message-modal');
            modal.classList.toggle('active');
        }
        
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('active');
        }
        
        document.addEventListener('click', (e) => {
            const userMenu = document.getElementById('user-menu');
            const userBtn = e.target.closest('.border-l');
            if (!userBtn && !userMenu.contains(e.target)) {
                userMenu.classList.remove('active');
            }
        });
        
        document.addEventListener('click', (e) => {
            const notificationModal = document.getElementById('notification-modal');
            const notificationBtn = e.target.closest('[onclick="toggleNotifications()"]');
            if (!notificationBtn && !notificationModal.contains(e.target)) {
                notificationModal.classList.remove('active');
            }
        });
        
        document.addEventListener('click', (e) => {
            const messageModal = document.getElementById('message-modal');
            const messageBtn = e.target.closest('[onclick="toggleMessages()"]');
            if (!messageBtn && !messageModal.contains(e.target)) {
                messageModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
