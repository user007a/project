<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流程设置 - 南丰蜜桔模型管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif; }
        .content-wrapper { padding: 24px; height: calc(100vh - 60px); overflow-y: auto; }
        .flow-step { flex: 1; }
        .flow-connector { width: 3px; background-color: #E5E7EB; }
        .flow-connector.active { background-color: #22C55E; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">流程设置</h1>
                <p class="text-gray-500 mt-1">设置预警消息的审核流程</p>
            </div>
            <button onclick="saveFlowSettings()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 flex items-center">
                <iconify-icon icon="material-symbols:save" class="w-4 h-4 mr-2"></iconify-icon>
                保存设置
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-800 flex items-center mb-6">
                <iconify-icon icon="material-symbols:workflow" class="w-5 h-5 mr-2 text-green-600"></iconify-icon>
                预警审核流程配置
            </h2>
            <div class="flex items-center justify-center space-x-2">
                <div class="flow-step flex flex-col items-center">
                    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center border-4 border-green-600">
                        <iconify-icon icon="material-symbols:model-training" class="w-7 h-7 text-green-600"></iconify-icon>
                    </div>
                    <p class="mt-3 text-sm font-medium text-gray-700">模型生成</p>
                    <p class="mt-1 text-xs text-gray-500">系统自动触发</p>
                </div>
                <div class="flow-connector active h-16"></div>
                <div class="flow-step flex flex-col items-center">
                    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center border-4 border-green-600">
                        <iconify-icon icon="material-symbols:person-check" class="w-7 h-7 text-green-600"></iconify-icon>
                    </div>
                    <p class="mt-3 text-sm font-medium text-gray-700">初审核查</p>
                    <p class="mt-1 text-xs text-gray-500">乡镇农技人员</p>
                </div>
                <div class="flow-connector active h-16"></div>
                <div class="flow-step flex flex-col items-center">
                    <div class="w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center border-4 border-yellow-500">
                        <iconify-icon icon="material-symbols:shield-check" class="w-7 h-7 text-yellow-600"></iconify-icon>
                    </div>
                    <p class="mt-3 text-sm font-medium text-gray-700">复核确认</p>
                    <p class="mt-1 text-xs text-gray-500">县级农技专家</p>
                </div>
                <div class="flow-connector h-16"></div>
                <div class="flow-step flex flex-col items-center">
                    <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center border-4 border-gray-300">
                        <iconify-icon icon="material-symbols:send" class="w-7 h-7 text-gray-400"></iconify-icon>
                    </div>
                    <p class="mt-3 text-sm font-medium text-gray-700">消息发布</p>
                    <p class="mt-1 text-xs text-gray-500">推送至用户</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-lg font-semibold text-gray-800 flex items-center mb-4">
                    <iconify-icon icon="material-symbols:timer" class="w-5 h-5 mr-2 text-green-600"></iconify-icon>
                    审核时限设置
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">初审时限（小时）</label>
                        <div class="flex items-center space-x-3">
                            <input type="range" id="first-review-slider" min="1" max="24" value="4" class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-green-600" oninput="updateSliderValue('first-review-slider', 'first-review-value', '小时')">
                            <span id="first-review-value" class="w-12 text-center text-sm font-medium text-gray-700">4小时</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">复核时限（小时）</label>
                        <div class="flex items-center space-x-3">
                            <input type="range" id="recheck-slider" min="1" max="12" value="2" class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-green-600" oninput="updateSliderValue('recheck-slider', 'recheck-value', '小时')">
                            <span id="recheck-value" class="w-12 text-center text-sm font-medium text-gray-700">2小时</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">超时自动处理</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option>自动通过</option>
                            <option>自动驳回</option>
                            <option>升级至上级审核</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-lg font-semibold text-gray-800 flex items-center mb-4">
                    <iconify-icon icon="material-symbols:group" class="w-5 h-5 mr-2 text-green-600"></iconify-icon>
                    审核人员配置
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">初审人员</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option>按区域分配（乡镇农技人员）</option>
                            <option>指定审核人员</option>
                            <option>轮询分配</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">复核人员</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option>县农技中心专家</option>
                            <option>指定审核人员</option>
                            <option>轮询分配</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">审核人员数量</label>
                        <div class="flex items-center space-x-3">
                            <input type="range" id="reviewer-count-slider" min="1" max="5" value="2" class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-green-600" oninput="updateSliderValue('reviewer-count-slider', 'reviewer-count-value', '人')">
                            <span id="reviewer-count-value" class="w-12 text-center text-sm font-medium text-gray-700">2人</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">多人审核时，任意一人通过即通过</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-lg font-semibold text-gray-800 flex items-center mb-4">
                    <iconify-icon icon="material-symbols:settings" class="w-5 h-5 mr-2 text-green-600"></iconify-icon>
                    特殊流程设置
                </h2>
                <div class="space-y-4">
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div>
                            <h4 class="font-medium text-gray-800">红色预警跳过审核</h4>
                            <p class="text-sm text-gray-500 mt-1">最高级别预警直接发布</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" checked class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div>
                            <h4 class="font-medium text-gray-800">专家确认后自动发布</h4>
                            <p class="text-sm text-gray-500 mt-1">无需二次确认</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" checked class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div>
                            <h4 class="font-medium text-gray-800">支持一键驳回</h4>
                            <p class="text-sm text-gray-500 mt-1">审核人员可直接驳回预警</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" checked class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div>
                            <h4 class="font-medium text-gray-800">驳回后重新生成</h4>
                            <p class="text-sm text-gray-500 mt-1">驳回的预警自动重新计算</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function saveFlowSettings() {
            alert('保存成功！流程设置已更新。');
        }

        function updateSliderValue(sliderId, valueId, unit) {
            const slider = document.getElementById(sliderId);
            const valueSpan = document.getElementById(valueId);
            valueSpan.textContent = slider.value + unit;
        }
    </script>
</body>
</html>
