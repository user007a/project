<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>村干部工作台</title>
  <link rel="stylesheet" href="css/cadre.css">
</head>
<body>
<div class="phone-container">
  <!-- 顶部标题栏 -->
  <header class="header-bar">
    <h1 class="header-title">村干部工作台</h1>
    <div class="header-btn" role="button" tabindex="0" aria-label="切换身份" onclick="showToast('切换身份功能开发中')">切换身份</div>
  </header>

  <!-- 页面内容 -->
  <main class="page-content-no-nav">
    <!-- 待办事项区域 -->
    <section class="todo-section" aria-label="待办事项">
      <h2 class="section-title">待办事项</h2>
      <div class="todo-grid">
        <div class="todo-card" role="button" tabindex="0" aria-label="待处理事件，3项" onclick="showToast('查看待处理事件')">
          <div class="todo-icon" style="color:#409eff;" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          </div>
          <span class="todo-num">3</span>
          <span class="todo-label">待处理事件</span>
          <span class="badge" aria-label="3条待处理">3</span>
        </div>
        <div class="todo-card" role="button" tabindex="0" aria-label="待审核积分，5项" onclick="showToast('查看待审核积分')">
          <div class="todo-icon" style="color:#67c23a;" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <span class="todo-num">5</span>
          <span class="todo-label">待审核积分</span>
          <span class="badge" aria-label="5条待审核">5</span>
        </div>
        <div class="todo-card" role="button" tabindex="0" aria-label="待回复议题，2项" onclick="showToast('查看待回复议题')">
          <div class="todo-icon" style="color:#e6a23c;" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <span class="todo-num">2</span>
          <span class="todo-label">待回复议题</span>
          <span class="badge" aria-label="2条待回复">2</span>
        </div>
        <div class="todo-card" role="button" tabindex="0" aria-label="待处理办事，1项" onclick="showToast('查看待处理办事')">
          <div class="todo-icon" style="color:#9b59b6;" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </div>
          <span class="todo-num">1</span>
          <span class="todo-label">待处理办事</span>
          <span class="badge" aria-label="1条待处理">1</span>
        </div>
      </div>
    </section>

    <!-- 今日工作数据 -->
    <h2 class="section-title section-title--work">今日工作</h2>
    <section class="work-data" aria-label="今日工作数据">
      <div class="data-item">
        <span class="data-value">2</span>
        <span class="data-label">已巡查（次）</span>
      </div>
      <div class="data-item">
        <span class="data-value">1</span>
        <span class="data-label">已处理（件）</span>
      </div>
      <div class="data-item">
        <span class="data-value">0</span>
        <span class="data-label">已发（条）</span>
      </div>
    </section>

    <!-- 快捷功能宫格 -->
    <h2 class="section-title section-title--quick">快捷功能</h2>
    <section aria-label="快捷功能">
      <div class="quick-grid">
        <a class="quick-item" role="button" href="task/task-list.html" aria-label="任务管理">
          <div class="quick-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          </div>
          <div class="quick-label">任务管理</div>
        </a>
        <a class="quick-item" role="button" href="patrol/patrol-plan.html" aria-label="网格巡查">
          <div class="quick-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
          <div class="quick-label">网格巡查</div>
        </a>
        <a class="quick-item" role="button" href="notice/notice-send.html" aria-label="通知发布">
          <div class="quick-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div class="quick-label">通知发布</div>
        </a>
        <a class="quick-item" role="button" href="points/audit-list.html" aria-label="积分审核">
          <div class="quick-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="quick-label">积分审核</div>
        </a>
        <a class="quick-item" role="button" href="appeal/appeal-list.html" aria-label="村民诉求">
          <div class="quick-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="quick-label">村民诉求</div>
        </a>
        <a class="quick-item" role="button" href="journal/journal-list.html" aria-label="工作日志">
          <div class="quick-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </div>
          <div class="quick-label">工作日志</div>
        </a>
        <a class="quick-item" role="button" href="data/data-overview.html" aria-label="数据查看">
          <div class="quick-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          </div>
          <div class="quick-label">数据查看</div>
        </a>
        <a class="quick-item" role="button" onclick="showToast('随手拍功能开发中')" aria-label="随手拍">
          <div class="quick-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
          <div class="quick-label">随手拍</div>
        </a>
      </div>
    </section>
  </main>

  <!-- TabBar -->
  <nav class="tab-bar" role="tablist" aria-label="主导航">
    <a class="tab-item active" role="tab" aria-current="page" href="index.html" aria-label="工作台">
      <span class="tab-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </span>
      <span>工作台</span>
    </a>
    <a class="tab-item" role="tab" href="patrol/patrol-plan.html" aria-label="巡查">
      <span class="tab-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <span>巡查</span>
    </a>
    <a class="tab-item" role="tab" href="notice/notice-sent.html" aria-label="通知，2条未读">
      <span class="tab-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </span>
      <span>通知</span>
      <span class="badge badge--tab" aria-label="2条未读通知">2</span>
    </a>
    <a class="tab-item" role="tab" href="profile/profile.html" aria-label="我的">
      <span class="tab-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>
      <span>我的</span>
    </a>
  </nav>
</div>
<script src="js/cadre.js"></script>
</body>
</html>
