<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日志详情</title>
  <link rel="stylesheet" href="../css/cadre.css">
</head>
<body>
<div class="phone-container">
  <!-- 导航栏 -->
  <header>
    <div class="nav-bar">
      <a class="nav-back" href="journal-list.html" aria-label="返回">&#8249;</a>
      <h1 class="nav-title">日志详情</h1>
    </div>
  </header>

  <!-- 页面内容 -->
  <main class="page-content-no-tab">
    <!-- 日期 -->
    <div class="card">
      <div class="text-center" style="font-size:18px;font-weight:600;color:#333;">2026-06-30 工作日志</div>
      <div class="text-center text-sm text-gray mt-8">09:00 - 17:00</div>
    </div>

    <!-- 工作内容全文 -->
    <div class="card">
      <div class="card-title">工作内容</div>
      <p style="font-size:14px;color:#333;line-height:1.8;">
        上午巡查村东片区河道卫生情况，发现河道两侧有少量垃圾堆积，已安排保洁人员清理。随后走访了第一组的3户村民，了解其近期生活情况和诉求。
      </p>
      <p style="font-size:14px;color:#333;line-height:1.8;margin-top:12px;">
        下午在村委会接待了来访群众，处理了3件办事咨询。整理了本周工作台账，汇总了各村组的工作进展情况。
      </p>
    </div>

    <!-- 照片 -->
    <div class="card">
      <div class="card-title">工作照片（3张）</div>
      <div class="photo-grid">
        <div class="photo-item" style="background:#e0e0e0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">河道巡查</div>
        <div class="photo-item" style="background:#e0e0e0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">村民走访</div>
        <div class="photo-item" style="background:#e0e0e0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">工作台账</div>
      </div>
    </div>
  </main>
</div>
<script src="../js/cadre.js"></script>
</body>
</html>
