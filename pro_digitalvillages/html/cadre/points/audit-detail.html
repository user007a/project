<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审核详情</title>
  <link rel="stylesheet" href="../css/cadre.css">
</head>
<body>
<div class="phone-container">
  <!-- 导航栏 -->
  <header>
    <div class="nav-bar">
      <a class="nav-back" href="audit-list.html" aria-label="返回">&#8249;</a>
      <h1 class="nav-title">审核详情</h1>
    </div>
  </header>

  <!-- 页面内容 -->
  <main class="page-content-no-tab">
    <!-- 村民信息 -->
    <div class="card">
      <div class="card-title">村民信息</div>
      <div class="info-row">
        <div class="info-label">村民姓名</div>
        <div class="info-value text-bold">张三</div>
      </div>
      <div class="info-row">
        <div class="info-label">积分事项</div>
        <div class="info-value">参与河道清理</div>
      </div>
      <div class="info-row">
        <div class="info-label">申请分值</div>
        <div class="info-value text-blue text-bold">+10分</div>
      </div>
      <div class="info-row">
        <div class="info-label">申请时间</div>
        <div class="info-value">2026-06-29 14:00</div>
      </div>
    </div>

    <!-- 申请说明 -->
    <div class="card">
      <div class="card-title">申请说明</div>
      <p style="font-size:14px;color:#333;line-height:1.8;">
        2026年6月28日上午，我参与了村东片区河道的垃圾清理志愿活动，清理了河道两岸约200米范围内的生活垃圾和枯枝落叶。活动持续了约3小时，共清理垃圾5袋。
      </p>
    </div>

    <!-- 申请照片 -->
    <div class="card">
      <div class="card-title">申请照片</div>
      <div class="photo-grid">
        <div class="photo-item" style="background:#e0e0e0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;flex-direction:column;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span class="text-xs">清理前</span>
        </div>
        <div class="photo-item" style="background:#e0e0e0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;flex-direction:column;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span class="text-xs">清理后</span>
        </div>
      </div>
      <div class="text-sm text-gray mt-8">点击照片可放大查看</div>
    </div>

    <!-- 积分规则对照 -->
    <div class="card">
      <div class="card-title">积分规则对照</div>
      <div class="info-row">
        <div class="info-label">规则名称</div>
        <div class="info-value">参与河道清理</div>
      </div>
      <div class="info-row">
        <div class="info-label">标准分值</div>
        <div class="info-value text-green text-bold">+10分</div>
      </div>
      <div class="info-row">
        <div class="info-label">规则说明</div>
        <div class="info-value">参与村内河道清理活动，每次可获得10积分</div>
      </div>
    </div>

    <!-- 底部操作按钮 -->
    <div class="btn-row" style="padding:16px;">
      <button class="btn btn-success" onclick="showModal('审核确认', '确认通过该积分申请？', function(){ showToast('审核通过'); })">通过</button>
      <button class="btn btn-danger" onclick="showModal('驳回确认', '确认驳回该积分申请？', function(){ showToast('已驳回'); })">驳回</button>
      <button class="btn btn-warning" onclick="showToast('请输入调整后的分值')">调整分值</button>
    </div>
  </main>
</div>
<script src="../js/cadre.js"></script>
</body>
</html>
