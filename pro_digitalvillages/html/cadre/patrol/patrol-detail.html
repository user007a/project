<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巡查记录详情</title>
  <link rel="stylesheet" href="../css/cadre.css">
</head>
<body>
<div class="phone-container">
  <!-- 导航栏 -->
  <header>
    <div class="nav-bar">
      <a class="nav-back" href="patrol-records.html" aria-label="返回">&#8249;</a>
      <h1 class="nav-title">巡查记录详情</h1>
    </div>
  </header>

  <!-- 页面内容 -->
  <main class="page-content-no-tab">
    <!-- 照片区 -->
    <div class="card">
      <div class="card-title">巡查照片</div>
      <div class="photo-grid">
        <div class="photo-item" style="background:#e0e0e0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">照片1</div>
        <div class="photo-item" style="background:#e0e0e0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">照片2</div>
        <div class="photo-item" style="background:#e0e0e0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">照片3</div>
      </div>
    </div>

    <!-- 基本信息 -->
    <div class="card">
      <div class="card-title">基本信息</div>
      <div class="info-row">
        <div class="info-label">巡查日期</div>
        <div class="info-value">2026-06-28</div>
      </div>
      <div class="info-row">
        <div class="info-label">巡查区域</div>
        <div class="info-value">第一网格（村东片区）</div>
      </div>
      <div class="info-row">
        <div class="info-label">定位方式</div>
        <div class="info-value"><span class="tag tag-blue">GPS定位</span></div>
      </div>
      <div class="info-row">
        <div class="info-label">所属计划</div>
        <div class="info-value">2026年6月第3周巡查</div>
      </div>
    </div>

    <!-- 巡查记录全文 -->
    <div class="card">
      <div class="card-title">巡查记录</div>
      <p style="font-size:14px;color:#333;line-height:1.8;">
        河道卫生良好，垃圾已清运完毕，发现一处路面破损已记录。
        河道两侧卫生状况良好，垃圾桶已清理，但东侧路面有一处坑洞，约30cm直径，已拍照记录并上报。
        建议安排道路维修人员尽快处理，避免安全隐患。
      </p>
    </div>
  </main>
</div>
<script src="../js/cadre.js"></script>
</body>
</html>
