<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据概览</title>
  <link rel="stylesheet" href="../css/cadre.css">
</head>
<body>
<div class="phone-container">
  <!-- 导航栏 -->
  <header>
    <div class="nav-bar">
      <a class="nav-back" href="../index.html" aria-label="返回">&#8249;</a>
      <h1 class="nav-title">数据概览</h1>
    </div>
  </header>

  <!-- 页面内容 -->
  <main class="page-content-no-tab">
    <!-- 5个维度统计卡片 -->
    <div class="overview-grid" style="margin-top:16px;">
      <!-- 产业总数 -->
      <div class="overview-card" style="border-top:3px solid #67c23a;">
        <div class="ov-num text-green">12</div>
        <div class="ov-sub">总产值 1,286万元</div>
        <div class="ov-label">产业总数</div>
      </div>

      <!-- 事件处置率 -->
      <div class="overview-card" style="border-top:3px solid #00bcd4;">
        <div class="ov-num" style="color:#00bcd4;">85.7%</div>
        <div class="ov-sub">已处置 6/7 件</div>
        <div class="ov-label">事件处置率</div>
      </div>

      <!-- 积分参与率 -->
      <div class="overview-card" style="border-top:3px solid #e6a23c;">
        <div class="ov-num text-orange">72%</div>
        <div class="ov-sub">参与 86/120 人</div>
        <div class="ov-label">积分参与率</div>
      </div>

      <!-- 事件平均时长（第二行居中） -->
      <div style="grid-column:1;"></div>
      <div class="overview-card" style="border-top:3px solid #409eff;">
        <div class="ov-num text-blue">18</div>
        <div class="ov-sub">单位：小时</div>
        <div class="ov-label">事件平均时长</div>
      </div>

      <!-- 人均收入 -->
      <div class="overview-card" style="border-top:3px solid #9b59b6;">
        <div class="ov-num text-purple">28,600</div>
        <div class="ov-sub">单位：元/年</div>
        <div class="ov-label">人均收入</div>
      </div>
    </div>

    <!-- 各维度详细Tab -->
    <div class="tab-switch" role="tablist" style="position:static;">
      <div class="tab-btn active" role="tab" aria-selected="true">产业发展</div>
      <div class="tab-btn" role="tab">事件处置</div>
      <div class="tab-btn" role="tab">积分管理</div>
    </div>

    <!-- 产业发展详情 -->
    <div class="card">
      <div class="card-title">产业发展概况</div>
      <div class="info-row">
        <div class="info-label">种植产业</div>
        <div class="info-value">5个 | 产值 480万元</div>
      </div>
      <div class="info-row">
        <div class="info-label">养殖产业</div>
        <div class="info-value">3个 | 产值 320万元</div>
      </div>
      <div class="info-row">
        <div class="info-label">加工产业</div>
        <div class="info-value">2个 | 产值 286万元</div>
      </div>
      <div class="info-row">
        <div class="info-label">服务产业</div>
        <div class="info-value">2个 | 产值 200万元</div>
      </div>
    </div>

    <!-- 月度趋势 -->
    <div class="card">
      <div class="card-title">月度事件处置趋势</div>
      <div style="display:flex;align-items:flex-end;height:120px;gap:8px;padding:10px 0;">
        <div style="flex:1;background:#409eff;border-radius:4px 4px 0 0;height:40%;opacity:0.6;"></div>
        <div style="flex:1;background:#409eff;border-radius:4px 4px 0 0;height:60%;opacity:0.7;"></div>
        <div style="flex:1;background:#409eff;border-radius:4px 4px 0 0;height:50%;opacity:0.7;"></div>
        <div style="flex:1;background:#409eff;border-radius:4px 4px 0 0;height:80%;opacity:0.8;"></div>
        <div style="flex:1;background:#409eff;border-radius:4px 4px 0 0;height:70%;opacity:0.8;"></div>
        <div style="flex:1;background:#409eff;border-radius:4px 4px 0 0;height:90%;"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <div style="flex:1;text-align:center;font-size:11px;color:#999;">1月</div>
        <div style="flex:1;text-align:center;font-size:11px;color:#999;">2月</div>
        <div style="flex:1;text-align:center;font-size:11px;color:#999;">3月</div>
        <div style="flex:1;text-align:center;font-size:11px;color:#999;">4月</div>
        <div style="flex:1;text-align:center;font-size:11px;color:#999;">5月</div>
        <div style="flex:1;text-align:center;font-size:11px;color:#409eff;font-weight:600;">6月</div>
      </div>
    </div>
  </main>
</div>
<script src="../js/cadre.js"></script>
</body>
</html>
