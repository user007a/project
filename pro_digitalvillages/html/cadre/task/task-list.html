<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务管理</title>
  <link rel="stylesheet" href="../css/cadre.css">
</head>
<body>
<div class="phone-container">
  <!-- 导航栏 -->
  <header>
    <div class="nav-bar">
      <a class="nav-back" href="../index.html" aria-label="返回首页">&#8249;</a>
      <h1 class="nav-title">任务管理</h1>
    </div>
  </header>

  <!-- 页面内容 -->
  <main class="page-content-no-tab">
    <!-- Tab切换 -->
    <div class="tab-switch" role="tablist">
      <div class="tab-btn active" role="tab" aria-selected="true">待接收(2)</div>
      <div class="tab-btn" role="tab" aria-selected="false">进行中(1)</div>
      <div class="tab-btn" role="tab" aria-selected="false">已完成(3)</div>
      <div class="tab-btn" role="tab" aria-selected="false">已过期(1)</div>
    </div>

    <!-- 任务列表 -->
    <div class="list-card" style="margin-top:0;">
      <!-- 进行中 -->
      <div class="list-item" role="button" onclick="location.href='task-detail.html'">
        <div class="item-content">
          <div class="item-title">
            <span class="tag tag-blue">进行中</span>
            清理河道垃圾
          </div>
          <div class="item-desc">分派人：李书记</div>
          <div class="item-meta">
            <span>截止：2026-07-05</span>
            <span>创建：2026-06-25</span>
          </div>
        </div>
        <div class="item-arrow">&#8250;</div>
      </div>

      <!-- 待接收 -->
      <div class="list-item" role="button" onclick="location.href='task-detail.html'">
        <div class="item-content">
          <div class="item-title">
            <span class="tag tag-orange">待接收</span>
            走访慰问困难户
          </div>
          <div class="item-desc">分派人：王主任</div>
          <div class="item-meta">
            <span>截止：2026-07-10</span>
            <span>创建：2026-06-28</span>
          </div>
        </div>
        <div class="item-arrow">&#8250;</div>
      </div>

      <!-- 已完成 -->
      <div class="list-item" role="button" onclick="location.href='task-detail.html'">
        <div class="item-content">
          <div class="item-title">
            <span class="tag tag-green">已完成</span>
            排查安全隐患
          </div>
          <div class="item-desc">分派人：李书记</div>
          <div class="item-meta">
            <span>截止：2026-06-20</span>
            <span>创建：2026-06-10</span>
          </div>
        </div>
        <div class="item-arrow">&#8250;</div>
      </div>

      <!-- 已过期 -->
      <div class="list-item" role="button" onclick="location.href='task-detail.html'">
        <div class="item-content">
          <div class="item-title">
            <span class="tag tag-red">已过期</span>
            整理村务档案
          </div>
          <div class="item-desc">分派人：王主任</div>
          <div class="item-meta">
            <span class="text-red">截止：2026-06-25（已过期）</span>
            <span>创建：2026-06-15</span>
          </div>
        </div>
        <div class="item-arrow">&#8250;</div>
      </div>
    </div>
  </main>
</div>
<script src="../js/cadre.js"></script>
</body>
</html>
