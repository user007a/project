<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务详情</title>
  <link rel="stylesheet" href="../css/cadre.css">
</head>
<body>
<div class="phone-container">
  <!-- 导航栏 -->
  <header>
    <div class="nav-bar">
      <a class="nav-back" href="task-list.html" aria-label="返回">&#8249;</a>
      <h1 class="nav-title">任务详情</h1>
    </div>
  </header>

  <!-- 页面内容 -->
  <main class="page-content-no-tab">
    <!-- 任务信息 -->
    <div class="card">
      <div class="card-title">任务信息</div>
      <div class="info-row">
        <div class="info-label">任务标题</div>
        <div class="info-value text-bold">清理河道垃圾</div>
      </div>
      <div class="info-row">
        <div class="info-label">当前状态</div>
        <div class="info-value"><span class="tag tag-blue">进行中</span></div>
      </div>
      <div class="info-row">
        <div class="info-label">任务内容</div>
        <div class="info-value">对村东片区河道两侧的生活垃圾进行清理，确保河道环境卫生达标。重点关注桥下和拐角处的积存垃圾。</div>
      </div>
      <div class="info-row">
        <div class="info-label">分派人</div>
        <div class="info-value">李书记</div>
      </div>
      <div class="info-row">
        <div class="info-label">分派时间</div>
        <div class="info-value">2026-06-25 09:00</div>
      </div>
      <div class="info-row">
        <div class="info-label">截止时间</div>
        <div class="info-value">2026-07-05</div>
      </div>
    </div>

    <!-- 要求附件 -->
    <div class="card">
      <div class="card-title">要求附件</div>
      <div class="upload-area">
        <div class="upload-item" style="display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;flex-direction:column;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          <span class="text-xs">清理方案.pdf</span>
        </div>
      </div>
    </div>

    <!-- 执行记录时间线 -->
    <div class="card">
      <div class="card-title">执行记录</div>
      <div class="timeline">
        <div class="timeline-item">
          <div class="timeline-dot"></div>
          <div class="timeline-time">2026-06-25 09:00</div>
          <div class="timeline-content">李书记分派了任务「清理河道垃圾」</div>
        </div>
        <div class="timeline-item">
          <div class="timeline-dot"></div>
          <div class="timeline-time">2026-06-25 10:30</div>
          <div class="timeline-content">您已确认接收该任务</div>
        </div>
        <div class="timeline-item">
          <div class="timeline-dot" style="background:#e6a23c;box-shadow:0 0 0 2px #e6a23c;"></div>
          <div class="timeline-time">2026-06-28 14:00</div>
          <div class="timeline-content">已开始执行，预计3天内完成</div>
        </div>
      </div>
    </div>

    <!-- 底部操作按钮 -->
    <div style="padding:16px;">
      <a class="btn btn-primary btn-block" href="task-execute.html">填写处理结果</a>
    </div>
  </main>
</div>
<script src="../js/cadre.js"></script>
</body>
</html>
