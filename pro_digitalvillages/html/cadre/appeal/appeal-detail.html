<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诉求详情</title>
  <link rel="stylesheet" href="../css/cadre.css">
</head>
<body>
<div class="phone-container">
  <!-- 导航栏 -->
  <header>
    <div class="nav-bar">
      <a class="nav-back" href="appeal-list.html" aria-label="返回">&#8249;</a>
      <h1 class="nav-title">诉求详情</h1>
    </div>
  </header>

  <!-- 页面内容 -->
  <main class="page-content-full" style="padding-top:44px;padding-bottom:56px;">
    <!-- 诉求信息 -->
    <div class="card">
      <div class="card-title">诉求信息</div>
      <div class="info-row">
        <div class="info-label">诉求标题</div>
        <div class="info-value text-bold">村东河道垃圾堆积</div>
      </div>
      <div class="info-row">
        <div class="info-label">诉求类型</div>
        <div class="info-value"><span class="tag tag-blue">随手拍</span></div>
      </div>
      <div class="info-row">
        <div class="info-label">上报人</div>
        <div class="info-value">张三 - 第一组</div>
      </div>
      <div class="info-row">
        <div class="info-label">上报时间</div>
        <div class="info-value">2026-06-30 09:00</div>
      </div>
    </div>

    <!-- 内容描述+图片 -->
    <div class="card">
      <div class="card-title">诉求内容</div>
      <p style="font-size:14px;color:#333;line-height:1.8;margin-bottom:12px;">
        村东河道两侧发现大量生活垃圾堆积，已持续一周未清理，严重影响村容村貌和河道水质。希望村委尽快安排清理。
      </p>
      <div class="photo-grid">
        <div class="photo-item" style="background:#e0e0e0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">照片1</div>
        <div class="photo-item" style="background:#e0e0e0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">照片2</div>
        <div class="photo-item" style="background:#e0e0e0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">照片3</div>
      </div>
    </div>

    <!-- 处理进度 -->
    <div class="card">
      <div class="card-title">处理进度</div>
      <div class="timeline">
        <div class="timeline-item">
          <div class="timeline-dot" style="background:#e6a23c;box-shadow:0 0 0 2px #e6a23c;"></div>
          <div class="timeline-time">2026-06-30 09:00</div>
          <div class="timeline-content">村民张三提交诉求</div>
        </div>
        <div class="timeline-item">
          <div class="timeline-dot" style="background:#909399;box-shadow:0 0 0 2px #909399;"></div>
          <div class="timeline-time">待处理</div>
          <div class="timeline-content">等待村干部处理中...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- 底部回复栏 -->
  <div class="reply-bar">
    <input type="text" placeholder="输入回复内容..." id="replyInput">
    <button class="reply-btn" onclick="var v=document.getElementById('replyInput').value;if(v){showToast('回复成功');document.getElementById('replyInput').value='';}else{showToast('请输入回复内容');}">回复</button>
  </div>
</div>
<script src="../js/cadre.js"></script>
</body>
</html>
