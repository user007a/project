<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产业数据</title>
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
</head>
<body>
<div class="admin-page">
  <!-- 页面标题 -->
  <div class="page-header">
    <h2>产业数据</h2>
    <span class="text-muted">村域产业运营数据统计</span>
  </div>

  <!-- 统计卡片 -->
  <div class="stat-cards cols-4">
    <div class="stat-card" onclick="parent.openPage && parent.openPage('industry/industry-list.html','产业列表')">
      <div class="stat-icon" style="background:#ecf5ff;color:#409eff;"><span class="iconify" data-icon="ri:store-2-line"></span></div>
      <div class="stat-info"><div class="stat-value">6</div><div class="stat-label">产业总数</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#f0f9eb;color:#67c23a;"><span class="iconify" data-icon="ri:group-line"></span></div>
      <div class="stat-info"><div class="stat-value">210</div><div class="stat-label">带动就业</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#fdf6ec;color:#e6a23c;"><span class="iconify" data-icon="ri:money-cny-circle-line"></span></div>
      <div class="stat-info"><div class="stat-value">¥1,286万</div><div class="stat-label">年度营收</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#fef0f0;color:#f56c6c;"><span class="iconify" data-icon="ri:trophy-line"></span></div>
      <div class="stat-info"><div class="stat-value">3</div><div class="stat-label">示范产业</div></div>
    </div>
  </div>

  <!-- 搜索筛选 -->
  <div class="filter-bar">
    <div class="filter-item">
      <label>产业类型</label>
      <select class="form-select">
        <option value="">全部类型</option>
        <option>种植业</option>
        <option>养殖业</option>
        <option>加工业</option>
        <option>服务业</option>
        <option>电商</option>
      </select>
    </div>
    <div class="filter-item">
      <label>年份</label>
      <select class="form-select">
        <option value="">全部年份</option>
        <option>2026年</option>
        <option>2025年</option>
        <option>2024年</option>
      </select>
    </div>
    <div class="filter-actions">
      <button class="btn btn-primary btn-sm">查询</button>
      <button class="btn btn-search-reset">重置</button>
    </div>
  </div>

  <!-- 产业类型分布数据表格 -->
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>产业类型</th>
          <th>企业数量</th>
          <th class="text-right">年产值(万元)</th>
          <th class="text-right">从业人数</th>
          <th class="text-right">同比增长</th>
          <th>备注</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><span class="tag tag-green">种植业</span></td>
          <td>5</td>
          <td class="text-right">470</td>
          <td class="text-right">63</td>
          <td class="text-right"><span style="color:#67c23a;">+8.5%</span></td>
          <td>含有机蔬菜、水稻种植</td>
          <td class="op-cell">
            <button type="button" class="btn-op" onclick="showToast('查看种植业详情','info')"><span class="iconify" data-icon="ri:eye-line"></span>查看</button><span class="op-divider"></span><button type="button" class="btn-op btn-op-edit" onclick="showToast('编辑种植业数据','info')"><span class="iconify" data-icon="ri:edit-line"></span>编辑</button>
          </td>
        </tr>
        <tr>
          <td><span class="tag tag-orange">养殖业</span></td>
          <td>2</td>
          <td class="text-right">280</td>
          <td class="text-right">30</td>
          <td class="text-right"><span style="color:#67c23a;">+5.2%</span></td>
          <td>生猪养殖为主</td>
          <td class="op-cell">
            <button type="button" class="btn-op" onclick="showToast('查看养殖业详情','info')"><span class="iconify" data-icon="ri:eye-line"></span>查看</button><span class="op-divider"></span><button type="button" class="btn-op btn-op-edit" onclick="showToast('编辑养殖业数据','info')"><span class="iconify" data-icon="ri:edit-line"></span>编辑</button>
          </td>
        </tr>
        <tr>
          <td><span class="tag tag-blue">加工业</span></td>
          <td>1</td>
          <td class="text-right">260</td>
          <td class="text-right">80</td>
          <td class="text-right"><span style="color:#67c23a;">+12.3%</span></td>
          <td>农产品精深加工</td>
          <td class="op-cell">
            <button type="button" class="btn-op" onclick="showToast('查看加工业详情','info')"><span class="iconify" data-icon="ri:eye-line"></span>查看</button><span class="op-divider"></span><button type="button" class="btn-op btn-op-edit" onclick="showToast('编辑加工业数据','info')"><span class="iconify" data-icon="ri:edit-line"></span>编辑</button>
          </td>
        </tr>
        <tr>
          <td><span class="tag tag-purple">服务业</span></td>
          <td>2</td>
          <td class="text-right">120</td>
          <td class="text-right">12</td>
          <td class="text-right"><span style="color:#67c23a;">+15.8%</span></td>
          <td>农家乐、乡村旅游</td>
          <td class="op-cell">
            <button type="button" class="btn-op" onclick="showToast('查看服务业详情','info')"><span class="iconify" data-icon="ri:eye-line"></span>查看</button><span class="op-divider"></span><button type="button" class="btn-op btn-op-edit" onclick="showToast('编辑服务业数据','info')"><span class="iconify" data-icon="ri:edit-line"></span>编辑</button>
          </td>
        </tr>
        <tr>
          <td><span class="tag tag-cyan">电商</span></td>
          <td>1</td>
          <td class="text-right">156</td>
          <td class="text-right">25</td>
          <td class="text-right"><span style="color:#67c23a;">+22.6%</span></td>
          <td>农产品电商销售</td>
          <td class="op-cell">
            <button type="button" class="btn-op" onclick="showToast('查看电商详情','info')"><span class="iconify" data-icon="ri:eye-line"></span>查看</button><span class="op-divider"></span><button type="button" class="btn-op btn-op-edit" onclick="showToast('编辑电商数据','info')"><span class="iconify" data-icon="ri:edit-line"></span>编辑</button>
          </td>
        </tr>
        <tr>
          <td><span class="tag tag-gray">其他</span></td>
          <td>1</td>
          <td class="text-right">0</td>
          <td class="text-right">0</td>
          <td class="text-right"><span style="color:#f56c6c;">--</span></td>
          <td>已注销</td>
          <td class="op-cell">
            <button type="button" class="btn-op" onclick="showToast('查看其他详情','info')"><span class="iconify" data-icon="ri:eye-line"></span>查看</button><span class="op-divider"></span><button type="button" class="btn-op btn-op-edit" onclick="showToast('编辑其他数据','info')"><span class="iconify" data-icon="ri:edit-line"></span>编辑</button>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="pagination">
      <span class="page-total">共 6 条记录</span>
      <div class="page-btns">
        <button type="button" class="page-btn disabled">&laquo;</button>
        <button type="button" class="page-btn active">1</button>
        <button type="button" class="page-btn disabled">&raquo;</button>
      </div>
    </div>
  </div>
</div>
<script src="../js/admin.js"></script>
</body>
</html>
