<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 数字乡村管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#edfcf1',
              100: '#d3f7dd',
              200: '#abedc4',
              300: '#76dea5',
              400: '#42c881',
              500: '#22a84a',
              600: '#1a8a3d',
              700: '#156d33',
              800: '#13562b',
              900: '#114725',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -20px) rotate(120deg); }
      66% { transform: translate(-20px, 15px) rotate(240deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(-25px, 30px) rotate(-120deg); }
      66% { transform: translate(15px, -25px) rotate(-240deg); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -30px) scale(1.1); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-float1 { animation: float1 20s ease-in-out infinite; }
    .animate-float2 { animation: float2 25s ease-in-out infinite; }
    .animate-float3 { animation: float3 18s ease-in-out infinite; }
    .animate-fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
    }
    .animate-fade-in-up-delay {
      animation: fadeInUp 0.8s ease-out 0.2s forwards;
      opacity: 0;
    }
    .animate-fade-in-up-delay2 {
      animation: fadeInUp 0.8s ease-out 0.4s forwards;
      opacity: 0;
    }
    .shimmer-btn {
      background-size: 200% 100%;
      background-image: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.15) 50%,
        transparent 100%
      );
      animation: shimmer 3s infinite;
    }
    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .glass-strong {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .input-glow:focus {
      box-shadow: 0 0 0 3px rgba(34, 168, 74, 0.15), 0 0 20px rgba(34, 168, 74, 0.08);
    }
    .dot-pattern {
      background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="min-h-screen overflow-hidden" style="background: linear-gradient(135deg, #0a1628 0%, #0f2027 20%, #1a3a3a 50%, #1a4a3a 80%, #0f2027 100%);">

  <!-- Floating decorative elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="dot-pattern absolute inset-0"></div>

    <!-- Large circles -->
    <div class="animate-float1 absolute -top-20 -left-20 w-96 h-96 rounded-full opacity-20"
         style="background: radial-gradient(circle, rgba(34,168,74,0.4) 0%, transparent 70%);"></div>
    <div class="animate-float2 absolute -bottom-32 -right-32 w-[500px] h-[500px] rounded-full opacity-15"
         style="background: radial-gradient(circle, rgba(34,168,74,0.3) 0%, transparent 70%);"></div>
    <div class="animate-float3 absolute top-1/3 right-1/4 w-64 h-64 rounded-full opacity-10"
         style="background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);"></div>

    <!-- Small floating shapes -->
    <div class="animate-float2 absolute top-20 right-[15%] w-3 h-3 rounded-full bg-primary-400 opacity-40"></div>
    <div class="animate-float1 absolute top-[40%] left-[10%] w-2 h-2 rounded-full bg-primary-300 opacity-30"></div>
    <div class="animate-float3 absolute bottom-[30%] left-[20%] w-4 h-4 rounded-full bg-emerald-400 opacity-20"></div>
    <div class="animate-float1 absolute top-[60%] right-[8%] w-2.5 h-2.5 rounded-full bg-teal-300 opacity-25"></div>
    <div class="animate-float2 absolute bottom-[15%] left-[45%] w-3 h-3 rounded-full bg-primary-500 opacity-20"></div>

    <!-- Geometric lines -->
    <div class="animate-float3 absolute top-[15%] left-[30%] w-16 h-16 rounded-full border border-white/5"></div>
    <div class="animate-float1 absolute bottom-[20%] right-[25%] w-24 h-24 rounded-full border border-white/5"></div>
    <div class="animate-float2 absolute top-[50%] left-[5%] w-20 h-20 rounded-full border border-primary-500/10"></div>
  </div>

  <!-- Main container -->
  <div class="relative z-10 min-h-screen flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-[460px]">

      <!-- Card -->
      <div class="glass-strong rounded-3xl shadow-2xl shadow-black/20 overflow-hidden animate-fade-in-up">

        <!-- Top accent bar -->
        <div class="h-1.5 w-full" style="background: linear-gradient(90deg, #1a8a3d 0%, #22a84a 30%, #42c881 60%, #22a84a 100%);"></div>

        <!-- Card body -->
        <div class="px-10 pt-8 pb-10">

          <!-- Logo area -->
          <div class="text-center mb-8 animate-fade-in-up">
            <!-- Logo icon -->
            <div class="mx-auto mb-4 w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg"
                 style="background: linear-gradient(135deg, #1a8a3d 0%, #22a84a 50%, #42c881 100%);
                        box-shadow: 0 8px 32px rgba(34,168,74,0.35);">
              <span class="iconify text-white" data-icon="mdi:village" data-width="32" data-height="32"></span>
            </div>

            <!-- Title -->
            <h1 class="text-2xl font-bold text-gray-800 tracking-wide">数字乡村管理系统</h1>

            <!-- Subtitle -->
            <div class="mt-2 flex items-center justify-center gap-1.5">
              <span class="inline-block w-8 h-px bg-gray-300"></span>
              <span class="text-sm text-gray-500 font-medium">数字乡村（村级版）V1.0</span>
              <span class="inline-block w-8 h-px bg-gray-300"></span>
            </div>
          </div>

          <!-- Login form -->
          <div class="space-y-5 animate-fade-in-up-delay">

            <!-- Username -->
            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1.5">用户名</label>
              <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                  <span class="iconify text-gray-400 group-focus-within:text-primary-500 transition-colors duration-200"
                        data-icon="mdi:account-outline" data-width="20" data-height="20"></span>
                </div>
                <input type="text" value="admin" placeholder="请输入用户名"
                       class="input-glow w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50/80 text-gray-800 text-sm
                              placeholder-gray-400 focus:outline-none focus:border-primary-500 focus:bg-white
                              transition-all duration-300">
              </div>
            </div>

            <!-- Password -->
            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1.5">密码</label>
              <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                  <span class="iconify text-gray-400 group-focus-within:text-primary-500 transition-colors duration-200"
                        data-icon="mdi:lock-outline" data-width="20" data-height="20"></span>
                </div>
                <input id="passwordInput" type="password" value="123456" placeholder="请输入密码"
                       class="input-glow w-full pl-10 pr-11 py-3 rounded-xl border border-gray-200 bg-gray-50/80 text-gray-800 text-sm
                              placeholder-gray-400 focus:outline-none focus:border-primary-500 focus:bg-white
                              transition-all duration-300">
                <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center">
                  <span id="eyeIcon" class="iconify text-gray-400 hover:text-gray-600 transition-colors cursor-pointer"
                        data-icon="mdi:eye-off-outline" data-width="20" data-height="20"></span>
                </button>
              </div>
            </div>

            <!-- Remember & Forgot -->
            <div class="flex items-center justify-between pt-1">
              <label class="flex items-center gap-2 cursor-pointer group">
                <input type="checkbox" checked class="w-4 h-4 rounded border-gray-300 text-primary-500 focus:ring-primary-500/30
                       accent-primary-500 cursor-pointer">
                <span class="text-sm text-gray-600 group-hover:text-gray-700 transition-colors select-none">记住密码</span>
              </label>
              <a href="javascript:void(0)" class="text-sm text-primary-600 hover:text-primary-700 font-medium
                        transition-colors duration-200 hover:underline underline-offset-2">
                忘记密码？
              </a>
            </div>

            <!-- Login button -->
            <div class="pt-2">
              <button onclick="window.location.href='index.html'"
                      class="relative w-full py-3.5 rounded-xl text-white font-semibold text-base
                             overflow-hidden transition-all duration-300
                             hover:shadow-lg hover:shadow-primary-500/25 hover:-translate-y-0.5
                             active:translate-y-0 active:shadow-md
                             focus:outline-none focus:ring-2 focus:ring-primary-500/40 focus:ring-offset-2"
                      style="background: linear-gradient(135deg, #1a8a3d 0%, #22a84a 50%, #28c060 100%);">
                <span class="shimmer-btn absolute inset-0"></span>
                <span class="relative z-10 flex items-center justify-center gap-2">
                  <span class="iconify" data-icon="mdi:login" data-width="20" data-height="20"></span>
                  <span>登 录</span>
                </span>
              </button>
            </div>
          </div>

          <!-- Footer -->
          <div class="mt-8 pt-6 border-t border-gray-100 text-center animate-fade-in-up-delay2">
            <div class="flex items-center justify-center gap-1.5 text-xs text-gray-400">
              <span class="iconify" data-icon="mdi:shield-check-outline" data-width="14" data-height="14"></span>
              <span>安全连接 · 数据已加密传输</span>
            </div>
            <p class="mt-2 text-xs text-gray-300">Copyright &copy; 2026 数字乡村管理系统 · All Rights Reserved</p>
          </div>

        </div>
      </div>

      <!-- Bottom hint -->
      <div class="text-center mt-6 animate-fade-in-up-delay2">
        <p class="text-xs text-white/30">
          <span class="iconify inline-block align-middle mr-1" data-icon="mdi:information-outline" data-width="14" data-height="14"></span>
          默认账号: admin / 123456
        </p>
      </div>

    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-icon', 'mdi:eye-outline');
      } else {
        input.type = 'password';
        icon.setAttribute('data-icon', 'mdi:eye-off-outline');
      }
    }
  </script>
</body>
</html>
