<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组织架构 - 数字乡村管理系统</title>
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <style>
    .tree-search { display: inline-flex; align-items: center; position: relative; margin: 0 8px; }
    .tree-search .search-icon { position: absolute; left: 8px; color: #909399; font-size: 14px; pointer-events: none; }
    .tree-search .form-input { padding-left: 30px; width: 180px; height: 30px; font-size: 13px; }
    .node-content.active { background: #ecf5ff; border-color: #409eff; }
    button.node-content { border: none; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; width: 100%; text-align: left; }
  </style>
</head>
<body style="background:#f0f2f5">

  <!-- 左右分栏 -->
  <div class="org-layout">
    <!-- 左侧树 -->
    <div class="tree-panel">
      <div class="tree-toolbar">
        <button class="btn btn-sm btn-outline" onclick="expandAllTree()"><span class="iconify" data-icon="ri:expand-up-down-line"></span> 展开全部</button>
        <button class="btn btn-sm btn-outline" onclick="collapseAllTree()"><span class="iconify" data-icon="ri:collapse-up-down-line"></span> 折叠全部</button>
        <div class="tree-search">
          <span class="iconify search-icon" data-icon="ri:search-line"></span>
          <input type="text" class="form-input" placeholder="搜索节点名称..." id="treeSearchInput" oninput="filterTree(this.value)">
        </div>
        <button class="btn btn-sm btn-primary" onclick="openModal('addNodeModal')"><span class="iconify" data-icon="ri:add-circle-line"></span> 新增子节点</button>
      </div>
      <ul class="tree-node">
        <!-- 幸福村（根节点） -->
        <li>
          <button type="button" class="node-content active" onclick="selectTreeNode(this)">
            <span class="toggle-icon expanded" onclick="event.stopPropagation();toggleTreeNode(this)">&#9654;</span>
            <span class="node-icon">&#127960;</span>
            <span class="node-label" style="color:#409eff;font-weight:600">幸福村</span>
          </button>
          <ul class="tree-children">
            <!-- 第一村民小组 -->
            <li>
              <button type="button" class="node-content" onclick="selectTreeNode(this)">
                <span class="toggle-icon expanded" onclick="event.stopPropagation();toggleTreeNode(this)">&#9654;</span>
                <span class="node-icon">&#128101;</span>
                <span class="node-label" style="color:#67c23a">第一村民小组</span>
              </button>
              <ul class="tree-children">
                <li>
                  <button type="button" class="node-content" onclick="selectTreeNode(this)">
                    <span class="toggle-icon" style="visibility:hidden">&#9654;</span>
                    <span class="node-icon">&#128205;</span>
                    <span class="node-label" style="color:#e6a23c">第一网格</span>
                  </button>
                </li>
                <li>
                  <button type="button" class="node-content" onclick="selectTreeNode(this)">
                    <span class="toggle-icon" style="visibility:hidden">&#9654;</span>
                    <span class="node-icon">&#128205;</span>
                    <span class="node-label" style="color:#e6a23c">第二网格</span>
                  </button>
                </li>
              </ul>
            </li>
            <!-- 第二村民小组 -->
            <li>
              <button type="button" class="node-content" onclick="selectTreeNode(this)">
                <span class="toggle-icon expanded" onclick="event.stopPropagation();toggleTreeNode(this)">&#9654;</span>
                <span class="node-icon">&#128101;</span>
                <span class="node-label" style="color:#67c23a">第二村民小组</span>
              </button>
              <ul class="tree-children">
                <li>
                  <button type="button" class="node-content" onclick="selectTreeNode(this)">
                    <span class="toggle-icon" style="visibility:hidden">&#9654;</span>
                    <span class="node-icon">&#128205;</span>
                    <span class="node-label" style="color:#e6a23c">第三网格</span>
                  </button>
                </li>
                <li>
                  <button type="button" class="node-content" onclick="selectTreeNode(this)">
                    <span class="toggle-icon" style="visibility:hidden">&#9654;</span>
                    <span class="node-icon">&#128205;</span>
                    <span class="node-label" style="color:#e6a23c">第四网格</span>
                  </button>
                </li>
              </ul>
            </li>
            <!-- 第三村民小组 -->
            <li>
              <button type="button" class="node-content" onclick="selectTreeNode(this)">
                <span class="toggle-icon expanded" onclick="event.stopPropagation();toggleTreeNode(this)">&#9654;</span>
                <span class="node-icon">&#128101;</span>
                <span class="node-label" style="color:#67c23a">第三村民小组</span>
              </button>
              <ul class="tree-children">
                <li>
                  <button type="button" class="node-content" onclick="selectTreeNode(this)">
                    <span class="toggle-icon" style="visibility:hidden">&#9654;</span>
                    <span class="node-icon">&#128205;</span>
                    <span class="node-label" style="color:#e6a23c">第五网格</span>
                  </button>
                </li>
                <li>
                  <button type="button" class="node-content" onclick="selectTreeNode(this)">
                    <span class="toggle-icon" style="visibility:hidden">&#9654;</span>
                    <span class="node-icon">&#128205;</span>
                    <span class="node-label" style="color:#e6a23c">第六网格</span>
                  </button>
                </li>
              </ul>
            </li>
          </ul>
        </li>
      </ul>
    </div>

    <!-- 右侧节点详情 -->
    <div class="detail-panel">
      <div class="detail-header">
        <h3 style="font-size:16px;font-weight:600;color:#333">节点详情 - 幸福村</h3>
        <div>
          <button class="btn btn-sm" onclick="showToast('已取消修改', 'info')">取 消</button>
          <button class="btn btn-sm btn-primary" onclick="showToast('保存成功', 'success')">保 存</button>
        </div>
      </div>

      <div style="max-width:500px">
        <div class="form-group">
          <label>节点名称 <span class="required">*</span></label>
          <input type="text" class="form-input" value="幸福村">
        </div>
        <div class="form-group">
          <label>节点编码 <span class="required">*</span></label>
          <input type="text" class="form-input" value="XFV_ROOT">
        </div>
        <div class="form-group">
          <label>上级节点</label>
          <input type="text" class="form-input" value="无（根节点）" style="background:#f5f7fa;color:#909399" readonly>
        </div>
        <div class="form-group">
          <label>负责人</label>
          <select class="form-select">
            <option>李书记</option>
            <option>王主任</option>
            <option>张委员</option>
          </select>
        </div>
        <div class="form-group">
          <label>节点描述</label>
          <textarea class="form-textarea" placeholder="请输入节点描述">幸福村下辖3个村民小组，6个网格，共有村民2,856人。</textarea>
        </div>
        <div class="form-group">
          <label>人员数量</label>
          <input type="text" class="form-input" value="2,856" style="background:#f5f7fa;color:#909399" readonly>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增子节点弹窗 -->
  <div class="modal-overlay" id="addNodeModal">
    <div class="modal">
      <div class="modal-header">
        <h3>新增子节点</h3>
        <button type="button" class="modal-close" onclick="closeModal('addNodeModal')" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>节点名称 <span class="required">*</span></label>
          <input type="text" class="form-input" placeholder="请输入节点名称" required>
        </div>
        <div class="form-group">
          <label>节点编码 <span class="required">*</span></label>
          <input type="text" class="form-input" placeholder="请输入节点编码" required>
        </div>
        <div class="form-group">
          <label>节点类型</label>
          <select class="form-select">
            <option>村</option>
            <option>村民小组</option>
            <option>网格</option>
          </select>
        </div>
        <div class="form-group">
          <label>负责人</label>
          <select class="form-select">
            <option>李书记</option>
            <option>王主任</option>
            <option>张委员</option>
            <option>赵网格员</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('addNodeModal')">取 消</button>
        <button class="btn btn-primary" onclick="closeModal('addNodeModal');showToast('节点添加成功','success')">保 存</button>
      </div>
    </div>
  </div>

  <script>
  function filterTree(keyword) {
    var nodes = document.querySelectorAll('.node-content');
    var lower = keyword.toLowerCase();
    nodes.forEach(function(node) {
      var label = node.querySelector('.node-label');
      if (!label) return;
      var text = label.textContent.toLowerCase();
      var parentLi = node.closest('li');
      if (!lower || text.indexOf(lower) > -1) {
        parentLi.style.display = '';
        // Show parent ul
        var parentUl = parentLi.parentElement;
        while (parentUl && parentUl.classList.contains('tree-children')) {
          parentUl.style.display = '';
          parentUl.parentElement.style.display = '';
          parentUl = parentUl.parentElement.parentElement;
        }
      } else {
        parentLi.style.display = 'none';
      }
    });
  }
  function expandAllTree() {
    document.querySelectorAll('.toggle-icon').forEach(function(icon) {
      icon.classList.add('expanded');
      icon.style.transform = 'rotate(90deg)';
      var children = icon.closest('li').querySelector(':scope > .tree-children');
      if (children) children.style.display = '';
    });
  }
  function collapseAllTree() {
    document.querySelectorAll('.toggle-icon').forEach(function(icon) {
      icon.classList.remove('expanded');
      icon.style.transform = '';
      var children = icon.closest('li').querySelector(':scope > .tree-children');
      if (children) children.style.display = 'none';
    });
  }
  function selectTreeNode(el) {
    document.querySelectorAll('.node-content').forEach(function(n) { n.classList.remove('active'); });
    el.classList.add('active');
    var label = el.querySelector('.node-label');
    document.querySelector('.detail-header h3').textContent = '节点详情 - ' + (label ? label.textContent : '');
  }
  function toggleTreeNode(icon) {
    var li = icon.closest('li');
    var children = li.querySelector(':scope > .tree-children');
    if (!children) return;
    var isExpanded = icon.classList.contains('expanded');
    if (isExpanded) {
      icon.classList.remove('expanded');
      icon.style.transform = '';
      children.style.display = 'none';
    } else {
      icon.classList.add('expanded');
      icon.style.transform = 'rotate(90deg)';
      children.style.display = '';
    }
  }
  </script>
  <script src="../js/admin.js"></script>
</body>
</html>
