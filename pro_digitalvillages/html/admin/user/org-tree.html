<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组织架构 - 数字乡村管理系统</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body style="background:#f0f2f5">

  <!-- 面包屑 -->
  <ul class="breadcrumb">
    <li><a href="javascript:void(0)">用户与组织</a></li>
    <li>组织架构</li>
  </ul>

  <!-- 左右分栏 -->
  <div class="org-layout">
    <!-- 左侧树 -->
    <div class="tree-panel">
      <div class="tree-toolbar">
        <button class="btn btn-sm" onclick="expandAllTree()">展开全部</button>
        <button class="btn btn-sm" onclick="collapseAllTree()">折叠全部</button>
        <button class="btn btn-sm btn-primary" onclick="openModal('addNodeModal')">+ 新增子节点</button>
      </div>
      <ul class="tree-node">
        <!-- 幸福村（根节点） -->
        <li>
          <div class="node-content active" onclick="selectTreeNode(this)">
            <span class="toggle-icon expanded" onclick="event.stopPropagation();toggleTreeNode(this)">&#9654;</span>
            <span class="node-icon">&#127960;</span>
            <span class="node-label" style="color:#409eff;font-weight:600">幸福村</span>
          </div>
          <ul class="tree-children">
            <!-- 第一村民小组 -->
            <li>
              <div class="node-content" onclick="selectTreeNode(this)">
                <span class="toggle-icon expanded" onclick="event.stopPropagation();toggleTreeNode(this)">&#9654;</span>
                <span class="node-icon">&#128101;</span>
                <span class="node-label" style="color:#67c23a">第一村民小组</span>
              </div>
              <ul class="tree-children">
                <li>
                  <div class="node-content" onclick="selectTreeNode(this)">
                    <span class="toggle-icon" style="visibility:hidden">&#9654;</span>
                    <span class="node-icon">&#128205;</span>
                    <span class="node-label" style="color:#e6a23c">第一网格</span>
                  </div>
                </li>
                <li>
                  <div class="node-content" onclick="selectTreeNode(this)">
                    <span class="toggle-icon" style="visibility:hidden">&#9654;</span>
                    <span class="node-icon">&#128205;</span>
                    <span class="node-label" style="color:#e6a23c">第二网格</span>
                  </div>
                </li>
              </ul>
            </li>
            <!-- 第二村民小组 -->
            <li>
              <div class="node-content" onclick="selectTreeNode(this)">
                <span class="toggle-icon expanded" onclick="event.stopPropagation();toggleTreeNode(this)">&#9654;</span>
                <span class="node-icon">&#128101;</span>
                <span class="node-label" style="color:#67c23a">第二村民小组</span>
              </div>
              <ul class="tree-children">
                <li>
                  <div class="node-content" onclick="selectTreeNode(this)">
                    <span class="toggle-icon" style="visibility:hidden">&#9654;</span>
                    <span class="node-icon">&#128205;</span>
                    <span class="node-label" style="color:#e6a23c">第三网格</span>
                  </div>
                </li>
                <li>
                  <div class="node-content" onclick="selectTreeNode(this)">
                    <span class="toggle-icon" style="visibility:hidden">&#9654;</span>
                    <span class="node-icon">&#128205;</span>
                    <span class="node-label" style="color:#e6a23c">第四网格</span>
                  </div>
                </li>
              </ul>
            </li>
            <!-- 第三村民小组 -->
            <li>
              <div class="node-content" onclick="selectTreeNode(this)">
                <span class="toggle-icon expanded" onclick="event.stopPropagation();toggleTreeNode(this)">&#9654;</span>
                <span class="node-icon">&#128101;</span>
                <span class="node-label" style="color:#67c23a">第三村民小组</span>
              </div>
              <ul class="tree-children">
                <li>
                  <div class="node-content" onclick="selectTreeNode(this)">
                    <span class="toggle-icon" style="visibility:hidden">&#9654;</span>
                    <span class="node-icon">&#128205;</span>
                    <span class="node-label" style="color:#e6a23c">第五网格</span>
                  </div>
                </li>
                <li>
                  <div class="node-content" onclick="selectTreeNode(this)">
                    <span class="toggle-icon" style="visibility:hidden">&#9654;</span>
                    <span class="node-icon">&#128205;</span>
                    <span class="node-label" style="color:#e6a23c">第六网格</span>
                  </div>
                </li>
              </ul>
            </li>
          </ul>
        </li>
      </ul>
    </div>

    <!-- 右侧节点详情 -->
    <div class="detail-panel">
      <div class="detail-header">
        <h3 style="font-size:16px;font-weight:600;color:#333">节点详情 - 幸福村</h3>
        <div>
          <button class="btn btn-sm" onclick="showToast('已取消修改', 'info')">取 消</button>
          <button class="btn btn-sm btn-primary" onclick="showToast('保存成功', 'success')">保 存</button>
        </div>
      </div>

      <div style="max-width:500px">
        <div class="form-group">
          <label>节点名称 <span class="required">*</span></label>
          <input type="text" class="form-input" value="幸福村">
        </div>
        <div class="form-group">
          <label>节点编码 <span class="required">*</span></label>
          <input type="text" class="form-input" value="XFV_ROOT">
        </div>
        <div class="form-group">
          <label>上级节点</label>
          <input type="text" class="form-input" value="无（根节点）" style="background:#f5f7fa;color:#909399" readonly>
        </div>
        <div class="form-group">
          <label>负责人</label>
          <select class="form-select">
            <option>李书记</option>
            <option>王主任</option>
            <option>张委员</option>
          </select>
        </div>
        <div class="form-group">
          <label>节点描述</label>
          <textarea class="form-textarea" placeholder="请输入节点描述">幸福村下辖3个村民小组，6个网格，共有村民2,856人。</textarea>
        </div>
        <div class="form-group">
          <label>人员数量</label>
          <input type="text" class="form-input" value="2,856" style="background:#f5f7fa;color:#909399" readonly>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增子节点弹窗 -->
  <div class="modal-overlay" id="addNodeModal">
    <div class="modal">
      <div class="modal-header">
        <h3>新增子节点</h3>
        <span class="modal-close" onclick="closeModal('addNodeModal')">&times;</span>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>节点名称 <span class="required">*</span></label>
          <input type="text" class="form-input" placeholder="请输入节点名称" required>
        </div>
        <div class="form-group">
          <label>节点编码 <span class="required">*</span></label>
          <input type="text" class="form-input" placeholder="请输入节点编码" required>
        </div>
        <div class="form-group">
          <label>节点类型</label>
          <select class="form-select">
            <option>村</option>
            <option>村民小组</option>
            <option>网格</option>
          </select>
        </div>
        <div class="form-group">
          <label>负责人</label>
          <select class="form-select">
            <option>李书记</option>
            <option>王主任</option>
            <option>张委员</option>
            <option>赵网格员</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('addNodeModal')">取 消</button>
        <button class="btn btn-primary" onclick="closeModal('addNodeModal');showToast('节点添加成功','success')">保 存</button>
      </div>
    </div>
  </div>

  <script src="../js/admin.js"></script>
</body>
</html>
