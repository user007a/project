<!DOCTYPE html>

          <td>全村</td>

          <td class="op-cell">
            <button class="btn-op btn-op-edit" onclick="openModal('editRuleModal');fillRuleEdit(this)"><span class="iconify" data-icon="ri:edit-line"></span>编辑</button>

          <td><span class="text-green fw-bold">+5</span></td>
          <td>指定组</td>
          <td>34次</td>
          <td><span class="tag tag-green">启用</span></td>
          <td class="op-cell">
            <button class="btn-op btn-op-edit" onclick="openModal('editRuleModal');fillRuleEdit(this)"><span class="iconify" data-icon="ri:edit-line"></span>编辑</button>
            <span class="op-divider"></span>

          <td class="op-cell">
            <button class="btn-op btn-op-edit" onclick="openModal('editRuleModal');fillRuleEdit(this)"><span class="iconify" data-icon="ri:edit-line"></span>编辑</button>

        <tr data-name="邻里纠纷调解成功" data-type="加分" data-score="8" data-scope="全村" data-desc="成功调解邻里纠纷，经双方确认后加分。" data-status="启用">
          <td class="text-center"><input type="checkbox"></td>

          <td><span class="tag tag-green">加分</span></td>
          <td><span class="text-green fw-bold">+8</span></td>
          <td>全村</td>
          <td>23次</td>
          <td><span class="tag tag-green">启用</span></td>
          <td class="op-cell">
            <button class="btn-op btn-op-edit" onclick="openModal('editRuleModal');fillRuleEdit(this)"><span class="iconify" data-icon="ri:edit-line"></span>编辑</button>
            <span class="op-divider"></span>
            <button class="btn-op btn-op-warning" onclick="showConfirm({title:'停用确认',message:'确定停用该规则吗？',onConfirm:function(){showToast('已停用','success')}})"><span class="iconify" data-icon="ri:close-circle-line"></span>停用</button>
            <span class="op-divider"></span>
            <button class="btn-op btn-op-danger" onclick="showConfirm({title:'删除确认',message:'确定删除该规则吗？删除后不可恢复。',onConfirm:function(){showToast('删除成功','success')}})"><span class="iconify" data-icon="ri:delete-bin-line"></span>删除</button>
          </td>
        </tr>
        <tr data-name="违规搭建" data-type="减分" data-score="-20" data-scope="全村" data-desc="未经批准擅自在村内违规搭建建筑物，经查实后减分。" data-status="停用">
          <td class="text-center"><input type="checkbox"></td>
          <td>违规搭建</td>
          <td><span class="tag tag-red">减分</span></td>
          <td><span class="text-red fw-bold">-20</span></td>
          <td>全村</td>
          <td>5次</td>
          <td><span class="tag tag-gray">停用</span></td>
          <td class="op-cell">
            <button class="btn-op btn-op-edit" onclick="openModal('editRuleModal');fillRuleEdit(this)"><span class="iconify" data-icon="ri:edit-line"></span>编辑</button>
            <span class="op-divider"></span>
            <button class="btn-op btn-op-warning" onclick="showConfirm({title:'启用确认',message:'确定启用该规则吗？',onConfirm:function(){showToast('已启用','success')}})"><span class="iconify" data-icon="ri:checkbox-circle-line"></span>启用</button>
            <span class="op-divider"></span>
            <button class="btn-op btn-op-danger" onclick="showConfirm({title:'删除确认',message:'确定删除该规则吗？删除后不可恢复。',onConfirm:function(){showToast('删除成功','success')}})"><span class="iconify" data-icon="ri:delete-bin-line"></span>删除</button>
          </td>

        <tr data-name="主动参与垃圾分类" data-type="加分" data-score="2" data-scope="指定组" data-desc="主动参与村组垃圾分类活动，每次加分。" data-status="启用">
          <td class="text-center"><input type="checkbox"></td>
          <td>主动参与垃圾分类</td>
          <td><span class="tag tag-green">加分</span></td>
          <td><span class="text-green fw-bold">+2</span></td>
          <td>指定组</td>
          <td>67次</td>
          <td><span class="tag tag-green">启用</span></td>
          <td class="op-cell">
            <button class="btn-op btn-op-edit" onclick="openModal('editRuleModal');fillRuleEdit(this)"><span class="iconify" data-icon="ri:edit-line"></span>编辑</button>
            <span class="op-divider"></span>

            <span class="op-divider"></span>
            <button class="btn-op btn-op-danger" onclick="showConfirm({title:'删除确认',message:'确定删除该规则吗？删除后不可恢复。',onConfirm:function(){showToast('删除成功','success')}})"><span class="iconify" data-icon="ri:delete-bin-line"></span>删除</button>
          </td>

    <div class="pagination">
      <span class="page-total">共 8 条记录</span>
      <div class="page-btns">
        <button type="button" class="page-btn disabled">&laquo;</button>
        <button type="button" class="page-btn active">1</button>
        <button type="button" class="page-btn disabled">&raquo;</button>

<script src="../js/admin.js"></script>

<!-- 新增规则弹窗 -->
<div class="modal-overlay" id="addRuleModal">
  <div class="modal">
    <div class="modal-header">
      <h3>新增规则</h3>
      <button type="button" class="modal-close" onclick="closeModal('addRuleModal')" aria-label="关闭">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>规则名称 <span class="required">*</span></label>
        <input type="text" class="form-input" placeholder="请输入规则名称">
      </div>
      <div class="form-group">
        <label>加减分类型 <span class="required">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="addRuleType" value="加分" checked> 加分</label>
          <label><input type="radio" name="addRuleType" value="减分"> 减分</label>
        </div>
      </div>
      <div class="form-group">
        <label>分值 <span class="required">*</span></label>
        <input type="number" class="form-input" placeholder="请输入分值">
      </div>
      <div class="form-group">
        <label>适用范围</label>
        <select class="form-select">
          <option>全村</option>
          <option>指定组</option>
        </select>
      </div>
      <div class="form-group">
        <label>规则描述</label>
        <textarea class="form-textarea" placeholder="请输入规则描述"></textarea>
      </div>
      <div class="form-group">
        <label>状态</label>
        <select class="form-select">
          <option>启用</option>
          <option>停用</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('addRuleModal')">取消</button>
      <button class="btn btn-primary" onclick="closeModal('addRuleModal');showToast('新增成功','success')">确定</button>
    </div>
  </div>
</div>

<!-- 编辑规则弹窗 -->
<div class="modal-overlay" id="editRuleModal">
  <div class="modal">
    <div class="modal-header">
      <h3>编辑规则</h3>
      <button type="button" class="modal-close" onclick="closeModal('editRuleModal')" aria-label="关闭">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>规则名称 <span class="required">*</span></label>
        <input type="text" class="form-input" value="参与志愿服务">
      </div>
      <div class="form-group">
        <label>加减分类型 <span class="required">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="editRuleType" value="加分" checked> 加分</label>
          <label><input type="radio" name="editRuleType" value="减分"> 减分</label>
        </div>
      </div>
      <div class="form-group">
        <label>分值 <span class="required">*</span></label>
        <input type="number" class="form-input" value="10">
      </div>
      <div class="form-group">
        <label>适用范围</label>
        <select class="form-select">
          <option>全村</option>
          <option>指定组</option>
        </select>
      </div>
      <div class="form-group">
        <label>规则描述</label>
        <textarea class="form-textarea">积极参与村内组织的各类志愿服务活动，每次加分。</textarea>
      </div>
      <div class="form-group">
        <label>状态</label>
        <select class="form-select">
          <option>启用</option>
          <option>停用</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('editRuleModal')">取消</button>
      <button class="btn btn-primary" onclick="closeModal('editRuleModal');showToast('保存成功','success')">确定</button>
    </div>
  </div>
</div>

<script>
function fillRuleEdit(btn) {
  var row = btn.closest('tr');
  var modal = document.getElementById('editRuleModal');
  if (!row || !modal) return;
  var inputs = modal.querySelectorAll('.form-input');
  var textareas = modal.querySelectorAll('.form-textarea');
  var selects = modal.querySelectorAll('.form-select');
  var radios = modal.querySelectorAll('input[name="editRuleType"]');
  if (inputs[0]) inputs[0].value = row.dataset.name || '';
  var scoreVal = Math.abs(parseInt(row.dataset.score) || 0);
  if (inputs[1]) inputs[1].value = scoreVal;
  if (radios.length >= 2) {
    radios[0].checked = (row.dataset.type === '加分');
    radios[1].checked = (row.dataset.type === '减分');
  }
  if (selects[0]) {
    for (var i = 0; i < selects[0].options.length; i++) {
      selects[0].options[i].selected = (selects[0].options[i].text === (row.dataset.scope || '全村'));
    }
  }
  if (textareas[0]) textareas[0].value = row.dataset.desc || '';
  if (selects[1]) {
    for (var i = 0; i < selects[1].options.length; i++) {
      selects[1].options[i].selected = (selects[1].options[i].text === (row.dataset.status || '启用'));
    }
  }
}
</script>

</body>
</html>
