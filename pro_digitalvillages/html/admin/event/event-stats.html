<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件统计</title>
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body>
<div class="admin-page">
  <div class="page-header">
    <h2>事件统计</h2>
    <span class="text-muted">事件处理数据统计与分析</span>
  </div>

  <!-- 统计卡片 -->
  <div class="stat-cards">
    <div class="stat-card">
      <div class="stat-icon" style="background:#ecf5ff;color:#409eff;"><span class="iconify" data-icon="ri:alarm-warning-line"></span></div>
      <div class="stat-info">
        <div class="stat-value">48</div>
        <div class="stat-label">事件总数</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#f0f9eb;color:#67c23a;"><span class="iconify" data-icon="ri:checkbox-circle-line"></span></div>
      <div class="stat-info">
        <div class="stat-value">42</div>
        <div class="stat-label">已处理</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#fdf6ec;color:#e6a23c;"><span class="iconify" data-icon="ri:loader-line"></span></div>
      <div class="stat-info">
        <div class="stat-value">4</div>
        <div class="stat-label">处理中</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#fef0f0;color:#f56c6c;"><span class="iconify" data-icon="ri:error-warning-line"></span></div>
      <div class="stat-info">
        <div class="stat-value">2</div>
        <div class="stat-label">超时未处理</div>
      </div>
    </div>
  </div>

  <!-- 搜索栏 -->
  <div class="filter-bar">
    <div class="filter-item">
      <label>时间范围</label>
      <div class="date-range-group">
        <input type="date" class="form-input">
        <span>至</span>
        <input type="date" class="form-input">
      </div>
    </div>
    <div class="filter-actions">
      <button class="btn btn-primary btn-sm"><span class="iconify" data-icon="ri:search-line"></span> 查询</button>
      <button class="btn btn-search-reset btn-sm"><span class="iconify" data-icon="ri:refresh-line"></span> 重置</button>
    </div>
  </div>

  <!-- 事件类型统计表格 -->
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>事件类型</th>
          <th>总数</th>
          <th>已处理</th>
          <th>处理中</th>
          <th>超时</th>
          <th>处理率</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><span class="tag tag-green">环境卫生</span></td>
          <td>16</td>
          <td>14</td>
          <td>1</td>
          <td>1</td>
          <td>87.5%</td>
          <td class="op-cell">
            <button class="btn-op" onclick="showToast('查看环境卫生事件详情','info')"><span class="iconify" data-icon="ri:eye-line"></span>查看详情</button>
          </td>
        </tr>
        <tr>
          <td><span class="tag tag-blue">基础设施</span></td>
          <td>12</td>
          <td>11</td>
          <td>1</td>
          <td>0</td>
          <td>91.7%</td>
          <td class="op-cell">
            <button class="btn-op" onclick="showToast('查看基础设施事件详情','info')"><span class="iconify" data-icon="ri:eye-line"></span>查看详情</button>
          </td>
        </tr>
        <tr>
          <td><span class="tag tag-purple">邻里纠纷</span></td>
          <td>12</td>
          <td>10</td>
          <td>2</td>
          <td>0</td>
          <td>83.3%</td>
          <td class="op-cell">
            <button class="btn-op" onclick="showToast('查看邻里纠纷事件详情','info')"><span class="iconify" data-icon="ri:eye-line"></span>查看详情</button>
          </td>
        </tr>
        <tr>
          <td><span class="tag tag-red">安全隐患</span></td>
          <td>6</td>
          <td>5</td>
          <td>0</td>
          <td>1</td>
          <td>83.3%</td>
          <td class="op-cell">
            <button class="btn-op" onclick="showToast('查看安全隐患事件详情','info')"><span class="iconify" data-icon="ri:eye-line"></span>查看详情</button>
          </td>
        </tr>
        <tr>
          <td><span class="tag tag-gray">其他</span></td>
          <td>2</td>
          <td>2</td>
          <td>0</td>
          <td>0</td>
          <td>100%</td>
          <td class="op-cell">
            <button class="btn-op" onclick="showToast('查看其他事件详情','info')"><span class="iconify" data-icon="ri:eye-line"></span>查看详情</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script src="../js/admin.js"></script>
</body>
</html>
