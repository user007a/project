<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字乡村 - 登录</title>
  <link rel="stylesheet" href="css/villager.css">
</head>
<body>
  <div class="phone-container">
    <main class="login-page" aria-label="登录">
      <header>
        <div class="login-logo">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
        </div>
        <h1 style="font-size:22px;font-weight:600;color:#333;margin-bottom:8px;">数字乡村</h1>
        <p style="font-size:14px;color:#999;margin-bottom:40px;">智慧乡村服务平台</p>
      </header>
      <button class="login-btn" aria-label="微信授权登录" onclick="location.href='auth.html'">微信授权登录</button>
      <div class="login-other">其他登录方式</div>
      <div class="login-agreement">
        登录即表示同意<a role="link" href="javascript:void(0)">《用户服务协议》</a>和<a role="link" href="javascript:void(0)">《隐私政策》</a>
      </div>
    </main>
  </div>
  <script src="js/villager.js"></script>
</body>
</html>
