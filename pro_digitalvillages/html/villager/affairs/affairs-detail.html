<main class="page-content" style="padding-bottom:60px;"><div class="page-body"><div style="font-size:18px;font-weight:600;color:#333;line-height:1.4;margin-bottom:8px;">关于XX村党支部换届选举结果公示</div><div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;"><span class="tag tag-blue">村务</span><span style="font-size:12px;color:#999;">2026-06-15</span></div><div style="font-size:14px;color:#333;line-height:1.8;margin-bottom:16px;"><p style="margin:0 0 12px;">经村民大会投票表决，现将XX村党支部换届选举结果公示如下：</p><p style="margin:0 0 12px;">一、选举基本情况。本次选举于2026年6月10日在村委会大会议室举行，共有选民386人，实际到会312人，超过半数符合法定要求。</p><p style="margin:0 0 12px;">二、选举结果。经无记名投票，李建国同志当选为XX村党支部书记，王志强同志、陈大明同志当选为支部委员。</p><p style="margin:0;">公示期为5个工作日，如有异议请到村委会反映。</p></div><div class="attachment-list"><div style="font-size:14px;font-weight:500;color:#333;margin-bottom:8px;">附件</div><div class="attachment-item"><span class="attach-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span><span class="attach-name">换届选举结果公示文件.pdf</span><span class="attach-size">120KB</span></div><div class="attachment-item"><span class="attach-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span><span class="attach-name">选举现场照片.jpg</span><span class="attach-size">85KB</span></div></div><div class="read-count">阅读 128 次</div></div></main>
