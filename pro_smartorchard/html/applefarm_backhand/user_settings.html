<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧果园 - 个人设置</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
  <link rel="stylesheet" href="css/page-content.css">
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition: all 0.2s ease;
  }
  .module-card:hover {
    background: var(--bg-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
</style>
</head>
<body data-active-menu="settings" data-active-submenu="user-settings">

<!-- ===== 整体布局容器 ===== -->
<div class="app-layout">

  <!-- ===== 侧边栏 ===== -->
  <nav class="sidebar" aria-label="主导航">
    <!-- 品牌区 -->
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <!-- 苹果绿 Logo SVG -->
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 3C8 1 5 3 5 6.5C5 10 8 14 11 17C14 14 17 10 17 6.5C17 3 14 1 11 3Z" fill="rgba(34,168,74,0.2)"/>
          <path d="M11 5C9.5 4 7.5 5 7.5 7C7.5 9 9.5 12 11 14"/>
          <path d="M11 5C12.5 4 14.5 5 14.5 7C14.5 9 12.5 12 11 14"/>
          <path d="M11 3V1"/>
        </svg>
      </div>
      <span class="sidebar-brand-text">智慧果园</span>
    </div>

    <!-- 菜单主体（由 JS 动态渲染） -->
    <div class="sidebar-body"></div>

    <!-- 底部功能区 -->
    <div class="sidebar-footer">
      <button class="sidebar-footer-btn sidebar-collapse-btn" title="折叠侧边栏">
        <span class="collapse-icon">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 3L6 9L11 15"/><path d="M14 3V15"/>
          </svg>
        </span>
        <span class="btn-text">折叠</span>
      </button>
      <button class="sidebar-footer-btn" title="系统设置" id="btn-settings">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="9" r="2.5"/>
          <path d="M9 2V4M9 14V16M2 9H4M14 9H16M4.2 4.2L5.6 5.6M12.4 12.4L13.8 13.8M13.8 4.2L12.4 5.6M5.6 12.4L4.2 13.8"/>
        </svg>
        <span class="btn-text">设置</span>
      </button>
    </div>
  </nav>

  <!-- 移动端遮罩层 -->
  <div class="sidebar-overlay"></div>

  <!-- ===== 主内容区 ===== -->
  <div class="main-wrapper">

    <!-- 顶栏 -->
    <header class="topbar">
      <!-- 移动端汉堡菜单 -->
      <button class="topbar-hamburger" aria-label="打开导航菜单">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M3 6H19M3 11H19M3 16H19"/>
        </svg>
      </button>
      <!-- 右侧功能区 -->
      <div class="topbar-right">
        <!-- 通知铃铛 -->
        <button class="topbar-notification" title="消息通知">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2C7 2 5 4.5 5 7.5V12L3 14H17L15 12V7.5C15 4.5 13 2 10 2Z"/>
            <path d="M8.5 16C8.5 17 9.2 18 10 18C10.8 18 11.5 17 11.5 16"/>
          </svg>
          <span class="badge">3</span>
        </button>

        <!-- 用户信息 -->
        <div class="topbar-user">
          <div class="topbar-user-avatar">张</div>
          <span class="topbar-user-name">张三</span>
          <span class="topbar-user-arrow">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;">
              <path d="M3 5L6 8L9 5"/>
            </svg>
          </span>
        </div>

        <!-- 用户下拉菜单 -->
        <div class="topbar-user-dropdown">
          <div class="dropdown-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <circle cx="8" cy="5" r="3"/><path d="M2 15C2 11.5 5 10 8 10C11 10 14 11.5 14 15"/>
            </svg>
            个人中心
          </div>
          <div class="dropdown-item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M8 2V8L11 11"/><circle cx="8" cy="8" r="6"/>
            </svg>
            操作日志
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item" style="color:var(--error);">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M6 2H3C2.45 2 2 2.45 2 3V13C2 13.55 2.45 14 3 14H6"/><path d="M10 11L14 8L10 5"/><path d="M14 8H6"/>
            </svg>
            退出登录
          </div>
        </div>
      </div>
    </header>

    <!-- Tab 标签栏 -->
    <div class="tab-bar">
      <!-- Tab 标签由 JS 动态渲染 -->
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content">
<div class="snzg-panel">
    <div class="snzg-panel-header">
      <div class="snzg-panel-title"><span class="pt-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>基本信息</div>
    </div>
    <div class="snzg-panel-body">
      <div class="form-row-three">
        <div class="form-group" style="grid-column: span 3;">
          <div class="avatar-section">
            <div class="avatar-container">
              <div class="avatar">管</div>
              <div class="avatar-edit-btn"头像上传功能开发中', 'info')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:36px;height:36px;"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></div>
            </div>
            <p style="font-size:12px;color:#666;">点击更换头像</p>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">用户名 <span style="color:#ff4d4f;">*</span></label>
          <input type="text" class="form-input" id="username" value="admin" readonly style="background:#f5f5f5;">
        </div>
        <div class="form-group">
          <label class="form-label">姓名 <span style="color:#ff4d4f;">*</span></label>
          <input type="text" class="form-input" id="realName" value="系统管理员">
        </div>
        <div class="form-group">
          <label class="form-label">角色</label>
          <input type="text" class="form-input" value="超级管理员" readonly style="background:#f5f5f5;">
        </div>
        <div class="form-group">
          <label class="form-label">手机号 <span style="color:#ff4d4f;">*</span></label>
          <input type="text" class="form-input" id="phone" value="138****0001">
        </div>
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input type="text" class="form-input" id="email" value="admin@snzg.com">
        </div>
        <div class="form-group">
          <label class="form-label">性别</label>
          <select class="form-select" id="gender">
            <option value="male">男</option>
            <option value="female">女</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">所属基地</label>
          <input type="text" class="form-input" value="全部基地" readonly style="background:#f5f5f5;">
        </div>
        <div class="form-group">
          <label class="form-label">部门</label>
          <input type="text" class="form-input" id="department" value="技术部">
        </div>
        <div class="form-group">
          <label class="form-label">职位</label>
          <input type="text" class="form-input" id="position" value="系统管理员">
        </div>
        <div class="form-group" style="grid-column: span 3;">
          <label class="form-label">个人简介</label>
          <textarea class="form-textarea" id="bio" placeholder="请输入个人简介...">负责系统日常维护和管理工作</textarea>
        </div>
      </div>
    </div>
  </div>
  <div class="snzg-panel">
    <div class="snzg-panel-header">
      <div class="snzg-panel-title"><span class="pt-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg></span>账户信息</div>
    </div>
    <div class="snzg-panel-body">
      <div class="info-card">
        <div class="info-row">
          <span class="info-label">账户状态</span>
          <span class="info-value" style="color:#52c41a;">正常</span>
        </div>
        <div class="info-row">
          <span class="info-label">创建时间</span>
          <span class="info-value">2024-01-15 10:30:00</span>
        </div>
        <div class="info-row">
          <span class="info-label">最后登录</span>
          <span class="info-value">2024-05-20 10:30:15</span>
        </div>
        <div class="info-row">
          <span class="info-label">登录IP</span>
          <span class="info-value">192.168.1.100</span>
        </div>
        <div class="info-row">
          <span class="info-label">登录次数</span>
          <span class="info-value">1,256 次</span>
        </div>
      </div>
      <button class="jg-btn" style="width:100%;margin-top:8px;">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></span>修改登录密码
      </button>
    </div>
  </div>
    </main>
  </div>

</div>

<!-- 引入交互脚本 -->
<script src="js/sidebar-layout.js"></script>

<!-- 已通过质量审查（第2轮修正）- 严过审 2025-01-18 -->
  <script src="js/iframe-hide.js"></script>
</body>
</html>
