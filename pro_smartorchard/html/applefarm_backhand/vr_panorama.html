<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR基地全景展示 - 智慧果园管理后台</title>
<!-- 使用设计系统: Design System v2.0 + sidebar-layout -->
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="../../common/css/vr-styles.css">
<!-- Pannellum VR 全景库 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
  /* 模块卡片 hover 效果 */
  .module-card {
    transition: all 0.2s ease;
  }
  .module-card:hover {
    background: var(--bg-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  /* VR 全景容器 */
  #panorama {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* 场景导航 */
  .scene-nav {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.6);
    padding: 8px 16px;
    border-radius: 24px;
    backdrop-filter: blur(10px);
  }

  .scene-nav .nav-btn {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .scene-nav .nav-btn:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  .scene-nav .nav-btn.active {
    background: var(--primary-500, #22a84a);
    border-color: var(--primary-500, #22a84a);
  }

  /* 热点图标样式 */
  .hotspot-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    transition: all 0.2s;
  }

  .hotspot-icon:hover {
    transform: scale(1.15);
  }

  /* Pannellum 覆盖层样式 */
  .pnlm-controls-container {
    display: none !important;
  }

  .pnlm-load-box {
    background: rgba(34, 168, 74, 0.9) !important;
  }

  .pnlm-load-box div {
    color: #fff !important;
  }
</style>
</head>
<body data-active-menu="home">

<div id="panorama"></div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
document.addEventListener('DOMContentLoaded', function() {
    // 初始化场景导航按钮
    document.querySelectorAll('.nav-btn[data-scene]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var sceneId = this.dataset.scene;
            if (sceneId && sceneId !== currentSceneId) {
                switchScene(sceneId);
                // 更新按钮状态
                document.querySelectorAll('.nav-btn[data-scene]').forEach(function(b) {
                    b.classList.remove('active');
                });
                this.classList.add('active');
            }
        });
    });

    // 面板折叠
    document.querySelector('.panel-collapse').addEventListener('click', togglePanel);

    // Tooltip 关闭按钮
    document.querySelector('.tooltip-close').addEventListener('click', closeTooltip);

    // 覆盖层控制按钮
    document.querySelectorAll('.controls-overlay .control-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var title = this.getAttribute('title');
            if (!viewer) return;

            switch(title) {
                case '向上':
                    viewer.setPitch(viewer.getPitch() + 10);
                    break;
                case '向下':
                    viewer.setPitch(viewer.getPitch() - 10);
                    break;
                case '向左':
                    viewer.setYaw(viewer.getYaw() - 30);
                    break;
                case '向右':
                    viewer.setYaw(viewer.getYaw() + 30);
                    break;
                case '缩小':
                    viewer.setFov(Math.min(viewer.getFov() + 10, 120));
                    break;
                case '放大':
                    viewer.setFov(Math.max(viewer.getFov() - 10, 30));
                    break;
                case '重置视角':
                    viewer.setPitch(0);
                    viewer.setYaw(0);
                    viewer.setFov(100);
                    break;
            }
        });
    });

    // 初始化 VR 全景
    initViewer('scene_main');
});

// 全局变量
var viewer;
var currentSceneId = 'scene_main';
var isPanelCollapsed = false;

// 初始化全景查看器
function initViewer(sceneId) {
    var sceneData = vrHotspotsData.getSceneById(sceneId);
    if (!sceneData) {
        console.error('Scene not found:', sceneId);
        return;
    }

    // 销毁现有 viewer
    if (viewer) {
        viewer.destroy();
    }

    // 构建热点配置
    var hotSpots = [];
    sceneData.hotspots.forEach(function(hotspot) {
        hotSpots.push({
            pitch: hotspot.pitch,
            yaw: hotspot.yaw,
            type: 'custom',
            cssClass: 'vr-hotspot vr-hotspot-' + hotspot.type,
            HTML: getHotspotIcon(hotspot.type, hotspot.status),
            clickHandler: function() {
                showTooltip(hotspot);
            }
        });
    });

    // Pannellum 配置
    var config = {
        type: 'equirectangular',
        panorama: sceneData.image,
        title: sceneData.name,
        author: '智慧果园',
        autoLoad: true,
        showControls: false, // 使用自定义控制按钮
        mouseZoom: true,
        draggable: true,
        keyboardZoom: true,
        compass: true,
        hfov: sceneData.hfov || 100,
        hotSpots: hotSpots,
        strings: {
            loadButtonLabel: '加载全景',
            loadingLabel: '加载中...',
            bylineLabel: '智慧果园'
        }
    };

    // 创建 viewer
    try {
        viewer = pannellum.viewer('panorama', config);
        currentSceneId = sceneId;
        updateSceneIndicator(sceneData.name);

        // 监听视角变化更新指示器
        viewer.on('viewchange', function() {
            // 可以更新罗盘方向等
        });
    } catch (e) {
        console.error('Failed to initialize Pannellum:', e);
    }
}

// 获取热点图标
function getHotspotIcon(type, status) {
    var icons = {
        plot: '<i class="fas fa-leaf"></i>',
        device: '<i class="fas fa-microchip"></i>',
        task: '<i class="fas fa-tasks"></i>',
        building: '<i class="fas fa-building"></i>',
        scene: '<i class="fas fa-directions"></i>'
    };

    var colors = {
        normal: '#22c55e',
        warning: '#f59e0b',
        error: '#ef4444'
    };

    var color = colors[status] || colors.normal;
    var icon = icons[type] || icons.plot;

    return '<div class="hotspot-icon" style="color:' + color + ';">' + icon + '</div>';
}

// 显示信息弹窗
function showTooltip(hotspot) {
    document.getElementById('tooltipTitle').innerHTML = hotspot.title;
    document.getElementById('tooltipContent').innerHTML = hotspot.content;
    document.getElementById('infoTooltip').classList.add('show');

    // 场景切换热点的点击处理
    if (hotspot.type === 'scene' && hotspot.targetId) {
        var contentDiv = document.getElementById('tooltipContent');
        var linkEl = contentDiv.querySelector('div');
        if (linkEl) {
            linkEl.style.cursor = 'pointer';
            linkEl.onclick = function() {
                switchScene(hotspot.targetId);
                closeTooltip();
            };
        }
    }
}

// 关闭弹窗
function closeTooltip() {
    document.getElementById('infoTooltip').classList.remove('show');
}

// 切换场景
function switchScene(sceneId) {
    if (sceneId !== currentSceneId) {
        initViewer(sceneId);
    }
}

// 更新场景指示器
function updateSceneIndicator(name) {
    document.getElementById('sceneName').innerHTML = '<i class="fas fa-map-pin"></i> ' + name;
}

// 切换面板折叠状态
function togglePanel() {
    var panel = document.querySelector('.side-panel');
    var collapseBtn = document.querySelector('.panel-collapse');

    if (isPanelCollapsed) {
        panel.classList.remove('collapsed');
        collapseBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
    } else {
        panel.classList.add('collapsed');
        collapseBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
    }
    isPanelCollapsed = !isPanelCollapsed;
}

// 聚焦到热点
function focusHotspot(hotspotId) {
    var sceneData = vrHotspotsData.getSceneById(currentSceneId);
    if (!sceneData) return;

    var hotspot = sceneData.hotspots.find(function(h) {
        return h.id === hotspotId;
    });

    if (hotspot && viewer) {
        viewer.setPitch(hotspot.pitch);
        viewer.setYaw(hotspot.yaw);
        showTooltip(hotspot);
    }
}
</script>
