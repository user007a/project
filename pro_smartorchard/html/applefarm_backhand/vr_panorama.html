<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR基地全景展示 - 数农智果管理后台</title>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="../common/js/vr-hotspots.js"></script>
    <script src="../common/js/api-mock.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        #panorama {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .header-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #2b6e3c, #1f8a4c);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
        }
        .logo-text {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        .nav-section {
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .nav-btn.active {
            background: #2b6e3c;
            border-color: #2b6e3c;
        }
        .nav-btn.exit {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
        }
        .nav-btn.exit:hover {
            background: rgba(239, 68, 68, 0.4);
        }
        .side-panel {
            position: absolute;
            top: 80px;
            left: 15px;
            width: 320px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            z-index: 100;
        }
        .panel-header {
            padding: 14px 16px;
            background: rgba(43, 110, 60, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-title {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-collapse {
            width: 26px;
            height: 26px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 12px;
        }
        .panel-content {
            padding: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .content-section {
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
            padding-left: 8px;
            border-left: 3px solid #2b6e3c;
        }
        .info-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .info-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(4px);
        }
        .info-card.active {
            border-color: #2b6e3c;
            background: rgba(43, 110, 60, 0.2);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .card-title {
            color: #fff;
            font-size: 13px;
            font-weight: 500;
        }
        .card-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }
        .card-status.warning { background: #f59e0b; }
        .card-status.error { background: #ef4444; }
        .card-content {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
        }
        .device-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .device-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .device-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .device-icon {
            width: 32px;
            height: 32px;
            margin: 0 auto 6px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
            font-size: 16px;
        }
        .device-name {
            font-size: 11px;
            color: #fff;
        }
        .device-status {
            font-size: 10px;
            color: #22c55e;
            margin-top: 2px;
        }
        .legend-section {
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }
        .legend-items {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
        }
        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .legend-dot.plot { background: #22c55e; }
        .legend-dot.device { background: #3b82f6; }
        .legend-dot.task { background: #f59e0b; }
        .legend-dot.building { background: #8b5cf6; }
        .legend-dot.scene { background: #06b6d4; }
        .controls-overlay {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }
        .control-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        .info-tooltip {
            position: absolute;
            top: 80px;
            right: 15px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 280px;
            z-index: 100;
            display: none;
        }
        .info-tooltip.show {
            display: block;
        }
        .tooltip-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #22c55e;
        }
        .tooltip-content {
            font-size: 12px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }
        .tooltip-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }
        .scene-indicator {
            position: absolute;
            bottom: 25px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }
        .scene-name {
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .scene-name i {
            color: #22c55e;
        }
    </style>
</head>
<body>
    <div id="panorama"></div>
    
    <div class="header-overlay">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fas fa-apple-alt"></i>
            </div>
            <div class="logo-text">VR全景管理</div>
        </div>
        
        <div class="nav-section">
            <button class="nav-btn active" data-scene="scene_main">
                <i class="fas fa-home"></i> 主入口
            </button>
            <button class="nav-btn" data-scene="scene_b">
                <i class="fas fa-map-marker-alt"></i> B区
            </button>
            <button class="nav-btn" data-scene="scene_c">
                <i class="fas fa-map-marker-alt"></i> C区
            </button>
            <button class="nav-btn exit" onclick="goBack()">
                <i class="fas fa-arrow-left"></i> 返回首页
            </button>
        </div>
    </div>
    
    <div class="side-panel">
        <div class="panel-header">
            <div class="panel-title">
                <i class="fas fa-layer-group"></i> 基地概览
            </div>
            <div class="panel-collapse" onclick="togglePanel()">
                <i class="fas fa-chevron-left"></i>
            </div>
        </div>
        <div class="panel-content">
            <div class="content-section">
                <div class="section-title">地块信息</div>
                <div class="info-card" onclick="focusHotspot('hotspot_plot_a1')">
                    <div class="card-header">
                        <span class="card-title">A1地块</span>
                        <span class="card-status"></span>
                    </div>
                    <div class="card-content">红富士 · 8年树龄 · 25亩</div>
                </div>
                <div class="info-card" onclick="focusHotspot('hotspot_plot_b1')">
                    <div class="card-header">
                        <span class="card-title">B1地块</span>
                        <span class="card-status warning"></span>
                    </div>
                    <div class="card-content">嘎啦 · 6年树龄 · 20亩</div>
                </div>
            </div>
            
            <div class="content-section">
                <div class="section-title">设备状态</div>
                <div class="device-list">
                    <div class="device-item" onclick="focusHotspot('hotspot_device_water1')">
                        <div class="device-icon"><i class="fas fa-droplet"></i></div>
                        <div class="device-name">水肥设备</div>
                        <div class="device-status">运行中</div>
                    </div>
                    <div class="device-item" onclick="focusHotspot('hotspot_device_camera1')">
                        <div class="device-icon"><i class="fas fa-video"></i></div>
                        <div class="device-name">监控摄像头</div>
                        <div class="device-status">在线</div>
                    </div>
                    <div class="device-item" onclick="focusHotspot('hotspot_device_meteor1')">
                        <div class="device-icon"><i class="fas fa-cloud-sun"></i></div>
                        <div class="device-name">气象站</div>
                        <div class="device-status">在线</div>
                    </div>
                </div>
            </div>
            
            <div class="content-section">
                <div class="section-title">农事任务</div>
                <div class="info-card" onclick="focusHotspot('hotspot_task_pruning')">
                    <div class="card-header">
                        <span class="card-title">夏季修剪</span>
                        <span class="card-status warning"></span>
                    </div>
                    <div class="card-content">A1-A3区 · 李师傅 · 进度75%</div>
                </div>
            </div>
            
            <div class="legend-section">
                <div class="legend-items">
                    <div class="legend-item"><span class="legend-dot plot"></span> 地块</div>
                    <div class="legend-item"><span class="legend-dot device"></span> 设备</div>
                    <div class="legend-item"><span class="legend-dot task"></span> 任务</div>
                    <div class="legend-item"><span class="legend-dot building"></span> 建筑</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="controls-overlay">
        <button class="control-btn" onclick="viewer.setPitch(viewer.getPitch() + 8)" title="向上">
            <i class="fas fa-chevron-up"></i>
        </button>
        <button class="control-btn" onclick="viewer.setYaw(viewer.getYaw() - 12)" title="向左">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="control-btn" onclick="viewer.setHfov(viewer.getHfov() - 5)" title="缩小">
            <i class="fas fa-minus"></i>
        </button>
        <button class="control-btn" onclick="viewer.setHfov(viewer.getHfov() + 5)" title="放大">
            <i class="fas fa-plus"></i>
        </button>
        <button class="control-btn" onclick="viewer.setYaw(viewer.getYaw() + 12)" title="向右">
            <i class="fas fa-chevron-right"></i>
        </button>
        <button class="control-btn" onclick="viewer.setPitch(viewer.getPitch() - 8)" title="向下">
            <i class="fas fa-chevron-down"></i>
        </button>
        <button class="control-btn" onclick="viewer.reset()" title="重置视角">
            <i class="fas fa-home"></i>
        </button>
    </div>
    
    <div class="info-tooltip" id="infoTooltip">
        <div class="tooltip-close" onclick="closeTooltip()">✕</div>
        <div class="tooltip-title" id="tooltipTitle"></div>
        <div class="tooltip-content" id="tooltipContent"></div>
    </div>
    
    <div class="scene-indicator">
        <div class="scene-name" id="sceneName">
            <i class="fas fa-map-pin"></i> 园区主入口
        </div>
    </div>
    
    <script src="../common/js/vr-hotspots.js"></script>
    <script>
        var viewer;
        var currentSceneId = 'scene_main';
        var isPanelCollapsed = false;
        
        function initViewer(sceneId) {
            var sceneData = vrHotspotsData.getSceneById(sceneId);
            if (!sceneData) return;
            
            if (viewer) {
                viewer.destroy();
            }
            
            var config = {
                type: 'equirectangular',
                panorama: sceneData.image,
                title: sceneData.name,
                author: '数农智果',
                sceneFov: sceneData.hfov || 100,
                autoLoad: true,
                showControls: true,
                mouseZoom: true,
                draggable: true,
                keyboardZoom: true,
                compass: true,
                hotSpots: []
            };
            
            sceneData.hotspots.forEach(function(hotspot) {
                var hotspotConfig = {
                    pitch: hotspot.pitch,
                    yaw: hotspot.yaw,
                    type: 'custom',
                    custom: getHotspotIcon(hotspot.type, hotspot.status),
                    clickHandler: function() {
                        showTooltip(hotspot);
                    }
                };
                config.hotSpots.push(hotspotConfig);
            });
            
            viewer = pannellum.viewer('panorama', config);
            currentSceneId = sceneId;
            
            updateNavButtons(sceneId);
            updateSceneIndicator(sceneData.name);
        }
        
        function getHotspotIcon(type, status) {
            var color = '#22c55e';
            switch(type) {
                case 'plot': color = '#22c55e'; break;
                case 'device': color = '#3b82f6'; break;
                case 'task': color = '#f59e0b'; break;
                case 'building': color = '#8b5cf6'; break;
                case 'scene': color = '#06b6d4'; break;
            }
            if (status === 'warning') color = '#f59e0b';
            if (status === 'error') color = '#ef4444';
            
            return '<div style="width:18px;height:18px;border-radius:50%;background:' + color + ';box-shadow:0 0 8px ' + color + ';border:2px solid #fff;cursor:pointer;"></div>';
        }
        
        function showTooltip(hotspot) {
            document.getElementById('tooltipTitle').innerHTML = hotspot.title;
            document.getElementById('tooltipContent').innerHTML = hotspot.content;
            document.getElementById('infoTooltip').classList.add('show');
            
            if (hotspot.type === 'scene') {
                var contentDiv = document.getElementById('tooltipContent');
                contentDiv.onclick = function(e) {
                    if (e.target.textContent.includes('进入') || e.target.textContent.includes('返回')) {
                        switchScene(hotspot.targetId);
                        closeTooltip();
                    }
                };
            }
        }
        
        function closeTooltip() {
            document.getElementById('infoTooltip').classList.remove('show');
        }
        
        function switchScene(sceneId) {
            initViewer(sceneId);
        }
        
        function updateNavButtons(sceneId) {
            var buttons = document.querySelectorAll('.nav-btn:not(.exit)');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
                if (btn.dataset.scene === sceneId) {
                    btn.classList.add('active');
                }
            });
        }
        
        function updateSceneIndicator(name) {
            document.getElementById('sceneName').innerHTML = '<i class="fas fa-map-pin"></i> ' + name;
        }
        
        function togglePanel() {
            var panel = document.querySelector('.side-panel');
            var content = document.querySelector('.panel-content');
            var collapseBtn = document.querySelector('.panel-collapse');
            
            if (isPanelCollapsed) {
                content.style.display = 'block';
                panel.style.width = '320px';
                collapseBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
            } else {
                content.style.display = 'none';
                panel.style.width = '40px';
                collapseBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
            }
            isPanelCollapsed = !isPanelCollapsed;
        }
        
        function focusHotspot(hotspotId) {
            var sceneData = vrHotspotsData.getSceneById(currentSceneId);
            if (!sceneData) return;
            
            var hotspot = sceneData.hotspots.find(function(h) {
                return h.id === hotspotId;
            });
            
            if (hotspot) {
                viewer.setPitch(hotspot.pitch);
                viewer.setYaw(hotspot.yaw);
                showTooltip(hotspot);
            }
        }
        
        function goBack() {
            window.location.href = 'home.html';
        }
        
        document.querySelectorAll('.nav-btn:not(.exit)').forEach(function(btn) {
            btn.addEventListener('click', function() {
                switchScene(this.dataset.scene);
            });
        });
        
        window.addEventListener('load', function() {
            initViewer('scene_main');
        });
    </script>
</body>
</html>
