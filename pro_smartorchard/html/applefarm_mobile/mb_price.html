<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>数农智果 - 价格预测</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    :root {
      --primary: #2e9e5a; --primary-dark: #1e7e42; --primary-light: #e8f5ec;
      --orange: #f39c12; --orange-light: #fef5e7;
      --blue: #3498db; --blue-light: #eaf2fa;
      --purple: #9b59b6; --purple-light: #f5eef8;
      --red: #e74c3c; --red-light: #fdecea;
      --text: #333; --text-secondary: #666; --text-light: #999;
      --border: #e8e8e8; --shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 66px; }
    
    .header-bg { background: linear-gradient(135deg, var(--purple), #764ba2); padding-bottom: 16px; }
    .header { display: flex; align-items: center; padding: 16px; padding-top: 44px; }
    .back-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; cursor: pointer; }
    .header-title { flex: 1; text-align: center; font-size: 18px; font-weight: 700; color: #fff; margin-right: 32px; }
    
    .content { padding: 16px; }
    
    .current-card { background: linear-gradient(135deg, var(--purple), #764ba2); border-radius: 16px; padding: 24px 20px; margin-bottom: 16px; color: #fff; box-shadow: var(--shadow); }
    .current-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .current-title { font-size: 14px; opacity: 0.9; display: flex; align-items: center; gap: 6px; }
    .current-date { font-size: 11px; opacity: 0.7; }
    .current-main { text-align: center; margin-bottom: 16px; }
    .current-variety { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
    .current-price { font-size: 48px; font-weight: 800; }
    .current-unit { font-size: 16px; opacity: 0.9; }
    .current-trend { display: flex; justify-content: center; gap: 16px; font-size: 13px; }
    .trend-item { display: flex; align-items: center; gap: 4px; }
    
    .chart-card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .chart-title { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
    .chart-legend { display: flex; gap: 12px; font-size: 11px; }
    .legend-item { display: flex; align-items: center; gap: 4px; color: var(--text-secondary); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .legend-dot.predict { background: var(--purple); }
    .legend-dot.last { background: var(--text-light); }
    .chart-canvas { height: 160px; position: relative; }
    .chart-grid { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; }
    .chart-grid-line { border-top: 1px dashed #f0f0f0; position: relative; }
    .chart-grid-label { position: absolute; left: 0; top: -8px; font-size: 10px; color: var(--text-light); }
    .chart-points { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
    .chart-line { position: absolute; }
    .chart-months { display: flex; justify-content: space-between; margin-top: 8px; padding: 0 10px; }
    .chart-month { font-size: 11px; color: var(--text-light); text-align: center; }
    
    .suggestion-card { background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1)); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(102, 126, 234, 0.2); }
    .suggestion-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .suggestion-icon { font-size: 24px; }
    .suggestion-title { font-size: 15px; font-weight: 600; color: var(--purple); }
    .suggestion-main { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .suggestion-text { font-size: 14px; color: var(--text); line-height: 1.6; }
    .suggestion-window { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--purple-light); border-radius: 10px; }
    .window-icon { font-size: 20px; }
    .window-text { flex: 1; font-size: 13px; color: var(--purple); }
    .window-time { font-size: 16px; font-weight: 700; color: var(--purple); }
    
    .variety-card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .variety-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .variety-list { display: flex; flex-direction: column; gap: 10px; }
    .variety-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: #f8f9fa; border-radius: 10px; }
    .variety-color { width: 4px; height: 32px; border-radius: 2px; }
    .variety-color.red { background: #e74c3c; }
    .variety-color.yellow { background: #f39c12; }
    .variety-color.green { background: #2ecc71; }
    .variety-name { flex: 1; font-size: 13px; color: var(--text); }
    .variety-price { font-size: 14px; font-weight: 600; color: var(--text); }
    .variety-trend { font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .variety-trend.up { background: var(--red-light); color: var(--red); }
    .variety-trend.down { background: var(--primary-light); color: var(--primary); }
    
    .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 750px; height: 56px; background: #fff; display: flex; border-top: 1px solid var(--border); z-index: 100; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-light); transition: color .2s; cursor: pointer; }
    .tab-item.active { color: var(--primary); }
    .tab-item svg { width: 22px; height: 22px; }
    .tab-item span { font-size: 10px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header-bg">
      <div class="header">
        <div class="back-btn" onclick="history.back()">←</div>
        <div class="header-title">价格预测</div>
      </div>
    </div>
    
    <div class="content">
      <div class="current-card">
        <div class="current-header">
          <div class="current-title">
            <span>💰</span>
            <span>当前市场价格</span>
          </div>
          <div class="current-date">5月21日 · 烟台产区</div>
        </div>
        <div class="current-main">
          <div class="current-variety">红富士 80# 一级果</div>
          <div class="current-price">4.5<span style="font-size: 18px;">元/斤</span></div>
        </div>
        <div class="current-trend">
          <div class="trend-item">
            <span>📈</span>
            <span>较上月 +0.3</span>
          </div>
          <div class="trend-item">
            <span>📊</span>
            <span>近30日均价 4.35</span>
          </div>
        </div>
      </div>
      
      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title">
            <span>📈</span>
            <span>未来6个月价格走势</span>
          </div>
          <div class="chart-legend">
            <div class="legend-item">
              <div class="legend-dot predict"></div>
              <span>预测价</span>
            </div>
            <div class="legend-item">
              <div class="legend-dot last"></div>
              <span>去年同期</span>
            </div>
          </div>
        </div>
        <div class="chart-canvas">
          <div class="chart-grid">
            <div class="chart-grid-line"><span class="chart-grid-label">6.0</span></div>
            <div class="chart-grid-line"><span class="chart-grid-label">5.0</span></div>
            <div class="chart-grid-line"><span class="chart-grid-label">4.0</span></div>
            <div class="chart-grid-line"><span class="chart-grid-label">3.0</span></div>
          </div>
          <svg class="chart-points" viewBox="0 0 300 120" preserveAspectRatio="none">
            <path d="M0,85 L50,80 L100,65 L150,50 L200,70 L250,90 L300,95" fill="none" stroke="#9b59b6" stroke-width="2"/>
            <path d="M0,90 L50,88 L100,78 L150,68 L200,75 L250,88 L300,92" fill="none" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,2"/>
            <circle cx="50" cy="80" r="3" fill="#9b59b6"/>
            <circle cx="100" cy="65" r="3" fill="#9b59b6"/>
            <circle cx="150" cy="50" r="3" fill="#9b59b6"/>
            <circle cx="200" cy="70" r="3" fill="#9b59b6"/>
            <circle cx="250" cy="90" r="3" fill="#9b59b6"/>
            <circle cx="300" cy="95" r="3" fill="#9b59b6"/>
          </svg>
        </div>
        <div class="chart-months">
          <div class="chart-month">6月<br/>4.6</div>
          <div class="chart-month">7月<br/>5.2</div>
          <div class="chart-month">8月<br/>5.8</div>
          <div class="chart-month">9月<br/>4.2</div>
          <div class="chart-month">10月<br/>3.8</div>
          <div class="chart-month">11月<br/>3.5</div>
        </div>
      </div>
      
      <div class="suggestion-card">
        <div class="suggestion-header">
          <span class="suggestion-icon">💡</span>
          <div class="suggestion-title">AI销售建议</div>
        </div>
        <div class="suggestion-main">
          <div class="suggestion-text">根据模型预测，7-8月苹果价格将达到年度高峰，建议分批出售库存，抓住最佳销售窗口。</div>
        </div>
        <div class="suggestion-window">
          <span class="window-icon">⏰</span>
          <div class="window-text">最佳出售窗口</div>
          <div class="window-time">7月中旬前</div>
        </div>
      </div>
      
      <div class="variety-card">
        <div class="variety-title">
          <span>🍎</span>
          <span>分品种价格预测</span>
        </div>
        <div class="variety-list">
          <div class="variety-item">
            <div class="variety-color red"></div>
            <div class="variety-name">红富士 80#</div>
            <div class="variety-price">4.5元</div>
            <div class="variety-trend up">↑ 7%</div>
          </div>
          <div class="variety-item">
            <div class="variety-color yellow"></div>
            <div class="variety-name">嘎啦 75#</div>
            <div class="variety-price">3.8元</div>
            <div class="variety-trend up">↑ 5%</div>
          </div>
          <div class="variety-item">
            <div class="variety-color green"></div>
            <div class="variety-name">乔纳金 80#</div>
            <div class="variety-price">4.2元</div>
            <div class="variety-trend down">↓ 2%</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_model.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
        <span>AI</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
  </div>
  
  <script>
    function navigateTo(page) { window.location.href = page; }
  </script>
</body>
</html>
