<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>数农智果 - 病虫害风险</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="../applefarm_backhand/css/design-system.css">
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <!-- 图标库 -->
  <script src="../applefarm_backhand/icons/icons.js"></script>
  <style>
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 66px; }
    
    .header-bg { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding-bottom: var(--space-4); }
    .page-header { display: flex; align-items: center; padding: var(--space-4); padding-top: 44px; }
    .header-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--bg-white); font-size: var(--font-xl); cursor: pointer; }
    .header-title { flex: 1; text-align: center; font-size: var(--font-lg); font-weight: 700; color: var(--bg-white); margin-right: 32px; }
    
    .content { padding: var(--space-4); }
    
    .overview-card { background: var(--bg-white); border-radius: var(--radius-xl); padding: var(--space-5); margin-bottom: var(--space-4); box-shadow: var(--shadow-card); border: 1px solid var(--border); }
    .overview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
    .overview-title { font-size: var(--font-md); font-weight: 600; color: var(--text); display: flex; align-items: center; gap: var(--space-2); }
    .overview-badge { background: var(--orange-bg); color: var(--orange); font-size: var(--font-xs); padding: var(--space-1) var(--space-3); border-radius: var(--radius-md); font-weight: 600; }
    .risk-stats { display: flex; justify-content: space-around; text-align: center; }
    .risk-stat { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
    .risk-count { width: 44px; height: 44px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-size: var(--font-xl); font-weight: 700; color: var(--bg-white); }
    .risk-count.high { background: var(--danger); }
    .risk-count.medium { background: var(--orange); }
    .risk-count.low { background: var(--primary); }
    .risk-label { font-size: var(--font-sm); color: var(--text-secondary); }
    
    .plot-list { background: var(--bg-white); border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-card); border: 1px solid var(--border); }
    .plot-header { padding: 14px var(--space-4); font-size: var(--font-base); font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--space-2); }
    .plot-item { padding: 14px var(--space-4); border-bottom: 1px solid var(--border); }
    .plot-item:last-child { border-bottom: none; }
    .plot-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
    .plot-name { font-size: var(--font-base); font-weight: 600; color: var(--text); display: flex; align-items: center; gap: var(--space-2); }
    .risk-badge { font-size: var(--font-xs); padding: var(--space-1) var(--space-3); border-radius: var(--radius-md); font-weight: 600; }
    .risk-badge.high { background: var(--danger-bg); color: var(--danger); }
    .risk-badge.medium { background: var(--orange-bg); color: var(--orange); }
    .risk-badge.low { background: var(--primary-light); color: var(--primary); }
    .pests-row { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
    .pest-tag { font-size: var(--font-xs); background: var(--gray-100); color: var(--text-secondary); padding: var(--space-1) var(--space-3); border-radius: var(--radius-sm); }
    .advice-item { display: flex; align-items: flex-start; gap: var(--space-2); padding: var(--space-3); background: var(--warning-bg); border-radius: var(--radius-sm); }
    .advice-icon { font-size: var(--font-base); }
    .advice-text { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.5; }
    
    .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 750px; height: 56px; background: var(--bg-white); display: flex; border-top: 1px solid var(--border); z-index: 100; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-light); transition: color var(--transition-fast); cursor: pointer; }
    .tab-item.active { color: var(--primary); }
    .tab-item svg { width: 22px; height: 22px; }
    .tab-item span { font-size: var(--font-xs); }
  </style>
</head>
<body>
  <div class="app">
    <div class="header-bg">
      <div class="page-header">
        <div class="header-back" onclick="history.back()">←</div>
        <div class="header-title">病虫害风险</div>
      </div>
    </div>
    
    <div class="content">
      <div class="overview-card">
        <div class="overview-header">
          <div class="overview-title">
            <span>🐛</span>
            <span>风险概览</span>
          </div>
          <div class="overview-badge">更新于 今日 08:00</div>
        </div>
        <div class="risk-stats">
          <div class="risk-stat">
            <div class="risk-count high">1</div>
            <div class="risk-label">高风险</div>
          </div>
          <div class="risk-stat">
            <div class="risk-count medium">1</div>
            <div class="risk-label">中风险</div>
          </div>
          <div class="risk-stat">
            <div class="risk-count low">1</div>
            <div class="risk-label">低风险</div>
          </div>
        </div>
      </div>
      
      <div class="plot-list">
        <div class="plot-header">
          <span>📍</span>
          <span>各地块病虫害风险</span>
        </div>
        
        <div class="plot-item">
          <div class="plot-top">
            <div class="plot-name">
              <span style="color: var(--primary);">●</span>
              A区 - 红富士
            </div>
            <div class="risk-badge high">高风险</div>
          </div>
          <div class="pests-row">
            <span class="pest-tag">苹果锈病</span>
            <span class="pest-tag">红蜘蛛</span>
          </div>
          <div class="advice-item">
            <span class="advice-icon">💊</span>
            <div class="advice-text">风险触发条件：近5天湿度>80%且温度15-25℃。建议喷施多菌灵+阿维菌素防治</div>
          </div>
        </div>
        
        <div class="plot-item">
          <div class="plot-top">
            <div class="plot-name">
              <span style="color: var(--orange);">●</span>
              B区 - 嘎啦
            </div>
            <div class="risk-badge medium">中风险</div>
          </div>
          <div class="pests-row">
            <span class="pest-tag">蚜虫</span>
          </div>
          <div class="advice-item">
            <span class="advice-icon">💡</span>
            <div class="advice-text">注意观察蚜虫发生情况，必要时使用吡虫啉进行防治</div>
          </div>
        </div>
        
        <div class="plot-item">
          <div class="plot-top">
            <div class="plot-name">
              <span style="color: var(--primary);">●</span>
              C区 - 乔纳金
            </div>
            <div class="risk-badge low">低风险</div>
          </div>
          <div class="pests-row">
            <span class="pest-tag">暂无明显病虫害</span>
          </div>
          <div class="advice-item" style="background: var(--primary-light);">
            <span class="advice-icon">✅</span>
            <div class="advice-text" style="color: var(--primary);">当前无明显病虫害，继续保持</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_model.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
        <span>AI</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
  </div>
  
  <script>
    function navigateTo(page) { window.location.href = page; }
  </script>
</body>
</html>
