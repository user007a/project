<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>数农智果 - 气象早知道</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    :root {
      --primary: #2e9e5a; --primary-dark: #1e7e42; --primary-light: #e8f5ec;
      --orange: #f39c12; --orange-light: #fef5e7;
      --blue: #3498db; --blue-light: #eaf2fa;
      --red: #e74c3c; --red-light: #fdecea;
      --text: #333; --text-secondary: #666; --text-light: #999;
      --border: #e8e8e8; --shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 66px; }
    
    .header-bg { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding-bottom: 16px; }
    .header { display: flex; align-items: center; padding: 16px; padding-top: 44px; }
    .back-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; cursor: pointer; }
    .header-title { flex: 1; text-align: center; font-size: 18px; font-weight: 700; color: #fff; margin-right: 32px; }
    
    .content { padding: 16px; }
    
    .today-card { background: linear-gradient(135deg, var(--blue), #2980b9); border-radius: 16px; padding: 24px 20px; margin-bottom: 16px; color: #fff; box-shadow: var(--shadow); }
    .today-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .today-location { font-size: 14px; opacity: 0.9; display: flex; align-items: center; gap: 6px; }
    .today-date { font-size: 12px; opacity: 0.8; }
    .today-main { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 10px 0; }
    .today-icon { font-size: 64px; }
    .today-temp { font-size: 56px; font-weight: 300; }
    .today-info { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .today-info-item { background: rgba(255,255,255,0.2); border-radius: 10px; padding: 12px 8px; text-align: center; }
    .today-info-label { font-size: 11px; opacity: 0.8; margin-bottom: 4px; }
    .today-info-value { font-size: 14px; font-weight: 600; }
    
    .forecast-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .forecast-list { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .forecast-item { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .forecast-item:last-child { border-bottom: none; }
    .forecast-day { width: 50px; text-align: center; }
    .forecast-day-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .forecast-day-date { font-size: 11px; color: var(--text-light); margin-top: 2px; }
    .forecast-icon { font-size: 32px; margin: 0 12px; }
    .forecast-temp { flex: 1; display: flex; justify-content: space-between; font-size: 14px; }
    .forecast-high { font-weight: 600; color: var(--text); }
    .forecast-low { color: var(--text-light); }
    .forecast-rain { font-size: 12px; color: var(--blue); background: var(--blue-light); padding: 4px 8px; border-radius: 8px; }
    
    .tips-card { background: #fff; border-radius: 16px; padding: 16px; margin-top: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .tips-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .tips-icon { font-size: 18px; }
    .tips-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
    .tips-item:last-child { border-bottom: none; }
    .tips-dot { width: 6px; height: 6px; background: var(--orange); border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
    .tips-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    
    .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 750px; height: 56px; background: #fff; display: flex; border-top: 1px solid var(--border); z-index: 100; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-light); transition: color .2s; cursor: pointer; }
    .tab-item.active { color: var(--primary); }
    .tab-item svg { width: 22px; height: 22px; }
    .tab-item span { font-size: 10px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header-bg">
      <div class="header">
        <div class="back-btn" onclick="history.back()">←</div>
        <div class="header-title">气象早知道</div>
      </div>
    </div>
    
    <div class="content">
      <div class="today-card">
        <div class="today-header">
          <div class="today-location">
            <span>📍</span>
            <span>烟台市·牟平区</span>
          </div>
          <div class="today-date">5月21日 周四</div>
        </div>
        <div class="today-main">
          <div class="today-icon">⛅</div>
          <div class="today-temp">24°</div>
        </div>
        <div class="today-info">
          <div class="today-info-item">
            <div class="today-info-label">湿度</div>
            <div class="today-info-value">72%</div>
          </div>
          <div class="today-info-item">
            <div class="today-info-label">风速</div>
            <div class="today-info-value">3级</div>
          </div>
          <div class="today-info-item">
            <div class="today-info-label">紫外线</div>
            <div class="today-info-value">中等</div>
          </div>
        </div>
      </div>
      
      <div class="forecast-title">📅 未来3天预报</div>
      <div class="forecast-list">
        <div class="forecast-item">
          <div class="forecast-day">
            <div class="forecast-day-name">明天</div>
            <div class="forecast-day-date">5月22日</div>
          </div>
          <div class="forecast-icon">🌤️</div>
          <div class="forecast-temp">
            <span class="forecast-high">26°</span>
            <span class="forecast-low">/ 18°</span>
          </div>
          <div class="forecast-rain">30%</div>
        </div>
        <div class="forecast-item">
          <div class="forecast-day">
            <div class="forecast-day-name">后天</div>
            <div class="forecast-day-date">5月23日</div>
          </div>
          <div class="forecast-icon">🌧️</div>
          <div class="forecast-temp">
            <span class="forecast-high">22°</span>
            <span class="forecast-low">/ 16°</span>
          </div>
          <div class="forecast-rain" style="background: #e8f5ec; color: var(--primary);">70%</div>
        </div>
        <div class="forecast-item">
          <div class="forecast-day">
            <div class="forecast-day-name">大后天</div>
            <div class="forecast-day-date">5月24日</div>
          </div>
          <div class="forecast-icon">☀️</div>
          <div class="forecast-temp">
            <span class="forecast-high">25°</span>
            <span class="forecast-low">/ 17°</span>
          </div>
          <div class="forecast-rain">10%</div>
        </div>
      </div>
      
      <div class="tips-card">
        <div class="tips-title">
          <span class="tips-icon">🍎</span>
          <span>苹果种植提醒</span>
        </div>
        <div class="tips-item">
          <div class="tips-dot"></div>
          <div class="tips-text">明日有雨，建议推迟喷药作业，避免药液被雨水冲刷</div>
        </div>
        <div class="tips-item">
          <div class="tips-dot"></div>
          <div class="tips-text">本周气温适宜，有利于果实膨大，注意及时灌溉补水</div>
        </div>
        <div class="tips-item">
          <div class="tips-dot"></div>
          <div class="tips-text">后天大风天气，避免进行套袋和修剪作业</div>
        </div>
      </div>
    </div>
    
    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_model.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
        <span>AI</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
  </div>
  
  <script>
    function navigateTo(page) { window.location.href = page; }
  </script>
</body>
</html>
