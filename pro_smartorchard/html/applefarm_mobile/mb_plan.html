<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>数农智果 - 看计划</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }
    :root {
      --primary: #2e9e5a; --primary-dark: #1e7e42; --primary-light: #e8f5ec;
      --orange: #f39c12; --orange-light: #fef5e7;
      --blue: #3498db; --blue-light: #eaf2fa;
      --red: #e74c3c; --red-light: #fdecea;
      --gray: #95a5a6; --gray-light: #f0f0f0;
      --bg: #f5f5f5; --white: #fff;
      --text: #333; --text-secondary: #666; --text-light: #999;
      --border: #e8e8e8; --radius: 12px; --radius-lg: 16px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .app { width: 100%; max-width: 750px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; padding-bottom: 66px; }
    .header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 16px 16px 12px; color: #fff; }
    .header-title { font-size: 18px; font-weight: 700; }
    .header-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }
    .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 750px; height: 56px; background: #fff; display: flex; border-top: 1px solid var(--border); z-index: 100; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-light); transition: color .2s; position: relative; cursor: pointer; }
    .tab-item.active { color: var(--primary); }
    .tab-item svg { width: 22px; height: 22px; }
    .tab-item span { font-size: 10px; }
    .content { padding: 16px; padding-bottom: 80px; }
    .card { background: #fff; border-radius: var(--radius); margin-bottom: 16px; padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .card-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 14px; }
    .back-btn { position: absolute; left: 12px; top: 16px; width: 32px; height: 32px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .back-btn svg { width: 18px; height: 18px; color: #fff; }
    .plan-item { padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; cursor: pointer; transition: all .2s; }
    .plan-item:active { background: var(--gray-light); }
    .plan-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .plan-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .plan-status { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .plan-status.doing { background: var(--primary-light); color: var(--primary); }
    .plan-status.pending { background: var(--orange-light); color: var(--orange); }
    .plan-status.completed { background: var(--blue-light); color: var(--blue); }
    .plan-date { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
    .plan-tasks { display: flex; gap: 8px; flex-wrap: wrap; }
    .task-tag { padding: 4px 10px; background: var(--gray-light); border-radius: 12px; font-size: 12px; color: var(--text-secondary); }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; justify-content: center; align-items: center; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius-lg); padding: 24px 20px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 18px; font-weight: 600; text-align: center; margin-bottom: 20px; }
    .detail-section { margin-bottom: 16px; }
    .detail-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
    .detail-value { font-size: 14px; color: var(--text); }
    .task-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .task-item:last-child { border-bottom: none; }
    .task-icon { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .task-icon svg { width: 14px; height: 14px; color: var(--primary); }
    .task-info { flex: 1; min-width: 0; }
    .task-name { font-size: 14px; color: var(--text); }
    .task-time { font-size: 12px; color: var(--text-light); margin-top: 2px; }
    .btn { width: 100%; height: 48px; border-radius: 24px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; margin-top: 16px; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
    .timeline { position: relative; padding-left: 20px; }
    .timeline::before { content: ''; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
    .timeline-item { position: relative; margin-bottom: 20px; }
    .timeline-dot { position: absolute; left: -20px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--primary); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--primary-light); }
    .timeline-item.completed .timeline-dot { background: var(--primary); }
    .timeline-item.pending .timeline-dot { background: var(--gray-light); border-color: var(--text-light); box-shadow: 0 0 0 2px var(--gray-light); }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div style="padding-left: 40px;">
        <div class="header-title">农事计划</div>
        <div class="header-sub">查看和执行农事作业计划</div>
      </div>
    </div>
    
    <div class="content">
      <div class="card">
        <div class="card-title">进行中的计划</div>
        <div class="plan-item" onclick="openPlanDetail(1)">
          <div class="plan-header">
            <div class="plan-name">2026年红富士夏季管理计划</div>
            <span class="plan-status doing">进行中</span>
          </div>
          <div class="plan-date">2026年5月 - 2026年7月</div>
          <div class="plan-tasks">
            <span class="task-tag">疏果</span>
            <span class="task-tag">套袋</span>
            <span class="task-tag">病虫害防治</span>
            <span class="task-tag">夏季修剪</span>
          </div>
        </div>
        <div class="plan-item" onclick="openPlanDetail(4)">
          <div class="plan-header">
            <div class="plan-name">2026年嘎啦夏季管理计划</div>
            <span class="plan-status doing">进行中</span>
          </div>
          <div class="plan-date">2026年5月 - 2026年8月</div>
          <div class="plan-tasks">
            <span class="task-tag">疏果</span>
            <span class="task-tag">套袋</span>
            <span class="task-tag">追肥</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">待执行计划</div>
        <div class="plan-item" onclick="openPlanDetail(2)">
          <div class="plan-header">
            <div class="plan-name">2026年乔纳金套袋计划</div>
            <span class="plan-status pending">待执行</span>
          </div>
          <div class="plan-date">2026年6月 - 2026年7月</div>
          <div class="plan-tasks">
            <span class="task-tag">套袋准备</span>
            <span class="task-tag">套袋作业</span>
            <span class="task-tag">检查验收</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">已完成计划</div>
        <div class="plan-item" onclick="openPlanDetail(3)">
          <div class="plan-header">
            <div class="plan-name">2026年春季果园管理计划</div>
            <span class="plan-status completed">已完成</span>
          </div>
          <div class="plan-date">2026年3月 - 2026年5月</div>
          <div class="plan-tasks">
            <span class="task-tag">冬季修剪</span>
            <span class="task-tag">清园消毒</span>
            <span class="task-tag">春季施肥</span>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item" onclick="navigateTo('mb_home.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_service.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>服务</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_plot.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>地块</span>
      </div>
      <div class="tab-item" onclick="navigateTo('mb_mine.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="planModal">
    <div class="modal-box">
      <div class="modal-title" id="planModalTitle">计划详情</div>
      <div id="planModalContent"></div>
      <button class="btn btn-primary" onclick="closePlanModal()">知道了</button>
    </div>
  </div>

  <script>
    const planData = {
      1: {
        title: '2026年红富士夏季管理计划',
        date: '2026年5月 - 2026年7月',
        status: 'doing',
        area: 'A1区、A2区',
        tasks: [
          { name: '第一次疏果', time: '5月20日 - 5月25日', completed: true },
          { name: '第二次疏果', time: '5月26日 - 5月31日', completed: false },
          { name: '病虫害防治（波尔多液）', time: '5月28日 - 6月5日', completed: true },
          { name: '红富士套袋作业', time: '6月1日 - 6月15日', completed: false },
          { name: '夏季修剪', time: '6月10日 - 6月20日', completed: false },
          { name: '追施膨果肥', time: '6月25日 - 6月30日', completed: false }
        ]
      },
      4: {
        title: '2026年嘎啦夏季管理计划',
        date: '2026年5月 - 2026年8月',
        status: 'doing',
        area: 'B1区、B2区',
        tasks: [
          { name: '嘎啦疏果作业', time: '5月18日 - 5月23日', completed: true },
          { name: '嘎啦套袋作业', time: '5月25日 - 6月10日', completed: false },
          { name: '阿维菌素防虫', time: '6月8日 - 6月12日', completed: false },
          { name: '嘎啦夏季修剪', time: '6月15日 - 6月25日', completed: false },
          { name: '追施钾肥', time: '7月5日 - 7月10日', completed: false }
        ]
      },
      2: {
        title: '2026年乔纳金套袋计划',
        date: '2026年6月 - 2026年7月',
        status: 'pending',
        area: 'C1区、C2区',
        tasks: [
          { name: '准备套袋材料', time: '6月1日 - 6月5日', completed: false },
          { name: '乔纳金套袋作业', time: '6月6日 - 6月20日', completed: false },
          { name: '套袋质量检查', time: '6月21日 - 6月25日', completed: false },
          { name: '补套遗漏果实', time: '6月26日 - 6月30日', completed: false }
        ]
      },
      3: {
        title: '2026年春季果园管理计划',
        date: '2026年3月 - 2026年5月',
        status: 'completed',
        area: '全园',
        tasks: [
          { name: '冬季修剪', time: '3月1日 - 3月10日', completed: true },
          { name: '清园消毒（石硫合剂）', time: '3月15日 - 3月20日', completed: true },
          { name: '春季基肥（有机肥）', time: '3月25日 - 3月30日', completed: true },
          { name: '花前病虫害防治', time: '4月1日 - 4月10日', completed: true },
          { name: '人工辅助授粉', time: '4月15日 - 4月20日', completed: true }
        ]
      }
    };

    function navigateTo(page) {
      window.location.href = page;
    }

    function goBack() {
      window.history.back();
    }

    function openPlanDetail(id) {
      const plan = planData[id];
      if (!plan) return;

      document.getElementById('planModalTitle').textContent = plan.title;
      
      let tasksHtml = '<div class="timeline">';
      plan.tasks.forEach((task, index) => {
        const isCompleted = task.completed;
        tasksHtml += `
          <div class="timeline-item ${isCompleted ? 'completed' : 'pending'}">
            <div class="timeline-dot"></div>
            <div class="task-item">
              <div class="task-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  ${isCompleted ? '<polyline points="20 6 9 17 4 12"/>' : '<circle cx="12" cy="12" r="10"/>'}
                </svg>
              </div>
              <div class="task-info">
                <div class="task-name">${task.name}</div>
                <div class="task-time">${task.time}</div>
              </div>
            </div>
          </div>
        `;
      });
      tasksHtml += '</div>';

      document.getElementById('planModalContent').innerHTML = `
        <div class="detail-section">
          <div class="detail-label">计划时间</div>
          <div class="detail-value">${plan.date}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">适用区域</div>
          <div class="detail-value">${plan.area || '全园'}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">任务列表</div>
          ${tasksHtml}
        </div>
      `;

      document.getElementById('planModal').classList.add('show');
    }

    function closePlanModal() {
      document.getElementById('planModal').classList.remove('show');
    }
  </script>
</body>
</html>
