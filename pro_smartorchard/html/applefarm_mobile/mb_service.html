<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>数农智果 - 服务</title>
  <!-- H5设计系统 -->
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    /* Content */
    .content { padding: var(--space-4); padding-bottom: 80px; }
    
    /* Card */
    .card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    
    .card-title {
      font-size: var(--font-md);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .card-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }
    
    /* Service Grid */
    .service-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
    }
    
    .service-item {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4) var(--space-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
    }
    
    .service-item:active {
      transform: scale(0.96);
      box-shadow: var(--shadow-sm);
    }
    
    .service-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .service-icon svg { width: 24px; height: 24px; }
    
    .service-icon.green { background: var(--success-bg); color: var(--success); }
    .service-icon.orange { background: var(--orange-bg); color: var(--orange); }
    .service-icon.blue { background: var(--info-bg); color: var(--info); }
    .service-icon.red { background: var(--danger-bg); color: var(--danger); }
    .service-icon.purple { background: var(--purple-bg); color: var(--purple); }
    .service-icon.cyan { background: #e8f8f5; color: #1abc9c; }
    .service-icon.yellow { background: var(--warning-bg); color: var(--warning); }
    .service-icon.gradient { background: linear-gradient(135deg, #667eea, #764ba2); color: var(--bg-white); }
    
    .service-name {
      font-size: var(--font-xs);
      color: var(--text);
      text-align: center;
    }
    
    .service-badge {
      position: absolute;
      top: var(--space-1);
      right: var(--space-1);
      min-width: 16px;
      height: 16px;
      background: var(--danger);
      color: var(--bg-white);
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    
    /* Form */
    .form-group { margin-bottom: var(--space-4); }
    
    .form-label {
      font-size: var(--font-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-2);
      display: block;
    }
    
    .form-input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 var(--space-3);
      font-size: var(--font-base);
      color: var(--text);
      background: var(--bg-white);
      transition: all var(--transition-fast);
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }
    
    .form-textarea {
      width: 100%;
      min-height: 100px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      font-size: var(--font-base);
      color: var(--text);
      resize: vertical;
      transition: all var(--transition-fast);
    }
    
    .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }
    
    /* Button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 var(--space-5);
      border-radius: var(--radius-full);
      font-size: var(--font-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      border: none;
    }
    
    .btn:active { transform: scale(0.98); }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: var(--bg-white);
    }
    
    .btn-outline {
      border: 1px solid var(--primary);
      color: var(--primary);
      background: transparent;
    }
    
    .btn-block { width: 100%; }
    
    /* Photo Upload */
    .photo-upload {
      width: 100%;
      height: 120px;
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .photo-upload:active {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    
    .photo-upload.has-photo {
      border-style: solid;
      border-color: var(--primary);
      background: var(--primary-light);
    }
    
    .photo-upload svg { width: 28px; height: 28px; color: var(--text-light); }
    .photo-upload.has-photo svg { color: var(--primary); }
    
    .photo-text { font-size: var(--font-sm); color: var(--text-light); }
    
    /* Radio */
    .radio-group { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    
    .radio-item {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-2) var(--space-3);
      background: var(--gray-100);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .radio-item.active { background: var(--primary-light); }
    .radio-item.active .radio-circle { background: var(--primary); border-color: var(--primary); }
    
    .radio-circle {
      width: 16px;
      height: 16px;
      border: 2px solid var(--gray-300);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .radio-circle::after {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--bg-white);
      border-radius: 50%;
      opacity: 0;
    }
    
    .radio-item.active .radio-circle::after { opacity: 1; }
    
    .radio-text { font-size: var(--font-sm); color: var(--text); }
    
    /* Section */
    .section-title {
      font-size: var(--font-sm);
      font-weight: 600;
      color: var(--text);
      margin: var(--space-5) 0 var(--space-3);
    }
    
    /* Task List */
    .task-list { margin-top: var(--space-2); }
    
    .task-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .task-item:last-child { border-bottom: none; }
    .task-item:active { background: var(--gray-50); }
    
    .task-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    .task-dot.pending { background: var(--orange); }
    .task-dot.completed { background: var(--success); }
    
    .task-info { flex: 1; min-width: 0; }
    
    .task-name { font-size: var(--font-sm); color: var(--text); }
    
    .task-meta { font-size: var(--font-xs); color: var(--text-light); margin-top: 2px; }
    
    /* Submit Button */
    .btn-submit {
      width: 100%;
      height: 44px;
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: var(--bg-white);
      border: none;
      border-radius: var(--radius-full);
      font-size: var(--font-base);
      font-weight: 600;
      cursor: pointer;
      margin-top: var(--space-2);
      transition: all var(--transition-fast);
    }
    
    .btn-submit:active { transform: scale(0.98); }
    
    /* Status Tag */
    .status-tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      font-weight: 500;
    }
    
    .status-tag.pending { background: var(--orange-bg); color: var(--orange); }
    .status-tag.processing { background: var(--info-bg); color: var(--info); }
    .status-tag.passed { background: var(--success-bg); color: var(--success); }
    .status-tag.rejected { background: var(--danger-bg); color: var(--danger); }
    
    /* Feedback Item */
    .feedback-item {
      padding: var(--space-3);
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-2);
      border: 1px solid var(--border);
    }
    
    .feedback-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-2);
    }
    .feedback-title { font-size: var(--font-sm); font-weight: 600; color: var(--text); }
    .feedback-time { font-size: var(--font-xs); color: var(--text-light); }
    .feedback-content { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.5; }
    .feedback-reason { margin-top: var(--space-2); padding: var(--space-2); background: var(--danger-bg); border-radius: var(--radius-sm); }
    .feedback-reason-title { font-size: var(--font-xs); color: var(--danger); font-weight: 600; margin-bottom: 4px; }
    .feedback-reason-text { font-size: var(--font-xs); color: var(--danger); }
    
    /* Device Card */
    .device-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-3);
      margin-bottom: var(--space-3);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
    }
    
    .device-header { display: flex; align-items: center; gap: var(--space-3); }
    
    .device-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .device-icon.online { background: var(--success-bg); color: var(--success); }
    .device-icon.offline { background: var(--gray-100); color: var(--text-light); }
    .device-icon svg { width: 20px; height: 20px; }
    
    .device-info { flex: 1; }
    
    .device-name { font-size: var(--font-sm); font-weight: 600; color: var(--text); }
    
    .device-status { font-size: var(--font-xs); margin-top: 2px; }
    .device-status.online { color: var(--success); }
    .device-status.offline { color: var(--text-light); }
    
    .device-params {
      display: flex;
      gap: var(--space-4);
      margin-top: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-light);
    }
    
    .param-item { text-align: center; }
    
    .param-value { font-size: var(--font-md); font-weight: 700; color: var(--text); }
    
    .param-label { font-size: var(--font-xs); color: var(--text-light); margin-top: 2px; }
    
    /* News Card */
    .news-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-3);
      margin-bottom: var(--space-3);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .news-card:active { transform: scale(0.99); }
    
    .news-title { font-size: var(--font-sm); font-weight: 600; color: var(--text); line-height: 1.4; }
    
    .news-meta {
      display: flex;
      gap: var(--space-3);
      margin-top: var(--space-2);
      font-size: var(--font-xs);
      color: var(--text-light);
    }
    
    .news-tag {
      padding: 2px 6px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: var(--radius-sm);
      font-size: var(--font-xs);
    }
    
    /* Expert Card */
    .expert-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-3);
      margin-bottom: var(--space-3);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
    }
    
    .expert-header { display: flex; align-items: center; gap: var(--space-3); }
    
    .expert-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .expert-avatar svg { width: 24px; height: 24px; color: var(--primary); }
    
    .expert-info { flex: 1; }
    
    .expert-name { font-size: var(--font-sm); font-weight: 600; color: var(--text); }
    
    .expert-title { font-size: var(--font-xs); color: var(--text-secondary); }
    
    .expert-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: var(--space-2);
    }
    
    .expert-tag {
      padding: 2px 8px;
      background: var(--gray-100);
      border-radius: var(--radius-full);
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }
    
    /* Disease Result */
    .disease-result {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      margin-top: var(--space-3);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    
    .result-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }
    
    .result-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .result-icon.high { background: var(--danger-bg); color: var(--danger); }
    .result-icon.medium { background: var(--orange-bg); color: var(--orange); }
    .result-icon.low { background: var(--success-bg); color: var(--success); }
    .result-icon svg { width: 28px; height: 28px; }
    
    .result-info { flex: 1; }
    
    .result-name { font-size: var(--font-md); font-weight: 600; color: var(--text); }
    
    .result-confidence { font-size: var(--font-xs); color: var(--text-secondary); }
    
    .result-tips {
      padding: var(--space-3);
      background: var(--gray-50);
      border-radius: var(--radius-md);
      margin-top: var(--space-2);
    }
    
    .tips-title { font-size: var(--font-sm); font-weight: 600; color: var(--text); margin-bottom: 6px; }
    
    .tips-content { font-size: var(--font-xs); color: var(--text-secondary); line-height: 1.6; }
    
    /* Search Box */
    .search-box {
      width: 100%;
      height: 40px;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 0 var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
      transition: all var(--transition-fast);
    }
    
    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }
    
    .search-box svg { width: 18px; height: 18px; color: var(--text-light); }
    .search-input { flex: 1; height: 100%; font-size: 14px; border: none; outline: none; background: transparent; }
    .search-input::placeholder { color: var(--text-light); }
    .back-btn { position: absolute; left: 12px; top: 16px; width: 32px; height: 32px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .back-btn svg { width: 18px; height: 18px; color: #fff; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; justify-content: center; align-items: center; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius-lg); padding: 24px 20px; width: 85%; max-width: 320px; }
    .modal-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 16px; }
    .modal-btn { width: 100%; height: 44px; background: var(--primary); color: #fff; border: none; border-radius: 22px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .success-icon { width: 56px; height: 56px; margin: 0 auto 16px; background: #e8f5ec; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .success-icon svg { width: 32px; height: 32px; color: #22a84a; }
  </style>
</head>
<body>
  <div class="mb-app">
    <div class="mb-header">
      <div class="mb-header-back">
        <div class="mb-back-btn" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </div>
        <div class="mb-header-back-title">服务中心</div>
      </div>
    </div>
    
    <div class="content">
      <div class="card">
        <div class="card-title">快捷服务</div>
        <div class="service-grid">
          <div class="service-item" onclick="openRecordTask()">
            <div class="service-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </div>
            <div class="service-name">记农事</div>
          </div>
          <div class="service-item" onclick="openPatrol()">
            <div class="service-icon blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </div>
            <div class="service-name">巡果园</div>
          </div>
          <div class="service-item" onclick="openDrawPlot()">
            <div class="service-icon orange">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
              </svg>
            </div>
            <div class="service-name">画地块</div>
          </div>
          <div class="service-item" onclick="openMap()">
            <div class="service-icon cyan">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
                <line x1="8" y1="2" x2="8" y2="18"/>
                <line x1="16" y1="6" x2="16" y2="22"/>
              </svg>
            </div>
            <div class="service-name">看地图</div>
          </div>
          <div class="service-item" onclick="openDevice()">
            <div class="service-icon purple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="12" y="2" width="8" height="14" rx="2"/>
                <line x1="8" y1="2" x2="8" y2="18"/>
                <line x1="16" y1="18" x2="20" y2="18"/>
                <line x1="16" y1="22" x2="20" y2="22"/>
                <line x1="2" y1="6" x2="12" y2="6"/>
                <line x1="2" y1="10" x2="12" y2="10"/>
                <line x1="2" y1="14" x2="12" y2="14"/>
              </svg>
            </div>
            <div class="service-name">看设备</div>
          </div>
          <div class="service-item" onclick="openFeedback()">
            <div class="service-icon yellow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <div class="service-name">跟反馈</div>
          </div>
          <div class="service-item" onclick="openModel()">
            <div class="service-icon gradient">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
              </svg>
            </div>
            <div class="service-name">模型预测</div>
          </div>
          <div class="service-item" onclick="openExpert()">
            <div class="service-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <div class="service-name">问专家</div>
          </div>
          <div class="service-item" onclick="openDisease()">
            <div class="service-icon red">
