<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>数农智果 - 商城</title>
<link rel="stylesheet" href="../css/design-system.css">
<style>
/* ==================== 基础重置 ==================== */
* { margin:0; padding:0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg-page);
  color: var(--text-primary);
  line-height:1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* ==================== 顶部导航 ==================== */
.header {
  background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
.header-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.header-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
.header-title {
  color: white;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* ==================== 下拉刷新 ==================== */
.pull-to-refresh {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
  color: white;
  font-size: 13px;
  transform: translateY(-100%);
  transition: transform 0.3s ease;
  z-index: 99;
}
.pull-to-refresh.show {
  transform: translateY(0);
}
.pull-to-refresh .spinner {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ==================== 搜索栏 ==================== */
.search-bar {
  background: white;
  margin: 12px 16px;
  padding: 10px 14px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  transition: all 0.3s ease;
}
.search-bar:focus-within {
  box-shadow: 0 4px 16px rgba(34,168,74,0.15);
  transform: translateY(-1px);
}
.search-input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 14px;
  outline: none;
  color: var(--text-primary);
}
.search-input::placeholder { color: var(--text-light); }

/* ==================== 分类标签 ==================== */
.category-scroll {
  display: flex;
  gap: 10px;
  padding: 12px 16px;
  overflow-x: auto;
  background: white;
  -webkit-overflow-scrolling: touch;
}
.category-scroll::-webkit-scrollbar { display: none; }
.category-item {
  flex-shrink: 0;
  padding: 6px 16px;
  background: var(--bg-secondary);
  border-radius: 16px;
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.25s ease;
  border: 1.5px solid transparent;
}
.category-item:active { transform: scale(0.95); }
.category-item.active {
  background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
  color: white;
  box-shadow: 0 3px 10px rgba(34,168,74,0.3);
}

/* ==================== 轮播图 ==================== */
.banner-section { margin: 12px 16px; }
.banner-img {
  width: 100%;
  height: 160px;
  border-radius: 16px;
  background: linear-gradient(135deg, #22a84a 0%, #15803d 50%, #0d6e2e 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(34,168,74,0.25);
}
.banner-img::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 200px;
  height: 200px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.banner-content { text-align: center; z-index: 1; }
.banner-content div:first-child {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 6px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.banner-content div:last-child {
  font-size: 13px;
  opacity: 0.9;
  letter-spacing: 1px;
}

/* ==================== 商品区域 ==================== */
.product-section { padding: 16px; }
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.section-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  position: relative;
  padding-left: 12px;
}
.section-title::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 4px;
  height: 18px;
  background: linear-gradient(180deg, var(--primary-500), var(--primary-600));
  border-radius: 2px;
}
.section-more {
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: color 0.2s;
}
.section-more:active { color: var(--primary-500); }

/* ==================== 商品网格 ==================== */
.product-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.product-card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  transition: all 0.3s ease;
  cursor: pointer;
  animation: fadeInUp 0.4s ease forwards;
  opacity: 0;
}
.product-card:nth-child(1) { animation-delay: 0.05s; }
.product-card:nth-child(2) { animation-delay: 0.1s; }
.product-card:nth-child(3) { animation-delay: 0.15s; }
.product-card:nth-child(4) { animation-delay: 0.2s; }

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.product-card:active {
  transform: scale(0.98);
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}
.product-img {
  width: 100%;
  height: 140px;
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.product-img::after {
  content: '🍎';
  font-size: 50px;
  position: absolute;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.product-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 3px 8px;
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: white;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 600;
  box-shadow: 0 2px 6px rgba(239,68,68,0.3);
}
.product-info { padding: 12px; }
.product-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.product-desc {
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.product-price-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.product-price {
  font-size: 18px;
  font-weight: 700;
  color: #ef4444;
}
.product-price-original {
  font-size: 11px;
  color: var(--text-light);
  text-decoration: line-through;
}
.product-cart-btn {
  position: absolute;
  bottom: 12px;
  right: 12px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(34,168,74,0.3);
  transition: all 0.2s;
}
.product-cart-btn:active { transform: scale(0.9); }

/* ==================== 骨架屏 ==================== */
.skeleton-screen {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: white;
  z-index: 9999;
  padding: 12px 16px;
  transition: opacity 0.4s ease;
}
.skeleton-screen.hide {
  opacity: 0;
  pointer-events: none;
}
.skeleton-header {
  height: 48px;
  background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
  border-radius: 0 0 12px 12px;
  margin: -12px -16px 12px;
}
.skeleton-search {
  height: 40px;
  background: #f0f0f0;
  border-radius: 20px;
  margin-bottom: 12px;
  background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s ease-in-out infinite;
}
.skeleton-categories {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}
.skeleton-category {
  width: 60px;
  height: 32px;
  background: #f0f0f0;
  border-radius: 16px;
  background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s ease-in-out infinite;
  animation-delay: 0.1s;
}
.skeleton-banner {
  height: 160px;
  background: #f0f0f0;
  border-radius: 16px;
  margin-bottom: 16px;
  background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s ease-in-out infinite;
  animation-delay: 0.2s;
}
.skeleton-products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.skeleton-product {
  height: 220px;
  background: #f0f0f0;
  border-radius: 16px;
  background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s ease-in-out infinite;
  animation-delay: 0.3s;
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

/* ==================== 加载更多 ==================== */
.loading-more {
  text-align: center;
  padding: 20px;
  color: var(--text-secondary);
  font-size: 13px;
}
.loading-more .spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border-light);
  border-top-color: var(--primary-500);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: inline-block;
  margin-right: 8px;
  vertical-align: middle;
}

/* ==================== 底部导航 ==================== */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  padding: 8px 0 12px;
  display: flex;
  justify-content: space-around;
  box-shadow: 0 -2px 20px rgba(0,0,0,0.08);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 4px 12px;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 8px;
  position: relative;
}
.nav-item:active { transform: scale(0.95); }
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 3px;
  background: var(--primary-500);
  border-radius: 0 0 3px 3px;
}
.nav-icon {
  width: 22px;
  height: 22px;
  transition: all 0.2s;
}
.nav-text {
  font-size: 10px;
  color: var(--text-secondary);
  font-weight: 500;
}
.nav-item.active .nav-icon { color: var(--primary-500); }
.nav-item.active .nav-text { color: var(--primary-500); font-weight: 600; }

/* ==================== 响应式 ==================== */
@media (max-width: 320px) {
  .product-grid { gap: 8px; }
  .product-img { height: 110px; }
  .product-name { font-size: 13px; }
}
</style>
</head>

          <button class="product-cart-btn" aria-label="加入购物车">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 加载更多 -->
<div class="loading-more" id="loadingMore" style="display: none;">
  <div class="spinner"></div>
  <span>加载中...</span>
</div>

<!-- 底部导航 -->
<div class="footer-nav">
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span class="nav-text">首页</span>
  </div>
  <div class="nav-item active">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#22a84a" stroke-width="2">
      <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <path d="M16 10a4 4 0 01-8 0"/>
    </svg>
    <span class="nav-text">商城</span>
  </div>
  <div class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2">
      <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
    </svg>

      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span class="nav-text">我的</span>
  </div>
</div>

<script>
// ==================== 骨架屏 ====================
window.addEventListener('load', function() {
  setTimeout(() => {
    document.getElementById('skeletonScreen').classList.add('hide');
    setTimeout(() => {
      document.getElementById('skeletonScreen').style.display = 'none';
    }, 400);
  }, 600);
});

// ==================== 下拉刷新 ====================
let startY = 0;
let pulling = false;
const pullThreshold = 80;
const pullToRefresh = document.getElementById('pullToRefresh');

document.addEventListener('touchstart', function(e) {
  if (window.scrollY === 0) {
    startY = e.touches[0].clientY;
    pulling = true;
  }
}, { passive: true });

document.addEventListener('touchmove', function(e) {
  if (!pulling || window.scrollY > 0) return;
  
  const currentY = e.touches[0].clientY;
  const diff = currentY - startY;
  
  if (diff > 0 && diff < pullThreshold) {
    pullToRefresh.style.transform = `translateY(${diff * 0.5}px)`;
  }
}, { passive: true });

document.addEventListener('touchend', function() {
  if (!pulling) return;
  
  const currentY = event.changedTouches[0].clientY;
  const diff = currentY - startY;
  
  if (diff > pullThreshold) {
    pullToRefresh.classList.add('show');
    // 模拟刷新
    setTimeout(() => {
      pullToRefresh.classList.remove('show');
      pullToRefresh.style.transform = 'translateY(-100%)';
      showToast('刷新成功');
    }, 1500);
  } else {
    pullToRefresh.style.transform = 'translateY(-100%)';
  }
  
  pulling = false;
});

// ==================== 无限滚动 ====================
let loading = false;
window.addEventListener('scroll', function() {
  if (loading) return;
  
  const scrollTop = window.scrollY;
  const windowHeight = window.innerHeight;
  const documentHeight = document.documentElement.scrollHeight;
  
  if (scrollTop + windowHeight >= documentHeight - 200) {
    loading = true;
    document.getElementById('loadingMore').style.display = 'block';
    
    // 模拟加载
    setTimeout(() => {
      loadMoreProducts();
      loading = false;
      document.getElementById('loadingMore').style.display = 'none';
    }, 1000);
  }
});

function loadMoreProducts() {
  const productGrid = document.getElementById('productGrid');
  const newProducts = [
    { name: '红富士苹果 10斤装', desc: '家庭装 · 实惠之选', price: '¥128', original: '¥158', badge: '热销', badgeColor: 'linear-gradient(135deg, #ef4444, #dc2626)' },
    { name: '有机苹果礼盒', desc: '有机种植 · 健康之选', price: '¥228', original: '¥268', badge: '新品', badgeColor: 'linear-gradient(135deg, #22c55e, #16a34a)' }
  ];
  
  newProducts.forEach((product, index) => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.style.animationDelay = `${index * 0.1}s`;
    card.innerHTML = `
      <div class="product-img">
        <span class="product-badge" style="background: ${product.badgeColor};">${product.badge}</span>
      </div>
      <div class="product-info">
        <div class="product-name">${product.name}</div>
        <div class="product-desc">${product.desc}</div>
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div class="product-price-row">
            <span class="product-price">${product.price}</span>
            <span class="product-price-original">${product.original}</span>
          </div>
          <button class="product-cart-btn" aria-label="加入购物车">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    `;
    productGrid.appendChild(card);
  });
  
  // 重新绑定事件
  bindCartButtons();
}

// ==================== 分类标签切换 ====================
document.querySelectorAll('.category-item').forEach(item => {
  item.addEventListener('click', function() {
    document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
    this.classList.add('active');
    // 这里可以添加筛选逻辑
  });
});

// ==================== 加入购物车动画 ====================
function bindCartButtons() {
  document.querySelectorAll('.product-cart-btn').forEach(btn => {
    btn.removeEventListener('click', handleCartClick);
    btn.addEventListener('click', handleCartClick);
  });
}

function handleCartClick(e) {
  e.stopPropagation();
  this.style.transform = 'scale(0.8)';
  setTimeout(() => {
    this.style.transform = 'scale(1)';
  }, 200);
  showToast('已加入购物车');
}

bindCartButtons();

// ==================== Toast提示 ====================
function showToast(message) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 1000;
    animation: fadeInOut 2s ease;
  `;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

// 添加CSS动画
const style = document.createElement('style');
style.textContent = `
  @keyframes fadeInOut {
    0% { opacity:0; transform: translate(-50%, -50%) scale(0.8); }
    20% { opacity:1; transform: translate(-50%, -50%) scale(1); }
    80% { opacity:1; }
    100% { opacity:0; }
  }
`;
document.head.appendChild(style);

// ==================== 搜索防抖 ====================
let searchTimer;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    if (this.value.trim()) {
      showToast('搜索: ' + this.value.trim());
    }
  }, 500);
});
</script>
</body>
</html>
