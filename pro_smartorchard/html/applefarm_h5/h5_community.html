<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>数农智果 - 认养社区</title>
<link rel="stylesheet" href="../css/design-system.css">
<style>
/* ==================== 基础重置 ==================== */
* { margin:0; padding:0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg-page);
  color: var(--text-primary);
  line-height:1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* ==================== 顶部导航 ==================== */
.header {
  background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
.header-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
}
.header-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
.header-title {
  color: white;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* ==================== 社区头部 ==================== */
.community-header {
  background: white;
  margin: 12px 16px;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  position: relative;
  overflow: hidden;
  animation: fadeInUp 0.5s ease forwards;
  opacity: 0;
}
.community-header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary-500), var(--primary-600), #a855f7);
}
.header-info {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  box-shadow: 0 4px 12px rgba(34,168,74,0.3);
  flex-shrink: 0;
}
.user-info { flex: 1; }
.user-name {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.user-meta {
  font-size: 12px;
  color: var(--text-secondary);
}
.header-stats {
  display: flex;
  justify-content: space-around;
  padding-top: 16px;
  border-top: 1px solid var(--border-light);
}
.stat-item { text-align: center; }
.stat-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary-600);
  line-height: 1.2;
}
.stat-label {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* ==================== 发布按钮 ==================== */
.publish-bar {
  margin: 12px 16px;
  display: flex;
  gap: 10px;
  align-items: center;
  animation: fadeInUp 0.5s ease forwards;
  animation-delay: 0.1s;
  opacity: 0;
}
.publish-input {
  flex: 1;
  padding: 10px 16px;
  background: white;
  border: 1.5px solid var(--border-light);
  border-radius: 20px;
  font-size: 13px;
  color: var(--text-primary);
  outline: none;
  transition: all 0.3s ease;
}
.publish-input:focus {
  border-color: var(--primary-400);
  box-shadow: 0 2px 8px rgba(34,168,74,0.15);
}
.publish-btn {
  padding: 10px 20px;
  background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
  color: white;
  border: none;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(34,168,74,0.3);
  transition: all 0.2s ease;
  white-space: nowrap;
}
.publish-btn:active { transform: scale(0.95); }

/* ==================== 动态列表 ==================== */
.post-section {
  padding: 0 16px 20px;
}
.post-card {
  background: white;
  border-radius: 16px;
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  transition: all 0.3s ease;
  animation: fadeInUp 0.4s ease forwards;
  opacity: 0;
}
.post-card:nth-child(1) { animation-delay: 0.15s; }
.post-card:nth-child(2) { animation-delay: 0.2s; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.post-card:active {
  transform: scale(0.99);
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

/* 动态头部 */
.post-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
}
.post-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--bg-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  position: relative;
}
.post-avatar.online::after {
  content: '';
  position: absolute;
  bottom: 0;
  right: 0;
  width: 12px;
  height: 12px;
  background: #22c55e;
  border-radius: 50%;
  border: 2px solid white;
}
.post-user-info { flex: 1; }
.post-user-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 2px;
}
.post-time {
  font-size: 11px;
  color: var(--text-light);
}
.post-more {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--bg-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
}
.post-more:active { background: var(--border-light); }

/* 动态内容 */
.post-content {
  padding: 0 16px 14px;
}
.post-text {
  font-size: 14px;
  color: var(--text-primary);
  line-height: 1.6;
  margin-bottom: 12px;
}
.post-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.post-tag {
  padding: 3px 10px;
  background: #f0fdf4;
  color: var(--primary-600);
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
}
.post-image {
  width: 100%;
  height: 200px;
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  position: relative;
  overflow: hidden;
}
.post-image::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.05));
}

/* 动态底部 */
.post-footer {
  display: flex;
  justify-content: space-around;
  padding: 10px 16px;
  border-top: 1px solid var(--border-light);
}
.post-action {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 12px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.post-action:active { background: var(--bg-hover); }
.post-action.active { color: #ef4444; }
.post-action-icon {
  width: 18px;
  height: 18px;
  transition: all 0.2s;
}
.post-action.active .post-action-icon { color: #ef4444; }

/* ==================== 骨架屏 ==================== */
.skeleton-screen {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: white;
  z-index: 9999;
  transition: opacity 0.4s ease;
}
.skeleton-screen.hide {
  opacity: 0;
  pointer-events: none;
}
.skeleton-header {
  height: 48px;
  background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
  border-radius: 0 0 12px 12px;
}
.skeleton-community {
  height: 180px;
  background: white;
  margin: 12px 16px;
  border-radius: 16px;
  background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s ease-in-out infinite;
}
.skeleton-post {
  height: 280px;
  background: white;
  margin: 12px 16px;
  border-radius: 16px;
  background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s ease-in-out infinite;
  animation-delay: 0.1s;
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

/* ==================== 下拉刷新 ==================== */
.pull-to-refresh {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
  color: white;
  font-size: 13px;
  transform: translateY(-100%);
  transition: transform 0.3s ease;
  z-index: 99;
}
.pull-to-refresh.show {
  transform: translateY(0);
}
.pull-to-refresh .spinner {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ==================== 底部导航 ==================== */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  padding: 8px 0 12px;
  display: flex;
  justify-content: space-around;
  box-shadow: 0 -2px 20px rgba(0,0,0,0.08);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 4px 12px;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 8px;
  position: relative;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 3px;
  background: var(--primary-500);
  border-radius: 0 0 3px 3px;
}
.nav-icon {
  width: 22px;
  height: 22px;
  transition: all 0.2s;
}
.nav-text {
  font-size: 10px;
  color: var(--text-secondary);
  font-weight: 500;
}
.nav-item.active .nav-icon { color: var(--primary-500); }
.nav-item.active .nav-text { color: var(--primary-500); font-weight: 600; }

/* ==================== 响应式 ==================== */
@media (max-width: 320px) {
  .post-image { height: 160px; }
  .stat-value { font-size: 18px; }
}
</style>
</head>

<script>
// ==================== 骨架屏 ====================
window.addEventListener('load', function() {
  setTimeout(() => {
    document.getElementById('skeletonScreen').classList.add('hide');
    setTimeout(() => {
      document.getElementById('skeletonScreen').style.display = 'none';
    }, 400);
  }, 600);
});

// ==================== 下拉刷新 ====================
let startY = 0;
let pulling = false;
const pullThreshold = 60;
const pullToRefresh = document.getElementById('pullToRefresh');

document.addEventListener('touchstart', function(e) {
  if (window.scrollY === 0) {
    startY = e.touches[0].clientY;
    pulling = true;
  }
}, { passive: true });

document.addEventListener('touchmove', function(e) {
  if (!pulling || window.scrollY > 0) return;
  
  const currentY = e.touches[0].clientY;
  const diff = currentY - startY;
  
  if (diff > 0 && diff < pullThreshold) {
    pullToRefresh.style.transform = `translateY(${diff * 0.5}px)`;
  }
}, { passive: true });

document.addEventListener('touchend', function() {
  if (!pulling) return;
  
  const currentY = event.changedTouches[0].clientY;
  const diff = currentY - startY;
  
  if (diff > pullThreshold) {
    pullToRefresh.classList.add('show');
    setTimeout(() => {
      pullToRefresh.classList.remove('show');
      pullToRefresh.style.transform = 'translateY(-100%)';
      showToast('刷新成功');
    }, 1500);
  } else {
    pullToRefresh.style.transform = 'translateY(-100%)';
  }
  
  pulling = false;
});

// ==================== 点赞交互 ====================
function toggleLike(element) {
  const svg = element.querySelector('svg');
  const span = element.querySelector('span');
  const count = parseInt(span.textContent);
  
  if (svg.getAttribute('fill') === 'none') {
    svg.setAttribute('fill', 'currentColor');
    element.classList.add('active');
    span.textContent = count + 1;
  } else {
    svg.setAttribute('fill', 'none');
    element.classList.remove('active');
    span.textContent = count - 1;
  }
}

// ==================== 发布动态 ====================
function publish() {
  const input = document.getElementById('publishInput');
  const content = input.value.trim();
  if (!content) {
    showToast('请输入内容');
    return;
  }
  showToast('发布成功');
  input.value = '';
}

// ==================== Toast提示 ====================
function showToast(message) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 1000;
    animation: fadeInOut 2s ease;
  `;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

// 添加CSS动画
const style = document.createElement('style');
style.textContent = `
  @keyframes fadeInOut {
    0% { opacity:0; transform: translate(-50%, -50%) scale(0.8); }
    20% { opacity:1; transform: translate(-50%, -50%) scale(1); }
    80% { opacity:1; }
    100% { opacity:0; }
  }
`;
document.head.appendChild(style);
</script>
