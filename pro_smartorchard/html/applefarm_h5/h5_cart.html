<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧果园 - 购物车</title>
  <link rel="stylesheet" href="../applefarm_mobile/css/mobile-design-system.css">
  <style>
    /* ========== 页面专属样式 ========== */
    .cart-list { padding: var(--space-4); padding-bottom: 160px; }
    .cart-item {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      display: flex;
      gap: var(--space-3);
      border: 1px solid var(--border);
      position: relative;
      transition: all var(--transition-fast);
    }
    .cart-item:active { transform: scale(0.99); }
    .cart-checkbox {
      margin-top: 28px;
      width: 20px; height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }
    .cart-img {
      width: 80px; height: 80px;
      border-radius: var(--radius-md);
      background: var(--primary-50);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 40px;
    }
    .cart-info {
      flex: 1;
      display: flex; flex-direction: column; justify-content: space-between;
      min-width: 0;
    }
    .cart-name {
      font-size: var(--font-base);
      font-weight: var(--font-semibold);
      color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cart-spec { font-size: var(--font-xs); color: var(--text-secondary); }
    .cart-price { font-size: var(--font-lg); font-weight: var(--font-extrabold); color: var(--error); font-family: var(--font-family-number); }
    .cart-quantity { display: flex; align-items: center; gap: var(--space-2); }
    .qty-btn {
      width: 28px; height: 28px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-white);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; color: var(--text);
      transition: all var(--transition-fast);
    }
    .qty-btn:active { background: var(--primary-50); border-color: var(--primary-200); }
    .qty-value { min-width: 32px; text-align: center; font-size: var(--font-base); font-weight: var(--font-semibold); }
    .cart-delete {
      position: absolute; top: 12px; right: 12px;
      width: 24px; height: 24px; border-radius: var(--radius-full);
      background: var(--gray-100);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: none;
    }
    .cart-delete:active { background: var(--error-light); }

    /* 底部操作栏 */
    .footer-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 750px;
      background: var(--bg-white);
      padding: var(--space-3) var(--space-4);
      padding-bottom: calc(var(--space-3) + var(--safe-bottom));
      display: flex; align-items: center; gap: var(--space-3);
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
      z-index: var(--z-tab-bar);
    }
    .footer-checkbox { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }
    .footer-text { font-size: var(--font-sm); color: var(--text-secondary); cursor: pointer; }
    .footer-price { flex: 1; text-align: right; }
    .price-label { font-size: var(--font-xs); color: var(--text-secondary); }
    .price-value { font-size: var(--font-xl); font-weight: var(--font-extrabold); color: var(--error); font-family: var(--font-family-number); }
  </style>
</head>
<body>
  <div class="mb-app">
    <!-- Header -->
    <header class="mb-header-detail">
      <div class="header-nav">
        <div class="header-back" onclick="navigateTo('h5_store.html')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
        <div class="header-title">购物车</div>
        <div class="header-actions">
          <div class="header-action-btn" onclick="clearCart()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </div>
        </div>
      </div>
    </header>

    <!-- 购物车列表 -->
    <div class="cart-list">
      <div class="cart-item">
        <input type="checkbox" class="cart-checkbox" checked>
        <div class="cart-img">🍎</div>
        <div class="cart-info">
          <div>
            <div class="cart-name">红富士苹果 5斤装</div>
            <div class="cart-spec">脆甜多汁 · 新鲜采摘</div>
          </div>
          <div class="flex justify-between items-center">
            <span class="cart-price">¥68</span>
            <div class="cart-quantity">
              <button class="qty-btn">−</button>
              <span class="qty-value">1</span>
              <button class="qty-btn">+</button>
            </div>
          </div>
        </div>
        <button class="cart-delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>

      <div class="cart-item">
        <input type="checkbox" class="cart-checkbox" checked>
        <div class="cart-img">🎁</div>
        <div class="cart-info">
          <div>
            <div class="cart-name">精品礼盒装 8斤</div>
            <div class="cart-spec">送礼佳品 · 品质保证</div>
          </div>
          <div class="flex justify-between items-center">
            <span class="cart-price">¥168</span>
            <div class="cart-quantity">
              <button class="qty-btn">−</button>
              <span class="qty-value">1</span>
              <button class="qty-btn">+</button>
            </div>
          </div>
        </div>
        <button class="cart-delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>

      <div class="cart-item">
        <input type="checkbox" class="cart-checkbox">
        <div class="cart-img">🍏</div>
        <div class="cart-info">
          <div>
            <div class="cart-name">嘎啦苹果 5斤装</div>
            <div class="cart-spec">酸甜可口 · 皮薄肉嫩</div>
          </div>
          <div class="flex justify-between items-center">
            <span class="cart-price">¥58</span>
            <div class="cart-quantity">
              <button class="qty-btn">−</button>
              <span class="qty-value">2</span>
              <button class="qty-btn">+</button>
            </div>
          </div>
        </div>
        <button class="cart-delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
    </div>

    <!-- 底部操作栏 -->
    <div class="footer-bar">
      <input type="checkbox" class="footer-checkbox" checked>
      <span class="footer-text">全选</span>
      <div class="footer-price">
        <div class="price-label">合计</div>
        <div class="price-value">¥236</div>
      </div>
      <button class="mb-btn mb-btn-primary mb-btn-lg" onclick="checkout()">结算(2)</button>
    </div>

    <!-- 底部导航 -->
    <nav class="mb-tab-bar" style="bottom: -70px;">
    </nav>
  </div>

  <script>
    function navigateTo(page) { window.location.href = page; }
    function checkout() { window.location.href = 'h5_checkout.html'; }
    function clearCart() { showToast('购物车已清空'); }
    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999;animation:fadeInOut 2s ease;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2000);
    }
    var style = document.createElement('style');
    style.textContent = '@keyframes fadeInOut { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0} }';
    document.head.appendChild(style);
  </script>
</body>
</html>
