<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>数农智果 - 会员中心</title>
<link rel="stylesheet" href="../css/design-system.css">
<style>
/* ==================== 基础重置 ==================== */
* { margin:0; padding:0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg-page);
  color: var(--text-primary);
  line-height:1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* ==================== 顶部导航 ==================== */
.header {
  background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
.header-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
}
.header-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
.header-title {
  color: white;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* ==================== 用户区域 ==================== */
.user-section {
  background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-700) 50%, #15803d 100%);
  padding: 32px 20px 40px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
  overflow: hidden;
}
.user-section::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 250px;
  height: 250px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.user-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid rgba(255,255,255,0.3);
  position: relative;
  z-index: 1;
  font-size: 36px;
  transition: all 0.3s ease;
  cursor: pointer;
}
.user-avatar:active { transform: scale(0.95); }
.user-info {
  flex: 1;
  position: relative;
  z-index: 1;
}
.user-name {
  font-size: 20px;
  font-weight: 700;
  color: white;
  margin-bottom: 6px;
}
.user-level {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  background: rgba(255,255,255,0.2);
  border-radius: 12px;
  font-size: 12px;
  color: white;
  font-weight: 600;
  backdrop-filter: blur(10px);
}
.user-growth {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.growth-bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  overflow: hidden;
}
.growth-fill {
  height: 100%;
  background: linear-gradient(90deg, #fbbf24, #f59e0b);
  border-radius: 3px;
  transition: width 1s ease;
}
.growth-text {
  font-size: 11px;
  color: rgba(255,255,255,0.8);
  white-space: nowrap;
}

/* ==================== 统计信息 ==================== */
.user-stats {
  display: flex;
  justify-content: space-around;
  background: white;
  margin: -20px 16px 16px;
  padding: 20px 16px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  position: relative;
  z-index: 2;
}
.stat-item {
  text-align: center;
  flex: 1;
  position: relative;
  animation: fadeInUp 0.5s ease forwards;
  opacity: 0;
}
.stat-item:nth-child(1) { animation-delay: 0.1s; }
.stat-item:nth-child(2) { animation-delay: 0.15s; }
.stat-item:nth-child(3) { animation-delay: 0.2s; }
.stat-item:nth-child(4) { animation-delay: 0.25s; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.stat-item:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 1px;
  height: 30px;
  background: var(--border-light);
}
.stat-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary-600);
  line-height: 1.2;
}
.stat-label {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* ==================== 菜单列表 ==================== */
.menu-section {
  background: white;
  margin: 12px 16px;
  border-radius: 16px;
  padding: 6px 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.menu-item {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-light);
  cursor: pointer;
  transition: all 0.2s ease;
  -webkit-tap-highlight-color: transparent;
  animation: fadeInUp 0.4s ease forwards;
  opacity: 0;
}
.menu-item:nth-child(1) { animation-delay: 0.15s; }
.menu-item:nth-child(2) { animation-delay: 0.2s; }
.menu-item:nth-child(3) { animation-delay: 0.25s; }

.menu-item:last-child { border-bottom: none; }
.menu-item:active { background: var(--bg-hover); }
.menu-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 12px;
  font-size: 18px;
  flex-shrink: 0;
}
.menu-icon.green { background: #f0fdf4; }
.menu-icon.yellow { background: #fef3c7; }
.menu-icon.blue { background: #eff6ff; }
.menu-icon.purple { background: #faf5ff; }
.menu-icon.red { background: #fef2f2; }
.menu-icon.gray { background: #f3f4f6; }
.menu-text {
  flex: 1;
  font-size: 14px;
  color: var(--text-primary);
  font-weight: 500;
}
.menu-badge {
  padding: 2px 8px;
  background: #ef4444;
  color: white;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  margin-right: 8px;
  min-width: 18px;
  text-align: center;
}
.menu-arrow {
  width: 16px;
  height: 16px;
  color: var(--text-light);
}

/* ==================== 退出按钮 ==================== */
.logout-section {
  padding: 20px 16px;
}
.logout-btn {
  width: 100%;
  padding: 14px;
  background: white;
  border: 1.5px solid var(--border-light);
  border-radius: 16px;
  font-size: 14px;
  color: #ef4444;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.logout-btn:active {
  background: #fef2f2;
  border-color: #fecaca;
  transform: scale(0.99);
}

/* ==================== 骨架屏 ==================== */
.skeleton-screen {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: white;
  z-index: 9999;
  transition: opacity 0.4s ease;
}
.skeleton-screen.hide {
  opacity: 0;
  pointer-events: none;
}
.skeleton-header {
  height: 48px;
  background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
  border-radius: 0 0 12px 12px;
}
.skeleton-user {
  height: 140px;
  background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
  margin: 0 16px;
  border-radius: 0 0 16px 16px;
  position: relative;
  overflow: hidden;
}
.skeleton-user::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%);
  animation: shimmer 1.8s ease-in-out infinite;
}
.skeleton-stats {
  height: 80px;
  background: white;
  margin: -20px 16px 16px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s ease-in-out infinite;
}
.skeleton-menu {
  height: 200px;
  background: white;
  margin: 12px 16px;
  border-radius: 16px;
  background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s ease-in-out infinite;
  animation-delay: 0.2s;
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

/* ==================== 下拉刷新 ==================== */
.pull-to-refresh {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
  color: white;
  font-size: 13px;
  transform: translateY(-100%);
  transition: transform 0.3s ease;
  z-index: 99;
}
.pull-to-refresh.show {
  transform: translateY(0);
}
.pull-to-refresh .spinner {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ==================== 底部导航 ==================== */
.footer-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  padding: 8px 0 12px;
  display: flex;
  justify-content: space-around;
  box-shadow: 0 -2px 20px rgba(0,0,0,0.08);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 4px 12px;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 8px;
  position: relative;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 3px;
  background: var(--primary-500);
  border-radius: 0 0 3px 3px;
}
.nav-icon {
  width: 22px;
  height: 22px;
  transition: all 0.2s;
}
.nav-text {
  font-size: 10px;
  color: var(--text-secondary);
  font-weight: 500;
}
.nav-item.active .nav-icon { color: var(--primary-500); }
.nav-item.active .nav-text { color: var(--primary-500); font-weight: 600; }
</style>
</head>
<body>

<script>
// ==================== 骨架屏 ====================
window.addEventListener('load', function() {
  setTimeout(() => {
    document.getElementById('skeletonScreen').classList.add('hide');
    setTimeout(() => {
      document.getElementById('skeletonScreen').style.display = 'none';
    }, 400);
  }, 600);
});

// ==================== 下拉刷新 ====================
let startY = 0;
let pulling = false;
const pullThreshold = 60;
const pullToRefresh = document.getElementById('pullToRefresh');

document.addEventListener('touchstart', function(e) {
  if (window.scrollY === 0) {
    startY = e.touches[0].clientY;
    pulling = true;
  }
}, { passive: true });

document.addEventListener('touchmove', function(e) {
  if (!pulling || window.scrollY > 0) return;
  
  const currentY = e.touches[0].clientY;
  const diff = currentY - startY;
  
  if (diff > 0 && diff < pullThreshold) {
    pullToRefresh.style.transform = `translateY(${diff * 0.5}px)`;
  }
}, { passive: true });

document.addEventListener('touchend', function() {
  if (!pulling) return;
  
  const currentY = event.changedTouches[0].clientY;
  const diff = currentY - startY;
  
  if (diff > pullThreshold) {
    pullToRefresh.classList.add('show');
    setTimeout(() => {
      pullToRefresh.classList.remove('show');
      pullToRefresh.style.transform = 'translateY(-100%)';
      showToast('刷新成功');
    }, 1500);
  } else {
    pullToRefresh.style.transform = 'translateY(-100%)';
  }
  
  pulling = false;
});

// ==================== Toast提示 ====================
function showToast(message) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 1000;
    animation: fadeInOut 2s ease;
  `;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

// 添加CSS动画
const style = document.createElement('style');
style.textContent = `
  @keyframes fadeInOut {
    0% { opacity:0; transform: translate(-50%, -50%) scale(0.8); }
    20% { opacity:1; transform: translate(-50%, -50%) scale(1); }
    80% { opacity:1; }
    100% { opacity:0; }
  }
`;
document.head.appendChild(style);
</script>
</body>
