<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR基地全景展示 - 数农智果</title>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="../common/js/vr-hotspots.js"></script>
    <script src="../common/js/api-mock.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        #panorama {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .header-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 12px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #2b6e3c, #1f8a4c);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
        }
        .logo-text {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }
        .scene-selector {
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 12px;
        }
        .scene-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .scene-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .scene-btn.active {
            background: #2b6e3c;
            border-color: #2b6e3c;
        }
        .controls-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 30px;
            z-index: 100;
        }
        .control-btn {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        .info-panel {
            position: absolute;
            top: 100px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 12px;
            color: #fff;
            width: 280px;
            z-index: 100;
            display: none;
        }
        .info-panel.show {
            display: block;
        }
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .info-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-close {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }
        .info-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .info-content {
            font-size: 13px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }
        .hotspot-legend {
            position: absolute;
            bottom: 90px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 12px;
            z-index: 100;
        }
        .legend-title {
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .legend-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .legend-dot.plot { background: #22c55e; }
        .legend-dot.device { background: #3b82f6; }
        .legend-dot.task { background: #f59e0b; }
        .legend-dot.building { background: #8b5cf6; }
        .legend-dot.scene { background: #06b6d4; }
        .exit-btn {
            position: absolute;
            top: 20px;
            right: 150px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        .exit-btn:hover {
            background: rgba(239, 68, 68, 0.8);
        }
        .auto-play-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        .status-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 100;
        }
        .status-item {
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .auto-play-btn.active {
            background: #2b6e3c;
        }
        .auto-play-btn:hover {
            background: rgba(43, 110, 60, 0.8);
        }
        .alert-notification {
            position: absolute;
            top: 100px;
            right: 20px;
            background: rgba(239, 68, 68, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-radius: 12px;
            color: #fff;
            z-index: 200;
            animation: slideIn 0.3s ease;
            display: none;
        }
        .alert-notification.show {
            display: block;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .alert-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alert-content {
            font-size: 12px;
            opacity: 0.9;
        }
        .alert-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="panorama"></div>
    
    <div class="header-overlay">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fas fa-apple-alt"></i>
            </div>
            <div class="logo-text">数农智果 VR全景</div>
        </div>
        
        <div class="status-bar">
            <div class="status-item" id="deviceStatus">
                <i class="fas fa-server"></i> 设备在线: 0/0
            </div>
            <div class="status-item" id="plotStatus">
                <i class="fas fa-tree"></i> 地块正常: 0/0
            </div>
        </div>
        
        <div class="exit-btn" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
            返回大屏
        </div>
        
        <div class="auto-play-btn" id="autoPlayBtn" onclick="toggleAutoPlay()">
            <i class="fas fa-play"></i>
            自动漫游
        </div>
        
        <div class="scene-selector" id="sceneSelector">
            <button class="scene-btn active" data-scene="scene_main">
                <i class="fas fa-home"></i> 主入口
            </button>
            <button class="scene-btn" data-scene="scene_b">
                <i class="fas fa-map-marker-alt"></i> B区
            </button>
            <button class="scene-btn" data-scene="scene_c">
                <i class="fas fa-map-marker-alt"></i> C区
            </button>
        </div>
    </div>
    
    <div class="controls-overlay">
        <button class="control-btn" onclick="viewer.setPitch(viewer.getPitch() + 10)" title="向上">
            <i class="fas fa-chevron-up"></i>
        </button>
        <button class="control-btn" onclick="viewer.setYaw(viewer.getYaw() - 15)" title="向左">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="control-btn" onclick="viewer.setHfov(viewer.getHfov() - 5)" title="缩小">
            <i class="fas fa-minus"></i>
        </button>
        <button class="control-btn" onclick="viewer.setHfov(viewer.getHfov() + 5)" title="放大">
            <i class="fas fa-plus"></i>
        </button>
        <button class="control-btn" onclick="viewer.setYaw(viewer.getYaw() + 15)" title="向右">
            <i class="fas fa-chevron-right"></i>
        </button>
        <button class="control-btn" onclick="viewer.setPitch(viewer.getPitch() - 10)" title="向下">
            <i class="fas fa-chevron-down"></i>
        </button>
        <button class="control-btn" onclick="viewer.reset()" title="重置视角">
            <i class="fas fa-home"></i>
        </button>
    </div>
    
    <div class="hotspot-legend">
        <div class="legend-title">热点图例</div>
        <div class="legend-items">
            <div class="legend-item"><span class="legend-dot plot"></span> 地块</div>
            <div class="legend-item"><span class="legend-dot device"></span> 设备</div>
            <div class="legend-item"><span class="legend-dot task"></span> 任务</div>
            <div class="legend-item"><span class="legend-dot building"></span> 建筑</div>
            <div class="legend-item"><span class="legend-dot scene"></span> 场景切换</div>
        </div>
    </div>
    
    <div class="info-panel" id="infoPanel">
        <div class="info-header">
            <div class="info-title" id="infoTitle">信息详情</div>
            <div class="info-close" onclick="closeInfoPanel()">✕</div>
        </div>
        <div class="info-content" id="infoContent"></div>
    </div>
    
    <div class="alert-notification" id="alertNotification">
        <div class="alert-close" onclick="closeAlert()">✕</div>
        <div class="alert-title"><i class="fas fa-exclamation-triangle"></i> 设备预警</div>
        <div class="alert-content">B1区水肥设备压力偏低，请及时检查维护</div>
    </div>
    
    <script src="../common/js/vr-hotspots.js"></script>
    <script>
        var viewer;
        var currentSceneId = 'scene_main';
        var isAutoPlaying = false;
        var autoPlayInterval;
        var sceneIndex = 0;
        
        function initViewer(sceneId) {
            var sceneData = vrHotspotsData.getSceneById(sceneId);
            if (!sceneData) return;
            
            if (viewer) {
                viewer.destroy();
            }
            
            var config = {
                type: 'equirectangular',
                panorama: 'https://pannellum.org/images/alma.jpg',
                title: sceneData.name,
                author: '数农智果',
                sceneFov: sceneData.hfov || 100,
                autoLoad: true,
                showControls: true,
                mouseZoom: true,
                draggable: true,
                keyboardZoom: true,
                compass: true,
                hotSpots: []
            };
            
            sceneData.hotspots.forEach(function(hotspot) {
                var hotspotConfig = {
                    pitch: hotspot.pitch,
                    yaw: hotspot.yaw,
                    type: 'custom',
                    custom: getHotspotIcon(hotspot.type, hotspot.status),
                    clickHandler: function() {
                        showInfoPanel(hotspot);
                    }
                };
                config.hotSpots.push(hotspotConfig);
            });
            
            viewer = pannellum.viewer('panorama', config);
            currentSceneId = sceneId;
            
            updateSceneButtons(sceneId);
        }
        
        function getHotspotIcon(type, status) {
            var color = '#22c55e';
            switch(type) {
                case 'plot': color = '#22c55e'; break;
                case 'device': color = '#3b82f6'; break;
                case 'task': color = '#f59e0b'; break;
                case 'building': color = '#8b5cf6'; break;
                case 'scene': color = '#06b6d4'; break;
            }
            if (status === 'warning') color = '#f59e0b';
            if (status === 'error') color = '#ef4444';
            
            return '<div style="width:20px;height:20px;border-radius:50%;background:' + color + ';box-shadow:0 0 10px ' + color + ';border:2px solid #fff;cursor:pointer;"></div>';
        }
        
        function showInfoPanel(hotspot) {
            document.getElementById('infoTitle').innerHTML = '<i class="fas fa-info-circle"></i> ' + hotspot.title;
            document.getElementById('infoContent').innerHTML = hotspot.content;
            document.getElementById('infoPanel').classList.add('show');
            
            if (hotspot.type === 'scene') {
                var contentDiv = document.getElementById('infoContent');
                contentDiv.onclick = function(e) {
                    if (e.target.textContent.includes('进入') || e.target.textContent.includes('返回')) {
                        switchScene(hotspot.targetId);
                        closeInfoPanel();
                    }
                };
            }
        }
        
        function closeInfoPanel() {
            document.getElementById('infoPanel').classList.remove('show');
        }
        
        function switchScene(sceneId) {
            initViewer(sceneId);
        }
        
        function updateSceneButtons(sceneId) {
            var buttons = document.querySelectorAll('.scene-btn');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
                if (btn.dataset.scene === sceneId) {
                    btn.classList.add('active');
                }
            });
        }
        
        document.querySelectorAll('.scene-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                switchScene(this.dataset.scene);
            });
        });
        
        function goBack() {
            window.location.href = 'da_dashboard.html';
        }
        
        function toggleAutoPlay() {
            var btn = document.getElementById('autoPlayBtn');
            if (isAutoPlaying) {
                clearInterval(autoPlayInterval);
                btn.innerHTML = '<i class="fas fa-play"></i> 自动漫游';
                btn.classList.remove('active');
            } else {
                btn.innerHTML = '<i class="fas fa-pause"></i> 停止漫游';
                btn.classList.add('active');
                startAutoPlay();
            }
            isAutoPlaying = !isAutoPlaying;
        }
        
        function startAutoPlay() {
            autoPlayInterval = setInterval(function() {
                var scenes = vrHotspotsData.getAllSceneIds();
                sceneIndex = (sceneIndex + 1) % scenes.length;
                switchScene(scenes[sceneIndex]);
            }, 8000);
        }
        
        function closeAlert() {
            document.getElementById('alertNotification').classList.remove('show');
        }
        
        function loadAlerts() {
            VRAPI.getAlerts(function(err, result) {
                if (!err && result.code === 200 && result.data.length > 0) {
                    var alerts = result.data;
                    var alertContent = '';
                    alerts.forEach(function(alert) {
                        var levelClass = alert.level === 'error' ? 'error' : 'warning';
                        var icon = alert.level === 'error' ? 'exclamation-circle' : 'alert-circle';
                        alertContent += '<div class="alert-item ' + levelClass + '"><i class="fas fa-' + icon + '"></i>' + alert.message + '</div>';
                    });
                    document.getElementById('alertContent').innerHTML = alertContent;
                    setTimeout(function() {
                        document.getElementById('alertNotification').classList.add('show');
                    }, 3000);
                }
            });
        }
        
        function loadDeviceData() {
            VRAPI.getDevices(function(err, result) {
                if (!err && result.code === 200) {
                    var onlineCount = result.data.filter(function(d) { return d.status === 'online'; }).length;
                    var totalCount = result.data.length;
                    document.getElementById('deviceStatus').innerHTML = '<i class="fas fa-server"></i> 设备在线: ' + onlineCount + '/' + totalCount;
                }
            });
        }
        
        function loadPlotData() {
            VRAPI.getPlots(function(err, result) {
                if (!err && result.code === 200) {
                    var normalCount = result.data.filter(function(p) { return p.status === 'normal'; }).length;
                    var totalCount = result.data.length;
                    document.getElementById('plotStatus').innerHTML = '<i class="fas fa-tree"></i> 地块正常: ' + normalCount + '/' + totalCount;
                }
            });
        }
        
        loadAlerts();
        loadDeviceData();
        loadPlotData();
        
        window.addEventListener('load', function() {
            initViewer('scene_main');
        });
    </script>
</body>
</html>
