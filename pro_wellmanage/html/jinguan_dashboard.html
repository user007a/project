            "邓州市": { wellTotal:512, wellAbnormal:14, staffCount:32, monthOrders:63, status:{normal:480,fault:14,maintain:18}, chartTypeData:[{name:"深井",value:280},{name:"浅井",value:180},{name:"大口井",value:52}], trend:[8,10,14,15,16,17,12], staffTop:[{name:"丁一",value:21},{name:"杨阳",value:17}], policies:[{title:"邓州市智慧水利示范区",progress:82,detail:"数字孪生灌区试点"}] },
            "中牟县": { wellTotal:390, wellAbnormal:6, staffCount:21, monthOrders:44, status:{normal:374,fault:6,maintain:10}, chartTypeData:[{name:"深井",value:180},{name:"浅井",value:150},{name:"大口井",value:60}], trend:[4,6,8,10,9,12,8], staffTop:[{name:"刘畅",value:15}], policies:[] }
        }
    };

    function getOrdersByRegion(level, id) {
        if(level === 'province') return [
            {no:"WO-24051901",location:"周口市淮阳区白楼镇",type:"水泵故障",staff:"李建国",status:"progress",statusText:"维修中"},
            {no:"WO-24051904",location:"驻马店市确山县双河镇",type:"电表异常",staff:"王海霞",status:"progress",statusText:"维修中"},
            {no:"WO-24051889",location:"南阳市邓州市构林镇",type:"定期巡检",staff:"张振国",status:"completed",statusText:"已完成"},
			{no:"WO-24051889",location:"南阳市邓州市构林镇",type:"定期巡检",staff:"张振国",status:"completed",statusText:"已完成"},
			{no:"WO-24051889",location:"南阳市邓州市构林镇",type:"定期巡检",staff:"张振国",status:"completed",statusText:"已完成"},
            {no:"WO-24051876",location:"商丘市睢县蓼堤镇",type:"井台损坏",staff:"刘云龙",status:"pending",statusText:"待派单"}
        ];
        if(level === 'city') {
            let city = dataHub.cities[id];
            if(!city) return [];
            return [{no:`WO-${id.slice(0,2)}01`,location:`${id} 中心灌区`,type:"灌溉故障",staff:city.staffTop[0]?.name||"工程师",status:"progress",statusText:"处理中"}];
        }
        if(level === 'county') {
            let county = dataHub.counties[id];
            if(!county) return [];
            return [{no:`WO-${id.slice(0,2)}01`,location:`${id} 高标准农田`,type:"机井维护",staff:county.staffTop[0]?.name||"网格员",status:"completed",statusText:"已完成"}];
        }
        return [];
    }
    function getPolicyByRegion(level, id) {
        if(level === 'province') return dataHub.province.policies;
        let city = dataHub.cities[id];
        if(city && city.policies) return city.policies;
        let county = dataHub.counties[id];
        if(county && county.policies) return county.policies;
        return [{title:"农田设施管护条例",progress:70,detail:"正在推进"}];
    }

    // 全局变量
    let currentRegion = { level:'province', id:'henan', name:'河南省' };
    let charts = {};
    let currentMapChart = null;
    let registeredMap = false;

    function initCharts() {
        charts.wellStatus = echarts.init(document.getElementById('wellStatusChart'));
        charts.secondary = echarts.init(document.getElementById('secondaryChart'));
        charts.trend = echarts.init(document.getElementById('orderTrendChart'));
        charts.staffRank = echarts.init(document.getElementById('staffRankChart'));
    }

    // 地图渲染逻辑 (复用原有)
    function initHenanMap(regionLevel, regionId) {
        if(!currentMapChart) currentMapChart = echarts.init(document.getElementById('henanMap'));
        if(!registeredMap) {
            fetch('https://geo.datav.aliyun.com/areas_v3/bound/410000_full.json')
                .then(response => response.json())
                .then(geoJson => {
                    echarts.registerMap('henan', geoJson);
                    registeredMap = true;
                    renderMapByLevel(regionLevel, regionId);
                })
                .catch(err => {
                    console.warn("地图加载失败，使用模拟散点", err);
                    drawFallbackMap(regionLevel, regionId);
                });
        } else {
            renderMapByLevel(regionLevel, regionId);
        }
    }
    function renderMapByLevel(level, id) {
        if(!currentMapChart) return;
        if(level === 'province') {
            let cityData = Object.keys(dataHub.cities).map(cityName => {
                let well = dataHub.cities[cityName]?.wellTotal || 0;
                let coord = cityCoordinates[cityName] || [113.8, 34.3];
                return { name: cityName, value: well, coord: coord };
            });
            let option = {
                tooltip: { trigger: 'item', formatter: '{b}<br/>机井数量: {c} 口' },
                series: [
                    { type: 'map', map: 'henan', roam: true, zoom: 1.2, label: { show: true, color: '#2c6e3c' }, emphasis: { label: { show: true } }, itemStyle: { borderColor: '#2b6e3c', areaColor: '#e0f2e9' } },
                    { type: 'scatter', coordinateSystem: 'geo', data: cityData.map(c => ({ name: c.name, value: c.value, coord: c.coord })), symbolSize: val => Math.sqrt(val[2]) * 0.8 + 8, label: { show: true, formatter: '{b}', position: 'right', offset: [10,0] }, itemStyle: { color: '#d45c4c' }, tooltip: { formatter: (p) => `${p.data.name}<br/>机井总数: ${p.data.value} 口` } }
                ],
                geo: { map: 'henan', roam: true, zoom: 1.2, label: { show: true }, itemStyle: { borderColor: '#31784a' } }
            };
            currentMapChart.setOption(option, true);
            currentMapChart.off('click');
            currentMapChart.on('click', (params) => {
                if(params.componentType === 'series' && params.seriesType === 'scatter') {
                    let cityName = params.data.name;
                    if(dataHub.cities[cityName]) {
                        document.getElementById('citySelect').value = cityName;
                        setRegion('city', cityName, cityName);
                    }
                } else if(params.componentType === 'geo') {
                    let name = params.name;
                    if(dataHub.cities[name]) setRegion('city', name, name);
                }
            });
        } 
        else if(level === 'city') {
            let city = dataHub.cities[id];
            if(city && city.subAreas) {
                let points = city.subAreas.map(area => {
                    let coord = countyCoordinates[area.name] || [113.5, 34.2];
                    return { name: area.name, value: area.wellTotal, coord: coord };
                });
                let option = {
                    title: { show: true, text: `${id} 县域机井分布`, left: 'center', textStyle: { fontSize: 12 } },
                    tooltip: { trigger: 'item', formatter: '{b}: {c} 口' },
                    series: [
                        { type: 'map', map: 'henan', roam: true, zoom: 1.4, center: cityCoordinates[id] || [113.8,34.3], label: { show: false }, itemStyle: { areaColor: '#cbdde6' } },
                        { type: 'scatter', coordinateSystem: 'geo', data: points.map(p => ({ name: p.name, value: p.value, coord: p.coord })), symbolSize: val => Math.sqrt(val[2]) * 0.7 + 12, label: { show: true, formatter: '{b}', offset: [10,0] }, itemStyle: { color: '#e68a2e' }, tooltip: { formatter: (p) => `${p.data.name}<br/>机井: ${p.data.value} 口` } }
                    ],
                    geo: { map: 'henan', roam: true, zoom: 1.4, center: cityCoordinates[id] }
                };
                currentMapChart.setOption(option, true);
                currentMapChart.off('click');
                currentMapChart.on('click', (params) => {
                    if(params.data && params.data.name) {
                        let countyName = params.data.name;
                        if(dataHub.counties[countyName]) setRegion('county', countyName, countyName);
                    }
                });
            }
        } else if(level === 'county') {
            let center = countyCoordinates[id] || [113.8,34.3];
            let option = { title: { show: true, text: `${id} 机井管理重点区域`, left: 'center' }, series: [{ type: 'map', map: 'henan', roam: true, zoom: 1.5, center: center, label: { show: false }, itemStyle: { areaColor: '#b8d9c6' } }], geo: { map: 'henan', center: center, zoom: 1.5 } };
            currentMapChart.setOption(option, true);
        }
        // 同时更新地图下方的地市机井标注（仅在省级视图显示完整列表）
        updateCityWellTags(level);
    }
    function drawFallbackMap(level, id) {
        if(currentMapChart) currentMapChart.setOption({ title: { text: '地图服务不可用，展示模拟热点分布', left: 'center' } });
        updateCityWellTags(level);
    }
    // 更新地图下方的地市机井数量标签（仅省级视图展示详细列表，市县视图展示简单提示）
    function updateCityWellTags(level) {
        const container = document.getElementById('cityWellTags');
        if(!container) return;
        if(level === 'province') {
            let citiesList = ['郑州市','开封市','洛阳市','周口市','南阳市','驻马店市','新乡市','信阳市'];
            let html = '';
            citiesList.forEach(city => {
                let wellCount = dataHub.cities[city]?.wellTotal || 0;
                html += `<span class="city-tag"><i class="fas fa-tint"></i> ${city}: ${wellCount}口</span>`;
            });
            container.innerHTML = html;
        } else {
            container.innerHTML = `<span class="city-tag">当前为${currentRegion.name}，点击返回省级查看各地市机井数量</span>`;
        }
    }

    // 核心渲染（更新所有图表和KPI）
    function renderAll() {
        let level = currentRegion.level, id = currentRegion.id, name = currentRegion.name;
        let data = (level==='province') ? dataHub.province : (level==='city' ? dataHub.cities[id] : dataHub.counties[id]);
        if(!data && level !== 'province') data = dataHub.province;
        let wellTotal = data.wellTotal || 0, abnormal = data.wellAbnormal || 0, staffCnt = data.staffCount || 0, monthOrd = data.monthOrders || 0;
        document.getElementById('kpiContainer').innerHTML = `<div class="kpi-card"><div class="kpi-info"><h4>机井总数</h4><div class="kpi-number">${wellTotal.toLocaleString()} 口</div></div><div class="kpi-icon"><i class="fas fa-tint"></i></div></div><div class="kpi-card"><div class="kpi-info"><h4>异常机井</h4><div class="kpi-number">${abnormal} 口</div></div><div class="kpi-icon"><i class="fas fa-exclamation-triangle"></i></div></div><div class="kpi-card"><div class="kpi-info"><h4>工作人员</h4><div class="kpi-number">${staffCnt} 人</div></div><div class="kpi-icon"><i class="fas fa-users"></i></div></div><div class="kpi-card"><div class="kpi-info"><h4>本月工单</h4><div class="kpi-number">${monthOrd} 件</div></div><div class="kpi-icon"><i class="fas fa-clipboard-list"></i></div></div>`;
        
        // 机井健康状态饼图 - 自定义颜色：正常绿色，维护黄色，故障红色
        let statusData = data.status ? data.status : {normal: wellTotal-abnormal, fault:abnormal, maintain:0};
        let pieData = [
            { name:"正常运行", value:statusData.normal, itemStyle:{ color: '#2b6e3c' } },
            { name:"故障停机", value:statusData.fault, itemStyle:{ color: '#e05a5a' } },
            { name:"维护检修", value:statusData.maintain, itemStyle:{ color: '#f4bc44' } }
        ];
        charts.wellStatus.setOption({ tooltip:{trigger:'item'}, series:[{type:'pie',radius:'55%',data:pieData,label:{show:true,formatter:'{b}: {d}%'}}] });
        
        // 下级区域排行
        let subData = [];
        if(level === 'province') subData = Object.keys(dataHub.cities).map(c => ({name:c, value:dataHub.cities[c].wellTotal}));
        else if(level === 'city' && data.subAreas) subData = data.subAreas.map(a=>({name:a.name,value:a.wellTotal}));
        else subData = [{name:"暂无下级数据",value:0}];
        charts.secondary.setOption({ tooltip:{trigger:'axis'}, xAxis:{type:'category',data:subData.map(d=>d.name),axisLabel:{rotate:30}}, yAxis:{type:'value'}, series:[{type:'bar',data:subData.map(d=>d.value),itemStyle:{color:'#469c63'}}] });
        
        let trend = data.recentTrend || (level==='province'?dataHub.province.recentTrend:[12,15,18,20,22,25,19]);
        charts.trend.setOption({ xAxis:{data:['5/13','5/14','5/15','5/16','5/17','5/18','今日']}, yAxis:{}, series:[{data:trend,type:'line',smooth:true,lineStyle:{color:'#2b6e3c'}}] });
        
        let staffData = data.staffTop || [{name:"张工",value:32}];
        charts.staffRank.setOption({ xAxis:{type:'value'}, yAxis:{type:'category',data:staffData.map(s=>s.name)}, series:[{type:'bar',data:staffData.map(s=>s.value),itemStyle:{color:'#3b8c5a'},label:{show:true}}] });
        
        let policies = getPolicyByRegion(level, id);
        document.getElementById('policyList').innerHTML = policies.map(p => `<div class="policy-item"><div class="policy-title"><i class="fas fa-check-circle" style="color:#2b6e3c;"></i> ${p.title}</div><div class="progress-bar"><div class="progress-fill" style="width: ${p.progress}%;"></div></div><div>进度 ${p.progress}% · ${p.detail}</div></div>`).join('');
        
        let orders = getOrdersByRegion(level, id);
        document.getElementById('workOrderBody').innerHTML = orders.map(o => `<tr><td>${o.no}</td><td>${o.location}</td><td>${o.type}</td><td>${o.staff}</td><td><span class="status-badge status-${o.status === 'completed' ? 'completed' : (o.status === 'progress' ? 'progress' : 'pending')}">${o.statusText}</span></td>`).join('');
        
        document.getElementById('breadcrumb').innerHTML = `📍 当前层级：${name}${level==='province'?'（省级）':(level==='city'?'（市级）':'（县级）')}`;
        initHenanMap(level, id);
    }

    function setRegion(level, id, name, parentCity = null) {
        currentRegion = { level, id, name };
        if(parentCity) currentRegion.parentCity = parentCity;
        if(level === 'province') {
            document.getElementById('citySelect').value = "全省";
            document.getElementById('countySelect').disabled = true;
            document.getElementById('countySelect').innerHTML = '<option value="">请先选择市</option>';
        } else if(level === 'city') {
            document.getElementById('citySelect').value = name;
            let city = dataHub.cities[name];
            let opts = '<option value="">请选择县/区</option>';
            if(city && city.subAreas) city.subAreas.forEach(a => { opts += `<option value="${a.name}">${a.name}</option>`; });
            document.getElementById('countySelect').innerHTML = opts;
            document.getElementById('countySelect').disabled = false;
        } else if(level === 'county') {
            document.getElementById('citySelect').value = currentRegion.parentCity || "周口市";
            let city = dataHub.cities[currentRegion.parentCity];
            if(city && city.subAreas) {
                let opts = '<option value="">请选择县/区</option>';
                city.subAreas.forEach(a => { opts += `<option value="${a.name}" ${a.name===name?'selected':''}>${a.name}</option>`; });
                document.getElementById('countySelect').innerHTML = opts;
                document.getElementById('countySelect').disabled = false;
                document.getElementById('countySelect').value = name;
            }
        }
        renderAll();
    }

    // 事件绑定
    document.getElementById('citySelect').addEventListener('change', function(e) {
        let city = e.target.value;
        if(city === "全省") setRegion('province','henan','河南省');
        else if(dataHub.cities[city]) setRegion('city', city, city);
    });
    document.getElementById('countySelect').addEventListener('change', function(e) {
        let county = e.target.value;
        if(!county) return;
        let city = document.getElementById('citySelect').value;
        if(dataHub.counties[county]) setRegion('county', county, county, city);
        else alert("该县区数据正在完善中");
    });
    document.getElementById('backToProvinceBtn').addEventListener('click',()=>{ setRegion('province','henan','河南省'); });

    initCharts();
    setRegion('province','henan','河南省');
    window.addEventListener('resize',()=>{ Object.values(charts).forEach(c=>c.resize()); if(currentMapChart) currentMapChart.resize(); });
</script>
</body>
</html>
